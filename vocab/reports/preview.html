 "note:1788603785005"}, {"id": "6f7bc31ecccafff3", "front": "lucid", "pos": "adjective", "ipa": "", "vi": "Rõ ràng, dễ hiểu, minh mẫn", "en": "", "ex": "Despite her high fever, the patient remained lucid and able to answer the doctor's questions.", "exvi": "Mặc dù bị sốt cao, bệnh nhân vẫn tỉnh táo và có thể trả lời các câu hỏi của bác sĩ.", "syn": [], "cefr": "C1", "ref": "note:1788603785007"}, {"id": "1206a1ed73f024e4", "front": "withdraw", "pos": "verb", "ipa": "", "vi": "rút lui, rút lại, lấy ra", "en": "", "ex": "The candidate chose to withdraw from the race following disappointing debate results.", "exvi": "Ứng cử viên đã chọn rút lui khỏi cuộc đua sau những kết quả tranh luận đáng thất vọng.", "syn": [], "cefr": "B2", "ref": "note:1788603785009"}, {"id": "70cba972cea5f145", "front": "imitation", "pos": "noun", "ipa": "", "vi": "sự bắt chước, bản sao chép", "en": "", "ex": "Forrest's passage served as a tribute that was a perfect imitation of William Faulkner's distinctive style.", "exvi": "Đoạn văn của Forrest đóng vai trò như một lời tri ân, là sự bắt chước hoàn hảo phong cách đặc trưng của William Faulkner.", "syn": [], "cefr": "B2", "ref": "note:1788603785011"}, {"id": "b193cfe83780fceb", "front": "transform", "pos": "verb", "ipa": "", "vi": "biến đổi hoàn toàn, chuyển hóa", "en": "", "ex": "Historians argue that the invention of the microchip fundamentally transformed the semiconductor industry.", "exvi": "Các nhà sử học lập luận rằng phát minh ra vi mạch đã biến đổi căn bản ngành công nghiệp bán dẫn.", "syn": [], "cefr": "B2", "ref": "note:1788603785013"}, {"id": "7431d643185f0ba6", "front": "authorize", "pos": "verb", "ipa": "", "vi": "ủy quyền, cho phép, phê chuẩn", "en": "", "ex": "The director refused to authorize additional spending until the audit was completed.", "exvi": "Giám đốc từ chối phê chuẩn các khoản chi tiêu bổ sung cho đến khi cuộc kiểm toán hoàn tất.", "syn": [], "cefr": "B2", "ref": "note:1788603785015"}, {"id": "8a26e95c7618dcec", "front": "halt", "pos": "verb", "ipa": "", "vi": "ngăn chặn, làm dừng lại", "en": "", "ex": "Gardeners often struggle to halt the invasive spread of weeds once deep roots are established.", "exvi": "Người làm vườn thường gặp khó khăn trong việc ngăn chặn sự lây lan xâm lấn của cỏ dại một khi rễ sâu đã bám rễ.", "syn": [], "cefr": "B2", "ref": "note:1788603785017"}, {"id": "655e30a526530ee6", "front": "analogy", "pos": "noun", "ipa": "", "vi": "sự tương tự, phép loại suy", "en": "", "ex": "The teacher drew an analogy between the human heart and a pump to explain how it works.", "exvi": "Giáo viên đã đưa ra một phép loại suy giữa trái tim con người và một cái máy bơm để giải thích cách nó hoạt động.", "syn": [], "cefr": "B2", "ref": "note:1788603785019"}, {"id": "b47f20c1d4da062a", "front": "rudimentary", "pos": "adjective", "ipa": "", "vi": "cơ bản, sơ đẳng", "en": "", "ex": "He only has a rudimentary understanding of the software, so he can't use its advanced features.", "exvi": "Anh ấy chỉ có hiểu biết sơ đẳng về phần mềm, vì vậy anh không thể sử dụng các tính năng nâng cao của nó.", "syn": [], "cefr": "B2", "ref": "note:1788603785021"}, {"id": "f9acd9d36e9ea659", "front": "indifferent", "pos": "adjective", "ipa": "", "vi": "thờ ơ, lãnh đạm, không quan tâm", "en": "", "ex": "The administrator seemed indifferent to student complaints regarding library hours.", "exvi": "Người quản lý dường như thờ ơ với những lời phàn nàn của sinh viên về giờ mở cửa thư viện.", "syn": [], "cefr": "B2", "ref": "note:1788603785023"}, {"id": "28e9412edbfd71d9", "front": "controversial among", "pos": "phrase", "ipa": "", "vi": "gây tranh cãi trong số (một nhóm người)", "en": "", "ex": "The proposed curriculum updates proved highly controversial among experienced educators.", "exvi": "Những cập nhật chương trình giảng dạy được đề xuất đã gây tranh cãi gay gắt trong số các nhà giáo dục giàu kinh nghiệm.", "syn": [], "cefr": "B2", "ref": "note:1788603785025"}, {"id": "54c97a08fb14d0b4", "front": "distract", "pos": "verb", "ipa": "", "vi": "làm xao lãng, làm phân tâm", "en": "", "ex": "Loud notifications can easily distract pupils during intensive study sessions.", "exvi": "Các thông báo ầm ĩ có thể dễ dàng làm phân tâm học sinh trong các buổi học tập tập trung.", "syn": [], "cefr": "B2", "ref": "note:1788603785027"}, {"id": "caf01ab187f85c74", "front": "convert", "pos": "verb", "ipa": "", "vi": "chuyển đổi, biến đổi dạng thức", "en": "", "ex": "Engineers devised a turbine to convert ocean wave energy into clean electricity.", "exvi": "Các kỹ sư đã chế tạo một tuabin để chuyển đổi năng lượng sóng biển thành điện năng sạch.", "syn": [], "cefr": "B2", "ref": "note:1788603785029"}, {"id": "502d9d786ebaebff", "front": "innovation", "pos": "noun", "ipa": "", "vi": "sự đổi mới, sáng kiến cải tiến", "en": "", "ex": "Technological innovation in battery storage has made renewable solar systems much more viable.", "exvi": "Sáng kiến đổi mới công nghệ trong việc lưu trữ pin đã làm cho hệ thống năng lượng mặt trời tái tạo trở nên khả thi hơn nhiều.", "syn": [], "cefr": "B2", "ref": "note:1788603785031"}, {"id": "ddee526371f7f673", "front": "interpret", "pos": "verb", "ipa": "", "vi": "diễn giải, lý giải, hiểu theo một cách nào đó", "en": "", "ex": "Historians often interpret the treaty differently depending on which primary sources they examine.", "exvi": "Các nhà sử học thường diễn giải hiệp ước theo cách khác nhau tùy thuộc vào nguồn tài liệu ban đầu mà họ xem xét.", "syn": [], "cefr": "B2", "ref": "note:1788603785033"}, {"id": "0d1ba73f77bd5fa6", "front": "habitable", "pos": "adjective", "ipa": "", "vi": "có thể ở được, thích hợp để cư trú", "en": "", "ex": "Astronomers continue to search for exoplanets positioned within their host stars' habitable zone.", "exvi": "Các nhà thiên văn học tiếp tục tìm kiếm các ngoại hành tinh nằm trong vùng có thể sinh sống của ngôi sao chủ.", "syn": [], "cefr": "B2", "ref": "note:1788603785035"}, {"id": "61d669d935d609a3", "front": "surrender", "pos": "verb", "ipa": "", "vi": "đầu hàng, từ bỏ quyền kiểm soát", "en": "", "ex": "Surrounded on all sides, the defensive garrison had no rational choice but to surrender.", "exvi": "Bị bao vây từ mọi phía, đội phòng thủ không còn lựa chọn hợp lý nào khác ngoài việc đầu hàng.", "syn": [], "cefr": "B2", "ref": "note:1788603785037"}, {"id": "8d6488425e699aa3", "front": "debris", "pos": "noun", "ipa": "", "vi": "mảnh vụn, đống đổ nát, tàn tích", "en": "", "ex": "Volunteers collected plastic debris that had washed ashore along the nature reserve.", "exvi": "Các tình nguyện viên đã thu gom các mảnh vụn nhựa dạt vào bờ dọc theo khu bảo tồn thiên nhiên.", "syn": [], "cefr": "B2", "ref": "note:1788603785039"}, {"id": "88868f59d5e6ff88", "front": "inaccessible", "pos": "adjective", "ipa": "", "vi": "không thể tiếp cận được, khó tới gần", "en": "", "ex": "The mountain research outpost was completely inaccessible by vehicle throughout the snowy winter.", "exvi": "Trạm nghiên cứu trên núi hoàn toàn không thể tiếp cận bằng phương tiện cơ giới trong suốt mùa đông phủ đầy tuyết.", "syn": [], "cefr": "B2", "ref": "note:1788603785041"}, {"id": "5784a0bb7c519685", "front": "wearing out", "pos": "phrase", "ipa": "", "vi": "làm kiệt sức, làm mòn rách, hao mòn", "en": "", "ex": "Hiking on abrasive volcanic rock was quickly wearing out the soles of the explorer's boots.", "exvi": "Đi bộ đường dài trên đá núi lửa sắc nhọn đã nhanh chóng làm mòn đế ủng của nhà thám hiểm.", "syn": [], "cefr": "B2", "ref": "note:1788603785043"}, {"id": "d67ba6e57075fbcb", "front": "assurance", "pos": "noun", "ipa": "", "vi": "sự đảm bảo, cam đoan; sự tự tin chắc chắn", "en": "", "ex": "The governor provided personal assurance that displaced residents would receive prompt relief funds.", "exvi": "Thống đốc đã đưa ra sự cam đoan cá nhân rằng những cư dân bị di dời sẽ nhận được tiền cứu trợ kịp thời.", "syn": [], "cefr": "B2", "ref": "note:1788603785045"}, {"id": "46cfee4c81a5dcb9", "front": "security", "pos": "noun", "ipa": "", "vi": "Sự an toàn, an ninh; sự bảo đảm.", "en": "", "ex": "The company increased digital security to protect user accounts from unauthorized access.", "exvi": "Công ty đã gia tăng an ninh kỹ thuật số để bảo vệ tài khoản người dùng khỏi truy cập trái phép.", "syn": [], "cefr": "B2", "ref": "note:1788603785047"}, {"id": "54177f9077f06f37", "front": "simulation", "pos": "noun", "ipa": "", "vi": "Sự mô phỏng, cuộc thử nghiệm giả lập.", "en": "", "ex": "Pilots undergo flight simulation to prepare for emergencies without facing real hazards.", "exvi": "Các phi công trải qua mô phỏng bay để chuẩn bị cho các tình huống khẩn cấp mà không gặp rủi ro thực tế.", "syn": [], "cefr": "B2", "ref": "note:1788603785049"}, {"id": "2a11d201f180ded4", "front": "collapse", "pos": "verb", "ipa": "", "vi": "Sụp đổ, sập xuống hoàn toàn.", "en": "", "ex": "The abandoned building threatened to collapse under the weight of the heavy snow.", "exvi": "Tòa nhà bỏ hoang có nguy cơ sụp đổ dưới sức nặng của lớp tuyết dày.", "syn": [], "cefr": "B2", "ref": "note:1788603785051"}, {"id": "73bf80efd4ef4d5b", "front": "misjudge", "pos": "verb", "ipa": "", "vi": "Đánh giá sai, phán đoán nhầm.", "en": "", "ex": "People often misjudge the impact of small acts of kindness, underestimating how happy the recipient will be.", "exvi": "Mọi người thường đánh giá sai tác động của những cử chỉ tử tế nhỏ bé, đánh giá thấp niềm vui của người nhận.", "syn": [], "cefr": "B2", "ref": "note:1788603785053"}, {"id": "07abe86de178e8bc", "front": "suggest", "pos": "verb", "ipa": "", "vi": "Gợi ý, ngụ ý, hàm ý.", "en": "", "ex": "The surrounding English sentences suggest the meaning of the unfamiliar foreign terms.", "exvi": "Những câu tiếng Anh xung quanh gợi ý ý nghĩa của các thuật ngữ ngoại ngữ xa lạ.", "syn": [], "cefr": "B2", "ref": "note:1788603785055"}, {"id": "353a4b98bb53c37e", "front": "an exhausting", "pos": "phrase", "ipa": "", "vi": "Kiệt sức, làm mệt nhoài.", "en": "", "ex": "Watching a film lasting thirty-five straight days proved to be an exhausting ordeal for viewers.", "exvi": "Xem một bộ phim kéo dài 35 ngày liên tục tỏ ra là một trải nghiệm vắt kiệt sức lực đối với khán giả.", "syn": [], "cefr": "B2", "ref": "note:1788603785057"}, {"id": "83134f0fb303ddd0", "front": "purpose", "pos": "noun", "ipa": "", "vi": "Mục đích, ý nghĩa thiết thực.", "en": "", "ex": "He was pleased to know his architectural drafts would serve a tangible purpose in actual construction.", "exvi": "Anh ấy rất vui mừng khi biết những bản phác thảo kiến trúc của mình sẽ phục vụ một mục đích cụ thể trong việc xây dựng thực tế.", "syn": [], "cefr": "B2", "ref": "note:1788603785059"}, {"id": "e1ee5c5c7974bc5f", "front": "translation", "pos": "noun", "ipa": "", "vi": "Sự chuyển đổi, sự diễn giải lại thành dạng thực tế.", "en": "", "ex": "The supervisor oversaw the translation of complex blueprints into actionable building instructions.", "exvi": "Người giám sát chịu trách nhiệm diễn giải các bản thiết kế phức tạp thành các hướng dẫn thi công thực tế.", "syn": [], "cefr": "B2", "ref": "note:1788603785061"}]}, {"key": "anki_starter-set05", "title": "Flashcard SAT Starter Set 05", "deck": "anki_starter", "count": 50, "cards": [{"id": "d7e04c89c48de4d2", "front": "evolve", "pos": "verb", "ipa": "", "vi": "Tiến hóa, không ngừng biến đổi và phát triển.", "en": "", "ex": "The scholar argued that bourgeois culture was not static, but rather continued to evolve in response to artistic movements.", "exvi": "Học giả lập luận rằng văn hóa tư sản không hề bất biến, mà tiếp tục biến đổi để đáp ứng lại các trào lưu nghệ thuật.", "syn": [], "cefr": "B2", "ref": "note:1788603785063"}, {"id": "ef395d79ec9a90db", "front": "independent", "pos": "adjective", "ipa": "", "vi": "Độc lập, không phụ thuộc hay liên quan lẫn nhau.", "en": "", "ex": "Researchers discovered that tree density and aggregation patterns in the forest were completely independent of one another.", "exvi": "Các nhà nghiên cứu phát hiện ra rằng mật độ cây và mô hình tụ hợp trong rừng hoàn toàn độc lập với nhau.", "syn": [], "cefr": "B2", "ref": "note:1788603785065"}, {"id": "afcd0001199303db", "front": "efficiency of", "pos": "noun phrase", "ipa": "", "vi": "Hiệu suất hoạt động của, hiệu quả của.", "en": "", "ex": "Closing vents in empty rooms actually hampers the efficiency of cooling systems by causing pressure imbalances.", "exvi": "Việc đóng các cửa gió trong phòng trống thực sự làm suy giảm hiệu suất của các hệ thống làm mát do gây mất cân bằng áp suất.", "syn": [], "cefr": "B2", "ref": "note:1788603785067"}, {"id": "2dc8bcb97e04e06a", "front": "presentation", "pos": "noun", "ipa": "", "vi": "Cách thức trình bày, lối biểu đạt nghệ thuật.", "en": "", "ex": "Without an element of theatrical projection, the presentation of literature becomes dry commentary.", "exvi": "Nếu không có yếu tố phóng chiếu mang tính hư cấu, lối trình bày của văn học sẽ trở thành những lời bình luận khô khan.", "syn": [], "cefr": "B2", "ref": "note:1788603785069"}, {"id": "60f6cccdb0fda353", "front": "symmetrical", "pos": "adjective", "ipa": "", "vi": "Đối xứng, cân đối.", "en": "", "ex": "The classical building featured a beautifully symmetrical facade with identical columns on both wings.", "exvi": "Tòa nhà cổ điển nổi bật với mặt tiền đối xứng đẹp mắt với các cột giống hệt nhau ở cả hai cánh.", "syn": [], "cefr": "B2", "ref": "note:1788603785071"}, {"id": "ad8c7f9b194c433d", "front": "deplete", "pos": "verb", "ipa": "", "vi": "làm cạn kiệt, làm suy yếu", "en": "", "ex": "If we continue to deplete the Earth's natural resources, we will cause serious damage to the environment.", "exvi": "Nếu chúng ta tiếp tục làm cạn kiệt tài nguyên thiên nhiên của Trái Đất, chúng ta sẽ gây ra thiệt hại nghiêm trọng cho môi trường.", "syn": [], "cefr": "B2", "ref": "note:1788603785073"}, {"id": "1dbc232199fa23ed", "front": "cluster", "pos": "verb", "ipa": "", "vi": "Tụ tập lại, tụm lại thành cụm.", "en": "", "ex": "Visitors clustered around the tour guide to hear the explanation over the loud street noise.", "exvi": "Những du khách tụm lại xung quanh hướng dẫn viên để nghe lời giải thích lấn át tiếng ồn trên đường phố.", "syn": [], "cefr": "B2", "ref": "note:1788603785075"}, {"id": "722325e68268e7fc", "front": "intend", "pos": "verb", "ipa": "", "vi": "Dự định, có ý định.", "en": "", "ex": "The city council intends to construct a new public library in the downtown district next year.", "exvi": "Hội đồng thành phố dự định xây dựng một thư viện công cộng mới ở khu trung tâm vào năm tới.", "syn": [], "cefr": "B2", "ref": "note:1788603785077"}, {"id": "9268b67472c45b66", "front": "seasonal", "pos": "adjective", "ipa": "", "vi": "Theo mùa, vụ mùa, thay đổi theo thời vụ.", "en": "", "ex": "Farm workers often rely on seasonal employment picking fruit during harvest months.", "exvi": "Các công nhân nông trường thường dựa vào việc làm thời vụ để hái trái cây trong những tháng thu hoạch.", "syn": [], "cefr": "B2", "ref": "note:1788603785079"}, {"id": "f176f37fb7d93cb4", "front": "purchase", "pos": "noun", "ipa": "", "vi": "Điểm tựa, thế bám vững chắc; sự mua bán", "en": "", "ex": "The rock climber struggled to find a secure purchase on the sheer granite cliff.", "exvi": "Người leo núi chật vật tìm một điểm tựa vững chắc trên vách đá granit dựng đứng.", "syn": [], "cefr": "B2", "ref": "note:1788603785081"}, {"id": "a204d93e7d663c33", "front": "cryptic", "pos": "adjective", "ipa": "", "vi": "Bí hiểm, khó hiểu, mang tính ẩn ý", "en": "", "ex": "The historian discovered a cryptic message hidden within the margins of the ancient manuscript.", "exvi": "Nhà sử học đã phát hiện một thông điệp bí hiểm được giấu kín bên lề bản thảo cổ.", "syn": [], "cefr": "B2", "ref": "note:1788603785083"}, {"id": "7dde58c95b0fbcee", "front": "authenticated by", "pos": "phrase", "ipa": "", "vi": "Được xác thực, chứng thực bởi", "en": "", "ex": "The painting was authenticated by world-renowned art appraisal experts.", "exvi": "Bức tranh đã được xác thực tính nguyên bản bởi các chuyên gia giám định nghệ thuật danh tiếng thế giới.", "syn": [], "cefr": "B2", "ref": "note:1788603785085"}, {"id": "f23cd07cdd09074b", "front": "contemporary with", "pos": "phrase", "ipa": "", "vi": "Đồng thời với, cùng thời kỳ với", "en": "", "ex": "The emergence of early agricultural tools was contemporary with the retreat of major glaciers.", "exvi": "Sự xuất hiện của các công cụ nông nghiệp thời kỳ đầu diễn ra đồng thời với sự rút lui của các sông băng lớn.", "syn": [], "cefr": "B2", "ref": "note:1788603785087"}, {"id": "c15b48d0d27deaf6", "front": "modesty", "pos": "noun", "ipa": "", "vi": "Sự khiêm tốn, sự giản dị, chừng mực", "en": "", "ex": "Despite winning prestigious academic honors, his genuine modesty won him wide respect.", "exvi": "Dù giành được nhiều giải thưởng học thuật danh giá, sự khiêm tốn chân thành của anh đã khiến anh nhận được sự kính trọng rộng rãi.", "syn": [], "cefr": "B2", "ref": "note:1788603785089"}, {"id": "11bba69e51236961", "front": "obsolete", "pos": "adjective", "ipa": "", "vi": "Lỗi thời, không còn được sử dụng", "en": "", "ex": "With the advent of high-speed digital streaming, magnetic cassettes quickly became obsolete.", "exvi": "Với sự xuất hiện của công nghệ phát trực tuyến kỹ thuật số tốc độ cao, băng từ nhanh chóng trở nên lỗi thời.", "syn": [], "cefr": "B2", "ref": "note:1788603785091"}, {"id": "264a646d04f03484", "front": "compromise", "pos": "noun", "ipa": "", "vi": "Sự thỏa hiệp, sự nhượng bộ lẫn nhau", "en": "", "ex": "After marathon negotiations, the two trade delegations finally struck a workable compromise.", "exvi": "Sau các cuộc đàm phán kéo dài nghẹt thở, hai phái đoàn thương mại cuối cùng đã đạt được một sự thỏa hiệp khả thi.", "syn": [], "cefr": "B2", "ref": "note:1788603785093"}, {"id": "b46fb6974dd329b1", "front": "postponement", "pos": "noun", "ipa": "", "vi": "Sự hoãn lại, sự trì hoãn", "en": "", "ex": "Heavy torrential rains led to the unavoidable postponement of the championship match.", "exvi": "Những cơn mưa như trút nước đã dẫn đến việc hoãn trận chung kết một cách không thể tránh khỏi.", "syn": [], "cefr": "B2", "ref": "note:1788603785095"}, {"id": "4d90db9e42bb96ce", "front": "anticipation", "pos": "noun", "ipa": "", "vi": "Sự háo hức mong đợi, sự dự đoán trước", "en": "", "ex": "There was a palpable sense of anticipation among the spectators before the keynote lecture.", "exvi": "Có một sự háo hức mong đợi rõ rệt nơi khán giả trước buổi thuyết trình quan trọng.", "syn": [], "cefr": "B2", "ref": "note:1788603785097"}, {"id": "9465306426c7b02f", "front": "distinguish", "pos": "verb", "ipa": "", "vi": "Phân biệt, nhận ra sự khác nhau; làm cho nổi bật", "en": "", "ex": "Trained ornithologists can readily distinguish between closely related warbler species by song.", "exvi": "Các nhà điểu học lành nghề có thể dễ dàng phân biệt giữa các loài chim chích có quan hệ họ hàng gần thông qua tiếng hót.", "syn": [], "cefr": "B2", "ref": "note:1788603785099"}, {"id": "cc2bf27b87bc7e63", "front": "compensates for", "pos": "phrase", "ipa": "", "vi": "Bù đắp cho, đền bù cho", "en": "", "ex": "His tireless work ethic easily compensates for his initial lack of formal professional training.", "exvi": "Đạo đức làm việc không biết mệt mỏi của anh ấy dễ dàng bù đắp cho sự thiếu hụt đào tạo chuyên môn ban đầu.", "syn": [], "cefr": "B2", "ref": "note:1788603785101"}, {"id": "67450e693eacc131", "front": "verification", "pos": "noun", "ipa": "", "vi": "Sự kiểm tra tính xác thực, sự thẩm minh", "en": "", "ex": "The laboratory findings require independent scientific verification before publication.", "exvi": "Các phát hiện trong phòng thí nghiệm đòi hỏi sự thẩm minh khoa học độc lập trước khi xuất bản.", "syn": [], "cefr": "B2", "ref": "note:1788603785103"}, {"id": "bf58a29caf46a48c", "front": "documentation", "pos": "noun", "ipa": "", "vi": "Tài liệu chứng minh, hồ sơ tư liệu", "en": "", "ex": "The historian gathered extensive archival documentation to support her radical historical thesis.", "exvi": "Nhà sử học đã thu thập tài liệu lưu trữ phong phú để chứng minh cho luận điểm lịch sử táo bạo của mình.", "syn": [], "cefr": "B2", "ref": "note:1788603785105"}, {"id": "bca0312f03489087", "front": "intermittent", "pos": "adjective", "ipa": "", "vi": "Ngắt quãng, từng cơn, chập chờn", "en": "", "ex": "Due to stormy weather, the ship maintained only intermittent radio communication with harbor control.", "exvi": "Do thời tiết bão bùng, con tàu chỉ duy trì được liên lạc vô tuyến ngắt quãng với trạm kiểm soát cảng.", "syn": [], "cefr": "B2", "ref": "note:1788603785107"}, {"id": "09cc4b415e107c8d", "front": "allocate", "pos": "verb", "ipa": "", "vi": "Phân bổ, chỉ định dành riêng cho", "en": "", "ex": "The municipal council voted to allocate additional funding toward public library renovations.", "exvi": "Hội đồng thành phố đã bỏ phiếu phân bổ thêm kinh phí cho việc cải tạo thư viện công cộng.", "syn": [], "cefr": "B2", "ref": "note:1788603785109"}, {"id": "2e28a85a8e29a86f", "front": "limitation on", "pos": "noun phrase", "ipa": "", "vi": "giới hạn đối với, sự hạn chế lên", "en": "", "ex": "The government imposed a strict limitation on carbon emissions for heavy industries.", "exvi": "Chính phủ đã áp đặt một sự giới hạn nghiêm ngặt đối với lượng khí thải carbon của các ngành công nghiệp nặng.", "syn": [], "cefr": "B2", "ref": "note:1788603785111"}, {"id": "9feb4e49cc10b5bd", "front": "expense of", "pos": "noun phrase", "ipa": "", "vi": "chi phí cho; sự trả giá của", "en": "", "ex": "He pursued professional success at the expense of his physical health.", "exvi": "Anh ấy theo đuổi thành công trong sự nghiệp bằng cái giá phải trả là sức khỏe thể chất.", "syn": [], "cefr": "B2", "ref": "note:1788603785113"}, {"id": "6898b4206b0de975", "front": "elimination", "pos": "noun", "ipa": "", "vi": "sự loại bỏ, sự triệt tiêu", "en": "", "ex": "The global campaign aimed at the complete elimination of the infectious disease.", "exvi": "Chiến dịch toàn cầu nhắm tới sự triệt tiêu hoàn toàn căn bệnh truyền nhiễm.", "syn": [], "cefr": "B2", "ref": "note:1788603785115"}, {"id": "1d0e6660d7069fa3", "front": "estimation", "pos": "noun", "ipa": "", "vi": "sự ước lượng, sự phán đoán ước chừng", "en": "", "ex": "According to the surveyor's estimation, the renovation will take six months.", "exvi": "Theo ước lượng của chuyên viên khảo sát, việc cải tạo sẽ mất sáu tháng.", "syn": [], "cefr": "B2", "ref": "note:1788603785117"}, {"id": "2f3664f5444b8ca7", "front": "mentorship", "pos": "noun", "ipa": "", "vi": "sự dìu dắt, quan hệ cố vấn", "en": "", "ex": "Under the mentorship of the lead researcher, the student published her first paper.", "exvi": "Dưới sự hướng dẫn của nhà nghiên cứu chính, cô sinh viên đã xuất bản bài báo khoa học đầu tiên.", "syn": [], "cefr": "B2", "ref": "note:1788603785119"}, {"id": "411a00100a914b86", "front": "certification", "pos": "noun", "ipa": "", "vi": "sự cấp chứng chỉ, chứng nhận chính thức", "en": "", "ex": "Completing the course grants students professional certification in data science.", "exvi": "Hoàn thành khóa học sẽ trao cho học viên chứng chỉ chuyên nghiệp về khoa học dữ liệu.", "syn": [], "cefr": "B2", "ref": "note:1788603785121"}, {"id": "40acce704609ea27", "front": "excessive for", "pos": "adjective phrase", "ipa": "", "vi": "quá mức, quá đáng đối với", "en": "", "ex": "A five-hour daily commute was deemed excessive for an entry-level position.", "exvi": "Việc đi lại 5 tiếng mỗi ngày được coi là quá mức đối với một vị trí công việc khởi điểm.", "syn": [], "cefr": "B2", "ref": "note:1788603785123"}, {"id": "ae101a94996c8e4a", "front": "compensation", "pos": "noun", "ipa": "", "vi": "sự bồi thường, thù lao", "en": "", "ex": "The displaced families received financial compensation from the development firm.", "exvi": "Các gia đình phải di dời đã nhận được tiền bồi thường từ công ty phát triển dự án.", "syn": [], "cefr": "B2", "ref": "note:1788603785125"}, {"id": "e88682b3bf60394b", "front": "hazardous", "pos": "adjective", "ipa": "", "vi": "nguy hiểm, độc hại", "en": "", "ex": "Workers wore protective suits to handle the hazardous chemical waste safely.", "exvi": "Các công nhân đã mặc đồ bảo hộ để xử lý chất thải hóa học nguy hại một cách an toàn.", "syn": [], "cefr": "B2", "ref": "note:1788603785127"}, {"id": "f80a799bafc30354", "front": "infrequent", "pos": "adjective", "ipa": "", "vi": "hiếm khi xảy ra, không thường xuyên", "en": "", "ex": "Public bus service in the remote rural valley was notoriously infrequent.", "exvi": "Dịch vụ xe buýt công cộng ở thung lũng nông thôn xa xôi này nổi tiếng là thưa thớt.", "syn": [], "cefr": "B2", "ref": "note:1788603785129"}, {"id": "a04fb4f5a03a15ca", "front": "complimentary", "pos": "adjective", "ipa": "", "vi": "miễn phí; ca ngợi, khen ngợi", "en": "", "ex": "Hotel guests were treated to complimentary breakfast and sparkling water.", "exvi": "Khách ở khách sạn được mời bữa sáng và nước khoáng có ga miễn phí.", "syn": [], "cefr": "B2", "ref": "note:1788603785131"}, {"id": "7fd3536fb267f2e3", "front": "overturn", "pos": "verb", "ipa": "", "vi": "lật ngược, đảo ngược (quyết định)", "en": "", "ex": "The appellate court decided to overturn the controversial lower court ruling.", "exvi": "Tòa phúc thẩm đã quyết định đảo ngược phán quyết gây tranh cãi của tòa cấp dưới.", "syn": [], "cefr": "B2", "ref": "note:1788603785133"}, {"id": "57a237a72bfb1412", "front": "abundance", "pos": "noun", "ipa": "", "vi": "sự dồi dào, phong phú", "en": "", "ex": "The fertile soil produced an abundance of fresh fruits and vegetables.", "exvi": "Mảnh đất màu mỡ đã mang lại một sự dồi dào các loại rau củ quả tươi ngon.", "syn": [], "cefr": "B2", "ref": "note:1788603785135"}, {"id": "f9e9fc18be9877cf", "front": "surveillance", "pos": "noun", "ipa": "", "vi": "sự giám sát, theo dõi", "en": "", "ex": "The bank installed cutting-edge surveillance cameras to monitor all vaults.", "exvi": "Ngân hàng đã lắp đặt các camera giám sát hiện đại nhất để theo dõi tất cả các kho tiền.", "syn": [], "cefr": "B2", "ref": "note:1788603785137"}, {"id": "c4dd925323a0f9b8", "front": "encryption", "pos": "noun", "ipa": "", "vi": "sự mã hóa (dữ liệu)", "en": "", "ex": "End-to-end encryption ensures that personal messages cannot be intercepted by third parties.", "exvi": "Mã hóa đầu cuối đảm bảo rằng tin nhắn cá nhân không thể bị bên thứ ba can thiệp.", "syn": [], "cefr": "B2", "ref": "note:1788603785139"}, {"id": "790be083ce4001e7", "front": "elevated from", "pos": "verb phrase", "ipa": "", "vi": "được nâng lên từ, được thăng cấp từ", "en": "", "ex": "She was elevated from junior associate to full partner in recognition of her courtroom success.", "exvi": "Cô đã được nâng từ vị trí cộng sự sơ cấp lên đối tác chính thức nhằm ghi nhận thành tích tranh tụng của mình.", "syn": [], "cefr": "B2", "ref": "note:1788603785141"}, {"id": "b2e5014eb3f414d7", "front": "differentiated from", "pos": "verb phrase", "ipa": "", "vi": "được phân biệt với, làm cho khác biệt so với", "en": "", "ex": "The new hybrid model is differentiated from its predecessor by improved battery life.", "exvi": "Mẫu xe lai mới được phân biệt với mẫu tiền nhiệm nhờ thời lượng pin cải tiến.", "syn": [], "cefr": "B2", "ref": "note:1788603785143"}, {"id": "e2783d1fb1878b4e", "front": "complicate", "pos": "verb", "ipa": "", "vi": "làm phức tạp hóa", "en": "", "ex": "Unforeseen supply chain disruptions complicate the manufacturer's production schedule.", "exvi": "Những gián đoạn chuỗi cung ứng ngoài dự kiến làm phức tạp hóa tiến độ sản xuất của nhà sản xuất.", "syn": [], "cefr": "B2", "ref": "note:1788603785145"}, {"id": "c0e4e62c51aa53e8", "front": "malicious", "pos": "adjective", "ipa": "", "vi": "hiểm độc, có ác ý", "en": "", "ex": "The cybersecurity team intercepted a malicious file designed to steal passwords.", "exvi": "Đội ngũ an ninh mạng đã chặn một tệp độc hại được thiết kế để đánh cắp mật khẩu.", "syn": [], "cefr": "B2", "ref": "note:1788603785147"}, {"id": "9ca471a4e44499d8", "front": "evacuate", "pos": "verb", "ipa": "", "vi": "sơ tán, di tản", "en": "", "ex": "Residents were urged to evacuate immediately as the wildfire approached the valley.", "exvi": "Cư dân được giục sơ tán ngay lập tức khi đám cháy rừng tiến gần thung lũng.", "syn": [], "cefr": "B2", "ref": "note:1788603785149"}, {"id": "eda12cc350ec9551", "front": "brace", "pos": "verb", "ipa": "", "vi": "chuẩn bị tinh thần đón nhận (điều xấu), gồng mình chống đỡ", "en": "", "ex": "Coastal communities prepared sandbags and braced for the impending hurricane.", "exvi": "Các cộng đồng ven biển đã chuẩn bị bao cát và gồng mình sẵn sàng cho cơn bão sắp ập đến.", "syn": [], "cefr": "B2", "ref": "note:1788603785151"}, {"id": "cee4f258fea39f93", "front": "entitle", "pos": "verb", "ipa": "", "vi": "cho quyền (làm gì), đặt tiêu đề", "en": "", "ex": "Purchasing an annual pass entitles visitors to unlimited entry at all national parks.", "exvi": "Mua thẻ cả năm cho phép du khách vào cửa không giới hạn ở tất cả các công viên quốc gia.", "syn": [], "cefr": "B2", "ref": "note:1788603785153"}, {"id": "019413a2517d676e", "front": "unresponsive", "pos": "adjective", "ipa": "", "vi": "không phản hồi, không phản ứng lại", "en": "", "ex": "The corporation remained unresponsive to customer complaints regarding defective software.", "exvi": "Tập đoàn vẫn không phản hồi đối với những khiếu nại của khách hàng liên quan đến phần mềm bị lỗi.", "syn": [], "cefr": "B2", "ref": "note:1788603785155"}, {"id": "f43d651b1719f236", "front": "accommodate", "pos": "verb", "ipa": "", "vi": "chứa được; đáp ứng, điều chỉnh để hòa hợp", "en": "", "ex": "The newly renovated auditorium can comfortably accommodate up to one thousand guests.", "exvi": "Khán phòng mới được tân trang lại có thể chứa thoải mái tới một nghìn khách.", "syn": [], "cefr": "B2", "ref": "note:1788603785157"}, {"id": "ac0d8c43e7ac40d1", "front": "quantify", "pos": "verb", "ipa": "", "vi": "định lượng, xác định số lượng", "en": "", "ex": "Economists attempted to quantify the total environmental damages caused by the oil spill.", "exvi": "Các nhà kinh tế đã nỗ lực định lượng toàn bộ thiệt hại môi trường do vụ tràn dầu gây ra.", "syn": [], "cefr": "B2", "ref": "note:1788603785159"}, {"id": "df96faabcb8ed361", "front": "standardize", "pos": "verb", "ipa": "", "vi": "tiêu chuẩn hóa", "en": "", "ex": "The exam board moved to standardize testing procedures across all regional schools.", "exvi": "Hội đồng khảo thí đã tiến hành tiêu chuẩn hóa các quy trình thi cử ở tất cả các trường trong khu vực.", "syn": [], "cefr": "B2", "ref": "note:1788603785161"}]}, {"key": "anki_starter-set06", "title": "Flashcard SAT Starter Set 06", "deck": "anki_starter", "count": 50, "cards": [{"id": "4c9852247ccf5b88", "front": "inscrutable", "pos": "adjective", "ipa": "", "vi": "Bí ẩn, khó hiểu, không thể dò đoán", "en": "", "ex": "The diplomat maintained an inscrutable expression throughout the tense negotiations, revealing nothing about his strategy.", "exvi": "Nhà ngoại giao giữ nét mặt khó dò đoán trong suốt cuộc đàm phán căng thẳng, không để lộ bất cứ điều gì về chiến lược của mình.", "syn": [], "cefr": "C2", "ref": "note:1788603785163"}, {"id": "1435e5a1cc465cef", "front": "vitiate", "pos": "verb", "ipa": "", "vi": "Làm hỏng, làm mất hiệu lực, làm suy giảm chất lượng", "en": "", "ex": "A fundamental flaw in the experimental setup served to vitiate the results of the entire study.", "exvi": "Một thiếu sót cơ bản trong khâu thiết lập thí nghiệm đã làm hỏng toàn bộ kết quả nghiên cứu.", "syn": [], "cefr": "C2", "ref": "note:1788603785165"}, {"id": "651ba8574a7f819d", "front": "hermetic", "pos": "adjective", "ipa": "", "vi": "Kín khít, cô lập hoàn toàn khỏi bên ngoài", "en": "", "ex": "The reclusive author lived in hermetic isolation, refusing all interviews and visitors.", "exvi": "Tác giả ẩn dật sống trong sự cô lập khép kín hoàn toàn, từ chối mọi cuộc phỏng vấn và khách thăm viếng.", "syn": [], "cefr": "C2", "ref": "note:1788603785167"}, {"id": "634f39d7ca3f7de8", "front": "heuristic", "pos": "adjective", "ipa": "", "vi": "Tìm tòi, phỏng đoán, dựa trên kinh nghiệm thực tế", "en": "", "ex": "Rather than relying on strict formulas, the software uses a heuristic approach to detect computer viruses quickly.", "exvi": "Thay vì dựa vào các công thức cứng nhắc, phần mềm sử dụng phương pháp dựa trên kinh nghiệm thực nghiệm để phát hiện virus máy tính nhanh chóng.", "syn": [], "cefr": "C1", "ref": "note:1788603785169"}, {"id": "f356cc5a5e361f53", "front": "singular", "pos": "adjective", "ipa": "", "vi": "Đặc biệt, phi thường, độc nhất vô nhị", "en": "", "ex": "Her singular talent for deciphering ancient scripts earned her international acclaim among linguists.", "exvi": "Tài năng phi thường của cô trong việc giải mã các văn tự cổ đã mang lại cho cô sự tán dương quốc tế từ các nhà ngôn ngữ học.", "syn": [], "cefr": "B2", "ref": "note:1788603785171"}, {"id": "a89781a8a85fe177", "front": "partisan", "pos": "adjective", "ipa": "", "vi": "Mang tính phe phái, thiên vị đảng phái", "en": "", "ex": "The newspaper was criticized for its partisan coverage of the presidential election.", "exvi": "Tờ báo bị chỉ trích vì đưa tin thiên vị theo phe phái về cuộc bầu cử tổng thống.", "syn": [], "cefr": "C1", "ref": "note:1788603785173"}, {"id": "231bde0d8c5a60ec", "front": "antiquate", "pos": "verb", "ipa": "", "vi": "Làm cho lỗi thời, làm cho cũ kỹ", "en": "", "ex": "Rapid advancements in smartphone cameras threaten to antiquate standalone digital compact cameras.", "exvi": "Sự phát triển nhanh chóng của camera trên điện thoại thông minh đe dọa biến máy ảnh kỹ thuật số mini thành đồ lỗi thời.", "syn": [], "cefr": "C1", "ref": "note:1788603785175"}, {"id": "48d265ac2d7a68f4", "front": "eschew", "pos": "verb", "ipa": "", "vi": "Tránh xa, kiêng cữ, từ bỏ", "en": "", "ex": "Eschewing the mythological and heroic subject matter popular among his peers, the painter focused on ordinary railway commuters.", "exvi": "Từ bỏ các chủ đề thần thoại và anh hùng vốn được các đồng nghiệp ưa chuộng, họa sĩ đã tập trung vào những hành khách đi tàu bình thường.", "syn": [], "cefr": "C1", "ref": "note:1788603785177"}, {"id": "598aeb4c2800f797", "front": "elicit", "pos": "verb", "ipa": "", "vi": "gợi ra, khơi ra", "en": "", "ex": "The survey was designed to elicit information about people's spending habits.", "exvi": "Bài khảo sát được thiết kế để gợi ra thông tin về thói quen chi tiêu của mọi người.", "syn": [], "cefr": "C1", "ref": "note:1788603785179"}, {"id": "77c87c1f11d151fa", "front": "fleeting", "pos": "adjective", "ipa": "", "vi": "Thoáng qua, phù du, ngắn ngủi", "en": "", "ex": "For a fleeting moment, the sun broke through the storm clouds before disappearing again.", "exvi": "Trong một khoảnh khắc thoáng qua, mặt trời ló rạng qua những đám mây bão trước khi lại biến mất.", "syn": [], "cefr": "B2", "ref": "note:1788603785181"}, {"id": "6e64ce5e5c66fc34", "front": "appraise", "pos": "verb", "ipa": "", "vi": "Thẩm định, đánh giá chất lượng hoặc giá trị", "en": "", "ex": "An independent expert was hired to appraise the authenticity and financial worth of the ancient artifacts.", "exvi": "Một chuyên gia độc lập đã được thuê để thẩm định tính xác thực và giá trị tài chính của các cổ vật.", "syn": [], "cefr": "C1", "ref": "note:1788603785183"}, {"id": "c100905d16278ede", "front": "conspicuous", "pos": "adjective", "ipa": "", "vi": "dễ thấy, nổi bật", "en": "", "ex": "In the crowd of dark suits, his bright yellow tie was conspicuous.", "exvi": "Trong đám đông mặc vest tối màu, chiếc cà vạt màu vàng tươi của anh ấy thật nổi bật.", "syn": [], "cefr": "C1", "ref": "note:1788603785185"}, {"id": "698e01f6e529faec", "front": "precipitate", "pos": "verb", "ipa": "", "vi": "gây ra, thúc đẩy", "en": "", "ex": "The rising unemployment figures precipitated a major political crisis.", "exvi": "Số liệu thất nghiệp gia tăng đã gây ra một cuộc khủng hoảng chính trị lớn.", "syn": [], "cefr": "C1", "ref": "note:1788603785187"}, {"id": "f9e16488d379f8ba", "front": "impartiality", "pos": "noun", "ipa": "", "vi": "tính không thiên vị, sự công bằng", "en": "", "ex": "The judge was praised for her impartiality throughout the controversial trial.", "exvi": "Vị thẩm phán được khen ngợi vì sự công tâm của bà trong suốt phiên tòa gây tranh cãi.", "syn": [], "cefr": "C1", "ref": "note:1788603785189"}, {"id": "72aa92fe46fc8d66", "front": "coherent", "pos": "adjective", "ipa": "", "vi": "Mạch lạc, chặt chẽ, gắn kết", "en": "", "ex": "The essay presented a coherent argument that systematically addressed every counterpoint.", "exvi": "Bài tiểu luận đưa ra một lập luận mạch lạc, giải quyết một cách có hệ thống mọi ý kiến phản bác.", "syn": [], "cefr": "B2", "ref": "note:1788603785191"}, {"id": "f18ed6f3f1856edb", "front": "renounce", "pos": "verb", "ipa": "", "vi": "từ bỏ, khước từ", "en": "", "ex": "After the scandal, the prince was forced to renounce his claim to the throne.", "exvi": "Sau vụ bê bối, hoàng tử đã buộc phải từ bỏ quyền thừa kế ngai vàng.", "syn": [], "cefr": "C1", "ref": "note:1788603785193"}, {"id": "b7d05c40c438b938", "front": "attest to", "pos": "verb", "ipa": "", "vi": "Chứng thực cho, là minh chứng cho", "en": "", "ex": "Ephemeral artifacts such as old tourist flyers attest to profound shifts in public leisure values over the last century.", "exvi": "Những vật phẩm phù du như tờ rơi du lịch cũ là minh chứng cho những chuyển biến sâu sắc trong giá trị giải trí đại chúng trong thế kỷ qua.", "syn": [], "cefr": "C1", "ref": "note:1788603785195"}, {"id": "816913eed486c729", "front": "prevail over", "pos": "verb", "ipa": "", "vi": "Chiếm ưu thế hơn, vượt trội hơn", "en": "", "ex": "In historical renown, few accomplishments can prevail over the lasting prestige of being the very first to achieve a feat.", "exvi": "Về danh tiếng lịch sử, ít thành tựu nào có thể chiếm ưu thế hơn uy tín lâu dài của việc là người đầu tiên đạt được một kỳ tích.", "syn": [], "cefr": "C1", "ref": "note:1788603785197"}, {"id": "91b4a363310e6c46", "front": "elusive", "pos": "adjective", "ipa": "", "vi": "khó nắm bắt, khó tìm", "en": "", "ex": "The elusive concept of 'happiness' is something philosophers have debated for centuries.", "exvi": "Khái niệm khó nắm bắt về 'hạnh phúc' là điều mà các triết gia đã tranh luận trong nhiều thế kỷ.", "syn": [], "cefr": "C1", "ref": "note:1788603785199"}, {"id": "740aa33f50f12f8f", "front": "exploit", "pos": "verb", "ipa": "", "vi": "Khai thác, tận dụng", "en": "", "ex": "As a defense mechanism, the monarch butterfly exploits toxic compounds from milkweed plants to deter predators.", "exvi": "Như một cơ chế tự vệ, bướm vua tận dụng các hợp chất độc hại từ cây bông tai để ngăn chặn kẻ săn mồi.", "syn": [], "cefr": "B2", "ref": "note:1788603785201"}, {"id": "e50789a2f9f3ec88", "front": "rectify", "pos": "verb", "ipa": "", "vi": "sửa chữa, điều chỉnh cho đúng", "en": "", "ex": "The company had to rectify the error in the customer's bill to avoid legal issues.", "exvi": "Công ty đã phải sửa chữa sai sót trong hóa đơn của khách hàng để tránh các vấn đề pháp lý.", "syn": [], "cefr": "C1", "ref": "note:1788603785203"}, {"id": "8c6a09110875fff4", "front": "spurious", "pos": "adjective", "ipa": "", "vi": "giả mạo, không xác thực", "en": "", "ex": "He was arrested in 2018 on spurious corruption charges, which were later dropped.", "exvi": "Ông ấy đã bị bắt vào năm 2018 vì những cáo buộc tham nhũng giả mạo, mà sau đó đã được bãi bỏ.", "syn": [], "cefr": "C1", "ref": "note:1788603785205"}, {"id": "b7c1fc62231ade9c", "front": "engender", "pos": "verb", "ipa": "", "vi": "gây ra, tạo ra", "en": "", "ex": "The politician's inflammatory speech engendered a great deal of controversy and anger.", "exvi": "Bài phát biểu đầy tính kích động của chính trị gia đã gây ra rất nhiều tranh cãi và tức giận.", "syn": [], "cefr": "C1", "ref": "note:1788603785207"}, {"id": "b2b1eeb21ac3112b", "front": "immutable", "pos": "adjective", "ipa": "", "vi": "bất biến, không thể thay đổi", "en": "", "ex": "Despite our pleas, the laws of the ancient kingdom were immutable and could not be altered.", "exvi": "Bất chấp lời khẩn cầu của chúng tôi, luật lệ của vương quốc cổ đại là bất biến và không thể thay đổi.", "syn": [], "cefr": "C2", "ref": "note:1788603785209"}, {"id": "f0cf7eced568c516", "front": "undermine", "pos": "verb", "ipa": "", "vi": "làm suy yếu, làm xói mòn", "en": "", "ex": "The constant criticism from his boss began to undermine his confidence.", "exvi": "Sự chỉ trích liên tục từ sếp bắt đầu làm suy yếu sự tự tin của anh ấy.", "syn": [], "cefr": "B2", "ref": "note:1788603785211"}, {"id": "259d3362f65bfecf", "front": "monetize", "pos": "verb", "ipa": "", "vi": "Kiếm tiền từ, thương mại hóa", "en": "", "ex": "Independent content creators explore various subscription models to monetize their online video channels.", "exvi": "Các nhà sáng tạo nội dung độc lập tìm hiểu nhiều mô hình đăng ký trả phí khác nhau nhằm kiếm tiền từ các kênh video trực tuyến của mình.", "syn": [], "cefr": "C1", "ref": "note:1788603785213"}, {"id": "3e6627a51a273b5f", "front": "expound", "pos": "verb", "ipa": "", "vi": "giải thích chi tiết, trình bày cặn kẽ", "en": "", "ex": "The scholar took the podium to expound her innovative theory on historical linguistics.", "exvi": "Học giả bước lên bục giảng để trình bày cặn kẽ lý thuyết đổi mới của mình về ngôn ngữ học lịch sử.", "syn": [], "cefr": "C1", "ref": "note:1788603785215"}, {"id": "3421f132574c3286", "front": "caricature", "pos": "noun", "ipa": "", "vi": "tranh biếm họa, sự bóp méo phóng đại để chế giễu", "en": "", "ex": "The editorial cartoon presented an amusing caricature of the politician with absurdly enlarged ears.", "exvi": "Bức tranh biếm họa trên báo đã thể hiện hình ảnh châm biếm hài hước về vị chính trị gia với đôi tai to một cách lố bịch.", "syn": [], "cefr": "C1", "ref": "note:1788603785217"}, {"id": "4975624802f49e5c", "front": "amorphous", "pos": "adjective", "ipa": "", "vi": "vô định hình, không có cấu trúc rõ ràng", "en": "", "ex": "The artist's latest work was an amorphous blob of clay, leaving its meaning open to interpretation.", "exvi": "Tác phẩm mới nhất của người nghệ sĩ là một khối đất sét vô định hình, để ngỏ cho mọi người tự diễn giải ý nghĩa.", "syn": [], "cefr": "C1", "ref": "note:1788603785219"}, {"id": "c0c5604089964496", "front": "neglect", "pos": "verb", "ipa": "", "vi": "Bỏ bê, bỏ qua, không chú ý tới", "en": "", "ex": "Mapping methods based strictly on pedestrian tracking often neglect sidewalks that are seldom used by locals.", "exvi": "Các phương pháp lập bản đồ chỉ dựa vào theo dõi người đi bộ thường bỏ qua những vỉa hè ít khi được người dân sử dụng.", "syn": [], "cefr": "B2", "ref": "note:1788603785221"}, {"id": "582c6abc16fefd3d", "front": "palpable", "pos": "adjective", "ipa": "", "vi": "rõ ràng, có thể sờ thấy được", "en": "", "ex": "The tension in the room was palpable as everyone waited for the CEO's announcement.", "exvi": "Sự căng thẳng trong phòng trở nên rõ rệt khi mọi người chờ đợi thông báo của CEO.", "syn": [], "cefr": "C1", "ref": "note:1788603785223"}, {"id": "09cd784e293f61d8", "front": "augment", "pos": "verb", "ipa": "", "vi": "gia tăng, làm tăng thêm", "en": "", "ex": "He augmented his income by taking on a second job in the evenings.", "exvi": "Anh ấy đã gia tăng thu nhập của mình bằng cách nhận thêm một công việc thứ hai vào buổi tối.", "syn": [], "cefr": "C1", "ref": "note:1788603785225"}, {"id": "b8088bcbd7b7d9c8", "front": "ambivalence", "pos": "noun", "ipa": "", "vi": "sự mâu thuẫn trong tư tưởng, sự do dự", "en": "", "ex": "She felt a great deal of ambivalence about leaving her hometown, torn between the excitement of a new city and the sadness of leaving friends behind.", "exvi": "Cô ấy cảm thấy rất do dự về việc rời quê hương, giằng xé giữa sự phấn khích về một thành phố mới và nỗi buồn khi phải xa bạn bè.", "syn": [], "cefr": "C1", "ref": "note:1788603785227"}, {"id": "07c2fb714298a713", "front": "incongruity", "pos": "noun", "ipa": "", "vi": "sự không phù hợp, sự phi lý", "en": "", "ex": "There's a striking incongruity between the picturesque landscape and the derelict, abandoned factory in the middle of it.", "exvi": "Có một sự không phù hợp rõ rệt giữa phong cảnh đẹp như tranh vẽ và nhà máy bỏ hoang, đổ nát ở ngay giữa.", "syn": [], "cefr": "C2", "ref": "note:1788603785229"}, {"id": "7dfa91458b4bba0f", "front": "exaggerate", "pos": "verb", "ipa": "", "vi": "Thổi phồng, phóng đại", "en": "", "ex": "Romantic paintings often exaggerate the beauty and heroism of their subjects while omitting any visual flaws.", "exvi": "Các bức tranh thời kỳ Lãng mạn thường phóng đại vẻ đẹp và sự anh hùng của đối tượng trong khi che giấu mọi khuyết điểm thị giác.", "syn": [], "cefr": "B2", "ref": "note:1788603785231"}, {"id": "ea7545ba6fc50d09", "front": "epitomize", "pos": "verb", "ipa": "", "vi": "là hình mẫu hoàn hảo, tiêu biểu cho", "en": "", "ex": "With his unwavering determination and creative genius, Steve Jobs epitomized the spirit of innovation.", "exvi": "Với quyết tâm không lay chuyển và tài năng sáng tạo thiên tài, Steve Jobs là hình mẫu tiêu biểu cho tinh thần đổi mới.", "syn": [], "cefr": "C1", "ref": "note:1788603785233"}, {"id": "7cd92f3229484609", "front": "fictitious", "pos": "adjective", "ipa": "", "vi": "hư cấu, giả mạo, không có thật", "en": "", "ex": "The fabricated biographical entries persisted on the encyclopedia website until editors confirmed they were entirely fictitious.", "exvi": "Các mục tiểu sử bịa đặt vẫn tồn tại trên trang bách khoa toàn thư cho đến khi các biên tập viên xác nhận chúng hoàn toàn là hư cấu.", "syn": [], "cefr": "C1", "ref": "note:1788603785235"}, {"id": "62475ae32028a3bd", "front": "subordinate to", "pos": "adjective phrase", "ipa": "", "vi": "phụ thuộc vào, thứ yếu so với", "en": "", "ex": "In the early design of the software, image-sharing was completely subordinate to the app's location-tagging functionality.", "exvi": "Trong thiết kế ban đầu của phần mềm, việc chia sẻ hình ảnh hoàn toàn là thứ yếu so với chức năng gắn thẻ vị trí của ứng dụng.", "syn": [], "cefr": "C1", "ref": "note:1788603785237"}, {"id": "aa2021009210945c", "front": "discount", "pos": "verb", "ipa": "", "vi": "xem nhẹ, bỏ qua, coi là không đáng kể", "en": "", "ex": "Scholars who rigidly categorize authors into general literary schools tend to discount individual stylistic nuances.", "exvi": "Các học giả phân loại cứng nhắc các tác giả vào những trường phái văn học chung có xu hướng xem nhẹ những sắc thái phong cách riêng biệt.", "syn": [], "cefr": "C1", "ref": "note:1788603785239"}, {"id": "d7d5b722ddd75560", "front": "enrich", "pos": "verb", "ipa": "", "vi": "làm phong phú, làm giàu thêm", "en": "", "ex": "Traveling to different countries can greatly enrich your understanding of the world.", "exvi": "Việc đi du lịch đến các quốc gia khác nhau có thể làm phong phú thêm đáng kể sự hiểu biết của bạn về thế giới.", "syn": [], "cefr": "B2", "ref": "note:1788603785241"}, {"id": "35287b83b90e56dd", "front": "commend", "pos": "verb", "ipa": "", "vi": "khen ngợi, ca ngợi, biểu dương", "en": "", "ex": "Prominent cultural critics published reviews to commend the director's bold cinematic exploration of racial identity.", "exvi": "Các nhà phê bình văn hóa nổi tiếng đã xuất bản các bài đánh giá để ca ngợi sự khám phá điện ảnh táo bạo của đạo diễn về bản sắc chủng tộc.", "syn": [], "cefr": "C1", "ref": "note:1788603785243"}, {"id": "996d604085d1de30", "front": "a quintessential", "pos": "adjective phrase", "ipa": "", "vi": "tinh túy, tiêu biểu nhất, mẫu mực nhất", "en": "", "ex": "The recessed mihrab is considered a quintessential architectural element found across historic and modern mosques alike.", "exvi": "Hốc tường mihrab được coi là một yếu tố kiến trúc tiêu biểu nhất được tìm thấy ở cả các nhà thờ Hồi giáo lịch sử lẫn hiện đại.", "syn": [], "cefr": "C2", "ref": "note:1788603785245"}, {"id": "1a8a2cecc4622f14", "front": "succession", "pos": "noun", "ipa": "", "vi": "sự kế vị, một chuỗi liên tiếp", "en": "", "ex": "She has won the award for the third year in succession.", "exvi": "Cô ấy đã giành được giải thưởng trong năm thứ ba liên tiếp.", "syn": [], "cefr": "B2", "ref": "note:1788603785246"}, {"id": "8c937294e7df2db3", "front": "proxies for", "pos": "noun phrase", "ipa": "", "vi": "vật thay thế cho, đại diện đại diện cho", "en": "", "ex": "Because soft tissue fossilizes poorly, scientists use the lungs of modern birds as proxies for the respiratory systems of ancient dinosaurs.", "exvi": "Bởi vì mô mềm hóa thạch rất kém, các nhà khoa học sử dụng phổi của các loài chim hiện đại làm vật đại diện cho hệ hô hấp của khủng long cổ đại.", "syn": [], "cefr": "C1", "ref": "note:1788603785247"}, {"id": "84498c054854f1da", "front": "fluctuate", "pos": "phrasal verb", "ipa": "", "vi": "biến động theo, thay đổi cùng với", "en": "", "ex": "The price of airline tickets will fluctuate with the demand from travelers.", "exvi": "Giá vé máy bay sẽ biến động theo nhu cầu của du khách.", "syn": [], "cefr": "B2", "ref": "note:1788603785248"}, {"id": "9ccb02e8692e0d97", "front": "invoke", "pos": "verb", "ipa": "", "vi": "viện dẫn (luật lệ, quyền lực), cầu khẩn", "en": "", "ex": "Parliamentarians voted to invoke an obscure parliamentary procedure to abruptly terminate the filibuster.", "exvi": "Các nghị sĩ đã bỏ phiếu để viện dẫn một quy trình nghị viện ít người biết nhằm chấm dứt ngay lập tức hành vi cản trở tranh luận.", "syn": [], "cefr": "C1", "ref": "note:1788603785249"}, {"id": "bbcfc78633c81a81", "front": "subordinate", "pos": "adjective phrase", "ipa": "", "vi": "ở cấp dưới, phụ thuộc vào", "en": "", "ex": "In the company's hierarchy, the marketing team is subordinate to the sales director.", "exvi": "Trong hệ thống cấp bậc của công ty, đội marketing ở cấp dưới của giám đốc kinh doanh.", "syn": [], "cefr": "B2", "ref": "note:1788603785250"}, {"id": "1c2fd3281e2dc5d5", "front": "dynamic", "pos": "adjective", "ipa": "", "vi": "năng động, luôn thay đổi", "en": "", "ex": "The business world is a dynamic environment where you must adapt quickly to survive.", "exvi": "Thế giới kinh doanh là một môi trường năng động, nơi bạn phải thích ứng nhanh chóng để tồn tại.", "syn": [], "cefr": "B2", "ref": "note:1788603785251"}, {"id": "9a4a2f72dfa504a3", "front": "anigh", "pos": "adverb, preposition", "ipa": "", "vi": "gần, kế bên", "en": "", "ex": "As the fateful hour drew anigh, the knight checked his sword one last time.", "exvi": "Khi giờ khắc định mệnh đến gần, người hiệp sĩ kiểm tra lại thanh gươm của mình lần cuối.", "syn": [], "cefr": "C2", "ref": "note:1788603785252"}, {"id": "a86d9531422e1a32", "front": "integral", "pos": "adjective", "ipa": "", "vi": "thiết yếu, không thể thiếu để tạo nên tổng thể", "en": "", "ex": "The drumming ensemble's contribution was integral to the symphony, requiring their presence at every performance.", "exvi": "Đóng góp của ban nhạc gõ là thiết yếu đối với bản giao hưởng, đòi hỏi sự hiện diện của họ trong mọi buổi biểu diễn.", "syn": [], "cefr": "C1", "ref": "note:1788603785253"}]}, {"key": "anki_starter-set07", "title": "Flashcard SAT Starter Set 07", "deck": "anki_starter", "count": 50, "cards": [{"id": "4b4adc0a79578f31", "front": "anon", "pos": "adverb", "ipa": "", "vi": "sớm, chẳng bao lâu nữa", "en": "", "ex": "I must leave now, but I will see you anon.", "exvi": "Tôi phải đi bây giờ, nhưng tôi sẽ sớm gặp lại bạn.", "syn": [], "cefr": "C2", "ref": "note:1788603785254"}, {"id": "e9fce719e87c344b", "front": "illusory", "pos": "adjective", "ipa": "", "vi": "hão huyền, không có thật", "en": "", "ex": "The sense of progress they felt was illusory, as their core problems remained unsolved.", "exvi": "Cảm giác tiến bộ mà họ cảm thấy chỉ là hão huyền, vì những vấn đề cốt lõi của họ vẫn chưa được giải quyết.", "syn": [], "cefr": "C1", "ref": "note:1788603785255"}, {"id": "71e2ec0b661b5188", "front": "sooth", "pos": "noun", "ipa": "", "vi": "sự thật, thực tế", "en": "", "ex": "In sooth, his apologies were empty words, for his actions never changed.", "exvi": "Thật vậy, lời xin lỗi của anh ta chỉ là những lời sáo rỗng, vì hành động của anh ta không bao giờ thay đổi.", "syn": [], "cefr": "C2", "ref": "note:1788603785256"}, {"id": "38b0a4b17e6b02a7", "front": "prescient", "pos": "adjective", "ipa": "", "vi": "biết trước, tiên tri", "en": "", "ex": "Her prescient warning about the stock market crash saved me a fortune.", "exvi": "Lời cảnh báo biết trước của cô ấy về sự sụp đổ của thị trường chứng khoán đã cứu tôi cả một gia tài.", "syn": [], "cefr": "C2", "ref": "note:1788603785257"}, {"id": "68390e94f445fe57", "front": "anent", "pos": "preposition", "ipa": "", "vi": "về, liên quan đến", "en": "", "ex": "The committee members had a lengthy discussion anent the new environmental regulations.", "exvi": "Các thành viên ủy ban đã có một cuộc thảo luận kéo dài về các quy định môi trường mới.", "syn": [], "cefr": "C2", "ref": "note:1788603785258"}, {"id": "a674bfec79c6a3b2", "front": "insurmountable", "pos": "adjective", "ipa": "", "vi": "không thể vượt qua, không thể khắc phục", "en": "", "ex": "The language barrier seemed an insurmountable obstacle to her success in the new country.", "exvi": "Rào cản ngôn ngữ dường như là một trở ngại không thể vượt qua đối với thành công của cô ấy ở đất nước mới.", "syn": [], "cefr": "C2", "ref": "note:1788603785259"}, {"id": "8693a8f7fc1fb2f5", "front": "betwixt", "pos": "adverb, preposition", "ipa": "", "vi": "ở giữa, ở khoảng giữa", "en": "", "ex": "Caught betwixt a desire for adventure and a longing for the comforts of home, she couldn&#x27;t decide which path to take.", "exvi": "Bị kẹt giữa một bên là khao khát phiêu lưu và một bên là mong mỏi sự thoải mái của gia đình, cô không thể quyết định nên đi con đường nào.", "syn": [], "cefr": "C2", "ref": "note:1788603785260"}, {"id": "852edce4df862a71", "front": "overlook", "pos": "verb", "ipa": "", "vi": "Bỏ sót, làm ngơ, không nhận thấy", "en": "", "ex": "Researchers must be careful not to overlook minor discrepancies that could indicate a flaw in their methodology.", "exvi": "Các nhà nghiên cứu phải cẩn thận để không bỏ sót những sai khác nhỏ có thể chỉ ra lỗ hổng trong phương pháp của họ.", "syn": [], "cefr": "B2", "ref": "note:1788603785261"}, {"id": "a85d939c51c2251a", "front": "aught", "pos": "noun", "ipa": "", "vi": "bất cứ thứ gì, số không", "en": "", "ex": "For aught I know, the old mansion has been deserted for decades.", "exvi": "Theo những gì tôi biết, dinh thự cổ đó đã bị bỏ hoang trong nhiều thập kỷ.", "syn": [], "cefr": "C2", "ref": "note:1788603785262"}, {"id": "a83e2ecf0e71bb6a", "front": "misconstrue", "pos": "verb", "ipa": "", "vi": "hiểu sai, giải thích sai", "en": "", "ex": "His sarcastic comment was misconstrued as a serious criticism, which caused a lot of tension in the team.", "exvi": "Lời bình luận mỉa mai của anh ấy đã bị hiểu sai thành một lời chỉ trích nghiêm túc, điều này gây ra rất nhiều căng thẳng trong đội.", "syn": [], "cefr": "C1", "ref": "note:1788603785263"}, {"id": "77a2ec3d62c41901", "front": "whilom", "pos": "adverb", "ipa": "", "vi": "trước đây, ngày xưa", "en": "", "ex": "The whilom king, now a humble farmer, often reminisced about his days on the throne.", "exvi": "Vị vua ngày xưa, giờ là một người nông dân khiêm tốn, thường hồi tưởng về những ngày tháng trên ngai vàng.", "syn": [], "cefr": "C2", "ref": "note:1788603785264"}, {"id": "990c5531b59fa982", "front": "idiosyncratic", "pos": "adjective", "ipa": "", "vi": "đặc trưng, lập dị", "en": "", "ex": "The famous director's idiosyncratic filmmaking style, characterized by slow-motion shots and unexpected plot twists, is instantly recognizable.", "exvi": "Phong cách làm phim lập dị của vị đạo diễn nổi tiếng, đặc trưng bởi những cảnh quay chậm và những tình tiết bất ngờ, có thể được nhận ra ngay lập tức.", "syn": [], "cefr": "C1", "ref": "note:1788603785265"}, {"id": "476289aef5ef092b", "front": "&#x27;tis", "pos": "contraction", "ipa": "", "vi": "nó là", "en": "", "ex": "&#x27;Tis better to have loved and lost than never to have loved at all.", "exvi": "Thà yêu và mất còn hơn không bao giờ yêu.", "syn": [], "cefr": "C2", "ref": "note:1788603785266"}, {"id": "a1198a4f92af2725", "front": "belie", "pos": "verb", "ipa": "", "vi": "gây ấn tượng sai lầm, cho thấy là sai", "en": "", "ex": "Her calm and cheerful demeanor belied the turmoil she was experiencing inside.", "exvi": "Vẻ ngoài điềm tĩnh và vui vẻ của cô đã che giấu sự hỗn loạn mà cô đang trải qua bên trong.", "syn": [], "cefr": "C1", "ref": "note:1788603785267"}, {"id": "ffc782aab579066a", "front": "whencever", "pos": "adverb", "ipa": "", "vi": "từ bất cứ nơi nào, từ bất cứ nguồn nào", "en": "", "ex": "Whencever the funds are derived, they must be accounted for properly.", "exvi": "Dù các quỹ này có nguồn gốc từ bất cứ đâu, chúng đều phải được hạch toán đúng quy cách.", "syn": [], "cefr": "C2", "ref": "note:1788603785268"}, {"id": "21bd78837568e0c2", "front": "circumvent", "pos": "verb", "ipa": "", "vi": "lách luật, né tránh", "en": "", "ex": "The clever hacker found a way to circumvent the company's security system.", "exvi": "Tên tin tặc thông minh đã tìm ra cách để lách qua hệ thống an ninh của công ty.", "syn": [], "cefr": "C1", "ref": "note:1788603785269"}, {"id": "d983bc97ae997cc1", "front": "tarry", "pos": "verb", "ipa": "", "vi": "nán lại, chần chừ", "en": "", "ex": "She wanted to tarry a while longer in the beautiful garden, but she knew she had to leave.", "exvi": "Cô ấy muốn nán lại thêm một lúc trong khu vườn xinh đẹp, nhưng cô biết mình phải rời đi.", "syn": [], "cefr": "C2", "ref": "note:1788603785270"}, {"id": "a4f5e56328d65b8e", "front": "acclaim", "pos": "noun, verb", "ipa": "", "vi": "sự hoan nghênh, lời ca ngợi", "en": "", "ex": "The new novel has been met with widespread critical acclaim.", "exvi": "Cuốn tiểu thuyết mới đã nhận được sự hoan nghênh rộng rãi từ giới phê bình.", "syn": [], "cefr": "B2", "ref": "note:1788603785271"}, {"id": "1b3606d656adbb7c", "front": "nay", "pos": "adverb", "ipa": "", "vi": "hay đúng hơn là, thậm chí còn", "en": "", "ex": "Her performance was impressive, nay, legendary.", "exvi": "Màn trình diễn của cô ấy rất ấn tượng, hay đúng hơn là, huyền thoại.", "syn": [], "cefr": "C2", "ref": "note:1788603785272"}, {"id": "a0c47ed79e349c96", "front": "incongruous", "pos": "adjective", "ipa": "", "vi": "không phù hợp, lệch lạc", "en": "", "ex": "His casual jeans and t-shirt were incongruous with the formal dress code of the wedding.", "exvi": "Chiếc quần jean và áo phông đời thường của anh ấy trông không phù hợp với quy định trang phục trang trọng của lễ cưới.", "syn": [], "cefr": "C1", "ref": "note:1788603785273"}, {"id": "1241dffbdee0393c", "front": "whither", "pos": "adverb", "ipa": "", "vi": "đến nơi nào, về phương nào", "en": "", "ex": "The economy is in crisis, and whither it will turn next is anyone&#x27;s guess.", "exvi": "Nền kinh tế đang khủng hoảng, và nó sẽ đi về đâu tiếp theo thì không ai đoán được.", "syn": [], "cefr": "C2", "ref": "note:1788603785274"}, {"id": "a036d3265b223357", "front": "irrefutable", "pos": "adjective", "ipa": "", "vi": "không thể chối cãi, không thể bác bỏ", "en": "", "ex": "The prosecutor presented irrefutable evidence that left the jury with no choice but to convict.", "exvi": "Công tố viên đã đưa ra bằng chứng không thể chối cãi, khiến bồi thẩm đoàn không còn lựa chọn nào khác ngoài việc kết tội.", "syn": [], "cefr": "C1", "ref": "note:1788603785275"}, {"id": "4cb8b3259dee90b2", "front": "ne’er-do-well", "pos": "noun", "ipa": "", "vi": "kẻ vô tích sự, người lêu lổng", "en": "", "ex": "Her parents warned her not to get involved with the town&#x27;s well-known ne&#x27;er-do-well, fearing he would only bring her trouble.", "exvi": "Bố mẹ cô cảnh báo cô đừng dính dáng đến kẻ vô tích sự nổi tiếng của thị trấn, vì sợ rằng anh ta sẽ chỉ mang lại rắc rối cho cô.", "syn": [], "cefr": "C2", "ref": "note:1788603785276"}, {"id": "bf30cd55da1f59b9", "front": "pretentiousness", "pos": "noun", "ipa": "", "vi": "sự tự phụ, tính khoe mẽ", "en": "", "ex": "The pretentiousness of the art critic was unbearable; he used overly complex jargon just to sound intelligent.", "exvi": "Sự tự phụ của nhà phê bình nghệ thuật thật không thể chịu nổi; ông ta chỉ dùng những thuật ngữ quá phức tạp để tỏ ra thông minh.", "syn": [], "cefr": "C1", "ref": "note:1788603785277"}, {"id": "1d326966edf55f5a", "front": "twill", "pos": "noun", "ipa": "", "vi": "vải chéo, một loại vải dệt bền chắc", "en": "", "ex": "His work trousers were made of a sturdy cotton twill, perfect for the tough conditions on the construction site.", "exvi": "Chiếc quần dài đi làm của anh ấy được làm bằng vải cotton chéo bền chắc, hoàn hảo cho những điều kiện khắc nghiệt ở công trường.", "syn": [], "cefr": "C2", "ref": "note:1788603785278"}, {"id": "ae919a2728579975", "front": "permissible", "pos": "adjective", "ipa": "", "vi": "được cho phép, có thể chấp nhận", "en": "", "ex": "It is permissible to take photographs in the museum, but the use of flash is strictly forbidden.", "exvi": "Việc chụp ảnh trong bảo tàng là được phép, nhưng việc sử dụng đèn flash thì bị nghiêm cấm.", "syn": [], "cefr": "C1", "ref": "note:1788603785279"}, {"id": "463f14118f99a0a9", "front": "hap", "pos": "noun", "ipa": "", "vi": "sự may rủi, vận may", "en": "", "ex": "By a strange hap, the two long-lost brothers found themselves sitting next to each other on the same flight.", "exvi": "Bởi một sự tình cờ kỳ lạ, hai anh em thất lạc lâu năm lại thấy mình ngồi cạnh nhau trên cùng một chuyến bay.", "syn": [], "cefr": "C2", "ref": "note:1788603785280"}, {"id": "9b4bee47a59585b1", "front": "establish", "pos": "verb", "ipa": "", "vi": "Thành lập, củng cố, định hình vững chắc", "en": "", "ex": "While established literary forms like the novel follow recognizable conventions, experimental genres blend prose and poetry.", "exvi": "Trong khi các hình thức văn học đã định hình vững chắc như tiểu thuyết tuân theo những quy ước quen thuộc, các thể loại thử nghiệm lại kết hợp giữa văn xuôi và thơ ca.", "syn": [], "cefr": "B2", "ref": "note:1788603785281"}, {"id": "4c44f728b73fcafe", "front": "doth", "pos": "verb", "ipa": "", "vi": "làm, thực hiện (lối cổ)", "en": "", "ex": "The lady doth protest too much, methinks.", "exvi": "Tôi nghĩ bà ấy phản đối hơi quá rồi.", "syn": [], "cefr": "C2", "ref": "note:1788603785282"}, {"id": "b0c9389cc7550eae", "front": "prolific", "pos": "adjective", "ipa": "", "vi": "sản xuất nhiều, phong phú", "en": "", "ex": "She was a prolific writer of novels and short stories, with over 50 books published.", "exvi": "Bà là một nhà văn viết rất sung sức với hơn 50 đầu sách gồm tiểu thuyết và truyện ngắn đã được xuất bản.", "syn": [], "cefr": "C1", "ref": "note:1788603785283"}, {"id": "0d3434807b30fa95", "front": "oftentimes", "pos": "adverb", "ipa": "", "vi": "thường xuyên, nhiều lần", "en": "", "ex": "Oftentimes, what seems like a major setback is actually a blessing in disguise.", "exvi": "Thường xuyên, những gì có vẻ là một trở ngại lớn lại thực ra là một may mắn trá hình.", "syn": [], "cefr": "C2", "ref": "note:1788603785284"}, {"id": "f6a8b33098f123ff", "front": "circumspection", "pos": "noun", "ipa": "", "vi": "sự thận trọng, sự cẩn trọng", "en": "", "ex": "The lawyer's circumspection in handling the sensitive case prevented any potential lawsuits.", "exvi": "Sự thận trọng của người luật sư khi xử lý vụ án nhạy cảm đã ngăn chặn mọi vụ kiện tiềm tàng.", "syn": [], "cefr": "C1", "ref": "note:1788603785285"}, {"id": "a38ac9068d76566f", "front": "hark", "pos": "verb", "ipa": "", "vi": "lắng nghe, gợi nhớ", "en": "", "ex": "The design of the new building harks back to the classic architecture of the 19th century.", "exvi": "Thiết kế của tòa nhà mới gợi nhớ lại lối kiến trúc cổ điển của thế kỷ 19.", "syn": [], "cefr": "C2", "ref": "note:1788603785286"}, {"id": "dc63966cead629e6", "front": "ubiquity", "pos": "noun", "ipa": "", "vi": "sự có mặt khắp nơi, sự phổ biến", "en": "", "ex": "The ubiquity of smartphones means that you can find a Wi-Fi signal almost anywhere you go.", "exvi": "Sự phổ biến của điện thoại thông minh có nghĩa là bạn có thể tìm thấy tín hiệu Wi-Fi ở hầu hết mọi nơi bạn đến.", "syn": [], "cefr": "C2", "ref": "note:1788603785287"}, {"id": "96ec01df0aa39185", "front": "mayhap", "pos": "adverb", "ipa": "", "vi": "có lẽ, biết đâu", "en": "", "ex": "Mayhap the old legends are true, and a great treasure lies hidden in these mountains.", "exvi": "Biết đâu những truyền thuyết cũ là thật, và một kho báu lớn đang được giấu trong những ngọn núi này.", "syn": [], "cefr": "C2", "ref": "note:1788603785288"}, {"id": "8c40ebb22b6c4d37", "front": "analogous", "pos": "adjective", "ipa": "", "vi": "tương tự, có thể so sánh được", "en": "", "ex": "The relationship between a teacher and a student is often considered analogous to that of a guide and a traveler.", "exvi": "Mối quan hệ giữa giáo viên và học sinh thường được coi là tương tự như mối quan hệ giữa người hướng dẫn và du khách.", "syn": [], "cefr": "C1", "ref": "note:1788603785289"}, {"id": "e9b97cebb218dd07", "front": "ne’er", "pos": "adverb", "ipa": "", "vi": "không bao giờ, chưa từng", "en": "", "ex": "I shall ne&#x27;er forget the kindness you have shown me.", "exvi": "Tôi sẽ không bao giờ quên lòng tốt mà bạn đã dành cho tôi.", "syn": [], "cefr": "C2", "ref": "note:1788603785290"}, {"id": "77feaa5d3c671f54", "front": "endure", "pos": "verb", "ipa": "", "vi": "Chịu đựng, trải qua gian khổ", "en": "", "ex": "Though still young, the weary student claimed to have endured great hardship, poverty, and illness.", "exvi": "Dù còn trẻ, người sinh viên mệt mỏi quả quyết rằng anh đã phải chịu đựng biết bao gian khổ, nghèo đói và bệnh tật.", "syn": [], "cefr": "B2", "ref": "note:1788603785291"}, {"id": "009d7fa5c2c0c9a4", "front": "o’er", "pos": "preposition, adverb", "ipa": "", "vi": "trên khắp, qua", "en": "", "ex": "The pale moon casts its glow o’er the silent lake.", "exvi": "Vầng trăng nhợt nhạt tỏa ánh sáng của mình trên khắp mặt hồ tĩnh lặng.", "syn": [], "cefr": "C2", "ref": "note:1788603785292"}, {"id": "bf38feaa311a5871", "front": "preempt", "pos": "verb", "ipa": "", "vi": "hành động phủ đầu, giành trước", "en": "", "ex": "The president's speech was an attempt to preempt the opposition's criticism.", "exvi": "Bài phát biểu của tổng thống là một nỗ lực nhằm đi trước một bước để chặn đứng sự chỉ trích của phe đối lập.", "syn": [], "cefr": "C1", "ref": "note:1788603785293"}, {"id": "3c909ec033c37274", "front": "whence", "pos": "adverb", "ipa": "", "vi": "từ đâu, nguồn gốc", "en": "", "ex": "The mysterious letter arrived, but the envelope had no return address, leaving us to wonder whence it came.", "exvi": "Lá thư bí ẩn đã đến, nhưng phong bì không có địa chỉ người gửi, khiến chúng tôi tự hỏi nó đến từ đâu.", "syn": [], "cefr": "C2", "ref": "note:1788603785294"}, {"id": "67f2d19d4efafc1a", "front": "delineate", "pos": "verb", "ipa": "", "vi": "phác họa, mô tả", "en": "", "ex": "The report's introduction carefully delineates the scope and objectives of the research project.", "exvi": "Phần giới thiệu của báo cáo đã mô tả cẩn thận phạm vi và mục tiêu của dự án nghiên cứu.", "syn": [], "cefr": "C1", "ref": "note:1788603785295"}, {"id": "2fd0f22f0fba99fe", "front": "ope", "pos": "verb", "ipa": "", "vi": "bày tỏ ý kiến, cho rằng", "en": "", "ex": "When the professor asked for thoughts on the novel&#x27;s controversial ending, only one brave student dared to ope that the protagonist&#x27;s fate was well-deserved.", "exvi": "Khi giáo sư hỏi suy nghĩ về cái kết gây tranh cãi của cuốn tiểu thuyết, chỉ một sinh viên dũng cảm dám cho rằng số phận của nhân vật chính là hoàn toàn xứng đáng.", "syn": [], "cefr": "C2", "ref": "note:1788603785296"}, {"id": "4af8bfe5e6347c83", "front": "partition", "pos": "verb", "ipa": "", "vi": "chia cắt, phân chia thành từng phần", "en": "", "ex": "The treaty required authorities to partition the disputed borderland into separate administrative zones.", "exvi": "Hiệp ước yêu cầu các nhà chức trách phải chia cắt vùng biên giới tranh chấp thành các khu vực hành chính riêng biệt.", "syn": [], "cefr": "C1", "ref": "note:1788603785297"}, {"id": "187728033fbec391", "front": "oft", "pos": "adverb", "ipa": "", "vi": "thường, hay", "en": "", "ex": "How oft have I lain awake at night, pondering the mysteries of the universe.", "exvi": "Biết bao đêm tôi đã thao thức, suy ngẫm về những bí ẩn của vũ trụ.", "syn": [], "cefr": "C2", "ref": "note:1788603785298"}, {"id": "138bf18b52d5632a", "front": "dissociate from", "pos": "verb phrase", "ipa": "", "vi": "tách rời khỏi, cắt đứt quan hệ với", "en": "", "ex": "The senator took immediate steps to dissociate from the extreme policies advocated by her former campaign manager.", "exvi": "Nữ thượng nghị sĩ đã ngay lập tức thực hiện các biện pháp để tách mình khỏi những chính sách cực đoan do người quản lý chiến dịch cũ của bà đề xuất.", "syn": [], "cefr": "C1", "ref": "note:1788603785299"}, {"id": "37f30c3d23d3ebf6", "front": "hast", "pos": "verb", "ipa": "", "vi": "có (dạng cổ), sở hữu (dạng cổ)", "en": "", "ex": "\"Thou hast stolen my heart,\" the knight declared to the fair maiden.", "exvi": "\"Nàng đã đánh cắp trái tim ta,\" chàng hiệp sĩ tuyên bố với người thiếu nữ xinh đẹp.", "syn": [], "cefr": "C2", "ref": "note:1788603785300"}, {"id": "9ce40965fe8d8310", "front": "influence", "pos": "verb", "ipa": "", "vi": "Ảnh hưởng, định hình, chi phối", "en": "", "ex": "The ongoing expansion of the river delta is heavily influenced by the coastal tides that continuously redistribute sediment.", "exvi": "Sự mở rộng liên tục của đồng bằng châu thổ chịu ảnh hưởng nặng nề bởi các đợt thủy triều ven biển vốn liên tục tái phân bổ trầm tích.", "syn": [], "cefr": "B2", "ref": "note:1788603785301"}, {"id": "52c9e1855b969786", "front": "fain", "pos": "adverb", "ipa": "", "vi": "sẵn lòng, vui lòng", "en": "", "ex": "The knight would fain have stayed longer at the feast, but he had a long journey ahead.", "exvi": "Chàng hiệp sĩ đã sẵn lòng ở lại bữa tiệc lâu hơn, nhưng anh ta có một cuộc hành trình dài phía trước.", "syn": [], "cefr": "C2", "ref": "note:1788603785302"}, {"id": "1d7edc746d12c6fb", "front": "collude with", "pos": "verb phrase", "ipa": "", "vi": "câu kết ngầm với, thông đồng với", "en": "", "ex": "Regulators suspected that several competing logistics firms were preparing to collude with one another to fix transport prices.", "exvi": "Các cơ quan quản lý nghi ngờ rằng một vài công ty logistics đối thủ đang chuẩn bị câu kết ngầm với nhau để ấn định giá vận chuyển.", "syn": [], "cefr": "C1", "ref": "note:1788603785303"}]}, {"key": "anki_starter-set08", "title": "Flashcard SAT Starter Set 08", "deck": "anki_starter", "count": 50, "cards": [{"id": "0ef86495c0702656", "front": "twas", "pos": "contraction", "ipa": "", "vi": "nó đã là", "en": "", "ex": "&#x27;Twas a dark and stormy night when the lone traveler arrived at the inn.", "exvi": "Đó là một đêm giông bão tối tăm khi người lữ khách cô độc đến quán trọ.", "syn": [], "cefr": "C2", "ref": "note:1788603785304"}, {"id": "76d30abf8cdc7888", "front": "catalysts of", "pos": "noun phrase", "ipa": "", "vi": "chất xúc tác của, tác nhân thúc đẩy", "en": "", "ex": "Historians argue that printed broadsides functioned as potent catalysts of political revolt across the colonies.", "exvi": "Các nhà sử học cho rằng những tờ truyền đơn in ấn đã đóng vai trò như những chất xúc tác mạnh mẽ thúc đẩy cuộc nổi dậy chính trị trên khắp các thuộc địa.", "syn": [], "cefr": "C1", "ref": "note:1788603785305"}, {"id": "b2be24e9358ff915", "front": "verily", "pos": "adverb", "ipa": "", "vi": "thật vậy, quả thật", "en": "", "ex": "He was, verily, a man of great courage.", "exvi": "Ông ấy, quả thật, là một người đàn ông vô cùng dũng cảm.", "syn": [], "cefr": "C2", "ref": "note:1788603785306"}, {"id": "c79452314dda5334", "front": "revelation", "pos": "noun", "ipa": "", "vi": "sự tiết lộ, phát hiện đầy bất ngờ", "en": "", "ex": "The investigation led to the startling revelation that company funds had been mismanaged.", "exvi": "Cuộc điều tra đã dẫn đến sự tiết lộ giật mình rằng các quỹ của công ty đã bị quản lý kém.", "syn": [], "cefr": "C1", "ref": "note:1788603785307"}, {"id": "2f9879ca1e5cdc2d", "front": "yonder", "pos": "adverb, adjective", "ipa": "", "vi": "ở đằng kia, ở xa kia", "en": "", "ex": "The old farmer pointed to the misty hills and said, 'My land extends to the river yonder.'", "exvi": "Người nông dân già chỉ tay về phía những ngọn đồi mờ sương và nói: 'Đất của tôi trải dài đến tận con sông ở đằng kia.'", "syn": [], "cefr": "C2", "ref": "note:1788603785308"}, {"id": "e517e09c3a3a242d", "front": "incongruous with", "pos": "adjective phrase", "ipa": "", "vi": "không phù hợp, mâu thuẫn với, lạc lõng với", "en": "", "ex": "The discovery that the basking shark maintains an elevated body temperature is incongruous with its long-held classification as an ectotherm.", "exvi": "Phát hiện rằng cá nhám phơi duy trì nhiệt độ cơ thể cao hơn là không phù hợp với việc phân loại lâu nay của nó là loài biến nhiệt.", "syn": [], "cefr": "C1", "ref": "note:1788603785309"}, {"id": "5fcd851779d3da0f", "front": "dost", "pos": "verb", "ipa": "", "vi": "(cổ) làm, thực hiện", "en": "", "ex": "Methinks thou dost protest too much.", "exvi": "Thiển nghĩ, ngài phản đối hơi nhiều rồi.", "syn": [], "cefr": "C2", "ref": "note:1788603785310"}, {"id": "789b4587a864a220", "front": "mitigate", "pos": "verb", "ipa": "", "vi": "làm dịu đi, giảm nhẹ", "en": "", "ex": "The government implemented new policies to mitigate the economic impact of the pandemic.", "exvi": "Chính phủ đã thực thi các chính sách mới để giảm nhẹ tác động kinh tế của đại dịch.", "syn": [], "cefr": "B2", "ref": "note:1788603785311"}, {"id": "86a522a62de56000", "front": "ere", "pos": "preposition, conjunction", "ipa": "", "vi": "trước khi, trước lúc", "en": "", "ex": "He had to finish his speech ere the bell rang for the end of the day.", "exvi": "Anh ấy phải kết thúc bài phát biểu của mình trước khi chuông reo báo hết ngày.", "syn": [], "cefr": "C2", "ref": "note:1788603785312"}, {"id": "28041522d58a987b", "front": "constrain within", "pos": "verb phrase", "ipa": "", "vi": "hạn chế, gò bó, giam giữ trong phạm vi", "en": "", "ex": "The strict architectural code tended to constrain builders within traditional stylistic parameters.", "exvi": "Quy chuẩn kiến trúc nghiêm ngặt có xu hướng hạn chế các nhà xây dựng trong các khuôn khổ phong cách truyền thống.", "syn": [], "cefr": "C1", "ref": "note:1788603785313"}, {"id": "0aac1fa5b0caca24", "front": "unto", "pos": "preposition", "ipa": "", "vi": "đến, tới", "en": "", "ex": "Do unto others as you would have them do unto you.", "exvi": "Hãy đối xử với người khác như cách bạn muốn họ đối xử với mình.", "syn": [], "cefr": "C2", "ref": "note:1788603785314"}, {"id": "019739c48b50c2ca", "front": "overreach by", "pos": "verb phrase", "ipa": "", "vi": "vượt quá thẩm quyền/khả năng do hành vi gì", "en": "", "ex": "The executive committee risked overreach by unilaterally changing the bylaws without shareholder approval.", "exvi": "Ban điều hành đã có nguy cơ lạm quyền khi đơn phương thay đổi điều lệ mà không có sự chấp thuận của các cổ đông.", "syn": [], "cefr": "C1", "ref": "note:1788603785315"}, {"id": "f6bf4460eef9253c", "front": "wherefore", "pos": "adverb", "ipa": "", "vi": "vì lý do gì, vì vậy", "en": "", "ex": "She was unhappy, but wherefore she could not say.", "exvi": "Cô ấy không vui, nhưng vì lý do gì thì cô không thể nói được.", "syn": [], "cefr": "C2", "ref": "note:1788603785316"}, {"id": "57b020a4cf5553d9", "front": "contingent on", "pos": "adjective phrase", "ipa": "", "vi": "phụ thuộc vào, tùy thuộc vào", "en": "", "ex": "How a photograph is interpreted by viewers is largely contingent on how its visual elements are balanced.", "exvi": "Cách một bức ảnh được người xem diễn giải phần lớn phụ thuộc vào cách các yếu tố thị giác của nó được cân bằng.", "syn": [], "cefr": "C1", "ref": "note:1788603785317"}, {"id": "0c0435be601386ee", "front": "unbeknownst", "pos": "adverb", "ipa": "", "vi": "mà không biết, mà không hay biết", "en": "", "ex": "Unbeknownst to her team, Sophie had already found a solution to the complex coding bug.", "exvi": "Cả nhóm không hề hay biết, Sophie đã tìm ra giải pháp cho lỗi lập trình phức tạp đó rồi.", "syn": [], "cefr": "C2", "ref": "note:1788603785318"}, {"id": "7aeda9bd040a77be", "front": "replicable", "pos": "adjective", "ipa": "", "vi": "có thể nhân rộng, có thể sao chép/tái lập được", "en": "", "ex": "Because related parrot species share identical ecologies, the successful conservation model may be replicable throughout the region.", "exvi": "Vì các loài vẹt có họ hàng chia sẻ đặc tính sinh thái giống nhau, mô hình bảo tồn thành công này có thể nhân rộng được trên toàn khu vực.", "syn": [], "cefr": "C1", "ref": "note:1788603785319"}, {"id": "c400ee340471dba5", "front": "herewith", "pos": "adverb", "ipa": "", "vi": "kèm theo đây, cùng với cái này", "en": "", "ex": "Herewith, I enclose the signed contract for your records.", "exvi": "Kèm theo đây, tôi xin gửi bản hợp đồng đã ký để quý vị lưu lại.", "syn": [], "cefr": "C2", "ref": "note:1788603785320"}, {"id": "91e28847851b1e87", "front": "counteract", "pos": "verb", "ipa": "", "vi": "chống lại, làm trung hòa", "en": "", "ex": "To counteract the dryness of the air, they used a humidifier.", "exvi": "Để chống lại sự khô hanh của không khí, họ đã sử dụng một chiếc máy tạo độ ẩm.", "syn": [], "cefr": "B2", "ref": "note:1788603785321"}, {"id": "b63e06b20e449d64", "front": "perchance", "pos": "adverb", "ipa": "", "vi": "có lẽ, ngẫu nhiên", "en": "", "ex": "Perchance he will be there, but I doubt it.", "exvi": "Có lẽ anh ấy sẽ ở đó, nhưng tôi nghi ngờ điều đó.", "syn": [], "cefr": "C2", "ref": "note:1788603785322"}, {"id": "e095c532e5fd8ca3", "front": "denote", "pos": "verb", "ipa": "", "vi": "biểu thị, chỉ ra, là biểu hiện của", "en": "", "ex": "Receiving the UNESCO designation was meant to denote that the municipality possessed an exceptional culinary culture.", "exvi": "Việc nhận danh hiệu của UNESCO nhằm biểu thị rằng thành phố sở hữu một nét văn hóa ẩm thực đặc sắc.", "syn": [], "cefr": "C1", "ref": "note:1788603785323"}, {"id": "da995fee324bc828", "front": "forsooth", "pos": "adverb", "ipa": "", "vi": "quả thật, thật vậy", "en": "", "ex": "He is, forsooth, the wisest man in the kingdom, though he can&#x27;t even tie his own shoes.", "exvi": "Anh ta, quả thật, là người đàn ông khôn ngoan nhất vương quốc, dù đến buộc dây giày của mình anh ta còn không biết.", "syn": [], "cefr": "C2", "ref": "note:1788603785324"}, {"id": "679e037b36bbd7b5", "front": "opaque", "pos": "adjective", "ipa": "", "vi": "mờ đục, khó hiểu, không minh bạch", "en": "", "ex": "Advocates warned that mobile gaming companies are notoriously opaque about how personal user data is stored and utilized.", "exvi": "Các nhà vận động cảnh báo rằng các công ty trò chơi di động khét tiếng mập mờ và không minh bạch về cách thức dữ liệu cá nhân của người dùng được lưu trữ và sử dụng.", "syn": [], "cefr": "C1", "ref": "note:1788603785325"}, {"id": "0f3db2c3f5ae7ece", "front": "yon", "pos": "adverb & determiner", "ipa": "", "vi": "đằng kia, ở đằng xa", "en": "", "ex": "Look at yon majestic castle on the hill.", "exvi": "Hãy nhìn tòa lâu đài hùng vĩ đằng kia trên ngọn đồi.", "syn": [], "cefr": "C2", "ref": "note:1788603785326"}, {"id": "71bfade71b159a8d", "front": "pervasive", "pos": "adjective", "ipa": "", "vi": "lan tỏa khắp nơi, phổ biến", "en": "", "ex": "The influence of social media is pervasive in modern society, affecting everything from politics to personal relationships.", "exvi": "Tầm ảnh hưởng của mạng xã hội lan tỏa khắp xã hội hiện đại, tác động đến mọ
