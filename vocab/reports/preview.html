<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flashcard — Starter Deck preview</title>
<style>
  :root {
    --ink:#111827; --muted:#6b7280; --line:#e5e7eb; --bg:#f7f7f8;
    --indigo:#4f46e5; --indigo-soft:#eef2ff; --amber:#b45309; --green:#15803d;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body { font:15px/1.55 Inter, "Segoe UI", system-ui, -apple-system, sans-serif; color:var(--ink); background:var(--bg); }
  button { font:inherit; cursor:pointer; }

  /* ---------- library ---------- */
  .lib-header { background:#f1f1f3; border-bottom:1px solid var(--line); padding:14px 22px; font-weight:600; }
  .wrap { max-width:1400px; margin:0 auto; padding:18px 22px 60px; }
  .banner { display:flex; align-items:center; gap:18px; background:#eceafd; border:1px solid #dcd6f8;
            border-radius:14px; padding:16px 20px; margin-bottom:18px; }
  .banner .t { color:var(--indigo); font-weight:700; margin-bottom:3px; }
  .banner .d { color:#4b5563; font-size:14px; }
  .banner .spacer { flex:1; }
  .btn-primary { background:var(--indigo); color:#fff; border:none; border-radius:999px; padding:9px 18px; font-weight:600; }
  .btn-primary:disabled { opacity:.45; cursor:default; }
  .search { display:flex; gap:0; margin-bottom:20px; max-width:420px; }
  .search input { flex:1; border:1px solid var(--line); border-right:none; border-radius:10px 0 0 10px;
                  padding:9px 14px; font:inherit; background:#fff; outline:none; }
  .search button { border:1px solid var(--line); border-left:none; background:#fff; border-radius:0 10px 10px 0;
                   padding:9px 14px; color:#dc2626; font-weight:600; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
  @media (max-width:1100px){ .grid { grid-template-columns:repeat(2,1fr);} }
  @media (max-width:640px){ .grid { grid-template-columns:1fr;} .wrap{padding:14px 12px 50px;} }
  .set { position:relative; border:1px solid #eef0f3; border-radius:12px; padding:18px 18px 30px; cursor:pointer;
         transition:transform .08s ease, box-shadow .12s ease; overflow:hidden; text-align:left; }
  .set:hover { transform:translateY(-2px); box-shadow:0 6px 18px rgba(17,24,39,.08); }
  .set .title { font-weight:700; font-size:16px; margin-bottom:26px; }
  .set .chip { display:inline-block; background:rgba(255,255,255,.85); border-radius:6px; padding:2px 10px;
               font-size:13px; color:#374151; }
  .set .deco { position:absolute; right:10px; bottom:8px; opacity:.75; }
  .pager { display:flex; justify-content:flex-end; align-items:center; gap:10px; margin-top:22px;
           color:#4b5563; font-size:13px; }
  .pager button { border:none; background:transparent; color:#9ca3af; font-size:16px; padding:2px 6px; }
  .pager button.cur { color:#dc2626; border:1px solid #f3c1c6; border-radius:8px; background:#fff; }
  .pager button:disabled { opacity:.35; }
  .empty { color:var(--muted); padding:30px 4px; }

  /* ---------- study ---------- */
  #study { display:none; min-height:100vh; background:var(--bg); }
  .study-top { display:flex; align-items:center; gap:10px; background:#fff; border-bottom:1px solid var(--line);
               padding:10px 18px; position:sticky; top:0; z-index:5; }
  .study-top .brand { font-weight:700; }
  .study-top .crumb { color:var(--muted); font-size:14px; }
  .study-top .spacer { flex:1; }
  .btn-exit { display:flex; align-items:center; gap:6px; border:1px solid var(--line); background:#fff;
              border-radius:999px; padding:6px 14px; }
  .stage { display:flex; flex-direction:column; align-items:center; padding:22px 14px 90px; }
  .count-pill { background:#fff; border:1px solid var(--line); border-radius:999px; padding:5px 14px;
                font-size:13px; color:#374151; margin-bottom:18px; }
  .card-zone { display:flex; align-items:center; gap:14px; width:100%; max-width:860px; justify-content:center; }
  .arrow { width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background:#fff;
           color:#6b7280; font-size:16px; flex:none; }
  .card3d { background:#fff; border-radius:18px; box-shadow:0 10px 30px rgba(17,24,39,.10);
            width:min(560px, 92vw); min-height:340px; padding:30px 34px; cursor:pointer;
            display:flex; flex-direction:column; }
  .face-front { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; }
  .word-xl { font-size:clamp(28px, 5vw, 44px); font-weight:800; text-align:center; }
  .hint { color:#9ca3af; font-size:14px; display:flex; gap:6px; align-items:center; }
  .face-back { flex:1; }
  .word-row { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .word-lg { font-size:30px; font-weight:800; }
  .pos { color:var(--muted); font-style:italic; }
  .ipa-row { display:flex; align-items:center; gap:10px; margin:8px 0 18px; color:#374151; }
  .speak { width:34px; height:34px; border-radius:50%; border:none; background:#eef2ff; color:var(--indigo);
           display:flex; align-items:center; justify-content:center; font-size:15px; }
  .vi-mean { font-weight:700; font-size:18px; margin-bottom:4px; }
  .en-mean { color:var(--muted); margin-bottom:16px; }
  .sec-label { font-size:11px; letter-spacing:.08em; color:#9ca3af; font-weight:700; margin:12px 0 8px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip2 { background:#f3f4f6; border-radius:999px; padding:5px 14px; font-size:14px; color:#374151; }
  .exbox { background:#eef2ff; border-radius:12px; padding:14px 16px; margin-top:16px; }
  .exbox .lab { color:var(--indigo); font-size:11px; font-weight:700; letter-spacing:.08em; margin-bottom:6px; }
  .exbox .tx { color:#374151; }
  .exbox .tx b { color:var(--indigo); }
  .ratings { display:flex; gap:16px; margin-top:22px; width:min(560px,92vw); }
  .rate { flex:1; background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px; text-align:center; }
  .rate .a { font-weight:700; margin-bottom:2px; }
  .rate .b { color:#9ca3af; font-size:12.5px; }
  .rate.amber .a { color:var(--amber); } .rate.green .a { color:var(--green); }
  .progress { position:fixed; left:50%; transform:translateX(-50%); bottom:56px; width:min(560px,90vw);
              height:6px; background:#e5e7eb; border-radius:999px; }
  .progress i { display:block; height:100%; background:var(--indigo); border-radius:999px; transition:width .2s; }
  .study-bottom { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--line);
                  display:flex; align-items:center; padding:10px 18px; gap:10px; }
  .study-bottom .u { font-weight:600; font-size:14px; }
  .study-bottom .m { color:#9ca3af; font-size:12.5px; }
  .study-bottom .spacer { flex:1; }
  .btn-ghost { border:1px solid var(--line); background:#fff; border-radius:10px; padding:8px 18px; }
  .done { text-align:center; padding:60px 20px; }
  .done h2 { margin:0 0 8px; }
  .done p { color:var(--muted); margin:0 0 20px; }
</style>
</head>
<body>

<div id="library">
  <div class="lib-header">Flashcard</div>
  <div class="wrap">
    <div class="banner">
      <div>
        <div class="t">Ôn hôm nay</div>
        <div class="d" id="due-text">Chưa có từ nào đến hạn — chọn một bộ để học.</div>
      </div>
      <div class="spacer"></div>
      <button class="btn-primary" id="btn-due" disabled>Bắt đầu ôn</button>
    </div>
    <div class="search">
      <input id="q" placeholder="Nhập từ khóa..." aria-label="Tìm kiếm">
      <button id="btn-search">Tìm kiếm</button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="pager" id="pager"></div>
  </div>
</div>

<div id="study">
  <div class="study-top">
    <span class="brand">Flashcard</span>
    <span class="crumb" id="crumb">Ôn hôm nay</span>
    <span class="spacer"></span>
    <button class="btn-exit" id="btn-exit">⟲ Thoát</button>
  </div>
  <div class="stage">
    <div class="count-pill" id="count-pill"></div>
    <div class="card-zone">
      <button class="arrow" id="prev" aria-label="Thẻ trước">‹</button>
      <div class="card3d" id="card"></div>
      <button class="arrow" id="next" aria-label="Thẻ sau">›</button>
    </div>
    <div class="ratings" id="ratings" style="display:none">
      <button class="rate amber" id="rate-again"><div class="a">Không chắc</div><div class="b">ôn lại sau 1 ngày</div></button>
      <button class="rate green" id="rate-good"><div class="a">Thuộc</div><div class="b">ôn lại sau 4 ngày</div></button>
    </div>
  </div>
  <div class="progress"><i id="bar" style="width:0%"></i></div>
  <div class="study-bottom">
    <div><div class="u">Starter Deck preview</div><div class="m">bản nháp local — chưa phát hành</div></div>
    <span class="spacer"></span>
    <button class="btn-ghost" id="btn-prev">Trước</button>
    <button class="btn-primary" id="btn-next">Tiếp</button>
  </div>
</div>

<script>
const SECTIONS = [{"key": "anki_starter-set01", "title": "Flashcard SAT Starter Set 01", "deck": "anki_starter", "count": 50, "cards": [{"id": "c172e76e8df8abe9", "front": "corroborate", "pos": "verb", "ipa": "", "vi": "xác nhận, chứng thực", "en": "", "ex": "The witness's testimony was corroborated by the security camera footage.", "exvi": "Lời khai của nhân chứng đã được chứng thực bởi đoạn phim từ camera an ninh.", "syn": [], "cefr": "C1", "ref": "note:1788603784663"}, {"id": "f747d0ad9120f7f6", "front": "substantiate", "pos": "verb", "ipa": "", "vi": "chứng minh, xác thực", "en": "", "ex": "The journalist was fired because she couldn't substantiate the sources in her article.", "exvi": "Nữ nhà báo đã bị sa thải vì không thể xác thực các nguồn tin trong bài báo của mình.", "syn": [], "cefr": "C1", "ref": "note:1788603784665"}, {"id": "ab7cbed77c392f59", "front": "equivocal", "pos": "adjective", "ipa": "", "vi": "mập mờ, nước đôi", "en": "", "ex": "His equivocal response to the reporter's question left everyone wondering what he really meant.", "exvi": "Câu trả lời nước đôi của anh ta cho câu hỏi của phóng viên khiến mọi người tự hỏi ý anh ta thực sự là gì.", "syn": [], "cefr": "C1", "ref": "note:1788603784667"}, {"id": "f441ac0b9e9ad6bc", "front": "disregard", "pos": "verb", "ipa": "", "vi": "ngó lơ, xem nhẹ, không bận tâm", "en": "", "ex": "Planners who disregard the architectural history of old neighborhoods risk stripping the city of its authentic charm.", "exvi": "Những nhà quy hoạch xem nhẹ lịch sử kiến trúc của các khu phố cổ có nguy cơ làm mất đi nét quyến rũ vốn có của thành phố.", "syn": [], "cefr": "C1", "ref": "note:1788603784669"}, {"id": "306fe6af2c5daa51", "front": "disparity", "pos": "noun", "ipa": "", "vi": "sự chênh lệch, sự khác biệt lớn", "en": "", "ex": "The growing disparity between the rich and the poor is a major concern for the new government.", "exvi": "Sự chênh lệch ngày càng tăng giữa người giàu và người nghèo là một mối quan tâm lớn đối với chính phủ mới.", "syn": [], "cefr": "B2", "ref": "note:1788603784671"}, {"id": "5afc84e57ba5f684", "front": "impart", "pos": "verb", "ipa": "", "vi": "truyền đạt, ban cho, mang lại", "en": "", "ex": "The chieftain's powerful spoken words impart courage and resilience to every warrior listening in the camp.", "exvi": "Những lời nói đầy uy quyền của vị tù trưởng truyền sự can đảm và kiên cường đến từng chiến binh đang lắng nghe trong doanh trại.", "syn": [], "cefr": "C1", "ref": "note:1788603784673"}, {"id": "d6d951b4d950c7df", "front": "ubiquitous", "pos": "adjective", "ipa": "", "vi": "ở đâu cũng có, phổ biến", "en": "", "ex": "Nowadays, smartphones are ubiquitous, found in the hands of people from all walks of life.", "exvi": "Ngày nay, điện thoại thông minh có mặt ở khắp nơi, được tìm thấy trong tay của mọi người từ mọi tầng lớp xã hội.", "syn": [], "cefr": "C1", "ref": "note:1788603784675"}, {"id": "9ed3f55bf26a68a7", "front": "supplant", "pos": "verb", "ipa": "", "vi": "thay thế, chiếm chỗ", "en": "", "ex": "Streaming services have largely supplanted physical media like DVDs and Blu-rays.", "exvi": "Các dịch vụ phát trực tuyến phần lớn đã thay thế các phương tiện vật lý như DVD và Blu-ray.", "syn": [], "cefr": "C1", "ref": "note:1788603784677"}, {"id": "c36a6e2e02f436e1", "front": "illuminate", "pos": "verb", "ipa": "", "vi": "làm sáng tỏ, giải thích rõ, soi sáng", "en": "", "ex": "Examining early fossil specimens helps paleontologists illuminate key evolutionary transitions of the Pliocene epoch.", "exvi": "Việc xem xét các mẫu hóa thạch ban đầu giúp các nhà cổ sinh vật học làm sáng tỏ các bước chuyển hóa tiến hóa then chốt của kỷ Pliocen.", "syn": [], "cefr": "C1", "ref": "note:1788603784679"}, {"id": "09952d97a1f8deaa", "front": "reveal", "pos": "verb", "ipa": "", "vi": "tiết lộ, làm lộ ra, cho thấy", "en": "", "ex": "Recent genetic testing managed to reveal that the Johnny gourd is the wild ancestor of modern summer squash.", "exvi": "Xét nghiệm di truyền gần đây đã tiết lộ rằng quả bầu Johnny chính là tổ tiên hoang dã của loài bí ngô mùa hè hiện đại.", "syn": [], "cefr": "B2", "ref": "note:1788603784681"}, {"id": "69f75a546598cd47", "front": "repudiate", "pos": "verb", "ipa": "", "vi": "khước từ, từ chối", "en": "", "ex": "The politician issued a statement to repudiate the allegations of corruption.", "exvi": "Vị chính trị gia đã ra tuyên bố để khước từ những cáo buộc tham nhũng.", "syn": [], "cefr": "C1", "ref": "note:1788603784683"}, {"id": "93217a761c3efcba", "front": "buttress", "pos": "verb", "ipa": "", "vi": "củng cố, làm vững chắc", "en": "", "ex": "The attorney presented new evidence to buttress her argument that the defendant was innocent.", "exvi": "Nữ luật sư đã đưa ra bằng chứng mới để củng cố lập luận của mình rằng bị cáo vô tội.", "syn": [], "cefr": "C1", "ref": "note:1788603784685"}, {"id": "12229a1296294067", "front": "accentuate", "pos": "verb", "ipa": "", "vi": "nhấn mạnh, làm nổi bật", "en": "", "ex": "Her new haircut and bold red lipstick accentuate her high cheekbones.", "exvi": "Kiểu tóc mới và màu son đỏ đậm của cô ấy làm nổi bật gò má cao.", "syn": [], "cefr": "C1", "ref": "note:1788603784687"}, {"id": "6751097747ab3434", "front": "convene", "pos": "verb", "ipa": "", "vi": "triệu tập, họp lại", "en": "", "ex": "The committee will convene at 11:30 a.m. to discuss the new budget proposal.", "exvi": "Ủy ban sẽ họp vào lúc 11:30 sáng để thảo luận về đề xuất ngân sách mới.", "syn": [], "cefr": "C1", "ref": "note:1788603784689"}, {"id": "b655e404cc891648", "front": "promote", "pos": "verb", "ipa": "", "vi": "thúc đẩy, quảng bá, vinh danh", "en": "", "ex": "The prestigious national fellowship was awarded to Losang Samten to promote his lifetime contributions to the arts.", "exvi": "Học bổng quốc gia danh giá đã được trao cho Losang Samten để tôn vinh và quảng bá những đóng góp cả đời của ông cho nghệ thuật.", "syn": [], "cefr": "B2", "ref": "note:1788603784691"}, {"id": "ae6665471e5828cd", "front": "stipulate", "pos": "verb", "ipa": "", "vi": "quy định, yêu cầu như một điều kiện", "en": "", "ex": "The contract stipulates that the tenant must pay a security deposit.", "exvi": "Hợp đồng quy định rằng người thuê nhà phải trả một khoản tiền đặt cọc.", "syn": [], "cefr": "C1", "ref": "note:1788603784693"}, {"id": "8d3207a2eb3ddcf0", "front": "yield", "pos": "verb", "ipa": "", "vi": "sinh ra, mang lại (kết quả, sản phẩm)", "en": "", "ex": "The intricate musical pieces of Albertine Caron-Legris can yield countless distinct interpretations for attentive listeners.", "exvi": "Những tác phẩm âm nhạc phức tạp của Albertine Caron-Legris có thể mang lại vô số cách diễn giải khác nhau cho những thính giả chăm chú.", "syn": [], "cefr": "C1", "ref": "note:1788603784695"}, {"id": "77514a59670c814a", "front": "vindicate", "pos": "verb", "ipa": "", "vi": "minh oan, chứng minh (là đúng)", "en": "", "ex": "The new evidence completely vindicated the defendant, proving his innocence beyond a doubt.", "exvi": "Bằng chứng mới đã hoàn toàn minh oan cho bị cáo, chứng minh anh ta vô tội không còn nghi ngờ gì nữa.", "syn": [], "cefr": "C1", "ref": "note:1788603784697"}, {"id": "555c64488ff43ba3", "front": "unequivocal", "pos": "adjective", "ipa": "", "vi": "rõ ràng, dứt khoát", "en": "", "ex": "Her unequivocal 'no' to his proposal left no room for further discussion.", "exvi": "Lời từ chối dứt khoát của cô ấy đối với lời cầu hôn của anh ta không còn chỗ cho việc thảo luận thêm.", "syn": [], "cefr": "C1", "ref": "note:1788603784699"}, {"id": "2e88731825abbeed", "front": "favorably", "pos": "adverb", "ipa": "", "vi": "một cách thiện cảm, thuận lợi, tích cực", "en": "", "ex": "Although received with indifference decades ago, both classic films are now regarded quite favorably by modern movie critics.", "exvi": "Dù bị thờ ơ hàng thập kỷ trước, cả hai bộ phim kinh điển giờ đây đều được các nhà phê bình điện ảnh hiện đại đón nhận rất tích cực.", "syn": [], "cefr": "B2", "ref": "note:1788603784701"}, {"id": "1a756aeaa6478e54", "front": "preclude", "pos": "verb", "ipa": "", "vi": "ngăn chặn, loại trừ", "en": "", "ex": "His lack of experience may preclude him from getting the job.", "exvi": "Việc thiếu kinh nghiệm có thể ngăn cản anh ấy nhận được công việc đó.", "syn": [], "cefr": "C1", "ref": "note:1788603784703"}, {"id": "dbfe5851231000f8", "front": "meticulous", "pos": "adjective", "ipa": "", "vi": "tỉ mỉ, kỹ lưỡng", "en": "", "ex": "The painter's meticulous attention to detail is what makes his work so lifelike.", "exvi": "Sự chú ý tỉ mỉ đến từng chi tiết của người họa sĩ là điều khiến tác phẩm của ông trở nên sống động như thật.", "syn": [], "cefr": "C1", "ref": "note:1788603784705"}, {"id": "fa39fcd72a2c674a", "front": "untenable", "pos": "adjective", "ipa": "", "vi": "không thể bảo vệ được, không thể giữ vững được", "en": "", "ex": "The general's position became untenable after the enemy captured the high ground.", "exvi": "Vị thế của viên tướng trở nên không thể giữ vững được sau khi quân địch chiếm được vùng đất cao.", "syn": [], "cefr": "C1", "ref": "note:1788603784707"}, {"id": "c713ce6c67e7b4e5", "front": "contentious", "pos": "adjective", "ipa": "", "vi": "gây tranh cãi, hay cãi cọ", "en": "", "ex": "Abortion is a highly contentious issue that often divides public opinion.", "exvi": "Phá thai là một vấn đề gây tranh cãi gay gắt và thường chia rẽ dư luận.", "syn": [], "cefr": "C1", "ref": "note:1788603784709"}, {"id": "f6002a9171fd5638", "front": "examine", "pos": "verb", "ipa": "", "vi": "khảo sát, xem xét kỹ lưỡng", "en": "", "ex": "Tom stood on the sidewalk to examine the massive board fence before beginning his tedious painting task.", "exvi": "Tom đứng trên vỉa hè để xem xét kỹ hàng rào gỗ đồ sộ trước khi bắt đầu công việc quét vôi tẻ nhạt của mình.", "syn": [], "cefr": "B2", "ref": "note:1788603784711"}, {"id": "ba25090cf875ef70", "front": "mutable", "pos": "adjective", "ipa": "", "vi": "có thể thay đổi, hay thay đổi", "en": "", "ex": "Public opinion is often mutable, shifting with each new headline and political scandal.", "exvi": "Dư luận xã hội thường hay thay đổi, dịch chuyển theo mỗi dòng tít mới và bê bối chính trị.", "syn": [], "cefr": "C1", "ref": "note:1788603784713"}, {"id": "f1cef9bde5dbde78", "front": "superfluous", "pos": "adjective", "ipa": "", "vi": "thừa thãi, không cần thiết", "en": "", "ex": "The report was marred by a mass of superfluous detail that obscured the main points.", "exvi": "Bản báo cáo bị làm hỏng bởi một loạt chi tiết thừa thãi che lấp đi các ý chính.", "syn": [], "cefr": "C1", "ref": "note:1788603784715"}, {"id": "2e43c7b58f7874c5", "front": "counterfactual", "pos": "adjective", "ipa": "", "vi": "phản thực tế, trái với sự thật", "en": "", "ex": "She spent the afternoon pondering the counterfactual question of what her life would be like if she had accepted the job offer in New York.", "exvi": "Cô ấy đã dành cả buổi chiều để suy ngẫm về câu hỏi phản thực tế rằng cuộc sống của mình sẽ ra sao nếu cô ấy chấp nhận lời mời làm việc ở New York.", "syn": [], "cefr": "C1", "ref": "note:1788603784717"}, {"id": "9d786356215b8101", "front": "precede", "pos": "verb", "ipa": "", "vi": "đi trước, diễn ra trước", "en": "", "ex": "The innovative prose of modern island authors is preceded by centuries of rich oral storytelling traditions.", "exvi": "Văn xuôi cách tân của các tác giả hải đảo hiện đại được đi trước bởi nhiều thế kỷ truyền thống kể chuyện truyền khẩu phong phú.", "syn": [], "cefr": "C1", "ref": "note:1788603784719"}, {"id": "659c2bcf259b8d40", "front": "approve", "pos": "verb", "ipa": "", "vi": "tán thành, chấp thuận, chuẩn y", "en": "", "ex": "The committee refused to approve the development plan because of its detrimental environmental footprint.", "exvi": "Ủy ban từ chối phê duyệt kế hoạch phát triển vì tác động tiêu cực của nó tới môi trường.", "syn": [], "cefr": "B2", "ref": "note:1788603784721"}, {"id": "ceba82fcf05ff720", "front": "derive", "pos": "verb", "ipa": "", "vi": "bắt nguồn từ, xuất phát từ", "en": "", "ex": "The therapeutic utility of gold nanoparticles derives directly from their distinct physical and optical properties.", "exvi": "Lợi ích trị liệu của các hạt nano vàng bắt nguồn trực tiếp từ các đặc tính quang học và vật lý riêng biệt của chúng.", "syn": [], "cefr": "C1", "ref": "note:1788603784723"}, {"id": "35d83b8fb8d4fdc8", "front": "foreground", "pos": "verb", "ipa": "", "vi": "làm nổi bật, đưa lên vị trí trọng tâm", "en": "", "ex": "Choreographers in the experimental movement opted to foreground ordinary gestures like bending and sitting rather than classical ballet postures.", "exvi": "Các biên đạo múa trong phong trào thể nghiệm đã chọn cách làm nổi bật những cử chỉ đời thường như cúi gập và ngồi xuống thay vì các tư thế ba lê cổ điển.", "syn": [], "cefr": "C2", "ref": "note:1788603784725"}, {"id": "45e61ac0d6392db6", "front": "redundancy", "pos": "noun", "ipa": "", "vi": "tính dư thừa, sự trùng lặp có tính dự phòng", "en": "", "ex": "Although netlike leaf venation slows fluid transport slightly, the architectural redundancy ensures backup pathways if a vein is severed.", "exvi": "Mặc dù cấu trúc gân lá dạng lưới làm chậm quá trình vận chuyển chất lỏng một chút, nhưng tính dư thừa dự phòng về mặt kiến trúc đảm bảo các đường dẫn thay thế nếu một gân lá bị đứt.", "syn": [], "cefr": "C1", "ref": "note:1788603784727"}, {"id": "39c54359e2c13911", "front": "perfunctory", "pos": "adjective", "ipa": "", "vi": "chiếu lệ, qua loa, làm cho có", "en": "", "ex": "Too many contemporary documentaries feel perfunctory, merely listing facts without delivering genuine historical perspective.", "exvi": "Quá nhiều phim tài liệu đương đại tạo cảm giác làm qua loa chiếu lệ, chỉ đơn thuần liệt kê sự kiện mà không đem lại góc nhìn lịch sử chân thực.", "syn": [], "cefr": "C2", "ref": "note:1788603784729"}, {"id": "36074365f4ada9e7", "front": "anticipate", "pos": "verb", "ipa": "", "vi": "lường trước, mong đợi, dự kiến", "en": "", "ex": "Few new parents anticipate that their newborn child will one day grow up to journey into outer space as an astronaut.", "exvi": "Rất ít bậc cha mẹ mới sinh con lường trước được rằng đứa con sơ sinh của họ một ngày nào đó sẽ lớn lên và bay vào vũ trụ như một phi hành gia.", "syn": [], "cefr": "B2", "ref": "note:1788603784731"}, {"id": "dbacfc4946d823cb", "front": "transpose", "pos": "verb", "ipa": "", "vi": "hoán đổi vị trí, thay đổi thứ tự", "en": "", "ex": "The editor had to transpose two paragraphs to improve the essay's flow.", "exvi": "Người biên tập đã phải hoán đổi vị trí hai đoạn văn để cải thiện sự mạch lạc của bài luận.", "syn": [], "cefr": "C1", "ref": "note:1788603784733"}, {"id": "b87721e32e62ff75", "front": "exorbitant", "pos": "adjective", "ipa": "", "vi": "cao cắt cổ, quá mức", "en": "", "ex": "The hotel charged an exorbitant price for a single bottle of water.", "exvi": "Khách sạn đã tính một mức giá cắt cổ cho một chai nước suối.", "syn": [], "cefr": "C1", "ref": "note:1788603784735"}, {"id": "5b96eb54f02fe5a6", "front": "rigor", "pos": "noun", "ipa": "", "vi": "sự nghiêm ngặt, sự khắt khe", "en": "", "ex": "The university is known for its academic rigor and high standards.", "exvi": "Trường đại học này nổi tiếng về sự nghiêm ngặt trong học thuật và các tiêu chuẩn cao.", "syn": [], "cefr": "C1", "ref": "note:1788603784737"}, {"id": "b4ccc5e8b985e714", "front": "detrimental", "pos": "adjective", "ipa": "", "vi": "gây hại, có hại", "en": "", "ex": "The new policy had a detrimental effect on the local economy, causing many small businesses to close.", "exvi": "Chính sách mới đã có ảnh hưởng gây hại đến nền kinh tế địa phương, khiến nhiều doanh nghiệp nhỏ phải đóng cửa.", "syn": [], "cefr": "C1", "ref": "note:1788603784739"}, {"id": "af7515e29f2c06e1", "front": "evident", "pos": "adjective", "ipa": "", "vi": "rõ ràng, hiển nhiên", "en": "", "ex": "As the years passed, it became evident to Katharine that inheriting a celebrated ancestry brought unexpected burdens.", "exvi": "Nhiều năm trôi qua, đối với Katharine ngày càng trở nên rõ ràng rằng việc kế thừa danh tiếng dòng dõi mang lại những gánh nặng khôn lường.", "syn": [], "cefr": "B2", "ref": "note:1788603784741"}, {"id": "268201eb7ce6ab45", "front": "presuppose", "pos": "verb", "ipa": "", "vi": "giả định trước, coi như là đúng", "en": "", "ex": "The lawyer's argument presupposes that the defendant was at the scene of the crime.", "exvi": "Lập luận của luật sư giả định trước rằng bị cáo đã có mặt tại hiện trường vụ án.", "syn": [], "cefr": "C1", "ref": "note:1788603784743"}, {"id": "09271734339a0181", "front": "ambivalent", "pos": "adjective", "ipa": "", "vi": "vừa yêu vừa ghét, mâu thuẫn", "en": "", "ex": "She was ambivalent about moving to a new city; she was excited for the new opportunities but sad to leave her friends behind.", "exvi": "Cô ấy có cảm xúc trái ngược về việc chuyển đến một thành phố mới; cô ấy hào hứng với những cơ hội mới nhưng cũng buồn khi phải rời xa bạn bè.", "syn": [], "cefr": "C1", "ref": "note:1788603784745"}, {"id": "197a2807e9d73c5a", "front": "dogmatic", "pos": "adjective", "ipa": "", "vi": "giáo điều, độc đoán", "en": "", "ex": "The professor's dogmatic style of teaching discouraged any form of questioning or debate in the classroom.", "exvi": "Phong cách giảng dạy giáo điều của vị giáo sư đã làm nản lòng mọi hình thức chất vấn hay tranh luận trong lớp học.", "syn": [], "cefr": "C1", "ref": "note:1788603784747"}, {"id": "33ca75ede464eb99", "front": "supersede", "pos": "verb", "ipa": "", "vi": "thay thế, thế chỗ", "en": "", "ex": "The new software update will supersede the older version, making it obsolete.", "exvi": "Bản cập nhật phần mềm mới sẽ thay thế phiên bản cũ hơn, khiến nó trở nên lỗi thời.", "syn": [], "cefr": "C1", "ref": "note:1788603784749"}, {"id": "66742ff949450244", "front": "estimate", "pos": "verb", "ipa": "", "vi": "ước tính, đánh giá gần đúng", "en": "", "ex": "Looking at the distinguished partner across the desk, an observer might estimate his age to be somewhere between forty and fifty.", "exvi": "Nhìn vào vị đối tác chững chạc bên kia bàn làm việc, một người quan sát có thể ước tính tuổi của ông ta vào khoảng giữa bốn mươi và năm mươi.", "syn": [], "cefr": "B2", "ref": "note:1788603784751"}, {"id": "fcf9dff6b798b2db", "front": "ascribe", "pos": "verb", "ipa": "", "vi": "gán cho, quy cho", "en": "", "ex": "The police ascribed the victim's death to a heart attack.", "exvi": "Cảnh sát quy nguyên nhân cái chết của nạn nhân là do một cơn đau tim.", "syn": [], "cefr": "C1", "ref": "note:1788603784753"}, {"id": "b3f5620eddd8a8c6", "front": "transcend", "pos": "verb", "ipa": "", "vi": "vượt qua, siêu việt", "en": "", "ex": "The beauty of her music transcends cultural boundaries, moving audiences all over the world.", "exvi": "Vẻ đẹp trong âm nhạc của cô ấy vượt qua mọi ranh giới văn hóa, làm lay động khán giả trên toàn thế giới.", "syn": [], "cefr": "C1", "ref": "note:1788603784755"}, {"id": "004a36f153ff2c61", "front": "novelty", "pos": "noun", "ipa": "", "vi": "tính mới lạ, sự mới mẻ", "en": "", "ex": "Once the novelty of the smartphone app wore off, users returned to their traditional habits.", "exvi": "Một khi sự mới lạ của ứng dụng điện thoại thông minh giảm bớt, người dùng đã quay trở lại với thói quen truyền thống.", "syn": [], "cefr": "C1", "ref": "note:1788603784757"}, {"id": "afc1d88674a13ea6", "front": "amend", "pos": "verb", "ipa": "", "vi": "sửa đổi, điều chỉnh (văn bản, luật)", "en": "", "ex": "The committee voted to amend the proposed policy before sending it for final ratification.", "exvi": "Ủy ban đã bỏ phiếu sửa đổi chính sách được đề xuất trước khi gửi đi để phê chuẩn lần cuối.", "syn": [], "cefr": "C1", "ref": "note:1788603784759"}, {"id": "d8463b5862a3a36b", "front": "ambiguous", "pos": "adjective", "ipa": "", "vi": "mơ hồ, không rõ ràng", "en": "", "ex": "The politician gave an ambiguous answer to the reporter's question, leaving everyone uncertain of his stance.", "exvi": "Vị chính trị gia đã đưa ra một câu trả lời mơ hồ cho câu hỏi của phóng viên, khiến mọi người không chắc chắn về lập trường của ông.", "syn": [], "cefr": "B2", "ref": "note:1788603784761"}]}, {"key": "anki_starter-set02", "title": "Flashcard SAT Starter Set 02", "deck": "anki_starter", "count": 50, "cards": [{"id": "60c15223eead1fa0", "front": "redundant", "pos": "adjective", "ipa": "", "vi": "thừa thãi, dư thừa không cần thiết", "en": "", "ex": "Because the essay repeated identical arguments across multiple paragraphs, much of the prose was redundant.", "exvi": "Bởi vì bài luận lặp lại các luận điểm giống hệt nhau qua nhiều đoạn văn, phần lớn văn phong bị thừa thãi.", "syn": [], "cefr": "C1", "ref": "note:1788603784763"}, {"id": "8a8da52fa9bd391f", "front": "precarious", "pos": "adjective", "ipa": "", "vi": "bấp bênh, bấp bênh không ổn định, nguy hiểm", "en": "", "ex": "The financial situation of Elizabethan playwrights was notoriously precarious, relying on unpredictable box-office revenues.", "exvi": "Tình hình tài chính của các nhà viết kịch thời Elizabeth nổi tiếng là bấp bênh, phụ thuộc vào doanh thu bán vé khó đoán.", "syn": [], "cefr": "C1", "ref": "note:1788603784765"}, {"id": "33009ce43c8fd64f", "front": "speculative", "pos": "adjective", "ipa": "", "vi": "mang tính suy đoán, phỏng đoán, chưa có chứng cứ xác thực", "en": "", "ex": "Before chemical tests provided hard facts, theories regarding the coin origins remained entirely speculative.", "exvi": "Trước khi các thử nghiệm hóa học cung cấp dữ kiện xác thực, các giả thuyết về nguồn gốc đồng xu hoàn toàn chỉ mang tính suy đoán.", "syn": [], "cefr": "C1", "ref": "note:1788603784767"}, {"id": "f6b41923f9016513", "front": "encompass", "pos": "verb", "ipa": "", "vi": "bao quát, bao gồm", "en": "", "ex": "Sustainable agriculture must encompass not only ecological health but also the financial stability of farming families.", "exvi": "Nông nghiệp bền vững phải bao quát không chỉ sức khỏe sinh thái mà cả sự ổn định tài chính của các gia đình làm nông.", "syn": [], "cefr": "C1", "ref": "note:1788603784769"}, {"id": "a1becd1c3b414c28", "front": "skeptically", "pos": "adverb", "ipa": "", "vi": "một cách hoài nghi, đầy ngờ vực", "en": "", "ex": "The detective looked skeptically at the suspect's alibi, which seemed too perfect to be true.", "exvi": "Viên thám tử nhìn một cách hoài nghi vào bằng chứng ngoại phạm của nghi phạm, thứ có vẻ quá hoàn hảo để có thể là sự thật.", "syn": [], "cefr": "B2", "ref": "note:1788603784771"}, {"id": "5f4474ec3cc936ed", "front": "proxy", "pos": "noun", "ipa": "", "vi": "vật thay thế, chỉ số đại diện, người ủy quyền", "en": "", "ex": "Because directly surveying deep subterranean zones is unfeasible, researchers relied on soil organism distribution as a proxy.", "exvi": "Bởi vì việc khảo sát trực tiếp các tầng sâu dưới lòng đất là không khả thi, các nhà nghiên cứu đã dựa vào sự phân bố sinh vật trong đất như một chỉ số đại diện.", "syn": [], "cefr": "C1", "ref": "note:1788603784773"}, {"id": "54a4658596c88663", "front": "inconsolable", "pos": "adjective", "ipa": "", "vi": "không thể an ủi được, đau buồn khôn nguôi", "en": "", "ex": "The parents were inconsolable after hearing the news of the accident.", "exvi": "Cha mẹ cậu bé đã đau buồn khôn nguôi sau khi nghe tin về vụ tai nạn.", "syn": [], "cefr": "C1", "ref": "note:1788603784775"}, {"id": "e138f7d34e39bd7f", "front": "forestall", "pos": "verb", "ipa": "", "vi": "ngăn chặn trước, chặn đứng", "en": "", "ex": "By offering a compromise, the negotiator hoped to forestall a strike.", "exvi": "Bằng cách đưa ra một thỏa hiệp, nhà đàm phán hy vọng sẽ ngăn chặn trước một cuộc đình công.", "syn": [], "cefr": "C1", "ref": "note:1788603784777"}, {"id": "0366c6a2a44dfd30", "front": "aesthetic", "pos": "adjective", "ipa": "", "vi": "có tính thẩm mỹ, thuộc về mỹ học", "en": "", "ex": "The minimalist aesthetic of the new art gallery, with its clean lines and neutral colors, was praised by critics.", "exvi": "Vẻ đẹp thẩm mỹ tối giản của phòng trưng bày nghệ thuật mới, với những đường nét gọn gàng và màu sắc trung tính, đã được các nhà phê bình khen ngợi.", "syn": [], "cefr": "C1", "ref": "note:1788603784779"}, {"id": "172ed79f105dfc48", "front": "conventional", "pos": "adjective", "ipa": "", "vi": "theo tập quán, thông thường, cổ truyền", "en": "", "ex": "Departing from conventional medical studies that inspect populations living at high altitudes, the authors turned their focus below sea level.", "exvi": "Rời xa các nghiên cứu y khoa thông thường vốn chỉ xem xét các quần thể sống ở vùng núi cao, các tác giả đã chuyển hướng sang khu vực dưới mực nước biển.", "syn": [], "cefr": "B2", "ref": "note:1788603784781"}, {"id": "bd9a0c4c69ba2749", "front": "analogical", "pos": "adjective", "ipa": "", "vi": "mang tính tương tự, theo phép loại suy", "en": "", "ex": "The teacher used an analogical approach, comparing the human brain to a computer to explain its functions.", "exvi": "Giáo viên đã sử dụng một phương pháp loại suy, so sánh bộ não con người với một chiếc máy tính để giải thích các chức năng của nó.", "syn": [], "cefr": "C1", "ref": "note:1788603784783"}, {"id": "5cce9c05f3f64a2c", "front": "invariable", "pos": "adjective", "ipa": "", "vi": "không thay đổi, bất biến", "en": "", "ex": "His invariable response to any problem was to take a long walk and think it over.", "exvi": "Phản ứng bất biến của anh ấy trước bất kỳ vấn đề nào là đi dạo một quãng dài và suy nghĩ về nó.", "syn": [], "cefr": "C1", "ref": "note:1788603784785"}, {"id": "e057551214c3bdd4", "front": "exhaustive", "pos": "adjective", "ipa": "", "vi": "toàn diện, thấu đáo", "en": "", "ex": "The police conducted an exhaustive investigation into the crime, leaving no stone unturned.", "exvi": "Cảnh sát đã tiến hành một cuộc điều tra toàn diện về vụ án, không bỏ sót một chi tiết nào.", "syn": [], "cefr": "C1", "ref": "note:1788603784787"}, {"id": "1d432686dae66255", "front": "attenuate", "pos": "verb", "ipa": "", "vi": "làm yếu đi, làm giảm hiệu lực", "en": "", "ex": "The thick forest canopy attenuates the sunlight, creating a dim, cool environment on the forest floor.", "exvi": "Tán lá rừng rậm rạp làm giảm bớt ánh sáng mặt trời, tạo ra một môi trường mờ ảo, mát mẻ trên mặt đất.", "syn": [], "cefr": "C1", "ref": "note:1788603784789"}, {"id": "50cd8c92929d8ebb", "front": "particular", "pos": "adjective", "ipa": "", "vi": "cụ thể, riêng biệt, đặc thù", "en": "", "ex": "Whenever the subway car emerged above ground, Moss enjoyed gazing at that particular panoramic view of the Oakland port.", "exvi": "Mỗi khi toa tàu điện ngầm trồi lên mặt đất, Moss lại thích thú ngắm nhìn khung cảnh ngoạn mục cụ thể đó của cảng Oakland.", "syn": [], "cefr": "B2", "ref": "note:1788603784791"}, {"id": "fb78823da7d8849a", "front": "ephemeral", "pos": "adjective", "ipa": "", "vi": "phù du, chóng tàn", "en": "", "ex": "The beauty of the cherry blossoms is ephemeral, lasting only a week or two each spring.", "exvi": "Vẻ đẹp của hoa anh đào thật phù du, chỉ kéo dài một hoặc hai tuần mỗi mùa xuân.", "syn": [], "cefr": "C1", "ref": "note:1788603784793"}, {"id": "c00f87dbafaca087", "front": "dearth", "pos": "noun", "ipa": "", "vi": "sự khan hiếm, sự thiếu thốn", "en": "", "ex": "There was a dearth of reliable information on the subject, which made research difficult.", "exvi": "Có một sự khan hiếm thông tin đáng tin cậy về chủ đề này, điều đó đã gây khó khăn cho việc nghiên cứu.", "syn": [], "cefr": "C1", "ref": "note:1788603784795"}, {"id": "815af6f66b5f5630", "front": "unanticipate", "pos": "verb", "ipa": "", "vi": "không lường trước, không dự liệu trước", "en": "", "ex": "Planners did unanticipate the sudden surge in commuter traffic following the subway closure.", "exvi": "Những người lập kế hoạch đã không lường trước được sự gia tăng đột biến lượng người đi lại sau khi tàu điện ngầm đóng cửa.", "syn": [], "cefr": "C1", "ref": "note:1788603784797"}, {"id": "6dff88edfd721742", "front": "warrant", "pos": "verb", "ipa": "", "vi": "biện minh cho, đáng để làm gì", "en": "", "ex": "The initial trial results were so promising that researchers decided they warrant immediate full-scale investigation.", "exvi": "Kết quả thử nghiệm ban đầu hứa hẹn đến mức các nhà nghiên cứu quyết định chúng đáng để tiến hành một cuộc điều tra toàn diện ngay lập tức.", "syn": [], "cefr": "C1", "ref": "note:1788603784799"}, {"id": "d5f68bf0e7cbd947", "front": "categorize", "pos": "verb", "ipa": "", "vi": "phân loại, chia thành từng nhóm", "en": "", "ex": "Biologists used automated computer programs to categorize the recorded vocalizations of wild zebras into distinct acoustic groups.", "exvi": "Các nhà sinh học đã sử dụng các chương trình máy tính tự động để phân loại các âm thanh ghi lại được của ngựa vằn hoang dã thành các nhóm âm thanh riêng biệt.", "syn": [], "cefr": "B2", "ref": "note:1788603784801"}, {"id": "7742708719aea0c5", "front": "obscurity", "pos": "noun", "ipa": "", "vi": "sự mơ hồ khó hiểu; tình trạng vô danh", "en": "", "ex": "The poet lived in obscurity for decades before her posthumous writings gained worldwide fame.", "exvi": "Nữ thi sĩ đã sống trong sự vô danh suốt nhiều thập kỷ trước khi những tác phẩm sau khi mất của bà nhận được sự nổi tiếng toàn cầu.", "syn": [], "cefr": "C1", "ref": "note:1788603784803"}, {"id": "962d89d8e7a471d3", "front": "shallowness", "pos": "noun", "ipa": "", "vi": "sự nông cạn, tính thiếu chiều sâu", "en": "", "ex": "Critics faulted the review for its intellectual shallowness and superficial appraisal of the theory.", "exvi": "Các nhà phê bình đã chê trách bài đánh giá vì sự nông cạn về mặt trí tuệ và sự thẩm định hời hợt đối với lý thuyết.", "syn": [], "cefr": "C1", "ref": "note:1788603784805"}, {"id": "d7ba57404475d59b", "front": "seclude", "pos": "verb", "ipa": "", "vi": "cách ly, tách biệt khỏi người khác", "en": "", "ex": "The author preferred to seclude herself in a mountain cabin whenever drafting a complex chapter.", "exvi": "Tác giả thích tự giam mình trong một căn nhà gỗ trên núi mỗi khi phác thảo một chương phức tạp.", "syn": [], "cefr": "C1", "ref": "note:1788603784807"}, {"id": "7adfb9652e81395b", "front": "counterproductive", "pos": "adjective", "ipa": "", "vi": "phản tác dụng", "en": "", "ex": "Micromanaging creative employees frequently proves counterproductive, diminishing overall output.", "exvi": "Việc quản lý vi mô nhân viên sáng tạo thường phản tác dụng, làm giảm hiệu suất tổng thể.", "syn": [], "cefr": "C1", "ref": "note:1788603784809"}, {"id": "8a8597c7ea94458c", "front": "preserve", "pos": "verb", "ipa": "", "vi": "bảo tồn, giữ gìn nguyên vẹn", "en": "", "ex": "Translators were fortunate that handwritten draft manuscripts had been preserved despite intense political censorship.", "exvi": "Các dịch giả đã may mắn khi các bản thảo viết tay được bảo tồn nguyên vẹn bất chấp sự kiểm duyệt chính trị gắt gao.", "syn": [], "cefr": "B2", "ref": "note:1788603784811"}, {"id": "ac14313662928e30", "front": "unbolt", "pos": "verb", "ipa": "", "vi": "mở chốt, tháo chốt cửa", "en": "", "ex": "The curator had to carefully unbolt the heavy iron gate leading into the historical vault.", "exvi": "Người phụ trách bảo tàng đã phải cẩn thận mở chốt cánh cổng sắt nặng nề dẫn vào hầm chứa lịch sử.", "syn": [], "cefr": "C1", "ref": "note:1788603784813"}, {"id": "1315d5132ee9fd70", "front": "confidentiality", "pos": "noun", "ipa": "", "vi": "Tính bảo mật, sự giữ bí mật.", "en": "", "ex": "Doctors are bound by strict codes of patient confidentiality.", "exvi": "Bác sĩ bị ràng buộc bởi các quy chuẩn nghiêm ngặt về tính bảo mật thông tin bệnh nhân.", "syn": [], "cefr": "C1", "ref": "note:1788603784815"}, {"id": "83b547b83a9d66bc", "front": "auxiliary", "pos": "adjective", "ipa": "", "vi": "Bổ trợ, phụ trợ, dự phòng.", "en": "", "ex": "The vessel relied on an auxiliary engine when the primary motor malfunctioned.", "exvi": "Con tàu dựa vào một động cơ phụ khi động cơ chính gặp trục trặc.", "syn": [], "cefr": "C1", "ref": "note:1788603784817"}, {"id": "594e738575396b57", "front": "parameter", "pos": "noun", "ipa": "", "vi": "Thông số, giới hạn xác định.", "en": "", "ex": "Researchers set strict temperature parameters during the biological experiment.", "exvi": "Các nhà nghiên cứu đã đặt ra các thông số nhiệt độ nghiêm ngặt trong suốt thí nghiệm sinh học.", "syn": [], "cefr": "C1", "ref": "note:1788603784819"}, {"id": "c00d87e4936256f3", "front": "neutrally", "pos": "adverb", "ipa": "", "vi": "một cách trung lập, khách quan", "en": "", "ex": "The debate moderator presented the complex policy question neutrally, refusing to endorse either candidate.", "exvi": "Người điều hành buổi tranh luận đã đưa ra câu hỏi chính sách phức tạp một cách trung lập, từ chối ủng hộ bất kỳ ứng cử viên nào.", "syn": [], "cefr": "B2", "ref": "note:1788603784821"}, {"id": "ae89cf30dbdf758a", "front": "localize", "pos": "verb", "ipa": "", "vi": "Địa phương hóa, giới hạn hoặc đặc thù theo từng khu vực.", "en": "", "ex": "The traditional dish is often localized in its preparation, using coastal seafood in some regions and mountain pork in others.", "exvi": "Món ăn truyền thống thường được địa phương hóa trong cách chế biến, sử dụng hải sản ven biển ở một số vùng và thịt lợn miền núi ở những vùng khác.", "syn": [], "cefr": "C1", "ref": "note:1788603784823"}, {"id": "23175dbd3627967a", "front": "concentrated among", "pos": "phrase", "ipa": "", "vi": "Tập trung chủ yếu ở/trong số.", "en": "", "ex": "Distinctive morphological traits were concentrated among tropical fish rather than widely dispersed.", "exvi": "Các đặc điểm hình thái riêng biệt tập trung chủ yếu ở các loài cá nhiệt đới thay vì phân tán rộng rãi.", "syn": [], "cefr": "C1", "ref": "note:1788603784825"}, {"id": "9d389d2617d49f08", "front": "constraint", "pos": "noun", "ipa": "", "vi": "Sự kiềm chế, sự gò bó, điều hạn chế.", "en": "", "ex": "She showed noticeable constraint when asked about her past, speaking with extreme reluctance.", "exvi": "Cô ấy tỏ ra gò bó và kiềm chế rõ rệt khi được hỏi về quá khứ, nói chuyện với sự ngập ngừng cao độ.", "syn": [], "cefr": "C1", "ref": "note:1788603784827"}, {"id": "2f24aa49f6b1c8d4", "front": "derivative", "pos": "adjective", "ipa": "", "vi": "Bắt chước, thiếu tính sáng tạo gốc, phái sinh.", "en": "", "ex": "Critics dismissed the artwork as derivative because it merely recycled ideas from earlier masters.", "exvi": "Các nhà phê bình đã gạt bỏ tác phẩm nghệ thuật vì cho rằng nó mang tính sao chép, do chỉ tái chế lại ý tưởng từ các bậc thầy đi trước.", "syn": [], "cefr": "C1", "ref": "note:1788603784829"}, {"id": "9c7d55b3385082af", "front": "challenge", "pos": "verb", "ipa": "", "vi": "thách thức, nghi vấn, bác bỏ", "en": "", "ex": "The discovery of a statue depicting a female ballplayer served to challenge the long-held assumption that ancient women were purely passive.", "exvi": "Việc phát hiện ra bức tượng khắc họa một nữ cầu thủ bóng đã thách thức quan niệm tồn tại từ lâu rằng phụ nữ thời cổ đại chỉ giữ những vai trò thụ động.", "syn": [], "cefr": "B2", "ref": "note:1788603784831"}, {"id": "c0604610af44a9ba", "front": "multifacete", "pos": "adjective", "ipa": "", "vi": "Nhiều mặt, đa phương diện.", "en": "", "ex": "Her performance was truly multifaceted, combining brilliant piano playing with a historical lecture.", "exvi": "Buổi biểu diễn của cô ấy thực sự đa khía cạnh, kết hợp giữa kỹ thuật chơi đàn piano đỉnh cao với bài thuyết trình lịch sử.", "syn": [], "cefr": "C1", "ref": "note:1788603784833"}, {"id": "60c9b4a67b661006", "front": "a surrogate for", "pos": "phrase", "ipa": "", "vi": "Vật thay thế cho, đại diện cho.", "en": "", "ex": "Chlorophyll measurements serve as a reliable surrogate for total phytoplankton biomass.", "exvi": "Các phép đo chất diệp lục đóng vai trò là một thước đo thay thế đáng tin cậy cho tổng sinh khối thực vật phù du.", "syn": [], "cefr": "C1", "ref": "note:1788603784835"}, {"id": "8638cfcbfb4a01f2", "front": "incentive", "pos": "noun", "ipa": "", "vi": "Động cơ thúc đẩy, sự khích lệ.", "en": "", "ex": "Established companies have little incentive to develop products that undercut their current sales.", "exvi": "Các công ty đã có vị thế vững chắc có rất ít động lực để phát triển các sản phẩm cạnh tranh trực tiếp với doanh số hiện tại của họ.", "syn": [], "cefr": "C1", "ref": "note:1788603784837"}, {"id": "ba792b0edb85b825", "front": "gratification", "pos": "noun", "ipa": "", "vi": "Sự thỏa mãn, niềm vui sướng hài lòng.", "en": "", "ex": "Receiving an unexpected note from an old friend produces instant emotional gratification.", "exvi": "Nhận được một lời nhắn bất ngờ từ một người bạn cũ mang lại sự hài lòng và niềm vui cảm xúc ngay tức thì.", "syn": [], "cefr": "C1", "ref": "note:1788603784839"}, {"id": "76bc0d7108d741b8", "front": "indication", "pos": "noun", "ipa": "", "vi": "dấu hiệu, dấu vết chỉ điểm", "en": "", "ex": "The heavy morning mist left little visible indication of the riverbanks, turning the distant bridge into a ghostly silhouette.", "exvi": "Lớp sương mù dày đặc buổi sáng hầu như không để lại dấu hiệu nào của bờ sông, biến cây cầu phía xa thành một bóng hình ma quái.", "syn": [], "cefr": "B2", "ref": "note:1788603784841"}, {"id": "c087f9277acb4c26", "front": "aligns with", "pos": "phrasal verb", "ipa": "", "vi": "Ăn khớp với, phù hợp với, nhất quán với.", "en": "", "ex": "The presence of animal characters in folktales typically aligns with the actual geographical ranges of those creatures.", "exvi": "Sự hiện diện của các nhân vật động vật trong truyện dân gian thường ăn khớp với phạm vi địa lý thực tế của những sinh vật đó.", "syn": [], "cefr": "C1", "ref": "note:1788603784843"}, {"id": "15f688769ebddbcd", "front": "iterative", "pos": "adjective", "ipa": "", "vi": "Lặp đi lặp lại để cải tiến, quy trình lặp.", "en": "", "ex": "Software design is an iterative process requiring constant testing and revision based on user feedback.", "exvi": "Thiết kế phần mềm là một quy trình lặp đi lặp lại đòi hỏi phải liên tục thử nghiệm và sửa đổi dựa trên phản hồi của người dùng.", "syn": [], "cefr": "C1", "ref": "note:1788603784845"}, {"id": "dc6b1668debec68e", "front": "anachronistic", "pos": "adjective", "ipa": "", "vi": "Lỗi thời, sai niên đại, lạc hậu so với thời kỳ.", "en": "", "ex": "Seeing a smartphone in a movie set in the nineteenth century is entirely anachronistic.", "exvi": "Nhìn thấy một chiếc điện thoại thông minh trong bộ phim lấy bối cảnh thế kỷ 19 là hoàn toàn sai niên đại.", "syn": [], "cefr": "C2", "ref": "note:1788603784847"}, {"id": "cc3d890b88f7d3ba", "front": "discontinuous", "pos": "adjective", "ipa": "", "vi": "Gián đoạn, không liên tục, đứt quãng.", "en": "", "ex": "The graph revealed discontinuous data points separated by abrupt, unpredictable interruptions.", "exvi": "Biểu đồ cho thấy các điểm dữ liệu gián đoạn được ngăn cách bởi những khoảng ngắt đột ngột và khó lường.", "syn": [], "cefr": "C1", "ref": "note:1788603784849"}, {"id": "61015ded30cff807", "front": "interrupt", "pos": "verb", "ipa": "", "vi": "làm gián đoạn, ngắt quãng", "en": "", "ex": "As the river enters the broader ocean waters, the drop in current velocity serves to interrupt sedimentary transport.", "exvi": "Khi dòng sông chảy vào vùng nước đại dương rộng lớn hơn, sự sụt giảm tốc độ dòng chảy làm gián đoạn quá trình vận chuyển trầm tích.", "syn": [], "cefr": "B2", "ref": "note:1788603784851"}, {"id": "31a448d1897d6c1a", "front": "discrepancy", "pos": "noun", "ipa": "", "vi": "Sự khác biệt, sự bất đồng, sai lệch giữa các số liệu.", "en": "", "ex": "The auditor noticed a significant discrepancy between the reported revenue and actual bank balances.", "exvi": "Kiểm toán viên nhận thấy sự sai lệch đáng kể giữa doanh thu được báo cáo và số dư ngân hàng thực tế.", "syn": [], "cefr": "C1", "ref": "note:1788603784853"}, {"id": "ce80283d515949d4", "front": "vulnerability", "pos": "noun", "ipa": "", "vi": "Tính dễ bị tổn thương, điểm yếu hiểm yếu.", "en": "", "ex": "A security audit exposed a critical vulnerability in the network operating system.", "exvi": "Một cuộc kiểm toán an ninh đã làm lộ ra một lỗ hổng hiểm yếu trong hệ điều hành mạng.", "syn": [], "cefr": "C1", "ref": "note:1788603784855"}, {"id": "b8dc0a333d788757", "front": "refurbish", "pos": "verb", "ipa": "", "vi": "Tân trang, làm mới lại, sửa sang.", "en": "", "ex": "The museum decided to refurbish its historic gallery before unveiling the new exhibition.", "exvi": "Bảo tàng đã quyết định tân trang lại phòng trưng bày lịch sử trước khi ra mắt triển lãm mới.", "syn": [], "cefr": "C1", "ref": "note:1788603784857"}, {"id": "a9e2b3367154be71", "front": "itemize", "pos": "verb", "ipa": "", "vi": "Liệt kê từng khoản, ghi chi tiết từng mục.", "en": "", "ex": "The repair shop provided an itemized receipt breaking down parts and labor costs.", "exvi": "Cửa hàng sửa chữa đã cung cấp một biên lai chi tiết liệt kê rõ ràng từng món phụ tùng và chi phí nhân công.", "syn": [], "cefr": "C1", "ref": "note:1788603784859"}, {"id": "59f3774013332564", "front": "designate", "pos": "verb", "ipa": "", "vi": "chỉ định, chỉ rõ", "en": "", "ex": "The director designated her as the project manager for the new initiative.", "exvi": "Giám đốc đã chỉ định cô ấy làm quản lý dự án cho sáng kiến mới.", "syn": [], "cefr": "B2", "ref": "note:1788603784861"}]}, {"key": "anki_starter-set03", "title": "Flashcard SAT Starter Set 03", "deck": "anki_starter", "count": 50, "cards": [{"id": "2d9e161a07e82366", "front": "circumscribe", "pos": "verb", "ipa": "", "vi": "giới hạn, khoanh vùng", "en": "", "ex": "The president's power is circumscribed by the constitution and the courts.", "exvi": "Quyền lực của tổng thống bị giới hạn bởi hiến pháp và tòa án.", "syn": [], "cefr": "C1", "ref": "note:1788603784863"}, {"id": "bf28692b1f8546c7", "front": "incredulity", "pos": "noun", "ipa": "", "vi": "sự hoài nghi, sự không tin", "en": "", "ex": "The news of his sudden resignation was met with widespread incredulity.", "exvi": "Tin tức về việc anh ấy đột ngột từ chức đã bị đón nhận với sự hoài nghi lan rộng.", "syn": [], "cefr": "C1", "ref": "note:1788603784865"}, {"id": "9b0666f4a73f6f97", "front": "contrive", "pos": "verb", "ipa": "", "vi": "xoay sở, bày mưu", "en": "", "ex": "Despite a lack of resources, the clever students contrived a way to build a functioning robot for the competition.", "exvi": "Bất chấp việc thiếu thốn tài nguyên, những sinh viên thông minh đã xoay sở để chế tạo một con rô-bốt hoạt động được cho cuộc thi.", "syn": [], "cefr": "C1", "ref": "note:1788603784867"}, {"id": "558b6e2123a02492", "front": "aggregation", "pos": "noun", "ipa": "", "vi": "sự tập hợp, sự tổng hợp", "en": "", "ex": "The report is an aggregation of data from various sources across the country.", "exvi": "Báo cáo này là sự tổng hợp dữ liệu từ nhiều nguồn khác nhau trên cả nước.", "syn": [], "cefr": "C1", "ref": "note:1788603784869"}, {"id": "32434ca53661126c", "front": "overshadow", "pos": "verb", "ipa": "", "vi": "làm lu mờ, che khuất", "en": "", "ex": "Her new achievement, though impressive, was overshadowed by her older sister's recent Nobel Prize win.", "exvi": "Thành tựu mới của cô ấy, dù ấn tượng, đã bị lu mờ bởi giải Nobel mà người chị gái vừa đạt được.", "syn": [], "cefr": "B2", "ref": "note:1788603784871"}, {"id": "22d74a8ffd7249ac", "front": "imperceptible", "pos": "adjective", "ipa": "", "vi": "không thể nhận thấy, rất nhỏ", "en": "", "ex": "The differences between the two paintings were imperceptible to the untrained eye.", "exvi": "Sự khác biệt giữa hai bức tranh là không thể nhận thấy đối với mắt người không chuyên.", "syn": [], "cefr": "C1", "ref": "note:1788603784873"}, {"id": "6bcfa2b3d503d503", "front": "appal", "pos": "verb", "ipa": "", "vi": "Làm kinh hoàng, làm thất kinh, làm choáng váng.", "en": "", "ex": "The dire conditions inside the dilapidated warehouse appalled the visiting inspectors.", "exvi": "Điều kiện tồi tàn bên trong nhà kho đổ nát đã khiến các thanh tra viên đến thăm cảm thấy bàng hoàng.", "syn": [], "cefr": "C1", "ref": "note:1788603784875"}, {"id": "10325ade136c4afb", "front": "reprimand", "pos": "verb", "ipa": "", "vi": "Khiển trách, quở trách gay gắt.", "en": "", "ex": "The officer was severely reprimanded for failing to follow standard emergency procedures.", "exvi": "Viên sĩ quan đã bị khiển trách nghiêm khắc vì không tuân theo các quy trình khẩn cấp tiêu chuẩn.", "syn": [], "cefr": "C1", "ref": "note:1788603784877"}, {"id": "6ca8266a871d68fb", "front": "adhered to", "pos": "phrasal verb", "ipa": "", "vi": "Tuân thủ triệt để, dính chặt vào.", "en": "", "ex": "Laboratory technicians adhered to rigorous safety guidelines during the containment trial.", "exvi": "Các kỹ thuật viên phòng thí nghiệm đã tuân thủ nghiêm ngặt các hướng dẫn an toàn trong quá trình thử nghiệm ngăn chặn.", "syn": [], "cefr": "C1", "ref": "note:1788603784879"}, {"id": "4f5698e15a8076d2", "front": "replicate", "pos": "verb", "ipa": "", "vi": "tái tạo, sao chép", "en": "", "ex": "Researchers tried to replicate the original experiment's results but were unsuccessful.", "exvi": "Các nhà nghiên cứu đã cố gắng tái tạo lại kết quả của thí nghiệm ban đầu nhưng không thành công.", "syn": [], "cefr": "B2", "ref": "note:1788603784881"}, {"id": "3819c154da84da9c", "front": "refrained from", "pos": "phrasal verb", "ipa": "", "vi": "Kìm chế, nhịn làm điều gì đó.", "en": "", "ex": "She refrained from voicing her frustrations during the tense diplomatic negotiations.", "exvi": "Cô đã kiềm chế không lên tiếng bày tỏ sự bực bội trong các cuộc đàm phán ngoại giao căng thẳng.", "syn": [], "cefr": "C1", "ref": "note:1788603784883"}, {"id": "ae07782487edd955", "front": "compel", "pos": "verb", "ipa": "", "vi": "Bắt buộc, cưỡng ép, thúc ép.", "en": "", "ex": "Overwhelming circumstantial evidence compelled the defendant to confess his involvement.", "exvi": "Bằng chứng gián tiếp quá rõ ràng đã buộc bị cáo phải thú nhận sự dính líu của mình.", "syn": [], "cefr": "C1", "ref": "note:1788603784885"}, {"id": "b4c3192de1a6dc93", "front": "relinquish", "pos": "verb", "ipa": "", "vi": "Từ bỏ, buông bỏ, nhượng lại.", "en": "", "ex": "Under mounting public pressure, the aging monarch chose to relinquish his throne.", "exvi": "Dưới áp lực ngày càng tăng của công chúng, vị vua cao tuổi đã chọn từ bỏ ngai vàng của mình.", "syn": [], "cefr": "C1", "ref": "note:1788603784887"}, {"id": "f74262f936d64a7b", "front": "recollection", "pos": "noun", "ipa": "", "vi": "Ký ức, hồi tưởng, sự nhớ lại.", "en": "", "ex": "She had no clear recollection of where she had misplaced her car keys that morning.", "exvi": "Cô không có ký ức rõ ràng nào về nơi mình đã để quên chìa khóa xe vào sáng hôm đó.", "syn": [], "cefr": "C1", "ref": "note:1788603784889"}, {"id": "442961682df25de2", "front": "homogeneous", "pos": "adjective", "ipa": "", "vi": "đồng nhất, đồng đều", "en": "", "ex": "The population of the small town was surprisingly homogeneous, with most residents sharing similar backgrounds and values.", "exvi": "Dân số của thị trấn nhỏ này đồng nhất một cách đáng ngạc nhiên, với hầu hết cư dân có cùng hoàn cảnh và giá trị sống.", "syn": [], "cefr": "B2", "ref": "note:1788603784891"}, {"id": "3245acf988412cb6", "front": "rubble", "pos": "noun", "ipa": "", "vi": "Đống đổ nát, đống gạch vụn.", "en": "", "ex": "Rescue workers searched through the piles of rubble following the violent earthquake.", "exvi": "Các nhân viên cứu hộ đã tìm kiếm qua những đống gạch vụn đổ nát sau trận động đất dữ dội.", "syn": [], "cefr": "C1", "ref": "note:1788603784893"}, {"id": "5f01c16995e7f518", "front": "memento", "pos": "noun", "ipa": "", "vi": "Vật kỷ niệm, kỷ vật.", "en": "", "ex": "He kept the handcrafted wooden figurine on his desk as a treasured memento of his grandfather.", "exvi": "Anh giữ bức tượng gỗ nhỏ thủ công trên bàn làm việc như một kỷ vật quý giá về ông nội mình.", "syn": [], "cefr": "C2", "ref": "note:1788603784895"}, {"id": "08c99a8aa7c946af", "front": "retrospective", "pos": "adjective", "ipa": "", "vi": "Nhìn lại quá khứ, hồi tưởng dĩ vãng.", "en": "", "ex": "The author provided a retrospective analysis of his early career struggles in the new memoir.", "exvi": "Tác giả đã đưa ra một phân tích hồi tưởng về những khó khăn trong sự nghiệp thời kỳ đầu trong cuốn hồi ký mới.", "syn": [], "cefr": "C1", "ref": "note:1788603784897"}, {"id": "357e8c94f7b97700", "front": "proprietary", "pos": "adjective", "ipa": "", "vi": "Độc quyền, thuộc quyền sở hữu riêng", "en": "", "ex": "The tech firm refused to license its proprietary software to rival developers.", "exvi": "Công ty công nghệ đã từ chối cấp phép phần mềm độc quyền của mình cho các nhà phát triển đối thủ.", "syn": [], "cefr": "C1", "ref": "note:1788603784899"}, {"id": "741a5b3675bd5f85", "front": "supplement", "pos": "verb", "ipa": "", "vi": "bổ sung, thêm vào", "en": "", "ex": "He supplements his regular income by working a second job in the evenings.", "exvi": "Anh ấy bổ sung thu nhập chính của mình bằng cách làm thêm công việc thứ hai vào buổi tối.", "syn": [], "cefr": "B2", "ref": "note:1788603784901"}, {"id": "5dcbb61d742fadbb", "front": "excise", "pos": "verb", "ipa": "", "vi": "Cắt bỏ, loại bỏ hoàn toàn (văn bản, khối u)", "en": "", "ex": "The editor decided to excise several redundant passages to make the article more concise.", "exvi": "Biên tập viên quyết định cắt bỏ một số đoạn văn thừa thãi để bài viết cô đọng hơn.", "syn": [], "cefr": "C2", "ref": "note:1788603784903"}, {"id": "3bb22fa3ab488056", "front": "haughty", "pos": "adjective", "ipa": "", "vi": "Kiêu căng, ngạo mạn, coi thường người khác", "en": "", "ex": "The haughty aristocrat looked down upon the commoners gathered in the village square.", "exvi": "Tên quý tộc ngạo mạn nhìn xuống những người dân thường tụ tập ở quảng trường làng với ánh mắt khinh miệt.", "syn": [], "cefr": "C1", "ref": "note:1788603784905"}, {"id": "19faae4d2e0efc13", "front": "habituated to", "pos": "phrase", "ipa": "", "vi": "Quen thuộc với, thích nghi dần với", "en": "", "ex": "Over time, the local wildlife became habituated to the frequent presence of hikers.", "exvi": "Theo thời gian, động vật hoang dã địa phương đã dần quen với sự xuất hiện thường xuyên của những người đi bộ đường dài.", "syn": [], "cefr": "C1", "ref": "note:1788603784907"}, {"id": "80265c6dce8ce4df", "front": "misgive", "pos": "verb", "ipa": "", "vi": "Làm e ngại, khiến lo âu, hồ nghi", "en": "", "ex": "His heart misgave him as he stepped into the unfamiliar and shadowy laboratory.", "exvi": "Lòng anh dấy lên mối lo ngại đầy bất an khi bước chân vào phòng thí nghiệm xa lạ và tăm tối.", "syn": [], "cefr": "C2", "ref": "note:1788603784909"}, {"id": "bbc18bd2d8e6e85f", "front": "impede", "pos": "verb", "ipa": "", "vi": "cản trở, gây trở ngại", "en": "", "ex": "Although he's shy, it certainly hasn't impeded his career in any way.", "exvi": "Dù anh ấy nhút nhát, điều đó chắc chắn không cản trở sự nghiệp của anh ấy theo bất kỳ cách nào.", "syn": [], "cefr": "B2", "ref": "note:1788603784911"}, {"id": "8add7faab1f84fb2", "front": "composure", "pos": "noun", "ipa": "", "vi": "Sự điềm tĩnh, sự thanh thản, tự chủ", "en": "", "ex": "Despite the unexpected technical glitch during the presentation, she maintained her composure.", "exvi": "Bất chấp sự cố kỹ thuật bất ngờ trong suốt bài thuyết trình, cô ấy vẫn giữ được vẻ điềm tĩnh.", "syn": [], "cefr": "C1", "ref": "note:1788603784913"}, {"id": "d69a670d1f0dab29", "front": "exuberant", "pos": "adjective", "ipa": "", "vi": "Tràn đầy năng lượng, dồi dào, sum suê", "en": "", "ex": "The stadium erupted in exuberant cheers the moment the home team scored the winning goal.", "exvi": "Cả sân vận động vỡ òa trong những tiếng reo hò tràn đầy năng lượng ngay khoảnh khắc đội chủ nhà ghi bàn thắng quyết định.", "syn": [], "cefr": "C1", "ref": "note:1788603784915"}, {"id": "16d27798ba34f04d", "front": "undiscerne", "pos": "adjective", "ipa": "", "vi": "Không được nhận ra, không phân biệt được", "en": "", "ex": "The subtle flaw in the engineering schematics went completely undiscerne by the review committee.", "exvi": "Sai sót nhỏ trong bản vẽ kỹ thuật đã hoàn toàn không được hội đồng thẩm định nhận ra.", "syn": [], "cefr": "C2", "ref": "note:1788603784917"}, {"id": "4e8f00459d16848f", "front": "a complement to", "pos": "phrase", "ipa": "", "vi": "Phần bổ sung hoàn hảo cho", "en": "", "ex": "The qualitative case studies served as a complement to the extensive statistical surveys.", "exvi": "Các nghiên cứu điển hình định tính đóng vai trò là phần bổ sung hoàn hảo cho các cuộc khảo sát thống kê sâu rộng.", "syn": [], "cefr": "C1", "ref": "note:1788603784919"}, {"id": "03556765a8103d2b", "front": "modify", "pos": "verb", "ipa": "", "vi": "sửa đổi, điều chỉnh", "en": "", "ex": "Researchers managed to modify the conventional synthesis protocol by adding a novel chemical catalyst.", "exvi": "Các nhà nghiên cứu đã sửa đổi thành công quy trình tổng hợp thông thường bằng cách thêm vào một chất xúc tác hóa học mới.", "syn": [], "cefr": "B2", "ref": "note:1788603784921"}, {"id": "597436f5cd01683c", "front": "an amalgam of", "pos": "phrase", "ipa": "", "vi": "Một sự pha trộn, hỗn hợp của", "en": "", "ex": "The modern culinary dish is an amalgam of traditional Cantonese flavors and French techniques.", "exvi": "Món ăn hiện đại này là một sự pha trộn giữa hương vị Quảng Đông truyền thống và kỹ thuật nấu nướng kiểu Pháp.", "syn": [], "cefr": "C1", "ref": "note:1788603784923"}, {"id": "50ed2ce0e748167b", "front": "a stipulation for", "pos": "phrase", "ipa": "", "vi": "Một điều khoản bắt buộc, điều kiện tiên quyết cho", "en": "", "ex": "Passing the background check was a mandatory stipulation for obtaining the security clearance.", "exvi": "Vượt qua bài kiểm tra lý lịch là một điều kiện tiên quyết bắt buộc để được cấp phép an ninh.", "syn": [], "cefr": "C1", "ref": "note:1788603784925"}, {"id": "7c697ebd601b24da", "front": "annihilate", "pos": "verb", "ipa": "", "vi": "Tiêu diệt hoàn toàn, hủy diệt triệt để", "en": "", "ex": "A catastrophic asteroid collision threatens to annihilate delicate planetary ecosystems.", "exvi": "Một vụ va chạm thiên thạch thảm khốc đe dọa tiêu diệt hoàn toàn các hệ sinh thái mỏng manh của hành tinh.", "syn": [], "cefr": "C1", "ref": "note:1788603784927"}, {"id": "d89487c005b35a87", "front": "consternation", "pos": "noun", "ipa": "", "vi": "Sự sửng sốt, bàng hoàng kèm lo âu", "en": "", "ex": "The unexpected declaration of company insolvency caused widespread consternation among investors.", "exvi": "Tuyên bố phá sản bất ngờ của công ty đã gây ra sự bàng hoàng và lo âu diện rộng trong giới đầu tư.", "syn": [], "cefr": "C2", "ref": "note:1788603784929"}, {"id": "707ee04a8928b4ba", "front": "absorb", "pos": "verb", "ipa": "", "vi": "hấp thụ, thấm hút, tiếp thu trọn vẹn", "en": "", "ex": "Dry sponges absorb water almost immediately when placed into a shallow dish.", "exvi": "Những miếng bọt biển khô hấp thụ nước gần như ngay lập tức khi được đặt vào một chiếc đĩa nông.", "syn": [], "cefr": "B2", "ref": "note:1788603784931"}, {"id": "af9979a3debbc14f", "front": "digresses from", "pos": "phrase", "ipa": "", "vi": "Lạc đề khỏi, đi chệch khỏi chủ đề chính", "en": "", "ex": "In chapter three, the author digresses from the primary historical argument to recount a personal anecdote.", "exvi": "Trong chương ba, tác giả đã đi chệch khỏi luận điểm lịch sử chính để kể lại một giai thoại cá nhân.", "syn": [], "cefr": "C1", "ref": "note:1788603784933"}, {"id": "9619ae0d10a2a190", "front": "acquiesces to", "pos": "phrase", "ipa": "", "vi": "Bằng lòng miễn cưỡng, ưng thuận ngầm", "en": "", "ex": "Reluctant to cause further friction, the board quietly acquiesces to the executive director's demands.", "exvi": "Ngại gây thêm mâu thuẫn, hội đồng quản trị đã ngậm ngùi chấp thuận các yêu cầu của giám đốc điều hành.", "syn": [], "cefr": "C2", "ref": "note:1788603784935"}, {"id": "b7f7d5172a7a563e", "front": "obsolescence", "pos": "noun", "ipa": "", "vi": "Tình trạng lỗi thời, sự trở nên thoái hóa lạc hậu", "en": "", "ex": "Planned obsolescence in consumer smartphones encourages buyers to upgrade devices frequently.", "exvi": "Sự lỗi thời được tính toán trước trong điện thoại thông minh tiêu dùng thúc đẩy người mua nâng cấp thiết bị thường xuyên.", "syn": [], "cefr": "C1", "ref": "note:1788603784937"}, {"id": "29d95fb2d3e3e45a", "front": "diminution", "pos": "noun", "ipa": "", "vi": "Sự giảm bớt, sự thu nhỏ, sự suy giảm", "en": "", "ex": "The long drought led to a severe diminution of the town's seasonal reservoir capacity.", "exvi": "Trận hạn hán kéo dài đã dẫn đến sự suy giảm nghiêm trọng dung tích hồ chứa nước theo mùa của thị trấn.", "syn": [], "cefr": "C1", "ref": "note:1788603784939"}, {"id": "53110a6fce6f8dbf", "front": "varies from", "pos": "verb phrase", "ipa": "", "vi": "khác biệt so với", "en": "", "ex": "Modern domesticated corn varies from its wild ancestor, which bore only tiny, sparse kernels.", "exvi": "Bắp ngô thuần hóa hiện đại khác biệt so với tổ tiên hoang dã của nó, loài vốn chỉ có những hạt nhỏ và thưa thớt.", "syn": [], "cefr": "B2", "ref": "note:1788603784941"}, {"id": "9444d9cf982bc844", "front": "entrench", "pos": "verb", "ipa": "", "vi": "Ăn sâu bám rễ, củng cố vững chắc", "en": "", "ex": "Decades of bureaucratic inertia served to entrench outdated administrative customs.", "exvi": "Hàng thập kỷ trì trệ của bộ máy quan liêu đã củng cố vững chắc những tập tục hành chính lỗi thời.", "syn": [], "cefr": "C1", "ref": "note:1788603784943"}, {"id": "1253c23f2652e290", "front": "indistinguishable", "pos": "adjective", "ipa": "", "vi": "Không thể phân biệt được, y hệt nhau", "en": "", "ex": "At high magnification, the synthetic diamond was practically indistinguishable from natural stone.", "exvi": "Dưới độ phóng đại cao, viên kim cương nhân tạo gần như không thể phân biệt được với đá tự nhiên.", "syn": [], "cefr": "C1", "ref": "note:1788603784945"}, {"id": "9bb0c5fcb79b2bcf", "front": "invert", "pos": "verb", "ipa": "", "vi": "Đảo ngược vị trí, lộn ngược", "en": "", "ex": "The optical lens acts to invert incoming light rays, casting an upside-down image on the sensor.", "exvi": "Thấu kính quang học có tác dụng đảo ngược các tia sáng đi vào, tạo ra một hình ảnh lộn ngược trên cảm biến.", "syn": [], "cefr": "C1", "ref": "note:1788603784947"}, {"id": "ed3fc7b7e7020920", "front": "squander", "pos": "verb", "ipa": "", "vi": "Lãng phí, phung phí (tiền của, cơ hội)", "en": "", "ex": "The young heir managed to squander his sizable fortune on lavish and short-lived ventures.", "exvi": "Người thừa kế trẻ tuổi đã phung phí toàn bộ gia tài kếch xù của mình vào những dự án xa hoa và ngắn ngủi.", "syn": [], "cefr": "C1", "ref": "note:1788603784949"}, {"id": "967f2b3474cee5d3", "front": "isolate", "pos": "verb", "ipa": "", "vi": "cô lập, tách biệt", "en": "", "ex": "The laboratory technician used specialized filters to isolate the active chemical compound from the plant extract.", "exvi": "Kỹ thuật viên phòng thí nghiệm đã sử dụng màng lọc chuyên dụng để cô lập hợp chất hóa học có hoạt tính khỏi chiết xuất thực vật.", "syn": [], "cefr": "B2", "ref": "note:1788603784951"}, {"id": "a30b6dab27611e63", "front": "craftsmanship", "pos": "noun", "ipa": "", "vi": "tay nghề thợ thủ công, sự khéo léo", "en": "", "ex": "The antique mahogany desk was admired for its exquisite craftsmanship.", "exvi": "Chiếc bàn gỗ gụ cổ được ngưỡng mộ vì tay nghề thủ công tinh xảo.", "syn": [], "cefr": "C1", "ref": "note:1788603784953"}, {"id": "971caaacf223b0b9", "front": "indispensable to", "pos": "adjective phrase", "ipa": "", "vi": "không thể thiếu đối với", "en": "", "ex": "Thorough peer review is indispensable to the integrity of scientific research.", "exvi": "Phản biện ngang hàng kỹ lưỡng là điều không thể thiếu đối với tính liêm chính của nghiên cứu khoa học.", "syn": [], "cefr": "C1", "ref": "note:1788603784955"}, {"id": "e8ea28bb5bc8905e", "front": "serendipitous", "pos": "adjective", "ipa": "", "vi": "tình cờ may mắn, ngẫu nhiên gặp điều tốt", "en": "", "ex": "Alexander Fleming's discovery of penicillin was a serendipitous breakthrough in medicine.", "exvi": "Việc Alexander Fleming phát hiện ra penicillin là một đột phá tình cờ và may mắn trong y học.", "syn": [], "cefr": "C2", "ref": "note:1788603784957"}, {"id": "952306e133b33234", "front": "resolute", "pos": "adjective", "ipa": "", "vi": "kiên quyết, quả quyết", "en": "", "ex": "Despite fierce political opposition, the governor remained resolute in her decision.", "exvi": "Bất chấp sự phản đối chính trị dữ dội, nữ thống đốc vẫn kiên quyết với quyết định của mình.", "syn": [], "cefr": "C1", "ref": "note:1788603784959"}, {"id": "5676f9c622921109", "front": "cite", "pos": "verb", "ipa": "", "vi": "trích dẫn, viện dẫn", "en": "", "ex": "In her essay, she was careful to cite all her sources to avoid plagiarism.", "exvi": "Trong bài luận của mình, cô ấy đã cẩn thận trích dẫn tất cả các nguồn của mình để tránh đạo văn.", "syn": [], "cefr": "B2", "ref": "note:1788603784961"}]}, {"key": "anki_starter-set04", "title": "Flashcard SAT Starter Set 04", "deck": "anki_starter", "count": 50, "cards": [{"id": "3a2b954668e19e4f", "front": "endorsement", "pos": "noun", "ipa": "", "vi": "sự tán thành, sự chứng thực, sự quảng cáo ủng hộ", "en": "", "ex": "The candidate gained momentum following an enthusiastic endorsement from the former mayor.", "exvi": "Ứng cử viên đã tạo được đà thuận lợi sau sự ủng hộ nhiệt tình từ cựu thị trưởng.", "syn": [], "cefr": "C1", "ref": "note:1788603784963"}, {"id": "aaa0cbdde33f7364", "front": "underappreciation", "pos": "noun", "ipa": "", "vi": "sự đánh giá thấp, sự không được coi trọng đúng mức", "en": "", "ex": "The poet struggled with underappreciation during her lifetime, finding fame only posthumously.", "exvi": "Nữ thi sĩ đã phải vật lộn với sự đánh giá thấp trong suốt cuộc đời mình và chỉ nổi tiếng sau khi qua đời.", "syn": [], "cefr": "C1", "ref": "note:1788603784965"}, {"id": "df0ed51a5c70901f", "front": "erasure", "pos": "noun", "ipa": "", "vi": "sự xóa bỏ, sự xóa sạch dấu vết", "en": "", "ex": "Scholars decried the deliberate erasure of indigenous history from textbook curricula.", "exvi": "Các học giả chỉ trích sự xóa bỏ có chủ đích lịch sử người bản địa khỏi các chương trình sách giáo khoa.", "syn": [], "cefr": "C1", "ref": "note:1788603784967"}, {"id": "0228c791027c4b1e", "front": "deterrence", "pos": "noun", "ipa": "", "vi": "sự ngăn chặn, sự răn đe", "en": "", "ex": "The prominent presence of security guards serves as an effective deterrence against shoplifting.", "exvi": "Sự hiện diện rõ ràng của nhân viên an ninh đóng vai trò như một biện pháp răn đe hiệu quả đối với hành vi trộm cắp.", "syn": [], "cefr": "C1", "ref": "note:1788603784969"}, {"id": "a3e6a3ae13e4665c", "front": "straightforward", "pos": "adjective", "ipa": "", "vi": "thẳng thắn, đơn giản, dễ hiểu", "en": "", "ex": "The laboratory instructions were completely straightforward, allowing the novice students to finish the experiment without confusion.", "exvi": "Các hướng dẫn trong phòng thí nghiệm hoàn toàn đơn giản và dễ hiểu, cho phép các sinh viên mới hoàn thành thí nghiệm mà không hề bối rối.", "syn": [], "cefr": "B2", "ref": "note:1788603784971"}, {"id": "fb253bd553f59c8f", "front": "surpassed by", "pos": "verb phrase", "ipa": "", "vi": "bị vượt qua bởi", "en": "", "ex": "The veteran runner's long-standing record was finally surpassed by a promising newcomer.", "exvi": "Kỷ lục lâu năm của vận động viên kỳ cựu cuối cùng đã bị vượt qua bởi một tân binh đầy triển vọng.", "syn": [], "cefr": "C1", "ref": "note:1788603784973"}, {"id": "9da2f1bf49576763", "front": "hasten", "pos": "verb", "ipa": "", "vi": "đẩy nhanh, vội vã", "en": "", "ex": "The government adopted financial reforms to hasten economic recovery after the recession.", "exvi": "Chính phủ đã áp dụng các cải cách tài chính để đẩy nhanh sự phục hồi kinh tế sau suy thoái.", "syn": [], "cefr": "C1", "ref": "note:1788603784975"}, {"id": "441430574f3028fa", "front": "insolvency", "pos": "noun", "ipa": "", "vi": "tình trạng vỡ nợ, mất khả năng thanh toán", "en": "", "ex": "Mounting debts and declining revenues pushed the airline into insolvency.", "exvi": "Các khoản nợ chồng chất và doanh thu sụt giảm đã đẩy hãng hàng không vào tình trạng vỡ nợ.", "syn": [], "cefr": "C1", "ref": "note:1788603784977"}, {"id": "f45f6b23f5b5386d", "front": "detangle", "pos": "verb", "ipa": "", "vi": "gỡ rối, tháo gỡ (mớ lộn xộn)", "en": "", "ex": "Investigators worked for months to detangle the politician's intricate financial networks.", "exvi": "Các điều tra viên đã làm việc hàng tháng trời để tháo gỡ mạng lưới tài chính chằng chịt của chính trị gia.", "syn": [], "cefr": "C1", "ref": "note:1788603784979"}, {"id": "bfb38f5e9193b987", "front": "expand", "pos": "verb", "ipa": "", "vi": "mở rộng, phát triển thêm", "en": "", "ex": "The tech firm intends to expand its regional research team to accelerate the creation of novel software tools.", "exvi": "Công ty công nghệ dự định mở rộng đội ngũ nghiên cứu trong khu vực để đẩy nhanh quá trình tạo ra các công cụ phần mềm mới.", "syn": [], "cefr": "B2", "ref": "note:1788603784981"}, {"id": "89b4b55526e410d2", "front": "prone", "pos": "adjective", "ipa": "", "vi": "dễ bị, có xu hướng ngả về (điều tiêu cực)", "en": "", "ex": "Elderly individuals with compromised immune systems are particularly prone to respiratory infections.", "exvi": "Những người cao tuổi có hệ miễn dịch suy giảm đặc biệt dễ bị nhiễm trùng đường hô hấp.", "syn": [], "cefr": "C1", "ref": "note:1788603784983"}, {"id": "19fdc385b8aef114", "front": "loath", "pos": "adjective", "ipa": "", "vi": "miễn cưỡng, không sẵn lòng", "en": "", "ex": "The conservative senator was loath to support any legislation increasing property taxes.", "exvi": "Thượng nghị sĩ bảo thủ rất miễn cưỡng trong việc ủng hộ bất kỳ đạo luật nào tăng thuế bất động sản.", "syn": [], "cefr": "C2", "ref": "note:1788603784985"}, {"id": "edcb834891e7cde1", "front": "admonish", "pos": "verb", "ipa": "", "vi": "khiển trách, nhắc nhở nghiêm khắc", "en": "", "ex": "The teacher gently admonished the students for talking loudly during the exam.", "exvi": "Giáo viên đã nhẹ nhàng nhắc nhở các học sinh vì nói chuyện ồn ào trong giờ thi.", "syn": [], "cefr": "C1", "ref": "note:1788603784987"}, {"id": "d74a5c67a7ec7293", "front": "pertinent", "pos": "adjective", "ipa": "", "vi": "thích hợp, đúng trọng tâm, liên quan", "en": "", "ex": "The defense attorney raised several pertinent points that shifted the jury's perspective.", "exvi": "Luật sư bào chữa đã nêu ra một số luận điểm thích đáng, làm thay đổi góc nhìn của bồi thẩm đoàn.", "syn": [], "cefr": "C1", "ref": "note:1788603784989"}, {"id": "c87491f473aafb3f", "front": "interaction", "pos": "noun", "ipa": "", "vi": "sự tương tác, sự giao tiếp qua lại", "en": "", "ex": "Careful interaction between different species is vital for maintaining ecological balance.", "exvi": "Sự tương tác cẩn thận giữa các loài khác nhau là điều cốt yếu để duy trì sự cân bằng sinh thái.", "syn": [], "cefr": "B2", "ref": "note:1788603784991"}, {"id": "0bb28913cf20e831", "front": "amenable", "pos": "adjective", "ipa": "", "vi": "dễ tiếp thu, sẵn lòng chịu nghe theo", "en": "", "ex": "The union leaders were amenable to compromising on working hours to avoid layoffs.", "exvi": "Các lãnh đạo công đoàn đã sẵn lòng thỏa hiệp về giờ làm việc để tránh sa thải.", "syn": [], "cefr": "C1", "ref": "note:1788603784993"}, {"id": "09991ad889d04371", "front": "misrepresent", "pos": "verb", "ipa": "", "vi": "trình bày sai lệch, bóp méo sự thật", "en": "", "ex": "Critics argued that the sensational news article grossly misrepresented the scientist's findings.", "exvi": "Các nhà phê bình lập luận rằng bài báo giật gân đã bóp méo nghiêm trọng các phát hiện của nhà khoa học.", "syn": [], "cefr": "C1", "ref": "note:1788603784995"}, {"id": "4fa7b52f7346b799", "front": "upended", "pos": "verb", "ipa": "", "vi": "lật ngược hoàn toàn, đảo lộn", "en": "", "ex": "The unexpected pandemic completely upended international travel and trade.", "exvi": "Đại dịch bất ngờ đã làm đảo lộn hoàn toàn ngành du lịch và thương mại quốc tế.", "syn": [], "cefr": "C1", "ref": "note:1788603784997"}, {"id": "00d7cd2a6a95b46a", "front": "tendentious", "pos": "adjective", "ipa": "", "vi": "có xu hướng thiên vị, có dụng ý định kiến", "en": "", "ex": "Scholars dismissed the partisan report as a tendentious interpretation of historical facts.", "exvi": "Các học giả đã bác bỏ báo cáo mang tính đảng phái đó vì cho rằng nó là một cách diễn giải thiên vị về các sự kiện lịch sử.", "syn": [], "cefr": "C2", "ref": "note:1788603784999"}, {"id": "f5272ad3e3913320", "front": "activate", "pos": "verb", "ipa": "", "vi": "kích hoạt, làm cho hoạt động", "en": "", "ex": "The sensor will activate the alarm system as soon as unauthorized motion is detected.", "exvi": "Cảm biến sẽ kích hoạt hệ thống báo động ngay khi phát hiện chuyển động trái phép.", "syn": [], "cefr": "B2", "ref": "note:1788603785001"}, {"id": "7df406c1606b50a1", "front": "pellucid", "pos": "adjective", "ipa": "", "vi": "Trong suốt, rõ ràng, dễ hiểu", "en": "", "ex": "The professor gave a pellucid explanation of a quantum physics theorem that had previously baffled his students.", "exvi": "Vị giáo sư đã đưa ra lời giải thích vô cùng rõ ràng về định lý vật lý lượng tử vốn từng làm bối rối các sinh viên.", "syn": [], "cefr": "C2", "ref": "note:1788603785003"}, {"id": "7969acf6332d066e", "front": "inchoate", "pos": "adjective", "ipa": "", "vi": "Mới bắt đầu, chưa hoàn thiện, còn phôi thai", "en": "", "ex": "At this point, his artistic vision was still inchoate, consisting merely of scattered sketches and vague ideas.", "exvi": "Tại thời điểm này, tầm nhìn nghệ thuật của anh ấy vẫn còn phôi thai, chỉ gồm những bức phác thảo rời rạc và ý tưởng mơ hồ.", "syn": [], "cefr": "C2", "ref":
