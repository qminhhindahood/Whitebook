 "front": "speculate", "pos": "verb", "ipa": "", "vi": "suy đoán, đầu cơ", "en": "", "ex": "The newspapers began to speculate about the Prime Minister's future after the scandal broke.", "exvi": "Các tờ báo bắt đầu suy đoán về tương lai của Thủ tướng sau khi vụ bê bối vỡ lở.", "syn": [], "cefr": "B2", "ref": "note:1788603785715"}, {"id": "2bcad4b589bb84d1", "front": "subjective", "pos": "adjective", "ipa": "", "vi": "chủ quan, dựa trên cảm tính", "en": "", "ex": "The beauty of a painting is purely subjective; what one person finds stunning, another may find unremarkable.", "exvi": "Vẻ đẹp của một bức tranh hoàn toàn mang tính chủ quan; thứ mà một người thấy tuyệt đẹp, người khác có thể thấy không có gì nổi bật.", "syn": [], "cefr": "B2", "ref": "note:1788603785717"}, {"id": "72bade33c2a5d609", "front": "unqualified", "pos": "adjective", "ipa": "", "vi": "không đủ năng lực, hoàn toàn hoặc tuyệt đối", "en": "", "ex": "The new policy was met with unqualified approval from the public.", "exvi": "Chính sách mới đã nhận được sự tán thành tuyệt đối từ công chúng.", "syn": [], "cefr": "B2", "ref": "note:1788603785719"}, {"id": "f993718b33597b43", "front": "superficial", "pos": "adjective", "ipa": "", "vi": "hời hợt, nông cạn", "en": "", "ex": "The inspector's superficial examination of the crime scene failed to uncover the crucial clue hidden beneath the floorboards.", "exvi": "Việc kiểm tra hời hợt của viên thanh tra tại hiện trường vụ án đã không phát hiện ra manh mối quan trọng được giấu dưới ván sàn.", "syn": [], "cefr": "B2", "ref": "note:1788603785721"}, {"id": "197652399b014876", "front": "ineffectual", "pos": "adjective", "ipa": "", "vi": "không hiệu quả, bất lực", "en": "", "ex": "His attempts to persuade his boss to give him a raise were ineffectual.", "exvi": "Những nỗ lực thuyết phục sếp tăng lương của anh ấy đều không có hiệu quả.", "syn": [], "cefr": "C1", "ref": "note:1788603785723"}, {"id": "1cf229c53f8893cb", "front": "copious", "pos": "adjective", "ipa": "", "vi": "dồi dào, phong phú", "en": "", "ex": "She took copious notes during the lecture to ensure she didn't miss any details.", "exvi": "Cô ấy đã ghi chép rất nhiều trong buổi giảng để đảm bảo không bỏ sót chi tiết nào.", "syn": [], "cefr": "C1", "ref": "note:1788603785725"}, {"id": "a008f6bd45081a6d", "front": "heterogeneous", "pos": "adjective", "ipa": "", "vi": "không đồng nhất, đa dạng", "en": "", "ex": "New York City is known for its heterogeneous population, with people from all over the world.", "exvi": "Thành phố New York nổi tiếng với dân số không đồng nhất, với những người đến từ khắp nơi trên thế giới.", "syn": [], "cefr": "C1", "ref": "note:1788603785727"}, {"id": "f2db8749bb7d0ebb", "front": "efficacy", "pos": "noun", "ipa": "", "vi": "tính hiệu quả, công hiệu", "en": "", "ex": "Recent studies have questioned the efficacy of this new drug in treating the disease.", "exvi": "Các nghiên cứu gần đây đã đặt câu hỏi về tính hiệu quả của loại thuốc mới này trong việc điều trị căn bệnh.", "syn": [], "cefr": "C1", "ref": "note:1788603785729"}, {"id": "03c18bc00dd319eb", "front": "abundant", "pos": "adjective", "ipa": "", "vi": "dồi dào, phong phú", "en": "", "ex": "Rainfall is abundant in the tropical rainforest, supporting a diverse ecosystem.", "exvi": "Lượng mưa ở rừng mưa nhiệt đới rất dồi dào, nuôi dưỡng một hệ sinh thái đa dạng.", "syn": [], "cefr": "B2", "ref": "note:1788603785731"}, {"id": "b65898748818e8ec", "front": "exhaustiveness", "pos": "noun", "ipa": "", "vi": "sự toàn diện, sự thấu đáo", "en": "", "ex": "The committee was praised for the exhaustiveness of its report, which covered every possible angle of the issue.", "exvi": "Ủy ban đã được khen ngợi vì sự toàn diện của bản báo cáo, vốn bao quát mọi khía cạnh có thể có của vấn đề.", "syn": [], "cefr": "C2", "ref": "note:1788603785733"}, {"id": "69a067c8ef5c9048", "front": "ameliorate", "pos": "verb", "ipa": "", "vi": "cải thiện, làm tốt hơn", "en": "", "ex": "The new policies are expected to ameliorate the living conditions for low-income families.", "exvi": "Các chính sách mới được kỳ vọng sẽ cải thiện điều kiện sống cho các gia đình có thu nhập thấp.", "syn": [], "cefr": "C2", "ref": "note:1788603785735"}, {"id": "98ba79b0a55a68dc", "front": "abridge", "pos": "verb", "ipa": "", "vi": "rút ngắn, tóm tắt", "en": "", "ex": "The publishing house asked the author to abridge the novel for a younger audience.", "exvi": "Nhà xuất bản đã yêu cầu tác giả rút gọn cuốn tiểu thuyết cho đối tượng độc giả trẻ tuổi hơn.", "syn": [], "cefr": "C1", "ref": "note:1788603785737"}, {"id": "0caae6d877369f0c", "front": "enumerate", "pos": "verb", "ipa": "", "vi": "liệt kê, đếm từng cái", "en": "", "ex": "The tour guide began to enumerate the historical landmarks we would be visiting on our city tour.", "exvi": "Hướng dẫn viên du lịch bắt đầu liệt kê những địa danh lịch sử mà chúng tôi sẽ đến thăm trong chuyến tham quan thành phố.", "syn": [], "cefr": "C1", "ref": "note:1788603785739"}, {"id": "9bd63c9e88ffd09b", "front": "sporadic", "pos": "adjective", "ipa": "", "vi": "Lẻ tẻ, không đều đặn. Thỉnh thoảng xảy ra.", "en": "", "ex": "The company has a history of sporadic success, with a hit product every few years.", "exvi": "Công ty có lịch sử thành công không đều đặn, với một sản phẩm nổi bật vài năm một lần.", "syn": [], "cefr": "B2", "ref": "note:1788603785741"}, {"id": "b560bc4d570466ac", "front": "sanguine", "pos": "adjective", "ipa": "", "vi": "lạc quan, đầy hy vọng", "en": "", "ex": "Despite the recent setbacks, she remained sanguine about the company's future.", "exvi": "Bất chấp những thất bại gần đây, cô ấy vẫn lạc quan về tương lai của công ty.", "syn": [], "cefr": "C1", "ref": "note:1788603785743"}, {"id": "b0d2bc408c4db730", "front": "conjecture", "pos": "noun, verb", "ipa": "", "vi": "sự phỏng đoán, sự ước đoán", "en": "", "ex": "The detective's conjecture about the culprit was based on a single, ambiguous clue, not on solid evidence.", "exvi": "Phỏng đoán của vị thám tử về thủ phạm chỉ dựa trên một manh mối duy nhất và mơ hồ, chứ không phải bằng chứng xác thực.", "syn": [], "cefr": "C1", "ref": "note:1788603785745"}, {"id": "98df87c48611de17", "front": "stymie", "pos": "verb", "ipa": "", "vi": "cản trở, ngăn chặn", "en": "", "ex": "The complex legal jargon in the contract was designed to stymie the other party from understanding the terms.", "exvi": "Những thuật ngữ pháp lý phức tạp trong hợp đồng được thiết kế để cản trở bên còn lại hiểu các điều khoản.", "syn": [], "cefr": "C1", "ref": "note:1788603785747"}, {"id": "c67cbed703d8fe29", "front": "extrapolating from", "pos": "verb phrase", "ipa": "", "vi": "suy diễn từ, ngoại suy từ một ví dụ", "en": "", "ex": "Economists caution against extrapolating from Silicon Valley to explain agglomeration patterns across all manufacturing fields.", "exvi": "Các nhà kinh tế học cảnh báo về việc suy diễn từ Thung lũng Silicon để giải thích các mô hình tụ cụm công nghiệp trên tất cả các lĩnh vực sản xuất.", "syn": [], "cefr": "C1", "ref": "note:1788603785749"}, {"id": "2106d598a6914e4d", "front": "dispute", "pos": "verb, noun", "ipa": "", "vi": "tranh cãi, bàn cãi", "en": "", "ex": "The players disputed the referee's decision, leading to a delay in the game.", "exvi": "Các cầu thủ đã tranh cãi về quyết định của trọng tài, dẫn đến việc trận đấu bị trì hoãn.", "syn": [], "cefr": "B2", "ref": "note:1788603785751"}, {"id": "8f0d2f5e2e844575", "front": "authoritative", "pos": "adjective", "ipa": "", "vi": "có thẩm quyền, đáng tin cậy, quyết đoán", "en": "", "ex": "The professor provided an authoritative study on the political shifts of nineteenth-century Europe.", "exvi": "Giáo sư đã cung cấp một nghiên cứu có thẩm quyền và chuẩn xác về những chuyển biến chính trị của châu Âu thế kỷ 19.", "syn": [], "cefr": "C1", "ref": "note:1788603785753"}, {"id": "65e65d61878af272", "front": "critique", "pos": "noun", "ipa": "", "vi": "bài phê bình, sự đánh giá có phân tích", "en": "", "ex": "The literary scholar published a compelling critique of modernist poetry in the academic journal.", "exvi": "Học giả văn học đã xuất bản một bài phê bình đầy thuyết phục về thơ ca hiện đại trên tạp chí học thuật.", "syn": [], "cefr": "C1", "ref": "note:1788603785755"}, {"id": "9e56dc4ec5781daa", "front": "register", "pos": "verb", "ipa": "", "vi": "ghi nhận, thể hiện, bộc lộ", "en": "", "ex": "Ephemeral artifacts can register subtle shifts in societal values that traditional historical texts overlook.", "exvi": "Những hiện vật phù du có thể ghi nhận những sự thay đổi tinh tế trong các giá trị xã hội mà các văn bản lịch sử truyền thống bỏ sót.", "syn": [], "cefr": "C1", "ref": "note:1788603785757"}, {"id": "6e73484144df2acd", "front": "pretexts for", "pos": "phrase", "ipa": "", "vi": "cái cớ cho, lý do ngụy biện cho", "en": "", "ex": "Minor border skirmishes were used as convenient pretexts for launching a full-scale invasion.", "exvi": "Các cuộc đụng độ nhỏ ở biên giới đã được sử dụng như những cái cớ thuận tiện để phát động một cuộc xâm lược quy mô lớn.", "syn": [], "cefr": "C1", "ref": "note:1788603785759"}, {"id": "0273bbc3f8adc535", "front": "spectacle", "pos": "noun", "ipa": "", "vi": "quang cảnh ấn tượng, màn trình diễn", "en": "", "ex": "The parade was a magnificent spectacle, with colorful floats and marching bands filling the streets.", "exvi": "Buổi diễu hành là một quang cảnh tráng lệ, với những chiếc xe hoa đầy màu sắc và các ban nhạc diễu hành lấp đầy đường phố.", "syn": [], "cefr": "B2", "ref": "note:1788603785761"}, {"id": "cad50b3cb79a1a45", "front": "harbingers of", "pos": "phrase", "ipa": "", "vi": "điềm báo của, dấu hiệu báo trước của", "en": "", "ex": "The blooming of early crocuses is seen as one of the quintessential harbingers of spring.", "exvi": "Sự nở rộ của hoa nghệ tây đầu mùa được coi là một trong những điềm báo tinh túy của mùa xuân.", "syn": [], "cefr": "C1", "ref": "note:1788603785763"}, {"id": "5f8d148487ccc224", "front": "telling of", "pos": "phrase", "ipa": "", "vi": "nói lên, bộc lộ rõ ràng, minh chứng cho", "en": "", "ex": "Outdated advertisements are telling of broader cultural attitudes toward consumerism in the late twentieth century.", "exvi": "Những mẩu quảng cáo lỗi thời là minh chứng rõ nét cho thấy thái độ văn hóa rộng lớn hơn đối với chủ nghĩa tiêu dùng vào cuối thế kỷ 20.", "syn": [], "cefr": "C1", "ref": "note:1788603785765"}]}, {"key": "anki_starter-set13", "title": "Flashcard SAT Starter Set 13", "deck": "anki_starter", "count": 50, "cards": [{"id": "006d6ab51c216e32", "front": "analogous to", "pos": "phrase", "ipa": "", "vi": "tương tự như, tương đồng với", "en": "", "ex": "The structure of an atom is often presented as being analogous to the solar system.", "exvi": "Cấu trúc của một nguyên tử thường được trình bày như thể tương tự với hệ mặt trời.", "syn": [], "cefr": "C1", "ref": "note:1788603785767"}, {"id": "42c09aabcbccbd8b", "front": "manifestations of", "pos": "phrase", "ipa": "", "vi": "biểu hiện của, sự biểu lộ của", "en": "", "ex": "Old flyers and ticket stubs are useful as manifestations of cultural change, displaying shifting societal concerns.", "exvi": "Những tờ rơi và cuống vé cũ rất hữu ích khi đóng vai trò là những biểu hiện của sự thay đổi văn hóa, phơi bày những mối quan tâm đang dịch chuyển của xã hội.", "syn": [], "cefr": "C1", "ref": "note:1788603785769"}, {"id": "ebfa188e4034f3a2", "front": "tolerance", "pos": "noun", "ipa": "", "vi": "Lòng khoan dung, sự chịu đựng.", "en": "", "ex": "Promoting religious tolerance is essential for a peaceful society.", "exvi": "Thúc đẩy lòng khoan dung tôn giáo là điều cần thiết cho một xã hội hòa bình.", "syn": [], "cefr": "B2", "ref": "note:1788603785771"}, {"id": "876bf15f574d776d", "front": "fabrication", "pos": "noun", "ipa": "", "vi": "sự bịa đặt, điều hư cấu", "en": "", "ex": "The fictitious online biography remained undetected for years until editors exposed it as a complete fabrication.", "exvi": "Tiểu sử trực tuyến hư cấu đã không bị phát hiện trong nhiều năm cho đến khi các biên tập viên vạch trần nó hoàn toàn là một sự bịa đặt.", "syn": [], "cefr": "C1", "ref": "note:1788603785773"}, {"id": "01b8dd9602c0116a", "front": "fraudulent", "pos": "adjective", "ipa": "", "vi": "gian lận, lừa đảo, giả mạo", "en": "", "ex": "Savvy readers soon recognized that the spurious encyclopedia article was fraudulent and reported it.", "exvi": "Những độc giả hiểu biết đã sớm nhận ra rằng bài viết bách khoa toàn thư giả mạo kia mang tính lừa đảo và đã báo cáo nó.", "syn": [], "cefr": "C1", "ref": "note:1788603785775"}, {"id": "1963fe650184d7f7", "front": "conscientious", "pos": "adjective", "ipa": "", "vi": "chu đáo, tận tâm, có lương tâm", "en": "", "ex": "The editor was known for her conscientious approach, verifying every single citation before publication.", "exvi": "Nữ biên tập viên nổi tiếng với phương pháp làm việc chu đáo, tận tâm, luôn xác minh từng trích dẫn trước khi xuất bản.", "syn": [], "cefr": "C1", "ref": "note:1788603785777"}, {"id": "f4d4b8f114d13858", "front": "hesitancy about", "pos": "phrase", "ipa": "", "vi": "sự ngập ngừng, lưỡng lự về", "en": "", "ex": "The committee displayed marked hesitancy about approving the untested technological prototype.", "exvi": "Ủy ban đã thể hiện sự ngập ngừng rõ rệt về việc phê duyệt nguyên mẫu công nghệ chưa qua thử nghiệm.", "syn": [], "cefr": "C1", "ref": "note:1788603785779"}, {"id": "eae0963bbdeff69e", "front": "entice", "pos": "verb", "ipa": "", "vi": "dụ dỗ, lôi kéo", "en": "", "ex": "The store's 'buy one, get one free' offer was designed to entice customers to spend more.", "exvi": "Chương trình khuyến mãi 'mua một, tặng một' của cửa hàng được thiết kế để dụ dỗ khách hàng chi tiêu nhiều hơn.", "syn": [], "cefr": "B2", "ref": "note:1788603785781"}, {"id": "740962691135d46c", "front": "manifest in", "pos": "phrase", "ipa": "", "vi": "biểu hiện rõ ràng trong, hiển lộ ở", "en": "", "ex": "Morris's rejection of modern industrial mass production is manifest in his press's reliance on handcrafted bindings.", "exvi": "Sự chối bỏ sản xuất hàng loạt thời công nghiệp của Morris được biểu hiện rõ ràng trong việc nhà in của ông phụ thuộc vào bìa sách thủ công.", "syn": [], "cefr": "C1", "ref": "note:1788603785783"}, {"id": "c91c04a39d75c423", "front": "engendering", "pos": "verb", "ipa": "", "vi": "gây ra, làm phát sinh, đem lại", "en": "", "ex": "The rapid price increase had the unexpected effect of engendering heightened demand among speculative toy collectors.", "exvi": "Việc tăng giá nhanh chóng đã mang lại tác động bất ngờ là làm phát sinh nhu cầu gia tăng trong giới sưu tập đồ chơi đầu cơ.", "syn": [], "cefr": "C2", "ref": "note:1788603785785"}, {"id": "b054fd942a2df399", "front": "interdependent", "pos": "adjective", "ipa": "", "vi": "phụ thuộc lẫn nhau, tương hỗ", "en": "", "ex": "The coastal delta landscape is shaped by interdependent ecological forces where sediment and geography continually affect one another.", "exvi": "Cảnh quan đồng bằng ven biển được định hình bởi các lực lượng sinh thái phụ thuộc lẫn nhau, nơi trầm tích và địa lý liên tục tác động qua lại lẫn nhau.", "syn": [], "cefr": "C1", "ref": "note:1788603785787"}, {"id": "b2bc0b4ce1f08bca", "front": "unyielding", "pos": "adjective", "ipa": "", "vi": "bất khuất, kiên định, không nhượng bộ (dạng unyielding)", "en": "", "ex": "Faced with intense political opposition, the diplomat maintained an unyielding stance on territorial borders.", "exvi": "Đối mặt với sự phản đối chính trị dữ dội, nhà ngoại giao vẫn giữ lập trường kiên định, không nhượng bộ về ranh giới lãnh thổ.", "syn": [], "cefr": "C2", "ref": "note:1788603785789"}, {"id": "dc37378f13e63a04", "front": "prohibitive", "pos": "adjective", "ipa": "", "vi": "đắt cắt cổ, ngăn cấm", "en": "", "ex": "The cost of renovating the old theater was prohibitive, so they decided to tear it down.", "exvi": "Chi phí cải tạo nhà hát cũ là quá đắt đỏ, vì vậy họ quyết định phá bỏ nó.", "syn": [], "cefr": "B2", "ref": "note:1788603785791"}, {"id": "9db81b59cf56eb9f", "front": "amass in", "pos": "phrasal verb", "ipa": "", "vi": "tập trung đông đúc tại, dồn về số lượng lớn", "en": "", "ex": "Industrial advantages manifest when complementary manufacturing firms amass in a regional hub.", "exvi": "Lợi thế công nghiệp lộ rõ khi các công ty sản xuất bổ trợ cho nhau tập trung đông đúc tại một trung tâm khu vực.", "syn": [], "cefr": "C1", "ref": "note:1788603785793"}, {"id": "e0a4985ed682f6ec", "front": "latitude in", "pos": "noun phrase", "ipa": "", "vi": "sự tự do, quyền chủ động quyết định trong", "en": "", "ex": "Prose poets typically enjoy broad latitude in balancing standard sentence structures with poetic metaphors.", "exvi": "Các nhà thơ viết thơ văn xuôi thường được hưởng quyền tự do rộng rãi trong việc cân đối cấu trúc câu thông thường với các ẩn dụ thơ ca.", "syn": [], "cefr": "C1", "ref": "note:1788603785795"}, {"id": "7ba1ee7bf789223e", "front": "an incipient", "pos": "adjective phrase", "ipa": "", "vi": "mới chớm nở, đang trong giai đoạn manh nha hình thành", "en": "", "ex": "Darwin's early notebook entries demonstrate that natural selection was already an incipient idea twenty years prior to publication.", "exvi": "Các ghi chép sớm trong sổ tay của Darwin chứng minh rằng thuyết chọn lọc tự nhiên đã là một ý tưởng mới chớm nở từ hai mươi năm trước khi xuất bản.", "syn": [], "cefr": "C2", "ref": "note:1788603785797"}, {"id": "5a6de742d1793910", "front": "inconsistency", "pos": "noun", "ipa": "", "vi": "sự thiếu nhất quán, tính không đồng đều", "en": "", "ex": "High concentrations and widespread physical inconsistency among plastic particles make sorting samples challenging.", "exvi": "Nồng độ cao cùng với sự thiếu nhất quán về hình thái vật lý giữa các hạt nhựa khiến việc phân loại mẫu thử gặp nhiều trở ngại.", "syn": [], "cefr": "C1", "ref": "note:1788603785799"}, {"id": "7120f916d504adb5", "front": "soothe", "pos": "verb", "ipa": "", "vi": "xoa dịu, làm dịu bớt, trấn an", "en": "", "ex": "Humanoid robots that fall into the uncanny valley tend to unsettle rather than soothe observers.", "exvi": "Những robot hình người rơi vào hiệu ứng thung lũng kỳ lạ có xu hướng làm người quan sát bồn chồn hơn là trấn an họ.", "syn": [], "cefr": "B2", "ref": "note:1788603785801"}, {"id": "0f628b4f569997f9", "front": "continuity", "pos": "noun", "ipa": "", "vi": "tính liên tục, sự kế thừa liền mạch", "en": "", "ex": "Hawaiian literature exhibits remarkable thematic continuity, maintaining clear connections with ancient native lore.", "exvi": "Văn học Hawaii thể hiện tính kế thừa liên tục đáng chú ý về mặt chủ đề, duy trì sự gắn kết rõ ràng với truyền thuyết dân gian cổ xưa.", "syn": [], "cefr": "C1", "ref": "note:1788603785803"}, {"id": "454a0b2e030bfaea", "front": "deference to", "pos": "noun phrase", "ipa": "", "vi": "sự tôn trọng đối với, sự nhún nhường trước", "en": "", "ex": "Out of deference to the lead researcher's seniority, the assistant did not challenge her conclusions publicly.", "exvi": "Vì sự tôn trọng đối với thâm niên của nhà nghiên cứu trưởng, người trợ lý đã không công khai phản bác các kết luận của bà.", "syn": [], "cefr": "C1", "ref": "note:1788603785805"}, {"id": "21b1c6224a13ecbc", "front": "satirize", "pos": "verb", "ipa": "", "vi": "châm biếm, chế giễu sâu cay", "en": "", "ex": "The novelist used absurd court trials to satirize the petty bureaucracy of the ruling class.", "exvi": "Nhà tiểu thuyết đã sử dụng những phiên tòa phi lý để châm biếm tính quan liêu nhỏ nhen của giai cấp thống trị.", "syn": [], "cefr": "C1", "ref": "note:1788603785807"}, {"id": "0633c7329ddee55b", "front": "intangible", "pos": "adjective", "ipa": "", "vi": "vô hình, không thể sờ nắm được", "en": "", "ex": "Interactive 3D printed models ensure nebulous stellar nurseries do not remain entirely intangible to students.", "exvi": "Các mô hình in 3D tương tác đảm bảo rằng các vườn ươm sao mờ ảo không còn là điều hoàn toàn vô hình đối với học sinh.", "syn": [], "cefr": "C1", "ref": "note:1788603785809"}, {"id": "1e0d08f4044508b9", "front": "genuine", "pos": "adjective", "ipa": "", "vi": "thật, chân thật, thành thật", "en": "", "ex": "The museum confirmed that the recovered artifact was a genuine antique from the Ming dynasty.", "exvi": "Bảo tàng xác nhận rằng cổ vật được thu hồi là một món đồ cổ đích thực từ thời nhà Minh.", "syn": [], "cefr": "B2", "ref": "note:1788603785811"}, {"id": "746c9d76c3f9a999", "front": "breadth of", "pos": "noun phrase", "ipa": "", "vi": "bề rộng của, sự phong phú và đa dạng của", "en": "", "ex": "The impressive breadth of public murals and statues scattered across the city ensures appeal for all art enthusiasts.", "exvi": "Sự đa dạng phong phú đáng kinh ngạc của các bức bích họa và tượng đài công cộng khắp thành phố đảm bảo sự lôi cuốn với mọi tín đồ nghệ thuật.", "syn": [], "cefr": "C1", "ref": "note:1788603785813"}, {"id": "4ce1fa813a3dac80", "front": "an exemplar", "pos": "noun phrase", "ipa": "", "vi": "tấm gương mẫu mực, điển hình tiêu biểu", "en": "", "ex": "Historians traditionally viewed eighteenth-century Britain as an exemplar of prudent fiscal stewardship.", "exvi": "Các nhà sử học theo truyền thống luôn nhìn nhận nước Anh thế kỷ thứ mười tám như một hình mẫu tiêu biểu cho sự quản lý tài chính cẩn trọng.", "syn": [], "cefr": "C2", "ref": "note:1788603785815"}, {"id": "600266ec7bea120b", "front": "perceptible", "pos": "adjective", "ipa": "", "vi": "có thể nhận biết được, có thể thấy rõ", "en": "", "ex": "Even as twilight deepened, the dying crimson rays of sunlight remained faintly perceptible on the horizon.", "exvi": "Ngay cả khi màn đêm buông xuống, những tia nắng đỏ rực le lói cuối cùng vẫn có thể nhận thấy mờ ảo nơi đường chân trời.", "syn": [], "cefr": "C1", "ref": "note:1788603785817"}, {"id": "7ec9d761816e31b8", "front": "adept at", "pos": "adjective phrase", "ipa": "", "vi": "điêu luyện, cực kỳ giỏi về", "en": "", "ex": "The chemist was recognized with a Nobel Prize after proving extraordinarily adept at tracking cellular protein decay.", "exvi": "Nhà hóa học đã được trao giải Nobel sau khi chứng tỏ bản thân cực kỳ điêu luyện trong việc theo dõi sự phân rã protein của tế bào.", "syn": [], "cefr": "C1", "ref": "note:1788603785819"}, {"id": "461bffa33a4dd3a3", "front": "abandon", "pos": "verb", "ipa": "", "vi": "từ bỏ, ruồng bỏ", "en": "", "ex": "Without legitimate support, the embattled monarch would have been forced to abandon the throne.", "exvi": "Nếu không có sự ủng hộ hợp pháp, vị vua bị bao vây bởi khủng hoảng sẽ bị buộc phải từ bỏ ngai vàng.", "syn": [], "cefr": "B2", "ref": "note:1788603785821"}, {"id": "a778653fdea5ae18", "front": "inextricable from", "pos": "adjective phrase", "ipa": "", "vi": "không thể tách rời khỏi, gắn bó khăng khít với", "en": "", "ex": "Modern local literature remains inextricable from traditional folklore, drawing life from ancestral oral histories.", "exvi": "Văn học địa phương hiện đại vẫn không thể tách rời khỏi truyền thuyết dân gian truyền thống, tiếp nhận nhựa sống từ lịch sử truyền khẩu của tổ tiên.", "syn": [], "cefr": "C2", "ref": "note:1788603785823"}, {"id": "682954335f857ff7", "front": "subverted by", "pos": "verb phrase", "ipa": "", "vi": "bị phá hoại ngầm bởi, bị lật đổ từ bên trong bởi", "en": "", "ex": "The authority of the autocratic regime was steadily subverted by clandestine networks circulating forbidden literature.", "exvi": "Quyền lực của chế độ độc tài đã dần dần bị phá hoại ngầm bởi các mạng lưới bí mật chuyên lưu hành văn tài liệu cấm.", "syn": [], "cefr": "C1", "ref": "note:1788603785825"}, {"id": "fe71d79794f65d49", "front": "esteem", "pos": "noun", "ipa": "", "vi": "Sự kính trọng, lòng quý mến và coi trọng", "en": "", "ex": "Benjamin Franklin was held in high esteem by the French public, which aided his diplomatic efforts.", "exvi": "Benjamin Franklin nhận được sự kính trọng lớn từ công chúng Pháp, điều này đã hỗ trợ cho các nỗ lực ngoại giao của ông.", "syn": [], "cefr": "C1", "ref": "note:1788603785827"}, {"id": "989660482165b876", "front": "competent", "pos": "adjective", "ipa": "", "vi": "Có năng lực, thành thạo, có đủ khả năng làm tốt một việc", "en": "", "ex": "Cuttlefish demonstrated that they were remarkably competent at exercising self-control to gain preferred foods.", "exvi": "Mực nang đã chứng minh rằng chúng thành thạo một cách đáng ngạc nhiên trong việc kiểm soát bản thân để nhận được món ăn ưa thích.", "syn": [], "cefr": "C1", "ref": "note:1788603785829"}, {"id": "d42097aa61e0d722", "front": "assert", "pos": "verb", "ipa": "", "vi": "khẳng định, quả quyết", "en": "", "ex": "Crucial political factors allowed the French monarch to assert his right to hold the throne successfully.", "exvi": "Các yếu tố chính trị cốt lõi đã cho phép vị quân chủ nước Pháp khẳng định thành công quyền giữ ngai vàng của mình.", "syn": [], "cefr": "B2", "ref": "note:1788603785831"}, {"id": "dd725c5c06ede7db", "front": "tally", "pos": "verb", "ipa": "", "vi": "Kiểm đếm, tính tổng số lượng", "en": "", "ex": "Librarians will tally the citations received by the paper to determine its academic influence.", "exvi": "Các thủ thư sẽ kiểm đếm số lượt trích dẫn mà bài báo nhận được để xác định tầm ảnh hưởng học thuật của nó.", "syn": [], "cefr": "C1", "ref": "note:1788603785833"}, {"id": "24bd4197d79d63c9", "front": "fuse", "pos": "verb", "ipa": "", "vi": "Hòa trộn, kết hợp, gắn kết lại với nhau thành một thể thống nhất", "en": "", "ex": "The musician seeks to fuse traditional Indigenous rhythms with contemporary jazz melodies.", "exvi": "Nhạc sĩ tìm cách kết hợp những giai điệu bản địa truyền thống với tiết tấu nhạc jazz đương đại.", "syn": [], "cefr": "C1", "ref": "note:1788603785835"}, {"id": "92aa8a3d6db2d81f", "front": "wrought by", "pos": "phrase", "ipa": "", "vi": "Gây ra bởi, tạo tác/gây nên bởi", "en": "", "ex": "Critics praised the war novel despite the substantial structural flaws wrought by heavy-handed government censors.", "exvi": "Các nhà phê bình ca ngợi cuốn tiểu thuyết chiến tranh bất chấp những lỗ hổng kết cấu đáng kể do các nhà kiểm duyệt độc đoán gây ra.", "syn": [], "cefr": "C2", "ref": "note:1788603785837"}, {"id": "8118d1ae9dddce05", "front": "prolong", "pos": "verb", "ipa": "", "vi": "Kéo dài (thời gian, tuổi thọ, sự việc)", "en": "", "ex": "Doctors prescribed physical therapy to prolong the patient's mobility in retirement.", "exvi": "Các bác sĩ đã chỉ định vật lý trị liệu để kéo dài khả năng vận động của bệnh nhân khi về hưu.", "syn": [], "cefr": "C1", "ref": "note:1788603785839"}, {"id": "8fae2e44de935ca6", "front": "embrace", "pos": "verb", "ipa": "", "vi": "đón nhận, tiếp thu nhiệt tình, ôm", "en": "", "ex": "Rather than following Western methods, Hashimoto Gahō chose to embrace traditional Japanese approaches in his artwork.", "exvi": "Thay vì làm theo các phương pháp phương Tây, Hashimoto Gahō đã chọn đón nhận những cách tiếp cận truyền thống của Nhật Bản trong tác phẩm của mình.", "syn": [], "cefr": "B2", "ref": "note:1788603785841"}, {"id": "17cf7925a75dc96b", "front": "hallmark", "pos": "noun", "ipa": "", "vi": "Dấu hiệu nhận biết đặc trưng, nét tiêu biểu", "en": "", "ex": "The towering minaret has long been regarded as an essential hallmark of classic mosque architecture.", "exvi": "Ngọn tháp minaret cao vút từ lâu đã được coi là một dấu ấn đặc trưng thiết yếu của kiến trúc đền thờ Hồi giáo cổ điển.", "syn": [], "cefr": "C1", "ref": "note:1788603785843"}, {"id": "25dee2636661b168", "front": "an imposing", "pos": "phrase", "ipa": "", "vi": "Hùng vĩ, bệ vệ, gây ấn tượng mạnh", "en": "", "ex": "The fortress sat atop the cliff, presenting an imposing sight to travelers approaching from the valley.", "exvi": "Pháo đài ngự trên đỉnh vách đá, tạo nên một cảnh tượng bệ vệ, uy nghi đối với những lữ khách tiến đến từ thung lũng.", "syn": [], "cefr": "C1", "ref": "note:1788603785845"}, {"id": "6450bbff66548c2c", "front": "an embellished", "pos": "phrase", "ipa": "", "vi": "Được tô điểm, thêm thắt chi tiết (cho đẹp hơn hoặc ly kỳ hơn)", "en": "", "ex": "The chronicler gave an embellished account of the battle, exaggerating the general's heroism.", "exvi": "Người ghi chép sử đã đưa ra một lời kể có phần thêm thắt về trận chiến, phóng đại lòng dũng cảm của vị tướng.", "syn": [], "cefr": "C1", "ref": "note:1788603785847"}, {"id": "d2145c248d68b6e3", "front": "an unprecedented", "pos": "phrase", "ipa": "", "vi": "Chưa từng có tiền lệ, chưa từng xảy ra trước đây", "en": "", "ex": "The sudden discovery of millions of fossils represented an unprecedented opportunity for evolutionary biologists.", "exvi": "Sự phát hiện đột ngột hàng triệu hóa thạch đại diện cho một cơ hội chưa từng có tiền lệ đối với các nhà sinh học tiến hóa.", "syn": [], "cefr": "C1", "ref": "note:1788603785849"}, {"id": "405b04fc5ea7415c", "front": "symbolize", "pos": "verb", "ipa": "", "vi": "tượng trưng cho, biểu tượng cho", "en": "", "ex": "In classical literature, the white dove is frequently used to symbolize peace and renewal.", "exvi": "Trong văn học cổ điển, chim bồ câu trắng thường được dùng để tượng trưng cho hòa bình và sự đổi mới.", "syn": [], "cefr": "B2", "ref": "note:1788603785851"}, {"id": "1b7e7febff352f55", "front": "unsympathetic to", "pos": "phrase", "ipa": "", "vi": "Không đồng tình, không ủng hộ, thờ ơ trước", "en": "", "ex": "Commuters upset about current bridge fees proved entirely unsympathetic to arguments advocating a toll increase.", "exvi": "Những người đi làm bức xúc về mức phí cầu đường hiện tại tỏ ra hoàn toàn không đồng tình với những lập luận ủng hộ việc tăng phí.", "syn": [], "cefr": "C1", "ref": "note:1788603785853"}, {"id": "83e95334f1269a35", "front": "persuadable", "pos": "adjective", "ipa": "", "vi": "Dễ thuyết phục, có thể bị thuyết phục", "en": "", "ex": "Campaigners focused their outreach on persuadable voters rather than staunch opponents.", "exvi": "Những người vận động chiến dịch đã tập trung tiếp cận các cử tri dễ thuyết phục hơn là những đối thủ kiên định phản đối.", "syn": [], "cefr": "C1", "ref": "note:1788603785855"}, {"id": "fdf800c6ff855abd", "front": "magnitude", "pos": "noun", "ipa": "", "vi": "Độ lớn, quy mô, tầm vóc hoặc cường độ", "en": "", "ex": "Although both aquatic creatures detect electric signals, the magnitude of their sensitivity differs substantially.", "exvi": "Mặc dù cả hai sinh vật thủy sinh đều phát hiện tín hiệu điện, độ lớn trong độ nhạy cảm của chúng khác biệt đáng kể.", "syn": [], "cefr": "C1", "ref": "note:1788603785857"}, {"id": "45c3aa21cae23453", "front": "prestige", "pos": "noun", "ipa": "", "vi": "Uy tín, thanh thế, vị thế danh giá", "en": "", "ex": "Portraying famous thinkers brought the painter widespread acclaim and substantial prestige in the artistic community.", "exvi": "Việc khắc họa chân dung các nhà tư tưởng nổi tiếng đã mang lại cho họa sĩ sự tán thưởng rộng rãi và uy tín lớn trong giới nghệ thuật.", "syn": [], "cefr": "C1", "ref": "note:1788603785859"}, {"id": "dabce1af43b9a325", "front": "fusion", "pos": "noun", "ipa": "", "vi": "sự kết hợp, sự hợp nhất", "en": "", "ex": "The mosque’s design reflects a unique fusion of Persian and Moorish architectural styles.", "exvi": "Thiết kế của nhà thờ Hồi giáo phản ánh sự kết hợp độc đáo giữa các phong cách kiến trúc Ba Tư và Moorish.", "syn": [], "cefr": "B2", "ref": "note:1788603785861"}, {"id": "89c172a2705722be", "front": "outsize", "pos": "adjective", "ipa": "", "vi": "Quá khổ, lớn khác thường, chiếm tỉ lệ vượt trội", "en": "", "ex": "Literature from the post-revolutionary decade occupies an outsize portion of the recognized Mexican literary canon.", "exvi": "Văn học từ thập kỷ sau cách mạng chiếm một phần lớn khác thường trong số các tác phẩm kinh điển được công nhận của Mexico.", "syn": [], "cefr": "C1", "ref": "note:1788603785863"}, {"id": "ef8a8fadd1645c2f", "front": "demarcated from", "pos": "phrase", "ipa": "", "vi": "Được phân định ranh giới, được tách biệt rõ ràng khỏi", "en": "", "ex": "Migratory fish are sharply demarcated from stationary marine species by their obligate journeys between biomes.", "exvi": "Cá di cư được phân định rõ ràng khỏi các loài biển cố định bởi những hành trình bắt buộc giữa các quần xã sinh vật.", "syn": [], "cefr": "C1", "ref": "note:1788603785865"}]}, {"key": "anki_starter-set14", "title": "Flashcard SAT Starter Set 14", "deck": "anki_starter", "count": 50, "cards": [{"id": "45314cf202d2b003", "front": "an oddity", "pos": "phrase", "ipa": "", "vi": "Một điều kỳ lạ, điều khác thường hiếm gặp", "en": "", "ex": "The gamma ray burst lasted hundreds of seconds, an oddity given that typical neutron mergers conclude in two seconds.", "exvi": "Vụ nổ tia gamma kéo dài hàng trăm giây, một điều kỳ lạ vì các vụ hợp nhất neutron thông thường chỉ kết thúc trong hai giây.", "syn": [], "cefr": "C1", "ref": "note:1788603785867"}, {"id": "522c1dc80c174fe2", "front": "a contentious", "pos": "phrase", "ipa": "", "vi": "Hay gây tranh cãi gay gắt, dễ dẫn đến bất đồng", "en": "", "ex": "The municipal proposal to rezone farmland became a contentious issue among regional council members.", "exvi": "Đề xuất quy hoạch lại đất nông nghiệp của thành phố đã trở thành một vấn đề gây tranh cãi gay gắt giữa các thành viên hội đồng khu vực.", "syn": [], "cefr": "C1", "ref": "note:1788603785869"}, {"id": "49752fb049fcec4a", "front": "mimic", "pos": "verb", "ipa": "", "vi": "bắt chước, nhại lại", "en": "", "ex": "Certain non-venomous insects mimic the bright coloring of toxic species to deter predators.", "exvi": "Một số loài côn trùng không độc bắt chước màu sắc sặc sỡ của các loài có độc để ngăn chặn những kẻ săn mồi.", "syn": [], "cefr": "B2", "ref": "note:1788603785871"}, {"id": "ed8c63cd05cab0f5", "front": "an arduous", "pos": "phrase", "ipa": "", "vi": "Gian nan, nhọc nhằn, đòi hỏi nhiều nỗ lực vất vả", "en": "", "ex": "Handcrafting a quarter million paper silhouettes proved to be an arduous task requiring three years of ceaseless effort.", "exvi": "Việc cắt thủ công một phần tư triệu hình bóng bằng giấy hóa ra là một công việc gian nan đòi hỏi ba năm nỗ lực không ngừng nghỉ.", "syn": [], "cefr": "C1", "ref": "note:1788603785873"}, {"id": "c79fdc843725373b", "front": "pervade", "pos": "verb", "ipa": "", "vi": "lan tỏa khắp, tràn ngập, thấm nhuần", "en": "", "ex": "A pro-innovation bias tends to pervade historical studies, overshadowing cases of technology abandonment.", "exvi": "Sự thiên vị ủng hộ đổi mới có xu hướng lan tỏa khắp các nghiên cứu lịch sử, làm lu mờ các trường hợp từ bỏ công nghệ.", "syn": [], "cefr": "C1", "ref": "note:1788603785875"}, {"id": "cf242e4ae226f66b", "front": "synthesis", "pos": "noun", "ipa": "", "vi": "sự tổng hợp, sự kết hợp", "en": "", "ex": "The architect created a synthesis of modern metallic frames and organic timber elements.", "exvi": "Kiến trúc sư đã tạo ra một sự tổng hợp giữa các khung kim loại hiện đại và các yếu tố gỗ hữu cơ.", "syn": [], "cefr": "C1", "ref": "note:1788603785877"}, {"id": "51ad8dadc30a4fd7", "front": "trophic", "pos": "adjective", "ipa": "", "vi": "(thuộc) dinh dưỡng, bậc dinh dưỡng trong hệ sinh thái", "en": "", "ex": "Because energy is lost as heat, ecosystems can rarely sustain more than four or five trophic levels.", "exvi": "Vì năng lượng bị mất đi dưới dạng nhiệt, các hệ sinh thái hiếm khi có thể duy trì nhiều hơn bốn hoặc năm bậc dinh dưỡng.", "syn": [], "cefr": "C2", "ref": "note:1788603785879"}, {"id": "aacad1ee3a439e0f", "front": "hideous", "pos": "adjective", "ipa": "", "vi": "gớm ghiếc, xấu xí kinh khủng", "en": "", "ex": "The abandoned factory was transformed into a hideous eyesore in the center of the town.", "exvi": "Nhà máy bị bỏ hoang đã biến thành một cảnh tượng gớm ghiếc, chướng mắt ngay giữa lòng thị trấn.", "syn": [], "cefr": "B2", "ref": "note:1788603785881"}, {"id": "2a6c86eae2db9440", "front": "salvage", "pos": "verb", "ipa": "", "vi": "cứu vớt, thu hồi, trục vớt dữ liệu hoặc đồ vật quý giá", "en": "", "ex": "Researchers launched an ambitious project to salvage valuable geological data from obsolete Apollo lunar tapes.", "exvi": "Các nhà nghiên cứu đã khởi động một dự án đầy tham vọng nhằm cứu vớt các dữ liệu địa chất quý giá từ những cuốn băng nguyệt cầu Apollo đã lỗi thời.", "syn": [], "cefr": "C1", "ref": "note:1788603785883"}, {"id": "d9097c49c269076a", "front": "enact", "pos": "verb", "ipa": "", "vi": "ban hành (luật), thi hành, thực hiện", "en": "", "ex": "Legislators convened an emergency session to enact stricter conservation laws protecting coastal wetlands.", "exvi": "Các nhà lập pháp đã triệu tập một phiên họp khẩn cấp để ban hành các đạo luật bảo tồn nghiêm ngặt hơn nhằm bảo vệ các vùng đất ngập nước ven biển.", "syn": [], "cefr": "C1", "ref": "note:1788603785885"}, {"id": "7ac571fa423398cd", "front": "unrivaled", "pos": "adjective", "ipa": "", "vi": "Vô song, không có đối thủ, không ai sánh bằng", "en": "", "ex": "Her unrivaled mastery of baroque violin techniques left audiences and critics in complete awe.", "exvi": "Sự thông thạo vô song của cô về kỹ thuật vĩ cầm thời kỳ baroque đã khiến khán giả và giới phê bình hoàn toàn kinh ngạc.", "syn": [], "cefr": "C1", "ref": "note:1788603785887"}, {"id": "79f801a95e9c0e3d", "front": "juxtaposition", "pos": "noun", "ipa": "", "vi": "sự đặt cạnh nhau, sự kề nhau", "en": "", "ex": "The juxtaposition of the ancient temple and the modern skyscraper in the city center was striking.", "exvi": "Sự đặt cạnh nhau giữa ngôi đền cổ và tòa nhà chọc trời hiện đại ở trung tâm thành phố thật ấn tượng.", "syn": [], "cefr": "C1", "ref": "note:1788603785889"}, {"id": "0c3a543dfeaba3d1", "front": "regard", "pos": "verb", "ipa": "", "vi": "ngắm nhìn, xem xét, coi như", "en": "", "ex": "Standing atop the ridge, the poet paused to regard the steep and lofty cliffs rising above the valley.", "exvi": "Đứng trên đỉnh núi, nhà thơ dừng bước để ngắm nhìn những vách đá dốc đứng và cao vút nhô lên phía trên thung lũng.", "syn": [], "cefr": "B2", "ref": "note:1788603785891"}, {"id": "1a55375ca98d1b08", "front": "appease", "pos": "verb", "ipa": "", "vi": "xoa dịu, nhân nhượng", "en": "", "ex": "The management's attempts to appease the striking workers with a small pay raise were unsuccessful.", "exvi": "Những nỗ lực của ban quản lý nhằm xoa dịu các công nhân đình công bằng một khoản tăng lương nhỏ đã không thành công.", "syn": [], "cefr": "C1", "ref": "note:1788603785893"}, {"id": "75dbd62827494797", "front": "evince", "pos": "verb", "ipa": "", "vi": "bày tỏ, biểu lộ", "en": "", "ex": "Despite the pressure, she evinced a remarkable calmness.", "exvi": "Bất chấp áp lực, cô ấy đã biểu lộ một sự bình tĩnh đáng nể.", "syn": [], "cefr": "C1", "ref": "note:1788603785895"}, {"id": "43e51bf55c25d66a", "front": "thwart", "pos": "verb", "ipa": "", "vi": "cản trở, làm thất bại", "en": "", "ex": "Her ambition to become a painter was thwarted by a lack of money.", "exvi": "Tham vọng trở thành họa sĩ của cô đã bị cản trở bởi việc thiếu tiền.", "syn": [], "cefr": "C1", "ref": "note:1788603785897"}, {"id": "bc20786ef84150da", "front": "austere", "pos": "adjective", "ipa": "", "vi": "khắc khổ, mộc mạc", "en": "", "ex": "The monks lived an austere life, with few possessions and a simple diet of rice and vegetables.", "exvi": "Các nhà sư sống một cuộc đời khắc khổ, với ít tài sản và chế độ ăn uống đơn giản gồm cơm và rau củ.", "syn": [], "cefr": "C1", "ref": "note:1788603785899"}, {"id": "f9c9810b8b83cd4e", "front": "compulsory", "pos": "adjective", "ipa": "", "vi": "bắt buộc", "en": "", "ex": "In many countries, secondary education is compulsory for all children up to the age of sixteen.", "exvi": "Ở nhiều quốc gia, giáo dục trung học là bắt buộc đối với tất cả trẻ em đến mười sáu tuổi.", "syn": [], "cefr": "B2", "ref": "note:1788603785901"}, {"id": "4b3ce796dc01110d", "front": "catalyze", "pos": "verb", "ipa": "", "vi": "xúc tác, gây ra", "en": "", "ex": "The president's speech catalyzed a wave of protests across the country.", "exvi": "Bài phát biểu của tổng thống đã châm ngòi cho một làn sóng biểu tình trên khắp cả nước.", "syn": [], "cefr": "C1", "ref": "note:1788603785903"}, {"id": "1096fc627ec5706b", "front": "coalesce", "pos": "verb", "ipa": "", "vi": "hợp nhất, kết lại", "en": "", "ex": "The different protest groups coalesced into a single, powerful movement to demand change.", "exvi": "Các nhóm biểu tình khác nhau đã hợp nhất thành một phong trào mạnh mẽ duy nhất để đòi hỏi sự thay đổi.", "syn": [], "cefr": "C1", "ref": "note:1788603785905"}, {"id": "901543b642713f00", "front": "discriminating", "pos": "adjective", "ipa": "", "vi": "tinh tế, sành sỏi", "en": "", "ex": "She is a discriminating reader, preferring dense literary fiction over popular thrillers.", "exvi": "Cô ấy là một độc giả tinh tế, thích tiểu thuyết văn học sâu sắc hơn là các truyện giật gân phổ thông.", "syn": [], "cefr": "C1", "ref": "note:1788603785907"}, {"id": "1a9d50567d115b0f", "front": "imminent", "pos": "adjective", "ipa": "", "vi": "sắp xảy ra, sắp đến", "en": "", "ex": "The dark clouds and strong winds signaled an imminent storm.", "exvi": "Những đám mây đen và gió mạnh báo hiệu một cơn bão sắp ập đến.", "syn": [], "cefr": "C1", "ref": "note:1788603785909"}, {"id": "4f2105ba763a4a68", "front": "reputation for", "pos": "phrase", "ipa": "", "vi": "danh tiếng về, nổi tiếng về", "en": "", "ex": "Peter Edwards earned a distinguished reputation for painting striking portraits of prominent cultural figures.", "exvi": "Peter Edwards đã tạo dựng được danh tiếng xuất sắc về việc vẽ những bức chân dung nổi bật của các nhân vật văn hóa lỗi lạc.", "syn": [], "cefr": "B2", "ref": "note:1788603785911"}, {"id": "9a5bb20c96b48e1a", "front": "innocuous", "pos": "adjective", "ipa": "", "vi": "vô hại, không có ác ý", "en": "", "ex": "What seemed like an innocuous question was actually designed to trick him into revealing the secret.", "exvi": "Tưởng chừng là một câu hỏi vô hại, nhưng nó thực chất được sắp đặt để lừa anh ta tiết lộ bí mật.", "syn": [], "cefr": "C1", "ref": "note:1788603785913"}, {"id": "ec283bc856641eb6", "front": "intractable", "pos": "adjective", "ipa": "", "vi": "khó giải quyết, cứng đầu", "en": "", "ex": "The company faced an intractable problem of declining sales that no strategy seemed to solve.", "exvi": "Công ty phải đối mặt với một vấn đề khó giải quyết về doanh số sụt giảm mà không chiến lược nào có vẻ giải quyết được.", "syn": [], "cefr": "C2", "ref": "note:1788603785915"}, {"id": "ab12e5a3a4419e7c", "front": "intransigent", "pos": "adjective", "ipa": "", "vi": "ngoan cố, không khoan nhượng", "en": "", "ex": "Because the politician was intransigent, the two parties could not reach a compromise on the bill.", "exvi": "Vì chính trị gia này rất ngoan cố, hai đảng đã không thể đạt được thỏa hiệp về dự luật.", "syn": [], "cefr": "C2", "ref": "note:1788603785917"}, {"id": "fde7868d55e199df", "front": "myriad", "pos": "adjective, noun", "ipa": "", "vi": "vô số, hằng hà sa số", "en": "", "ex": "The old library contained a myriad of books on ancient history and forgotten arts.", "exvi": "Thư viện cổ chứa đựng vô số sách về lịch sử cổ đại và những nghệ thuật bị lãng quên.", "syn": [], "cefr": "C1", "ref": "note:1788603785919"}, {"id": "1e0126bbd1f8d9ba", "front": "nurture", "pos": "verb", "ipa": "", "vi": "nuôi dưỡng, bồi dưỡng, ươm mầm", "en": "", "ex": "By linking regional entrepreneurs with seasoned investors, local exchanges help nurture developing small businesses.", "exvi": "Bằng cách liên kết các doanh nhân khu vực với các nhà đầu tư dày dạn kinh nghiệm, các sàn giao dịch địa phương giúp nuôi dưỡng các doanh nghiệp nhỏ đang phát triển.", "syn": [], "cefr": "B2", "ref": "note:1788603785921"}, {"id": "ee7d689f85771e12", "front": "resurgence", "pos": "noun", "ipa": "", "vi": "sự trỗi dậy, sự hồi sinh", "en": "", "ex": "The 1990s have seen a resurgence in popularity, with baggy jeans and pop music making a comeback.", "exvi": "Thập niên 1990 đã chứng kiến sự trỗi dậy về mức độ phổ biến, với quần jeans rộng và nhạc pop quay trở lại.", "syn": [], "cefr": "C1", "ref": "note:1788603785923"}, {"id": "b5014eee2c193b4e", "front": "surmise", "pos": "verb", "ipa": "", "vi": "phỏng đoán, suy đoán", "en": "", "ex": "Based on the empty pizza boxes and the sleepy dog, I surmised that my roommates had a party last night without me.", "exvi": "Dựa vào những hộp pizza rỗng và con chó đang ngủ gà ngủ gật, tôi phỏng đoán rằng bạn cùng phòng của tôi đã tổ chức tiệc tối qua mà không có tôi.", "syn": [], "cefr": "C1", "ref": "note:1788603785925"}, {"id": "948e138058fd794a", "front": "unobtrusive", "pos": "adjective", "ipa": "", "vi": "khiêm tốn, không phô trương", "en": "", "ex": "The best waiters are unobtrusive, refilling your water glass without you even noticing.", "exvi": "Những người phục vụ giỏi nhất là những người kín đáo, họ rót đầy ly nước của bạn mà bạn không hề hay biết.", "syn": [], "cefr": "C1", "ref": "note:1788603785927"}, {"id": "379c1cd725c08cb1", "front": "acquiesced", "pos": "verb", "ipa": "", "vi": "bằng lòng, chấp nhận miễn cưỡng", "en": "", "ex": "Although she disagreed with the plan, she ultimately acquiesced to her boss's decision to avoid further conflict.", "exvi": "Mặc dù không đồng tình với kế hoạch, cuối cùng cô ấy đã chấp nhận quyết định của sếp để tránh xung đột thêm.", "syn": [], "cefr": "C2", "ref": "note:1788603785929"}, {"id": "9bcb1c292b2f939d", "front": "a consequence", "pos": "phrase", "ipa": "", "vi": "hậu quả, hệ quả, kết quả của", "en": "", "ex": "The discrepancy between aerial and aquatic animal velocities is largely a consequence of differing physical constraints in air versus water.", "exvi": "Sự chênh lệch giữa tốc độ của động vật trên không và dưới nước phần lớn là hệ quả của các hạn chế vật lý khác nhau trong không khí so với trong nước.", "syn": [], "cefr": "B2", "ref": "note:1788603785931"}, {"id": "44613566618429f5", "front": "endemic", "pos": "adjective", "ipa": "", "vi": "đặc hữu của một vùng, phổ biến ở một nơi cụ thể", "en": "", "ex": "The Komodo dragon is endemic to a few Indonesian islands.", "exvi": "Rồng Komodo là loài đặc hữu của một vài hòn đảo ở Indonesia.", "syn": [], "cefr": "C1", "ref": "note:1788603785933"}, {"id": "152d3a28084e579c", "front": "epitome", "pos": "noun", "ipa": "", "vi": "hình mẫu hoàn hảo, ví dụ tiêu biểu", "en": "", "ex": "With his unwavering integrity and dedication, the firefighter was the epitome of courage.", "exvi": "Với sự chính trực và cống hiến không lay chuyển, người lính cứu hỏa đó là hình mẫu tiêu biểu của lòng dũng cảm.", "syn": [], "cefr": "C2", "ref": "note:1788603785935"}, {"id": "b8e6c6d6bf151881", "front": "esoteric", "pos": "adjective", "ipa": "", "vi": "chuyên sâu, bí truyền", "en": "", "ex": "The philosophy professor's lecture was so esoteric that most of the students were completely lost.", "exvi": "Bài giảng của vị giáo sư triết học uyên thâm đến mức hầu hết sinh viên đều hoàn toàn không hiểu gì.", "syn": [], "cefr": "C2", "ref": "note:1788603785937"}, {"id": "4ee71c48a089743e", "front": "obfuscates", "pos": "verb", "ipa": "", "vi": "làm cho khó hiểu, che đậy", "en": "", "ex": "The politician's speech obfuscates the real issue by using complex jargon and irrelevant statistics.", "exvi": "Bài phát biểu của chính trị gia làm lu mờ vấn đề thực sự bằng cách sử dụng biệt ngữ phức tạp và các số liệu thống kê không liên quan.", "syn": [], "cefr": "C2", "ref": "note:1788603785939"}, {"id": "342d9298ab8e9700", "front": "contributions to", "pos": "phrase", "ipa": "", "vi": "những đóng góp cho", "en": "", "ex": "Claude Williams was honored with a National Heritage Fellowship for his invaluable lifetime contributions to jazz violin and guitar.", "exvi": "Claude Williams đã được vinh danh với Học bổng Di sản Quốc gia vì những đóng góp trọn đời vô giá của ông cho bộ môn vĩ cầm và guitar jazz.", "syn": [], "cefr": "B2", "ref": "note:1788603785941"}, {"id": "0af9f4ca98d73512", "front": "tantamount", "pos": "adjective phrase", "ipa": "", "vi": "tương đương với, ngang với", "en": "", "ex": "Her silence was tantamount to an admission of guilt.", "exvi": "Sự im lặng của cô ấy tương đương với một lời thú tội.", "syn": [], "cefr": "C2", "ref": "note:1788603785943"}, {"id": "9a7503946cfe595b", "front": "deference", "pos": "noun phrase", "ipa": "", "vi": "sự tôn trọng, sự tuân theo", "en": "", "ex": "In deference to the wishes of his elders, he agreed to attend the traditional ceremony.", "exvi": "Vì tôn trọng mong muốn của các bậc trưởng bối, anh ấy đã đồng ý tham dự buổi lễ truyền thống.", "syn": [], "cefr": "C1", "ref": "note:1788603785945"}, {"id": "c6ac8663ca669a95", "front": "exemplar", "pos": "noun", "ipa": "", "vi": "mẫu mực, tấm gương điển hình", "en": "", "ex": "The company's commitment to customer service is an exemplar for the entire industry.", "exvi": "Sự tận tâm với dịch vụ khách hàng của công ty là một tấm gương mẫu mực cho toàn ngành.", "syn": [], "cefr": "C1", "ref": "note:1788603785947"}, {"id": "1e3ba47aff32b767", "front": "harbinger", "pos": "noun", "ipa": "", "vi": "người báo hiệu, điềm báo", "en": "", "ex": "The robins are a sure harbinger of spring.", "exvi": "Những con chim cổ đỏ là điềm báo chắc chắn của mùa xuân.", "syn": [], "cefr": "C1", "ref": "note:1788603785949"}, {"id": "e68b90fe34974709", "front": "impact", "pos": "noun", "ipa": "", "vi": "tác động, ảnh hưởng mạnh mẽ", "en": "", "ex": "One reliable way to evaluate the impact of a scholar's research is to track citation counts in academic journals.", "exvi": "Một cách đáng tin cậy để đánh giá tầm ảnh hưởng từ nghiên cứu của một học giả là theo dõi số lượt trích dẫn trên các tạp chí học thuật.", "syn": [], "cefr": "B2", "ref": "note:1788603785951"}, {"id": "b2f0deb71db4423f", "front": "harbingers", "pos": "noun phrase", "ipa": "", "vi": "điềm báo, người báo hiệu", "en": "", "ex": "The unusually warm winter and the early bloom of flowers were seen by many as harbingers of a changing climate.", "exvi": "Mùa đông ấm áp bất thường và hoa nở sớm được nhiều người xem là điềm báo của một khí hậu đang thay đổi.", "syn": [], "cefr": "C1", "ref": "note:1788603785953"}, {"id": "f417f55990744a24", "front": "quintessential", "pos": "adjective", "ipa": "", "vi": "tinh túy nhất, điển hình nhất", "en": "", "ex": "For many, a slice of apple pie is the quintessential American dessert.", "exvi": "Đối với nhiều người, một miếng bánh táo là món tráng miệng tinh túy nhất của Mỹ.", "syn": [], "cefr": "C1", "ref": "note:1788603785955"}, {"id": "f9219fb5fc9bfeee", "front": "recalibrate", "pos": "verb", "ipa": "", "vi": "hiệu chỉnh lại, điều chỉnh lại", "en": "", "ex": "After the initial strategy failed, the company had to recalibrate its approach to the new market.", "exvi": "Sau khi chiến lược ban đầu thất bại, công ty đã phải điều chỉnh lại cách tiếp cận đối với thị trường mới.", "syn": [], "cefr": "C1", "ref": "note:1788603785957"}, {"id": "122c9fec9895c292", "front": "tangential", "pos": "adjective", "ipa": "", "vi": "lạc đề, ngoài lề", "en": "", "ex": "During the meeting about the budget, her comments about the office's new coffee machine were purely tangential.", "exvi": "Trong cuộc họp về ngân sách, những bình luận của cô ấy về chiếc máy pha cà phê mới của văn phòng hoàn toàn là ngoài lề.", "syn": [], "cefr": "C1", "ref": "note:1788603785959"}, {"id": "a41a3636e9d0469a", "front": "vary", "pos": "verb", "ipa": "", "vi": "thay đổi, khác nhau, biến đổi", "en": "", "ex": "The migratory patterns of wetland birds vary depending on regional temperature changes.", "exvi": "Tập tính di cư của các loài chim vùng đất ngập nước thay đổi tùy thuộc vào sự biến đổi nhiệt độ theo từng vùng.", "syn": [], "cefr": "B2", "ref": "note:1788603785961"}, {"id": "9f438101bd53750b", "front": "unadorned", "pos": "adjective", "ipa": "", "vi": "Mộc mạc, không trang trí", "en": "", "ex": "She preferred the unadorned beauty of the natural wood over the painted furniture.", "exvi": "Cô ấy thích vẻ đẹp mộc mạc của gỗ tự nhiên hơn là đồ nội thất được sơn phết.", "syn": [], "cefr": "C1", "ref": "note:1788603785963"}, {"id": "3e62f4a3dd0f04a8", "front": "austerity", "pos": "noun", "ipa": "", "vi": "sự khắc khổ, sự thắt lưng buộc bụng", "en": "", "ex": "The government imposed a period of austerity, cutting public spending to reduce national debt.", "exvi": "Chính phủ đã áp đặt một thời kỳ thắt lưng buộc bụng, cắt giảm chi tiêu công để giảm nợ quốc gia.", "syn": [], "cefr": "C1", "ref": "note:1788603785965"}]}, {"key": "anki_starter-set15", "title": "Flashcard SAT Starter Set 15", "deck": "anki_starter", "count": 50, "cards": [{"id": "a6656d012f728d14", "front": "trite", "pos": "adjective", "ipa": "", "vi": "cũ rích và sáo rỗng, thiếu độc đáo", "en": "", "ex": "His speech was filled with trite clichés about the importance of hard work.", "exvi": "Bài phát biểu của anh ấy toàn những lời sáo rỗng cũ rích về tầm quan trọng của sự chăm chỉ.", "syn": [], "cefr": "C1", "ref": "note:1788603785967"}, {"id": "b5e21fbac2b9e9ed", "front": "plethora", "pos": "noun", "ipa": "", "vi": "sự thừa thãi, số lượng quá nhiều", "en": "", "ex": "The city offers a plethora of attractions for tourists.", "exvi": "Thành phố có vô số điểm tham quan cho khách du lịch.", "syn": [], "cefr": "C1", "ref": "note:1788603785969"}, {"id": "170c19e9b7d1414b", "front": "instruct", "pos": "verb", "ipa": "", "vi": "hướng dẫn, chỉ dẫn, ra lệnh", "en": "", "ex": "The experienced technician took time to instruct the junior staff on delicate safety procedures.", "exvi": "Kỹ thuật viên giàu kinh nghiệm đã dành thời gian để hướng dẫn các nhân viên cấp dưới về các quy trình an toàn chuẩn xác.", "syn": [], "cefr": "B2", "ref": "note:1788603785971"}, {"id": "0745534f0ddb847e", "front": "concurrently", "pos": "adverb", "ipa": "", "vi": "đồng thời, cùng một lúc", "en": "", "ex": "The company announced it would be laying off 200 workers while concurrently hiring for 50 new positions in a different department.", "exvi": "Công ty thông báo họ sẽ sa thải 200 công nhân, đồng thời tuyển dụng 50 vị trí mới ở một bộ phận khác.", "syn": [], "cefr": "C1", "ref": "note:1788603785973"}, {"id": "89109578b1c4e7b6", "front": "consequential", "pos": "adjective", "ipa": "", "vi": "quan trọng, có ảnh hưởng lớn", "en": "", "ex": "The Supreme Court's ruling on the new law was a highly consequential decision for the country's future.", "exvi": "Phán quyết của Tòa án Tối cao về luật mới là một quyết định có ảnh hưởng lớn đến tương lai của đất nước.", "syn": [], "cefr": "C1", "ref": "note:1788603785975"}, {"id": "bd2e0810bd446f57", "front": "convoluted", "pos": "adjective", "ipa": "", "vi": "phức tạp, rắc rối", "en": "", "ex": "The movie's plot was so convoluted that by the end I couldn't tell who the villain was.", "exvi": "Cốt truyện của bộ phim quá rắc rối đến nỗi xem xong tôi không thể biết ai là nhân vật phản diện.", "syn": [], "cefr": "C1", "ref": "note:1788603785977"}, {"id": "6b042427228ae523", "front": "facile", "pos": "adjective", "ipa": "", "vi": "dễ dãi, hời hợt", "en": "", "ex": "His facile solution to the complex problem was quickly dismissed by the experts.", "exvi": "Giải pháp quá dễ dãi của anh ta cho vấn đề phức tạp đã nhanh chóng bị các chuyên gia bác bỏ.", "syn": [], "cefr": "C1", "ref": "note:1788603785979"}, {"id": "c04849e65926ea58", "front": "steer", "pos": "verb", "ipa": "", "vi": "dẫn lối, điều hướng, lái", "en": "", "ex": "Guiding himself by the faint sound, he managed to steer his way through the darkening woods.", "exvi": "Tự định hướng bằng âm thanh yếu ớt, chú chuột đã khéo léo dẫn lối bản thân vượt qua khu rừng đang dần tối sầm lại.", "syn": [], "cefr": "B2", "ref": "note:1788603785981"}, {"id": "59bd34041021b9d6", "front": "demarcated", "pos": "adjective", "ipa": "", "vi": "được phân định, được vạch rõ ranh giới", "en": "", "ex": "The treaty clearly demarcated the border between the two countries, preventing future disputes.", "exvi": "Hiệp ước đã phân định rõ ràng biên giới giữa hai quốc gia, ngăn chặn các tranh chấp trong tương lai.", "syn": [], "cefr": "C1", "ref": "note:1788603785983"}, {"id": "80b0d0a803356f2c", "front": "decouple", "pos": "verb", "ipa": "", "vi": "Tách rời, chia tách, cắt đứt mối liên kết hoặc làm cho hai yếu tố không còn phụ thuộc lẫn nhau", "en": "", "ex": "In an effort to foster sustainable development, environmental economists emphasize the urgent need to decouple gross domestic product growth from fossil fuel consumption.", "exvi": "Trong nỗ lực thúc đẩy phát triển bền vững, các nhà kinh tế học môi trường nhấn mạnh sự cần thiết cấp bách của việc tách rời tăng trưởng tổng sản phẩm quốc nội khỏi việc tiêu thụ nhiên liệu hóa thạch.", "syn": [], "cefr": "C1", "ref": "note:1788603785985"}, {"id": "d9e3065b9cb78f92", "front": "semblance", "pos": "noun", "ipa": "", "vi": "vẻ bề ngoài, sự giống nhau", "en": "", "ex": "The city had returned to some semblance of normality after the hurricane.", "exvi": "Thành phố đã trở lại vẻ bình thường nào đó sau cơn bão.", "syn": [], "cefr": "C1", "ref": "note:1788603785987"}, {"id": "99e0a999a3c6f0c2", "front": "inadvertent", "pos": "adjective", "ipa": "", "vi": "không cố ý, vô tình", "en": "", "ex": "His inadvertent disclosure of the party's theme spoiled the surprise for the birthday girl.", "exvi": "Việc anh ấy vô tình tiết lộ chủ đề của bữa tiệc đã phá hỏng sự bất ngờ dành cho cô gái sinh nhật.", "syn": [], "cefr": "C1", "ref": "note:1788603785989"}, {"id": "a8a5954b22c2a099", "front": "adapt", "pos": "verb", "ipa": "", "vi": "thích nghi, điều chỉnh cho phù hợp", "en": "", "ex": "Desert vegetation must adapt to severe drought conditions by developing moisture-retaining tissues.", "exvi": "Thực vật sa mạc phải thích nghi với điều kiện hạn hán khắc nghiệt bằng cách phát triển các mô giữ ẩm.", "syn": [], "cefr": "B2", "ref": "note:1788603785991"}, {"id": "937ee1daea08c6cd", "front": "insular", "pos": "adjective", "ipa": "", "vi": "hẹp hòi, thiển cận", "en": "", "ex": "The community's insular nature made it difficult for outsiders to be accepted.", "exvi": "Bản tính khép kín của cộng đồng khiến người ngoài khó được chấp nhận.", "syn": [], "cefr": "C1", "ref": "note:1788603785993"}, {"id": "ae9b93b520ce3dab", "front": "jettison", "pos": "verb", "ipa": "", "vi": "vứt bỏ, loại bỏ", "en": "", "ex": "To stay competitive, the company had to jettison its less profitable product lines.", "exvi": "Để duy trì khả năng cạnh tranh, công ty đã phải loại bỏ những dòng sản phẩm kém lợi nhuận hơn.", "syn": [], "cefr": "C1", "ref": "note:1788603785995"}, {"id": "ccdd4563942f9db5", "front": "languid", "pos": "adjective", "ipa": "", "vi": "Uể oải, thiếu sinh lực; Chậm chạp, lờ đờ", "en": "", "ex": "The hot afternoon made us feel languid and unwilling to move.", "exvi": "Buổi chiều nóng nực khiến chúng tôi cảm thấy uể oải và không muốn cử động.", "syn": [], "cefr": "C1", "ref": "note:1788603785997"}, {"id": "acc44f58bf26d9da", "front": "ostentatious", "pos": "adjective", "ipa": "", "vi": "phô trương, khoe khoang", "en": "", "ex": "He bought an ostentatious sports car, painted gold, to show off his new wealth.", "exvi": "Anh ta đã mua một chiếc xe thể thao phô trương, sơn màu vàng, để khoe khoang sự giàu có mới của mình.", "syn": [], "cefr": "C1", "ref": "note:1788603785999"}, {"id": "037077fb42c5c0dd", "front": "guarantee", "pos": "verb", "ipa": "", "vi": "bảo đảm, cam kết chắc chắn", "en": "", "ex": "Thorough experimental preparation does not guarantee success, but it noticeably mitigates risk.", "exvi": "Sự chuẩn bị thí nghiệm kỹ lưỡng không thể bảo đảm thành công, nhưng nó giảm thiểu rủi ro một cách rõ rệt.", "syn": [], "cefr": "B2", "ref": "note:1788603786001"}, {"id": "d1eaa383d4b34b3d", "front": "onerous", "pos": "adjective", "ipa": "", "vi": "nặng nề, khó nhọc; tốn nhiều công sức", "en": "", "ex": "He found his duties as a manager increasingly onerous.", "exvi": "Anh ấy thấy nhiệm vụ quản lý của mình ngày càng nặng nề.", "syn": [], "cefr": "C1", "ref": "note:1788603786003"}, {"id": "33f03805c826aeff", "front": "myopic", "pos": "adjective", "ipa": "", "vi": "Thiển cận, tầm nhìn hạn hẹp", "en": "", "ex": "The company's myopic focus on short-term profits led to its eventual failure.", "exvi": "Sự tập trung thiển cận của công ty vào lợi nhuận ngắn hạn đã dẫn đến thất bại cuối cùng của nó.", "syn": [], "cefr": "C1", "ref": "note:1788603786005"}, {"id": "17b070e58b194df5", "front": "penchant", "pos": "noun", "ipa": "", "vi": "sự yêu thích mãnh liệt, thiên hướng", "en": "", "ex": "He has a penchant for collecting rare stamps, spending his weekends searching for them in antique shops.", "exvi": "Anh ấy có thiên hướng sưu tập những con tem quý hiếm, dành những ngày cuối tuần của mình để tìm kiếm chúng trong các cửa hàng đồ cổ.", "syn": [], "cefr": "C1", "ref": "note:1788603786007"}, {"id": "85e630ba43b935ea", "front": "placate", "pos": "verb", "ipa": "", "vi": "làm nguôi giận, xoa dịu", "en": "", "ex": "The company tried to placate the angry protestors by promising to review its environmental policies.", "exvi": "Công ty đã cố gắng xoa dịu những người biểu tình tức giận bằng cách hứa sẽ xem xét lại các chính sách môi trường của mình.", "syn": [], "cefr": "C1", "ref": "note:1788603786009"}, {"id": "eb7ab0a493f47ebf", "front": "substitute", "pos": "verb", "ipa": "", "vi": "thay thế", "en": "", "ex": "When primary food resources decline, opportunistic predators often substitute berries and roots for small rodents.", "exvi": "Khi nguồn thức ăn chính sụt giảm, những động vật ăn thịt cơ hội thường dùng quả mọng và rễ cây để thay thế cho các loài gặm nhấm nhỏ.", "syn": [], "cefr": "B2", "ref": "note:1788603786011"}, {"id": "6eabf84e2b694858", "front": "reprehensible", "pos": "adjective", "ipa": "", "vi": "đáng bị chỉ trích, đáng chê trách", "en": "", "ex": "The company's reprehensible decision to dump toxic waste into the river sparked public outrage.", "exvi": "Quyết định đáng bị chỉ trích của công ty khi xả chất thải độc hại ra sông đã gây ra sự phẫn nộ trong dư luận.", "syn": [], "cefr": "C1", "ref": "note:1788603786013"}, {"id": "f32643b33fb63640", "front": "restive", "pos": "adjective", "ipa": "", "vi": "bồn chồn không yên, khó kiểm soát", "en": "", "ex": "The audience grew restive as they waited for the delayed concert to start.", "exvi": "Khán giả trở nên bồn chồn trong lúc chờ đợi buổi hòa nhạc bị trì hoãn bắt đầu.", "syn": [], "cefr": "C1", "ref": "note:1788603786015"}, {"id": "09c5357c0b210137", "front": "categorical", "pos": "adjective", "ipa": "", "vi": "dứt khoát, không có điều kiện; tuyệt đối, không có ngoại lệ", "en": "", "ex": "The company issued a categorical denial of any wrongdoing.", "exvi": "Công ty đã đưa ra lời phủ nhận dứt khoát về mọi hành vi sai trái.", "syn": [], "cefr": "C1", "ref": "note:1788603786017"}, {"id": "45a3125376dcb538", "front": "predicated", "pos": "verb", "ipa": "", "vi": "dựa trên một sự thật hoặc ý tưởng, khẳng định điều gì là đúng", "en": "", "ex": "The company's entire marketing strategy was predicated on the assumption that young consumers prefer digital content.", "exvi": "Toàn bộ chiến lược marketing của công ty được dựa trên giả định rằng người tiêu dùng trẻ tuổi ưa thích nội dung số.", "syn": [], "cefr": "C1", "ref": "note:1788603786019"}, {"id": "9eced31b5f15745a", "front": "consistency", "pos": "noun", "ipa": "", "vi": "tính nhất quán, sự kiên định", "en": "", "ex": "Scholars emphasize the thematic consistency of Hawaiian literature across different generations of storytellers.", "exvi": "Các học giả nhấn mạnh tính nhất quán về mặt chủ đề của nền văn học Hawaii xuyên suốt các thế hệ người kể chuyện khác nhau.", "syn": [], "cefr": "B2", "ref": "note:1788603786021"}, {"id": "9e28eea3f522e39e", "front": "attested", "pos": "adjective", "ipa": "", "vi": "được chứng thực, được xác nhận", "en": "", "ex": "The earliest attested use of the word dates back to the 14th century.", "exvi": "Việc sử dụng từ này được chứng thực sớm nhất là từ thế kỷ 14.", "syn": [], "cefr": "C1", "ref": "note:1788603786023"}, {"id": "b2ece720a5d69086", "front": "unscrupulous", "pos": "adjective", "ipa": "", "vi": "vô đạo đức, không trung thực", "en": "", "ex": "The unscrupulous developer bribed officials to get his building plans approved, ignoring safety regulations.", "exvi": "Nhà phát triển bất lương đã hối lộ các quan chức để được phê duyệt kế hoạch xây dựng của mình, phớt lờ các quy định an toàn.", "syn": [], "cefr": "C1", "ref": "note:1788603786025"}, {"id": "305b0e5ba11e6e65", "front": "alluded", "pos": "verb", "ipa": "", "vi": "ám chỉ, nói bóng gió", "en": "", "ex": "In his speech, the CEO alluded to the upcoming layoffs without explicitly mentioning them.", "exvi": "Trong bài phát biểu của mình, vị CEO đã ám chỉ về đợt sa thải sắp tới mà không đề cập trực tiếp.", "syn": [], "cefr": "C1", "ref": "note:1788603786027"}, {"id": "d38e01809e50daad", "front": "antithesis", "pos": "noun", "ipa": "", "vi": "sự đối lập, điều hoàn toàn trái ngược", "en": "", "ex": "Her quiet, thoughtful nature was the antithesis of her brother's loud and impulsive personality.", "exvi": "Bản tính trầm lặng, sâu sắc của cô là sự đối lập hoàn toàn với tính cách ồn ào và bốc đồng của anh trai cô.", "syn": [], "cefr": "C1", "ref": "note:1788603786029"}, {"id": "32ed31937a52ea56", "front": "concealed from", "pos": "adjective phrase", "ipa": "", "vi": "bị giấu kín, bị che khuất khỏi", "en": "", "ex": "The cave entrance was concealed from passersby by thick curtains of hanging vines.", "exvi": "Cửa hang đã bị che khuất khỏi tầm mắt của người qua lại bởi những tấm rèm dây leo rậm rạp.", "syn": [], "cefr": "B2", "ref": "note:1788603786031"}, {"id": "6f40c981ac2adfe5", "front": "arduous", "pos": "adjective", "ipa": "", "vi": "khó khăn, gian khổ", "en": "", "ex": "Climbing Mount Everest is an arduous journey that tests both physical and mental endurance.", "exvi": "Leo núi Everest là một hành trình gian khổ, thử thách cả sức bền thể chất lẫn tinh thần.", "syn": [], "cefr": "C1", "ref": "note:1788603786033"}, {"id": "7b38a5a8a8f7a685", "front": "cursory", "pos": "adjective", "ipa": "", "vi": "vội vàng, sơ sài", "en": "", "ex": "The detective gave the crime scene only a cursory glance, missing the crucial clue hidden under the rug.", "exvi": "Viên thám tử chỉ liếc qua hiện trường một cách sơ sài, bỏ lỡ manh mối quan trọng giấu dưới tấm thảm.", "syn": [], "cefr": "C1", "ref": "note:1788603786035"}, {"id": "a7d865f43218263a", "front": "curtail", "pos": "verb", "ipa": "", "vi": "cắt bớt, rút ngắn", "en": "", "ex": "The company had to curtail its spending on travel to stay within budget.", "exvi": "Công ty đã phải cắt giảm chi tiêu cho việc đi lại để không vượt quá ngân sách.", "syn": [], "cefr": "C1", "ref": "note:1788603786037"}, {"id": "b73565351eae0209", "front": "decried", "pos": "verb", "ipa": "", "vi": "công khai chỉ trích, lên án", "en": "", "ex": "The activist decried the company's harmful environmental practices in front of the media.", "exvi": "Nhà hoạt động đã công khai chỉ trích các hoạt động gây hại cho môi trường của công ty trước giới truyền thông.", "syn": [], "cefr": "C1", "ref": "note:1788603786039"}, {"id": "ac1dd2fc3bfa5859", "front": "applicable to", "pos": "adjective phrase", "ipa": "", "vi": "thích hợp cho, có thể áp dụng đối với", "en": "", "ex": "Factors driving past animal extinctions may be directly applicable to modern conservation policies.", "exvi": "Các nhân tố dẫn đến sự tuyệt chủng của động vật trong quá khứ có thể áp dụng trực tiếp cho các chính sách bảo tồn ngày nay.", "syn": [], "cefr": "B2", "ref": "note:1788603786041"}, {"id": "e768075885afc484", "front": "dispel", "pos": "verb", "ipa": "", "vi": "xua tan, làm tan biến", "en": "", "ex": "The government's official statement helped to dispel the rumors about a potential lockdown.", "exvi": "Tuyên bố chính thức của chính phủ đã giúp xua tan tin đồn về khả năng phong tỏa.", "syn": [], "cefr": "C1", "ref": "note:1788603786043"}, {"id": "a0474b189b57f971", "front": "dissonance", "pos": "noun", "ipa": "", "vi": "sự bất hòa, sự không thống nhất", "en": "", "ex": "She felt a sense of cognitive dissonance when her actions contradicted her strong moral beliefs.", "exvi": "Cô cảm thấy một sự bất hòa về nhận thức khi hành động của mình mâu thuẫn với niềm tin đạo đức mạnh mẽ của mình.", "syn": [], "cefr": "C1", "ref": "note:1788603786045"}, {"id": "acd7eb2f092aa9bf", "front": "ebb", "pos": "verb", "ipa": "", "vi": "rút đi, suy yếu", "en": "", "ex": "After the initial excitement, his enthusiasm for the project began to ebb.", "exvi": "Sau sự hào hứng ban đầu, nhiệt huyết của anh ấy cho dự án bắt đầu suy giảm.", "syn": [], "cefr": "C1", "ref": "note:1788603786047"}, {"id": "05a9aa577ed0265e", "front": "emblematic", "pos": "adjective phrase", "ipa": "", "vi": "tượng trưng cho, là biểu tượng của", "en": "", "ex": "The crumbling public library was emblematic of the city's neglect of its cultural institutions.", "exvi": "Thư viện công cộng đổ nát là biểu tượng cho sự thờ ơ của thành phố đối với các thiết chế văn hóa của mình.", "syn": [], "cefr": "C1", "ref": "note:1788603786049"}, {"id": "7a4b625dadab9328", "front": "integrated with", "pos": "adjective phrase", "ipa": "", "vi": "được hòa nhập với, được tích hợp cùng", "en": "", "ex": "Traditional cultural values were smoothly integrated with modern educational curriculum across schools.", "exvi": "Các giá trị văn hóa truyền thống đã được tích hợp nhịp nhàng với chương trình giáo dục hiện đại tại các trường học.", "syn": [], "cefr": "B2", "ref": "note:1788603786051"}, {"id": "e93115cb4cc058b0", "front": "encapsulate", "pos": "verb", "ipa": "", "vi": "tóm gọn, gói gọn", "en": "", "ex": "The final chapter of the book encapsulates the main arguments presented throughout the text.", "exvi": "Chương cuối cùng của cuốn sách tóm gọn lại những luận điểm chính được trình bày trong toàn bộ văn bản.", "syn": [], "cefr": "C1", "ref": "note:1788603786053"}, {"id": "cf1a69caa0716da1", "front": "extolling", "pos": "verb", "ipa": "", "vi": "tán dương, ca tụng", "en": "", "ex": "The critic wrote a glowing review, extolling the movie's brilliant script and breathtaking cinematography.", "exvi": "Nhà phê bình đã viết một bài đánh giá xuất sắc, tán dương kịch bản tài tình và kỹ thuật quay phim ngoạn mục của bộ phim.", "syn": [], "cefr": "C1", "ref": "note:1788603786055"}, {"id": "1e5e06c7c0a19ecd", "front": "hierarchy", "pos": "noun phrase", "ipa": "", "vi": "hệ thống cấp bậc trong, thứ bậc giữa", "en": "", "ex": "The study revealed a clear social hierarchy among the chimpanzees, with the alpha male at the top.", "exvi": "Nghiên cứu đã tiết lộ một hệ thống cấp bậc xã hội rõ ràng giữa những con tinh tinh, với con đực đầu đàn ở vị trí cao nhất.", "syn": [], "cefr": "C1", "ref": "note:1788603786057"}, {"id": "75dd60d80ae51699", "front": "implicate", "pos": "verb", "ipa": "", "vi": "làm cho dính líu, ngụ ý", "en": "", "ex": "The fingerprints found at the scene directly implicate the suspect in the theft.", "exvi": "Dấu vân tay tìm thấy tại hiện trường trực tiếp cho thấy nghi phạm có dính líu đến vụ trộm.", "syn": [], "cefr": "C1", "ref": "note:1788603786059"}, {"id": "316e58a00777f65f", "front": "reception of", "pos": "noun phrase", "ipa": "", "vi": "sự đón nhận đối với", "en": "", "ex": "The critical reception of the debut novel was overwhelmingly warm, leading to numerous honors.", "exvi": "Sự đón nhận của giới phê bình đối với cuốn tiểu thuyết đầu tay cực kỳ nồng hậu, mang lại vô số giải thưởng danh giá.", "syn": [], "cefr": "B2", "ref": "note:1788603786061"}, {"id": "7c5e9acafe28f3c4", "front": "incompatibilities", "pos": "noun", "ipa": "", "vi": "sự không tương thích, sự xung khắc", "en": "", "ex": "Their frequent arguments stemmed from fundamental incompatibilities in their personalities.", "exvi": "Những cuộc tranh cãi thường xuyên của họ bắt nguồn từ những sự không tương thích cơ bản trong tính cách.", "syn": [], "cefr": "C1", "ref": "note:1788603786063"}, {"id": "a64deca19b7211c5", "front": "indeterminate", "pos": "adjective", "ipa": "", "vi": "không xác định, mơ hồ", "en": "", "ex": "The exact date of their wedding remains indeterminate.", "exvi": "Ngày cưới chính xác của họ vẫn chưa được xác định.", "syn": [], "cefr": "C1", "ref": "note:1788603786065"}]}, {"key": "anki_starter-set16", "title": "Flashcard SAT Starter Set 16", "deck": "anki_starter", "count": 50, "cards": [{"id": "359fedd1fea2e79c", "front": "indisputable", "pos": "adjective", "ipa": "", "vi": "không thể chối cãi, không thể bàn cãi", "en": "", "ex": "The overwhelming evidence made his guilt indisputable.", "exvi": "Bằng chứng quá rõ ràng khiến tội của anh ta là không thể chối cãi.", "syn": [], "cefr": "C1", "ref": "note:1788603786067"}, {"id": "b5f2adda247be449", "front": "infeasible", "pos": "adjective", "ipa": "", "vi": "không thể thực hiện được, bất khả thi", "en": "", "ex": "The CEO's plan to build a theme park on the moon was deemed financially infeasible by the board.", "exvi": "Kế hoạch của CEO xây dựng một công viên giải trí trên mặt trăng đã bị hội đồng quản trị cho là bất khả thi về mặt tài chính.", "syn": [], "cefr": "C1", "ref": "note:1788603786069"}, {"id": "0a6925a9d5ca4a61", "front": "misunderstood", "pos": "adjective", "ipa": "", "vi": "bị hiểu nhầm, không được đánh giá đúng", "en": "", "ex": "For years the experimental painting was misunderstood by critics who overlooked its profound emotional depth.", "exvi": "Trong nhiều năm, bức tranh thể nghiệm đã bị hiểu nhầm bởi những nhà phê bình không nhận thấy chiều sâu cảm xúc sâu sắc của nó.", "syn": [], "cefr": "B2", "ref": "note:1788603786071"}, {"id": "c48b302bd3959ebc", "front": "latitude", "pos": "noun", "ipa": "", "vi": "sự tự do hành động, phạm vi rộng rãi", "en": "", "ex": "The new company policy gives managers more latitude in hiring decisions.", "exvi": "Chính sách mới của công ty cho phép các nhà quản lý có nhiều tự do hơn trong các quyết định tuyển dụng.", "syn": [], "cefr": "C1", "ref": "note:1788603786073"}, {"id": "38e70af2effdcef0", "front": "legitimize", "pos": "verb", "ipa": "", "vi": "hợp pháp hóa, chính thức hóa", "en": "", "ex": "The government passed a law to legitimize the use of certain alternative medicines.", "exvi": "Chính phủ đã thông qua một đạo luật để hợp pháp hóa việc sử dụng một số loại thuốc thay thế.", "syn": [], "cefr": "C1", "ref": "note:1788603786075"}, {"id": "81cbddb698e5c1ff", "front": "misconstrued as", "pos": "phrasal verb", "ipa": "", "vi": "hiểu sai là, giải thích sai là", "en": "", "ex": "Her friendly wave was misconstrued as a romantic gesture, which made the situation awkward.", "exvi": "Cái vẫy tay thân thiện của cô đã bị hiểu sai là một cử chỉ lãng mạn, điều này khiến tình huống trở nên khó xử.", "syn": [], "cefr": "C1", "ref": "note:1788603786077"}, {"id": "77c0ba3f99af3212", "front": "obviate", "pos": "verb", "ipa": "", "vi": "loại bỏ, ngăn ngừa", "en": "", "ex": "The new system is designed to obviate the need for manual data entry.", "exvi": "Hệ thống mới được thiết kế để loại bỏ sự cần thiết của việc nhập dữ liệu thủ công.", "syn": [], "cefr": "C1", "ref": "note:1788603786079"}, {"id": "b3b7d6953e9ef7d8", "front": "applaud", "pos": "verb", "ipa": "", "vi": "tán thưởng, ca ngợi nhiệt liệt", "en": "", "ex": "Reviewers applaud the young novelist for conveying historical hardship with delicate nuance.", "exvi": "Các nhà phê bình ca ngợi nhiệt liệt cây bút trẻ vì đã truyền tải những gian truân lịch sử với sắc thái đầy tinh tế.", "syn": [], "cefr": "B2", "ref": "note:1788603786081"}, {"id": "ce458f86d98e637d", "front": "oscillated", "pos": "verb", "ipa": "", "vi": "dao động, lưỡng lự", "en": "", "ex": "Her mood oscillated between hope and despair as she awaited the test results.", "exvi": "Tâm trạng của cô ấy dao động giữa hy vọng và tuyệt vọng trong lúc chờ đợi kết quả bài thi.", "syn": [], "cefr": "C1", "ref": "note:1788603786083"}, {"id": "d8796193a35e6b1d", "front": "outstrip", "pos": "verb", "ipa": "", "vi": "vượt qua, bỏ xa", "en": "", "ex": "The company's rapid growth allowed its profits to outstrip those of its main competitors.", "exvi": "Sự tăng trưởng nhanh chóng của công ty đã giúp lợi nhuận của nó vượt xa các đối thủ cạnh tranh chính.", "syn": [], "cefr": "C1", "ref": "note:1788603786085"}, {"id": "0aeb696e33a4cf74", "front": "partiality", "pos": "noun", "ipa": "", "vi": "sự thiên vị, sự không công bằng", "en": "", "ex": "The judge was accused of partiality after his son was acquitted of all charges.", "exvi": "Vị thẩm phán bị buộc tội thiên vị sau khi con trai ông được tuyên trắng án mọi tội danh.", "syn": [], "cefr": "C1", "ref": "note:1788603786087"}, {"id": "e50943eb016a6d89", "front": "pervasiveness", "pos": "noun", "ipa": "", "vi": "sự lan tỏa, sự phổ biến rộng khắp", "en": "", "ex": "The pervasiveness of smartphones has fundamentally changed how people interact with the world.", "exvi": "Sự phổ biến rộng khắp của điện thoại thông minh đã thay đổi một cách cơ bản cách mọi người tương tác với thế giới.", "syn": [], "cefr": "C1", "ref": "note:1788603786089"}, {"id": "aeefe08cc232cdc1", "front": "immense", "pos": "adjective", "ipa": "", "vi": "bao la, to lớn khổng lồ", "en": "", "ex": "Spanning two vast continents, the linguistic diversity among Indigenous populations is truly immense.", "exvi": "Trải dài trên hai lục địa bao la, sự đa dạng ngôn ngữ giữa các cộng đồng bản địa thực sự vô cùng to lớn.", "syn": [], "cefr": "B2", "ref": "note:1788603786091"}, {"id": "6cc4994905da1eec", "front": "reciprocal", "pos": "adjective", "ipa": "", "vi": "tương hỗ, có qua có lại", "en": "", "ex": "The two nations have a reciprocal agreement to lower trade barriers.", "exvi": "Hai quốc gia có một thỏa thuận tương hỗ để hạ thấp các rào cản thương mại.", "syn": [], "cefr": "C1", "ref": "note:1788603786093"}, {"id": "3fc434771df261ac", "front": "reciprocity", "pos": "noun", "ipa": "", "vi": "sự có qua có lại, sự tương hỗ", "en": "", "ex": "The trade agreement was based on the principle of reciprocity, with both countries lowering tariffs on each other's goods.", "exvi": "Hiệp định thương mại được dựa trên nguyên tắc có qua có lại, với cả hai quốc gia cùng hạ thuế quan đối với hàng hóa của nhau.", "syn": [], "cefr": "C1", "ref": "note:1788603786095"}, {"id": "df9a07438bf47853", "front": "self-contradictory", "pos": "adjective", "ipa": "", "vi": "tự mâu thuẫn, tiền hậu bất nhất", "en": "", "ex": "His argument was self-contradictory; he claimed to support environmental protection but drove a gas-guzzling SUV.", "exvi": "Lập luận của anh ấy tự mâu thuẫn; anh ấy tuyên bố ủng hộ bảo vệ môi trường nhưng lại lái một chiếc SUV ngốn xăng.", "syn": [], "cefr": "C1", "ref": "note:1788603786097"}, {"id": "547782dd094038c0", "front": "sophistication", "pos": "noun", "ipa": "", "vi": "sự tinh vi, sự sành điệu", "en": "", "ex": "The audience was impressed by the sophistication of her argument.", "exvi": "Khán giả đã bị ấn tượng bởi sự tinh vi trong lập luận của cô ấy.", "syn": [], "cefr": "C1", "ref": "note:1788603786099"}, {"id": "4a0758b63342fc33", "front": "competition with", "pos": "noun phrase", "ipa": "", "vi": "sự cạnh tranh với", "en": "", "ex": "Endemic songbirds suffered steep declines when placed in direct competition with aggressive invasive species.", "exvi": "Các loài chim biết hót đặc hữu đã sụt giảm nghiêm trọng khi bị đặt vào thế cạnh tranh trực tiếp với các loài xâm lấn hung dữ.", "syn": [], "cefr": "B2", "ref": "note:1788603786101"}, {"id": "b32b1f09de8fb03a", "front": "sporadically", "pos": "adverb", "ipa": "", "vi": "lác đác, không đều đặn", "en": "", "ex": "He only contacted his family sporadically after moving to the city.", "exvi": "Anh ấy chỉ liên lạc với gia đình một cách lác đác sau khi chuyển đến thành phố.", "syn": [], "cefr": "C1", "ref": "note:1788603786103"}, {"id": "ed131a89b44e138c", "front": "subsumed", "pos": "phrasal verb", "ipa": "", "vi": "bao gồm trong, sáp nhập vào", "en": "", "ex": "All the smaller political parties were
