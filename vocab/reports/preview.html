eventually subsumed in the two major ones.", "exvi": "Tất cả các đảng phái chính trị nhỏ hơn cuối cùng đã bị sáp nhập vào hai đảng lớn.", "syn": [], "cefr": "C1", "ref": "note:1788603786105"}, {"id": "71a7d7dfc600c124", "front": "subsume", "pos": "verb", "ipa": "", "vi": "bao gồm, gộp vào", "en": "", "ex": "Most of these problems can be subsumed under the broader category of 'resource management'.", "exvi": "Hầu hết những vấn đề này có thể được gộp vào danh mục lớn hơn là 'quản lý tài nguyên'.", "syn": [], "cefr": "C1", "ref": "note:1788603786107"}, {"id": "ad3dd62d001a5818", "front": "subversive", "pos": "adjective", "ipa": "", "vi": "có tính lật đổ, phá hoại ngầm", "en": "", "ex": "The government considered the journalist's articles to be subversive and a threat to national security.", "exvi": "Chính phủ coi các bài báo của nhà báo này mang tính lật đổ và là mối đe dọa cho an ninh quốc gia.", "syn": [], "cefr": "C1", "ref": "note:1788603786109"}, {"id": "099fdd965e821f74", "front": "inspire", "pos": "verb", "ipa": "", "vi": "truyền cảm hứng, khơi gợi", "en": "", "ex": "Vivid oral legends passed down by tribal elders continue to inspire modern storytellers.", "exvi": "Những truyền thuyết truyền khẩu sống động do các già làng truyền lại tiếp tục khơi gợi cảm hứng cho các tác giả hiện đại.", "syn": [], "cefr": "B2", "ref": "note:1788603786111"}, {"id": "8efa4d8f28ffc297", "front": "succinctly", "pos": "adverb", "ipa": "", "vi": "ngắn gọn, súc tích", "en": "", "ex": "During the meeting, she presented her findings succinctly, impressing everyone with her clarity and efficiency.", "exvi": "Trong cuộc họp, cô ấy đã trình bày những phát hiện của mình một cách ngắn gọn súc tích, gây ấn tượng với mọi người bởi sự rõ ràng và hiệu quả.", "syn": [], "cefr": "C1", "ref": "note:1788603786113"}, {"id": "7f995df7a7697473", "front": "transience", "pos": "noun", "ipa": "", "vi": "tính tạm thời, tính phù du", "en": "", "ex": "The transience of life is a common theme in poetry, reminding us to cherish every moment.", "exvi": "Sự phù du của cuộc đời là một chủ đề phổ biến trong thơ ca, nhắc nhở chúng ta trân trọng từng khoảnh khắc.", "syn": [], "cefr": "C1", "ref": "note:1788603786115"}, {"id": "c6f0969ac8c75fb0", "front": "merge", "pos": "verb", "ipa": "", "vi": "hòa trộn, kết hợp, hợp nhất", "en": "", "ex": "Innovative musicians merge native cultural chants with modern rhythm and blues traditions.", "exvi": "Những nhạc sĩ đổi mới kết hợp các điệu tụng ca văn hóa bản địa với các giai điệu rhythm and blues hiện đại.", "syn": [], "cefr": "B2", "ref": "note:1788603786117"}, {"id": "090013530cd82853", "front": "relevant", "pos": "adjective", "ipa": "", "vi": "có liên quan, thích hợp, có ý nghĩa thiết thực", "en": "", "ex": "Historical patterns from prehistoric extinctions remain highly relevant to current ecological protection policies.", "exvi": "Những quy luật lịch sử từ các vụ tuyệt chủng tiền sử vẫn giữ nguyên ý nghĩa thiết thực đối với các chính sách bảo vệ sinh thái hiện nay.", "syn": [], "cefr": "B2", "ref": "note:1788603786119"}, {"id": "b27a5333676e9500", "front": "excessive", "pos": "adjective", "ipa": "", "vi": "quá mức, thái quá", "en": "", "ex": "Charging excessive fees for public parking deterred shoppers from visiting the downtown shopping district.", "exvi": "Việc thu các khoản phí quá mức cho việc đỗ xe công cộng đã ngăn cản người mua sắm đến với khu thương mại trung tâm.", "syn": [], "cefr": "B2", "ref": "note:1788603786121"}, {"id": "d4e49f578e44d5a5", "front": "adequate", "pos": "adjective", "ipa": "", "vi": "đầy đủ, thỏa đáng, vừa đủ", "en": "", "ex": "Receiving reviews from thousands of players provided an adequate sample size to determine consumer satisfaction.", "exvi": "Việc nhận được phản hồi từ hàng ngàn người chơi đã cung cấp một cỡ mẫu thỏa đáng để xác định mức độ hài lòng của khách hàng.", "syn": [], "cefr": "B2", "ref": "note:1788603786123"}, {"id": "94ec2a64a84653d1", "front": "revise", "pos": "verb", "ipa": "", "vi": "sửa đổi, điều chỉnh lại (giả thuyết, quan điểm)", "en": "", "ex": "Surprising new fossil discoveries compelled paleontologists to revise their standing timeline of marsupial extinction.", "exvi": "Những phát hiện hóa thạch bất ngờ mới đã buộc các nhà cổ sinh vật học phải điều chỉnh lại dòng thời gian hiện tại về sự tuyệt chủng của loài thú có túi.", "syn": [], "cefr": "B2", "ref": "note:1788603786125"}, {"id": "815481f3c9e17c4c", "front": "consequences for", "pos": "noun phrase", "ipa": "", "vi": "hậu quả đối với, tác động lớn đến", "en": "", "ex": "The loss of prehistoric apex herbivores generated sweeping trophic consequences for regional plant distributions.", "exvi": "Sự biến mất của các loài thú ăn cỏ khổng lồ thời tiền sử đã tạo ra những hệ quả sâu rộng đối với sự phân bố thực vật trong vùng.", "syn": [], "cefr": "B2", "ref": "note:1788603786127"}, {"id": "f2bfa82e9ec9f01d", "front": "reform", "pos": "noun", "ipa": "", "vi": "sự cải cách, đổi mới hệ thống", "en": "", "ex": "To eliminate delivery fee evasion, major postal reform was introduced through uniform adhesive stamps.", "exvi": "Để loại bỏ việc trốn cước giao hàng, cuộc cải cách bưu chính lớn đã được đưa vào thực hiện thông qua việc dán tem đồng bộ.", "syn": [], "cefr": "B2", "ref": "note:1788603786129"}, {"id": "d1e7d3df3066c282", "front": "alter", "pos": "verb", "ipa": "", "vi": "thay đổi, biến đổi", "en": "", "ex": "Minor shifts in water temperature can drastically alter marine ecosystems and food chains.", "exvi": "Những biến động nhỏ về nhiệt độ nước có thể làm biến đổi mạnh mẽ các hệ sinh thái biển và chuỗi thức ăn.", "syn": [], "cefr": "B2", "ref": "note:1788603786131"}, {"id": "29afe0fadd82da70", "front": "preliminary", "pos": "adjective", "ipa": "", "vi": "sơ bộ, bước đầu", "en": "", "ex": "The research laboratory released preliminary data while continuing to verify the comprehensive clinical trial results.", "exvi": "Phòng nghiên cứu đã công bố các số liệu sơ bộ trong khi tiếp tục xác minh kết quả thử nghiệm lâm sàng toàn diện.", "syn": [], "cefr": "B2", "ref": "note:1788603786133"}, {"id": "4cadcdfbc70a51e8", "front": "collaboration between", "pos": "phrase", "ipa": "", "vi": "Sự hợp tác giữa (hai hoặc nhiều bên)", "en": "", "ex": "The collaboration between engineers and entomologists resulted in a more comprehensive approach to material design.", "exvi": "Sự hợp tác giữa các kỹ sư và các nhà côn trùng học đã mang lại một phương pháp tiếp cận toàn diện hơn cho việc thiết kế vật liệu.", "syn": [], "cefr": "B2", "ref": "note:1788603786135"}, {"id": "1c0c960378d7ffa2", "front": "respectable", "pos": "adjective", "ipa": "", "vi": "Đáng kính, đứng đắn, có uy tín hoặc ở mức khá tốt", "en": "", "ex": "Despite having modest resources, the scholar maintained a respectable reputation throughout the academic community.", "exvi": "Dù có nguồn lực khiêm tốn, học giả đó vẫn duy trì được danh tiếng đáng kính trong toàn bộ cộng đồng học thuật.", "syn": [], "cefr": "B2", "ref": "note:1788603786137"}, {"id": "71c749a975abfb30", "front": "held up", "pos": "phrasal verb", "ipa": "", "vi": "Được chống đỡ, nâng đỡ (về mặt vật lý); duy trì hoặc đứng vững", "en": "", "ex": "The bridge was held up by stalwart sandstone pillars that had endured for over fifty years.", "exvi": "Cây cầu được chống đỡ bởi những cây cột đá sa thạch vững chãi đã tồn tại hơn năm mươi năm.", "syn": [], "cefr": "B2", "ref": "note:1788603786139"}, {"id": "aba10dd011edb287", "front": "critical", "pos": "adjective", "ipa": "", "vi": "Mang tính then chốt, cực kỳ quan trọng; hoặc có tính phê phán", "en": "", "ex": "History is far too critical to democracy to remain solely the dominion of academic historians.", "exvi": "Lịch sử quá đỗi then chốt đối với nền dân chủ đến mức không thể chỉ để riêng cho các nhà sử học hàn lâm.", "syn": [], "cefr": "B2", "ref": "note:1788603786141"}, {"id": "166106142e5c97fd", "front": "confused with", "pos": "phrase", "ipa": "", "vi": "Bị nhầm lẫn với", "en": "", "ex": "Due to its similar plumage, the immature hawk is easily confused with a common buzzard.", "exvi": "Do có bộ lông tương tự, con diều hâu non rất dễ bị nhầm lẫn với chim ó thường.", "syn": [], "cefr": "B2", "ref": "note:1788603786143"}, {"id": "cb071d09a08e4d39", "front": "publicity", "pos": "noun", "ipa": "", "vi": "Sự quảng bá, sự chú ý từ công chúng và truyền thông", "en": "", "ex": "Strategic publicity and a well-run marketing campaign drove the novel to the top of the bestseller list.", "exvi": "Sự quảng bá mang tính chiến lược và một chiến dịch tiếp thị hiệu quả đã đưa cuốn tiểu thuyết lên đầu danh sách bán chạy nhất.", "syn": [], "cefr": "B2", "ref": "note:1788603786145"}, {"id": "edf2bd0ee036dcf0", "front": "imaginative", "pos": "adjective", "ipa": "", "vi": "Giàu trí tưởng tượng, sáng tạo và độc đáo", "en": "", "ex": "The novelist created an imaginative fantasy realm with intricate political structures and unique languages.", "exvi": "Tiểu thuyết gia đã tạo ra một thế giới giả tưởng giàu trí tưởng tượng với cấu trúc chính trị phức tạp và ngôn ngữ độc đáo.", "syn": [], "cefr": "B2", "ref": "note:1788603786147"}, {"id": "0901d7f70d0602ab", "front": "getting ahead of", "pos": "phrase", "ipa": "", "vi": "Đi trước, vượt lên phía trước hoặc quá vội vàng làm gì trước thời điểm thích hợp", "en": "", "ex": "By introducing advanced robotics early, the firm succeeded in getting ahead of its rivals.", "exvi": "Bằng cách áp dụng robot tiên tiến từ sớm, công ty đã thành công trong việc vượt lên trước các đối thủ.", "syn": [], "cefr": "B2", "ref": "note:1788603786149"}, {"id": "33bf71f634a0ef9b", "front": "physical", "pos": "adjective", "ipa": "", "vi": "Vật chất, hữu hình, có thể sờ hoặc nhìn thấy được", "en": "", "ex": "To support their theories regarding ancient climates, researchers sought physical evidence such as fossilized teeth.", "exvi": "Để củng cố các giả thuyết về khí hậu cổ đại, các nhà nghiên cứu đã tìm kiếm bằng chứng vật chất hữu hình như răng hóa thạch.", "syn": [], "cefr": "B2", "ref": "note:1788603786151"}, {"id": "ff8d9c21f6093cba", "front": "target", "pos": "noun", "ipa": "", "vi": "Mục tiêu, đích nhắm", "en": "", "ex": "The snowball fell several yards short of its intended target, hitting the brick wall instead.", "exvi": "Quả bóng tuyết rơi cách mục tiêu định nhắm vài thước, đập trúng vào bức tường gạch thay vì trúng đích.", "syn": [], "cefr": "B2", "ref": "note:1788603786153"}, {"id": "07ec6b7a14701601", "front": "analyze", "pos": "verb", "ipa": "", "vi": "Phân tích kỹ lưỡng", "en": "", "ex": "Scientists will carefully analyze the chemical composition of the recovered mineral specimens.", "exvi": "Các nhà khoa học sẽ cẩn thận phân tích thành phần hóa học của các mẫu khoáng vật thu thập được.", "syn": [], "cefr": "B2", "ref": "note:1788603786155"}, {"id": "ae093de16c6fa0b8", "front": "rejection", "pos": "noun", "ipa": "", "vi": "Sự từ chối, sự bác bỏ", "en": "", "ex": "The author faced repeated rejection from publishing houses before his manuscript was finally accepted.", "exvi": "Tác giả đã phải đối mặt với sự từ chối lặp đi lặp lại từ các nhà xuất bản trước khi bản thảo cuối cùng được chấp nhận.", "syn": [], "cefr": "B2", "ref": "note:1788603786157"}, {"id": "d65b51263d4fb9c5", "front": "reproduction", "pos": "noun", "ipa": "", "vi": "Sự sinh sản; bản sao chép, tái tạo lại", "en": "", "ex": "The gallery sold an exact photographic reproduction of the Renaissance master's painting.", "exvi": "Phòng tranh đã bán một bản sao chép nhiếp ảnh chính xác của bức họa bậc thầy thời Phục hưng.", "syn": [], "cefr": "B2", "ref": "note:1788603786159"}, {"id": "2d64a3bb4168f9cb", "front": "impractical", "pos": "adjective", "ipa": "", "vi": "Không thực tế, bất khả thi hoặc phi thực tiễn", "en": "", "ex": "Because of the sheer number of discovered asteroids, assigning unique names to each body would be impractical.", "exvi": "Bởi vì số lượng tiểu hành tinh được phát hiện quá lớn, việc đặt tên riêng duy nhất cho từng thiên thể sẽ là điều không thực tế.", "syn": [], "cefr": "B2", "ref": "note:1788603786161"}, {"id": "a4e473fe8f3e8eb8", "front": "sympathy", "pos": "noun", "ipa": "", "vi": "Sự thông cảm, đồng cảm hoặc thiện cảm", "en": "", "ex": "The community expressed heartfelt sympathy for the families displaced by the severe flooding.", "exvi": "Cộng đồng đã bày tỏ sự cảm thông chân thành đối với những gia đình phải di dời do trận lũ lụt nghiêm trọng.", "syn": [], "cefr": "B2", "ref": "note:1788603786163"}, {"id": "de1d71277f111105", "front": "accumulate", "pos": "verb", "ipa": "", "vi": "Tích tụ, tích lũy, gom lại nhiều dần theo thời gian", "en": "", "ex": "River deltas expand gradually as mineral sediments accumulate where flowing fresh water enters the ocean.", "exvi": "Các vùng đồng bằng châu thổ mở rộng dần dần khi phù sa khoáng chất tích tụ tại nơi nước ngọt đổ vào đại dương.", "syn": [], "cefr": "B2", "ref": "note:1788603786165"}]}, {"key": "anki_starter-set17", "title": "Flashcard SAT Starter Set 17", "deck": "anki_starter", "count": 39, "cards": [{"id": "d17332a6fbbcca3f", "front": "contract", "pos": "verb", "ipa": "", "vi": "Co lại, thu nhỏ lại kích thước; hoặc ký kết hợp đồng", "en": "", "ex": "Metal tracks expand in the intense summer heat and contract noticeably when temperatures plunge in winter.", "exvi": "Đường ray kim loại nở ra trong cái nóng gay gắt của mùa hè và co lại rõ rệt khi nhiệt độ hạ sâu vào mùa đông.", "syn": [], "cefr": "B2", "ref": "note:1788603786167"}, {"id": "8e966e1d05fd6f60", "front": "selective", "pos": "adjective", "ipa": "", "vi": "Có chọn lọc, có tính kén chọn khắt khe", "en": "", "ex": "The prestigious university maintains an extremely selective admissions process, accepting only top applicants.", "exvi": "Trường đại học danh tiếng này duy trì một quy trình tuyển sinh cực kỳ có chọn lọc, chỉ nhận những ứng viên xuất sắc nhất.", "syn": [], "cefr": "B2", "ref": "note:1788603786169"}, {"id": "ca12d2d66d2120ba", "front": "jointly", "pos": "adverb", "ipa": "", "vi": "Chung, cùng nhau, phối hợp liên kết", "en": "", "ex": "When research results from collaborative work, the chemistry prize is conferred jointly upon multiple scientists.", "exvi": "Khi kết quả nghiên cứu bắt nguồn từ công trình hợp tác, giải Nobel hóa học sẽ được trao chung cho nhiều nhà khoa học.", "syn": [], "cefr": "B2", "ref": "note:1788603786171"}, {"id": "50c8be3791ff6cea", "front": "beneficial", "pos": "adjective", "ipa": "", "vi": "Có lợi, mang lại điều tốt lành", "en": "", "ex": "Regular physical exercise produces beneficial impacts on both cardiovascular health and mental well-being.", "exvi": "Tập thể dục thường xuyên tạo ra những tác động có lợi cho cả sức khỏe tim mạch và tinh thần.", "syn": [], "cefr": "B2", "ref": "note:1788603786173"}, {"id": "36e0abacd12f5d14", "front": "visible", "pos": "adjective", "ipa": "", "vi": "Có thể nhìn thấy được, rõ ràng hiển hiện", "en": "", "ex": "The bright flare of the meteor was clearly visible against the dark night sky.", "exvi": "Ánh sáng chói lọi của ngôi sao băng có thể nhìn thấy rõ ràng trên nền trời đêm đen thẳm.", "syn": [], "cefr": "B2", "ref": "note:1788603786175"}, {"id": "48326b31d22507f9", "front": "reliably", "pos": "adverb", "ipa": "", "vi": "Một cách đáng tin cậy, chuẩn xác và ổn định", "en": "", "ex": "The newly developed recognition algorithm reliably pinpointed urban pathways across thousands of trial images.", "exvi": "Thuật toán nhận dạng mới được phát triển đã xác định chính xác một cách đáng tin cậy các lối đi đô thị qua hàng nghìn bức ảnh thử nghiệm.", "syn": [], "cefr": "B2", "ref": "note:1788603786177"}, {"id": "d7ebf773c4ba2d82", "front": "imply", "pos": "verb", "ipa": "", "vi": "ngụ ý, ám chỉ", "en": "", "ex": "The speaker did not state his opinion outright, but his tone seemed to imply dissatisfaction with the project.", "exvi": "Diễn giả không nêu thẳng quan điểm của mình, nhưng giọng điệu của ông dường như ngụ ý sự không hài lòng với dự án.", "syn": [], "cefr": "B2", "ref": "note:1788603786179"}, {"id": "73ac672c35b57d50", "front": "indecision", "pos": "noun", "ipa": "", "vi": "sự do dự, sự lưỡng lự, sự thiếu quyết đoán", "en": "", "ex": "His chronic indecision prevented him from choosing a major until the final deadline had passed.", "exvi": "Sự do dự kinh niên của anh ấy đã ngăn anh chọn ngành học cho đến tận khi hạn chót trôi qua.", "syn": [], "cefr": "B2", "ref": "note:1788603786181"}, {"id": "a3d9caf168fe053f", "front": "reflection", "pos": "noun", "ipa": "", "vi": "sự suy ngẫm, sự cân nhắc sâu sắc", "en": "", "ex": "Natalie realized that there would never be time to approach college with appropriate reflection and care.", "exvi": "Natalie nhận ra rằng sẽ không bao giờ có đủ thời gian để tiếp cận việc học đại học với sự suy ngẫm và cẩn trọng thích đáng.", "syn": [], "cefr": "B2", "ref": "note:1788603786183"}, {"id": "a3ae0f76d3b14eab", "front": "providing resistance to", "pos": "phrase", "ipa": "", "vi": "tạo ra sự cản trở, kháng cự đối với", "en": "", "ex": "The dense crowd and handtrucks crowded the street, providing resistance to our forward passage.", "exvi": "Đám đông dày đặc cùng xe đẩy tay tràn ngập con phố, tạo ra sự cản trở cho lối đi của chúng tôi.", "syn": [], "cefr": "B2", "ref": "note:1788603786185"}, {"id": "c55b0255b1f1a2e1", "front": "persist", "pos": "verb", "ipa": "", "vi": "tiếp tục tồn tại, kiên trì, dai dẳng", "en": "", "ex": "Although temperatures rose, the unseasonal morning frost managed to persist in shaded valleys.", "exvi": "Mặc dù nhiệt độ đã tăng lên, đợt sương giá trái mùa vẫn tiếp tục tồn tại dai dẳng ở các thung lũng râm mát.", "syn": [], "cefr": "B2", "ref": "note:1788603786187"}, {"id": "00e0cea435e407bb", "front": "renew", "pos": "verb", "ipa": "", "vi": "khôi phục, làm mới, tái sinh công dụng", "en": "", "ex": "Digitizing the long-forgotten space recordings succeeded in renewing the Apollo data's usefulness.", "exvi": "Việc số hóa các bản ghi vũ trụ đã bị lãng quên từ lâu đã thành công trong việc khôi phục tính hữu ích của dữ liệu Apollo.", "syn": [], "cefr": "B2", "ref": "note:1788603786189"}, {"id": "97115fc26a474775", "front": "compound", "pos": "verb", "ipa": "", "vi": "làm trầm trọng thêm, nhân lên sự tồi tệ", "en": "", "ex": "Unexpected shipping delays will only compound the financial difficulties the company is already confronting.", "exvi": "Sự chậm trễ vận chuyển ngoài dự kiến sẽ chỉ làm trầm trọng thêm những khó khăn tài chính mà công ty đang phải đối mặt.", "syn": [], "cefr": "B2", "ref": "note:1788603786191"}, {"id": "62a1c8b6085fc852", "front": "outmoded", "pos": "adjective", "ipa": "", "vi": "lỗi thời, lạc hậu", "en": "", "ex": "The company's outmoded management practices led to its sharp decline in profits.", "exvi": "Những phương thức quản lý lỗi thời của công ty đã dẫn đến sự sụt giảm mạnh về lợi nhuận.", "syn": [], "cefr": "B2", "ref": "note:1788603786193"}, {"id": "465f88eaf8ff18b0", "front": "amplify", "pos": "verb", "ipa": "", "vi": "khuếch đại, làm tăng lên", "en": "", "ex": "His comments only served to amplify her feelings of insecurity.", "exvi": "Những lời nhận xét của anh ta chỉ càng làm khuếch đại thêm cảm giác bất an của cô ấy.", "syn": [], "cefr": "B2", "ref": "note:1788603786195"}, {"id": "f1bf851a00f948e4", "front": "counterbalance", "pos": "verb", "ipa": "", "vi": "làm đối trọng, cân bằng lại", "en": "", "ex": "The strengths of the new software are counterbalanced by its high price and steep learning curve.", "exvi": "Thế mạnh của phần mềm mới được cân bằng lại bởi giá thành cao và quá trình học sử dụng khó khăn.", "syn": [], "cefr": "B2", "ref": "note:1788603786197"}, {"id": "0a5833017ba574cd", "front": "intrinsic", "pos": "adjective phrase", "ipa": "", "vi": "cốt lõi của, bản chất của", "en": "", "ex": "The risk of injury is intrinsic to high-contact sports like football.", "exvi": "Rủi ro chấn thương là một phần cố hữu của các môn thể thao va chạm mạnh như bóng đá.", "syn": [], "cefr": "B2", "ref": "note:1788603786199"}, {"id": "895c7fd63632096f", "front": "peripheral", "pos": "adjective", "ipa": "", "vi": "thuộc ngoại vi, thứ yếu", "en": "", "ex": "While the main plot of the novel was engaging, the details about the protagonist's childhood felt peripheral to the story.", "exvi": "Trong khi cốt truyện chính của cuốn tiểu thuyết rất hấp dẫn, những chi tiết về thời thơ ấu của nhân vật chính có vẻ thứ yếu đối với câu chuyện.", "syn": [], "cefr": "B2", "ref": "note:1788603786201"}, {"id": "cdc3e6a58b728118", "front": "static", "pos": "adjective", "ipa": "", "vi": "tĩnh, không thay đổi", "en": "", "ex": "The company's profits have been static for the past two quarters, showing no significant growth or decline.", "exvi": "Lợi nhuận của công ty đã không thay đổi trong hai quý vừa qua, không cho thấy sự tăng trưởng hay sụt giảm đáng kể nào.", "syn": [], "cefr": "B2", "ref": "note:1788603786203"}, {"id": "e3b5824fd96aa955", "front": "advantageous", "pos": "adjective", "ipa": "", "vi": "có lợi, thuận lợi", "en": "", "ex": "Taking a gap year before college can be advantageous for students who need more time to explore their interests.", "exvi": "Việc nghỉ một năm trước khi vào đại học có thể thuận lợi cho những sinh viên cần thêm thời gian để khám phá sở thích của mình.", "syn": [], "cefr": "B2", "ref": "note:1788603786205"}, {"id": "c56f55baceb8b5cb", "front": "unconventional", "pos": "adjective", "ipa": "", "vi": "khác thường, không theo lối mòn", "en": "", "ex": "Her unconventional approach to problem-solving, though initially criticized, ultimately led to a groundbreaking discovery.", "exvi": "Cách tiếp cận giải quyết vấn đề khác thường của cô ấy, dù ban đầu bị chỉ trích, cuối cùng đã dẫn đến một khám phá đột phá.", "syn": [], "cefr": "B2", "ref": "note:1788603786207"}, {"id": "37b112e290ae68b5", "front": "haphazard", "pos": "adjective", "ipa": "", "vi": "bừa bãi, không có kế hoạch", "en": "", "ex": "The government's haphazard response to the crisis was widely criticized for its lack of clear direction.", "exvi": "Phản ứng bừa bãi của chính phủ đối với cuộc khủng hoảng đã bị chỉ trích rộng rãi vì thiếu định hướng rõ ràng.", "syn": [], "cefr": "B2", "ref": "note:1788603786209"}, {"id": "3e8399bad41df14d", "front": "prescribe", "pos": "verb", "ipa": "", "vi": "kê đơn, quy định", "en": "", "ex": "The law prescribes that all drivers must have a valid license to operate a vehicle.", "exvi": "Luật pháp quy định rằng tất cả người lái xe phải có giấy phép hợp lệ để điều khiển phương tiện.", "syn": [], "cefr": "B2", "ref": "note:1788603786211"}, {"id": "288bd7fc6e1a6c1c", "front": "skeptic", "pos": "noun", "ipa": "", "vi": "người hoài nghi, người không dễ tin", "en": "", "ex": "Even though the psychic claimed to speak with her late grandmother, she remained a skeptic, demanding concrete proof.", "exvi": "Mặc dù nhà ngoại cảm tuyên bố đã nói chuyện với người bà quá cố của cô, cô vẫn là một người hoài nghi, đòi hỏi bằng chứng cụ thể.", "syn": [], "cefr": "B2", "ref": "note:1788603786213"}, {"id": "7fd5eeb0a29191c5", "front": "compensate", "pos": "phrasal verb", "ipa": "", "vi": "bù đắp cho, đền bù cho", "en": "", "ex": "His enthusiasm more than compensates for his lack of experience.", "exvi": "Sự nhiệt tình của anh ấy đã bù đắp nhiều hơn cho sự thiếu kinh nghiệm của anh.", "syn": [], "cefr": "B2", "ref": "note:1788603786215"}, {"id": "a60f672a0bf44bdc", "front": "presupposition", "pos": "noun", "ipa": "", "vi": "sự giả định, niềm tin ngầm", "en": "", "ex": "The question 'When did you stop cheating on the test?' carries the presupposition that you did, in fact, cheat at some point.", "exvi": "Câu hỏi 'Bạn đã ngừng gian lận trong bài kiểm tra khi nào?' mang theo giả định ngầm rằng bạn thực sự đã từng gian lận.", "syn": [], "cefr": "B2", "ref": "note:1788603786217"}, {"id": "5f57948afbc23128", "front": "bent", "pos": "noun", "ipa": "", "vi": "khuynh hướng tự nhiên, năng khiếu", "en": "", "ex": "From a young age, she showed a bent for music and drama.", "exvi": "Ngay từ khi còn nhỏ, cô ấy đã bộc lộ năng khiếu về âm nhạc và kịch nghệ.", "syn": [], "cefr": "B2", "ref": "note:1788603786219"}, {"id": "667fe76a6d7b4659", "front": "comprise", "pos": "verb", "ipa": "", "vi": "bao gồm, tạo thành", "en": "", "ex": "The collection comprises 327 paintings.", "exvi": "Bộ sưu tập bao gồm 327 bức tranh.", "syn": [], "cefr": "B2", "ref": "note:1788603786221"}, {"id": "6adc0990de7e2b8a", "front": "constitution", "pos": "noun", "ipa": "", "vi": "hiến pháp, thể chất", "en": "", "ex": "Despite his age, the marathon runner has the constitution of a man half his age.", "exvi": "Bất chấp tuổi tác, vận động viên marathon này có thể chất của một người đàn ông chỉ bằng nửa tuổi ông.", "syn": [], "cefr": "B2", "ref": "note:1788603786223"}, {"id": "e2ff1c519f406305", "front": "discord", "pos": "noun", "ipa": "", "vi": "sự bất hòa, sự bất đồng", "en": "", "ex": "A decade of discord over the inheritance has torn the family apart.", "exvi": "Một thập kỷ bất hòa về việc thừa kế đã chia rẽ gia đình.", "syn": [], "cefr": "B2", "ref": "note:1788603786225"}, {"id": "581fbce65c7abad7", "front": "disposition", "pos": "noun", "ipa": "", "vi": "tính khí, khuynh hướng", "en": "", "ex": "She has a cheerful disposition and is always smiling.", "exvi": "Cô ấy có tính khí vui vẻ và luôn luôn mỉm cười.", "syn": [], "cefr": "B2", "ref": "note:1788603786227"}, {"id": "9056920e3ca35989", "front": "fabricate", "pos": "verb", "ipa": "", "vi": "bịa đặt, làm giả", "en": "", "ex": "He was late, so he fabricated a story about his car breaking down to avoid getting into trouble.", "exvi": "Anh ta bị trễ, nên đã bịa ra câu chuyện về việc xe mình bị hỏng để không bị khiển trách.", "syn": [], "cefr": "B2", "ref": "note:1788603786229"}, {"id": "bb04f17b8dceb638", "front": "fruitless", "pos": "adjective", "ipa": "", "vi": "vô ích, không có kết quả", "en": "", "ex": "After weeks of searching, their efforts to find the lost treasure proved fruitless.", "exvi": "Sau nhiều tuần tìm kiếm, nỗ lực của họ trong việc tìm kiếm kho báu đã mất đã trở nên vô ích.", "syn": [], "cefr": "B2", "ref": "note:1788603786231"}, {"id": "bd8f323a14aa4f92", "front": "grapple", "pos": "phrasal verb", "ipa": "", "vi": "vật lộn với, cố gắng giải quyết", "en": "", "ex": "The new government has to grapple with the problem of rising unemployment.", "exvi": "Chính phủ mới phải vật lộn với vấn đề thất nghiệp gia tăng.", "syn": [], "cefr": "B2", "ref": "note:1788603786233"}, {"id": "458bc9223ecaa2a5", "front": "hinder", "pos": "verb", "ipa": "", "vi": "cản trở, gây khó khăn", "en": "", "ex": "Thick fog and a fallen tree hindered our journey to the cabin.", "exvi": "Sương mù dày đặc và một cái cây đổ đã cản trở chuyến đi của chúng tôi đến căn nhà gỗ.", "syn": [], "cefr": "B2", "ref": "note:1788603786235"}, {"id": "7afbb948eade8bfe", "front": "invasive", "pos": "adjective", "ipa": "", "vi": "xâm lấn, xâm phạm", "en": "", "ex": "The invasive species of kudzu vine is a major threat to native ecosystems in the southeastern United States.", "exvi": "Loài dây leo sắn dây xâm lấn là một mối đe dọa lớn đối với các hệ sinh thái bản địa ở vùng đông nam Hoa Kỳ.", "syn": [], "cefr": "B2", "ref": "note:1788603786237"}, {"id": "73cb3d2d7526556b", "front": "mobilize", "pos": "verb", "ipa": "", "vi": "huy động, tập hợp", "en": "", "ex": "The community leader managed to mobilize hundreds of volunteers to clean up the park after the storm.", "exvi": "Người lãnh đạo cộng đồng đã huy động được hàng trăm tình nguyện viên để dọn dẹp công viên sau cơn bão.", "syn": [], "cefr": "B2", "ref": "note:1788603786239"}, {"id": "3e0e657d1b1d9ae1", "front": "watershed", "pos": "noun", "ipa": "", "vi": "bước ngoặt, thời điểm quan trọng", "en": "", "ex": "The discovery of penicillin was a watershed moment in the history of medicine.", "exvi": "Việc phát hiện ra penicillin là một thời điểm bước ngoặt trong lịch sử y học.", "syn": [], "cefr": "B2", "ref": "note:1788603786241"}, {"id": "c9cf6731dcb95858", "front": "theoretical", "pos": "adjective", "ipa": "", "vi": "thuộc về lý thuyết, mang tính giả định", "en": "", "ex": "The plan to build a colony on Mars is still purely theoretical at this stage.", "exvi": "Kế hoạch xây dựng một thuộc địa trên Sao Hỏa ở giai đoạn này vẫn hoàn toàn chỉ là lý thuyết.", "syn": [], "cefr": "B2", "ref": "note:1788603786243"}]}, {"key": "c1c2_wic500-set01", "title": "Flashcard C1-C2 Set 01", "deck": "c1c2_wic500", "count": 50, "cards": [{"id": "00b2e982b8d06ac6", "front": "repudiate", "pos": "", "ipa": "/rɪˈpjuːdieɪt/", "vi": "bác bỏ, từ chối", "en": "to refuse to accept; to reject formally", "ex": "", "exvi": "", "syn": ["reject", "deny", "disown"], "cefr": "C1-C2", "ref": "page:3/table:0/row:1"}, {"id": "1511c982cb7ab4dc", "front": "corroborate", "pos": "", "ipa": "/kəˈrɑːbəreɪt/", "vi": "xác nhận, củng cố", "en": "to confirm or give support to a statement", "ex": "", "exvi": "", "syn": ["confirm", "verify", "substantiate"], "cefr": "C1-C2", "ref": "page:3/table:0/row:2"}, {"id": "bbfc576a62f593a5", "front": "equivocal", "pos": "", "ipa": "/ɪˈkwɪvəkəl/", "vi": "nhập nhằng, mơ hồ", "en": "open to more than one interpretation; ambiguous", "ex": "", "exvi": "", "syn": ["ambiguous", "unclear", "uncertain"], "cefr": "C1-C2", "ref": "page:3/table:0/row:3"}, {"id": "f689d8461388e9f4", "front": "meticulous", "pos": "", "ipa": "/məˈtɪkjələs/", "vi": "tỉ mỉ, cẩn thận", "en": "showing great attention to detail", "ex": "", "exvi": "", "syn": ["careful", "thorough", "precise"], "cefr": "C1-C2", "ref": "page:3/table:0/row:4"}, {"id": "65c37d062e1e6344", "front": "subvert", "pos": "", "ipa": "/səbˈvɜːrt/", "vi": "lật đổ, làm suy yếu", "en": "to undermine the power or authority of", "ex": "", "exvi": "", "syn": ["undermine", "sabotage", "destabilize"], "cefr": "C1-C2", "ref": "page:3/table:0/row:5"}, {"id": "c1ccd18a80db152c", "front": "substantiate", "pos": "", "ipa": "/səbˈstænʃieɪt/", "vi": "chứng minh, xác minh", "en": "to provide evidence to support or prove", /* ---------- library ---------- */
const PASTELS = [
  ['#f3f0fb', '#e9e4f8'], ['#e8f6f1', '#d9efe6'], ['#e9f2fd', '#dbe9fa'],
  ['#fdeef1', '#f9dee4'], ['#fdf6e7', '#faedd2'], ['#eef7ec', '#dff0dc']
];
const PAGE_SIZE = 24;
let filtered = SECTIONS.slice(), page = 0;
const grid = document.getElementById('grid'), pager = document.getElementById('pager');
const DECO = ['🎧','📐','🌈','📕','🧩','✏️'];

function dueMap() { try { return JSON.parse(localStorage.getItem('wb-vocab-due') || '{}'); } catch { return {}; } }
function saveDue(m) { localStorage.setItem('wb-vocab-due', JSON.stringify(m)); }
function dueToday() {
  const today = new Date().toISOString().slice(0, 10);
  const m = dueMap();
  return SECTIONS.flatMap(s => s.cards).filter(c => m[c.id] && m[c.id] <= today);
}

function renderPager() {
  const pages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  page = Math.min(page, pages - 1);
  const lo = filtered.length ? page * PAGE_SIZE + 1 : 0;
  const hi = Math.min(filtered.length, (page + 1) * PAGE_SIZE);
  let html = `<span>${lo}-${hi} trong tổng số ${filtered.length} kết quả</span>`;
  html += `<button ${page === 0 ? 'disabled' : ''} data-p="${page-1}">‹</button>`;
  for (let i = 0; i < pages; i++)
    html += `<button class="${i === page ? 'cur' : ''}" data-p="${i}">${i+1}</button>`;
  html += `<button ${page >= pages-1 ? 'disabled' : ''} data-p="${page+1}">›</button>`;
  pager.innerHTML = html;
  pager.querySelectorAll('button[data-p]').forEach(b =>
    b.onclick = () => { page = +b.dataset.p; renderGrid(); });
}

function renderGrid() {
  const slice = filtered.slice(page * PAGE_SIZE, (page + 1) * PAGE_SIZE);
  grid.innerHTML = slice.length ? '' : '<div class="empty">Không có bộ nào khớp từ khóa.</div>';
  for (const s of slice) {
    const c = PASTELS[SECTIONS.indexOf(s) % PASTELS.length];
    const b = document.createElement('button');
    b.className = 'set';
    b.style.background = `linear-gradient(135deg, ${c[0]}, ${c[1]})`;
    b.innerHTML = `<div class="title">${s.title}</div><span class="chip">${s.count} terms</span>`
                + `<span class="deco">${DECO[SECTIONS.indexOf(s) % DECO.length]}</span>`;
    b.onclick = () => startSession([s], s.title);
    grid.appendChild(b);
  }
  renderPager();
}

function refreshBanner() {
  const due = dueToday();
  document.getElementById('due-text').textContent = due.length
    ? `${due.length} từ đến hạn — nhấn "Bắt đầu ôn" để ôn theo lịch.` 
    : 'Chưa có từ nào đến hạn — chọn một bộ để học.';
  const btn = document.getElementById('btn-due');
  btn.disabled = !due.length;
  btn.onclick = () => startSession(dueToday(), 'Ôn hôm nay');
}

function doSearch() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  filtered = !q ? SECTIONS.slice()
    : SECTIONS.filter(s => s.title.toLowerCase().includes(q)
        || s.cards.some(c => c.front.toLowerCase().includes(q) || (c.vi || '').toLowerCase().includes(q)));
  page = 0;
  renderGrid();
}
document.getElementById('btn-search').onclick = doSearch;
document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

/* ---------- study ---------- */
let session = null; // { title, cards, idx, flipped }
const $card = document.getElementById('card'), $ratings = document.getElementById('ratings');

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function hi(example, word) {
  if (!example) return '';
  const w = word.trim();
  const re = new RegExp('\\b' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\w*', 'i');
  return esc(example).replace(re, m => '<b>' + m + '</b>');
}

function renderCard() {
  const c = session.cards[session.idx];
  document.getElementById('count-pill').textContent = `${session.title} · thẻ ${session.idx+1} / ${session.cards.length}`;
  document.getElementById('crumb').textContent = session.title;
  document.getElementById('bar').style.width = (session.idx / session.cards.length * 100) + '%';
  if (!session.flipped) {
    $ratings.style.display = 'none';
    $card.innerHTML = `<div class="face-front"><div class="word-xl">${esc(c.front)}</div>
      <div class="hint">⟳ Nhấn để xem nghĩa</div></div>`;
  } else {
    $ratings.style.display = 'flex';
    const syn = (c.syn || []).slice(0, 4).map(s => `<span class="chip2">${esc(s)}</span>`).join('');
    $card.innerHTML = `<div class="face-back">
      <div class="word-row"><span class="word-lg">${esc(c.front)}</span>
        ${c.pos ? `<span class="pos">${esc(c.pos)}.</span>` : ''}</div>
      <div class="ipa-row"><span>${esc(c.ipa)}</span>
        <button class="speak" title="Đọc từ">🔊</button></div>
      ${c.vi ? `<div class="vi-mean">${esc(c.vi)}</div>` : ''}
      ${c.en ? `<div class="en-mean">${esc(c.en)}</div>` : ''}
      ${syn ? `<div class="sec-label">ĐỒNG NGHĨA</div><div class="chips">${syn}</div>` : ''}
      ${c.ex ? `<div class="exbox"><div class="lab">VÍ DỤ TRONG NGỮ CẢNH</div>
        <div class="tx">${hi(c.ex, c.front)}</div>
        ${c.exvi ? `<div class="tx" style="margin-top:6px;color:#6b7280">${esc(c.exvi)}</div>` : ''}</div>` : ''}
    </div>`;
    $card.querySelector('.speak').onclick = (e) => {
      e.stopPropagation();
      try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(c.front);
            u.lang = 'en-US'; speechSynthesis.speak(u); } catch {}
    };
  }
  document.getElementById('btn-prev').disabled = session.idx === 0;
  document.getElementById('prev').disabled = session.idx === 0;
}

function flip() { session.flipped = !session.flipped; renderCard(); }
function go(delta) {
  const next = session.idx + delta;
  if (next < 0) return;
  if (next >= session.cards.length) { endSession(); return; }
  session.idx = next; session.flipped = false; renderCard();
}
function rate(kind) {
  const c = session.cards[session.idx];
  const m = dueMap();
  const d = new Date();
  d.setDate(d.getDate() + (kind === 'again' ? 1 : 4));
  m[c.id] = d.toISOString().slice(0, 10);
  saveDue(m);
  go(1);
}
function endSession() {
  refreshBanner();
  document.getElementById('library').style.display = 'block';
  document.getElementById('study').style.display = 'none';
  location.hash = '';
}
function startSession(cards, title) {
  session = { title, cards: cards.slice(), idx: 0, flipped: false };
  document.getElementById('library').style.display = 'none';
  document.getElementById('study').style.display = 'block';
  renderCard();
  window.scrollTo(0, 0);
}
document.getElementById('card').onclick = flip;
document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
document.getElementById('btn-prev').onclick = () => go(-1);
document.getElementById('btn-next').onclick = () => session.flipped ? go(1) : flip();
document.getElementById('rate-again').onclick = () => rate('again');
document.getElementById('rate-good').onclick = () => rate('good');
document.getElementById('btn-exit').onclick = endSession;
document.addEventListener('keydown', e => {
  if (document.getElementById('study').style.display !== 'block') return;
  if (e.key === 'ArrowRight') go(1);
  else if (e.key === 'ArrowLeft') go(-1);
  else if (e.key === ' ') { e.preventDefault(); flip(); }
});

renderGrid();
refreshBanner();
</script>
</body>
</html>
