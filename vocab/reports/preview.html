i thứ từ chính trị đến các mối quan hệ cá nhân.", "syn": [], "cefr": "C1", "ref": "note:1788603785327"}, {"id": "0352b5e36bf30a71", "front": "eftsoons", "pos": "adverb", "ipa": "", "vi": "ngay sau đó, tức thì", "en": "", "ex": "The knight drew his sword, and eftsoons the dragon let out a fearsome roar.", "exvi": "Người hiệp sĩ rút kiếm ra, và ngay sau đó con rồng gầm lên một tiếng đáng sợ.", "syn": [], "cefr": "C2", "ref": "note:1788603785328"}, {"id": "c1c5365f43aae8ab", "front": "inconsequential", "pos": "adjective", "ipa": "", "vi": "không quan trọng, không đáng kể", "en": "", "ex": "Compared to the massive budget cuts, the debate over the color of the new office chairs seemed utterly inconsequential.", "exvi": "So với việc cắt giảm ngân sách khổng lồ, cuộc tranh luận về màu sắc của những chiếc ghế văn phòng mới có vẻ hoàn toàn không đáng kể.", "syn": [], "cefr": "C1", "ref": "note:1788603785329"}, {"id": "8ce5a4311b3bc9f8", "front": "forthwith", "pos": "adverb", "ipa": "", "vi": "ngay lập tức, không chậm trễ", "en": "", "ex": "Upon receiving the judge&#x27;s order, the company was required to cease operations forthwith.", "exvi": "Khi nhận được lệnh của thẩm phán, công ty được yêu cầu phải ngừng hoạt động ngay lập tức.", "syn": [], "cefr": "C2", "ref": "note:1788603785330"}, {"id": "f43f795c9da2fcf4", "front": "induce", "pos": "verb", "ipa": "", "vi": "gây ra, thuyết phục", "en": "", "ex": "The doctor decided to induce labor because the baby was overdue.", "exvi": "Bác sĩ đã quyết định gây chuyển dạ vì em bé đã quá ngày dự sinh.", "syn": [], "cefr": "B2", "ref": "note:1788603785331"}, {"id": "b19733decd3a561f", "front": "thee", "pos": "pronoun", "ipa": "", "vi": "ngươi, bạn (tân ngữ, dạng cổ)", "en": "", "ex": "Hark, I tell thee, the king&#x27;s messenger approaches.", "exvi": "Nghe này, ta nói cho ngươi biết, sứ giả của nhà vua đang đến gần.", "syn": [], "cefr": "C2", "ref": "note:1788603785332"}, {"id": "89ae663a77e702ef", "front": "unclassifiable", "pos": "adjective", "ipa": "", "vi": "không thể phân loại, khó xếp hạng", "en": "", "ex": "The newly discovered deep-sea creature, with its bizarre mix of fish and insect-like features, was deemed unclassifiable by the team of marine biologists.", "exvi": "Sinh vật biển sâu mới được phát hiện, với sự kết hợp kỳ lạ giữa các đặc điểm giống cá và côn trùng, đã được nhóm nhà sinh vật học biển cho là không thể phân loại.", "syn": [], "cefr": "C1", "ref": "note:1788603785333"}, {"id": "a391887590e7c689", "front": "thy", "pos": "determiner", "ipa": "", "vi": "của ngươi, của bạn (cổ)", "en": "", "ex": "In the famous prayer, it says &#x27;Hallowed be thy name.&#x27;", "exvi": "Trong lời cầu nguyện nổi tiếng, có câu &#x27;Xin cho danh Người được tôn vinh.&#x27;", "syn": [], "cefr": "C2", "ref": "note:1788603785334"}, {"id": "a409b2bfeddd8e48", "front": "irresolvable", "pos": "adjective", "ipa": "", "vi": "không thể giải quyết, không thể hòa giải", "en": "", "ex": "The border dispute between the two nations seemed irresolvable, with neither side willing to compromise.", "exvi": "Tranh chấp biên giới giữa hai quốc gia dường như không thể giải quyết, vì không bên nào chịu nhượng bộ.", "syn": [], "cefr": "C1", "ref": "note:1788603785335"}, {"id": "e84de4512da6ce9f", "front": "hither", "pos": "adverb", "ipa": "", "vi": "đến đây, tới nơi này", "en": "", "ex": "The wizard beckoned, saying, &#x27;Come hither, and I shall show you a vision of the future.&#x27;", "exvi": "Vị pháp sư vẫy gọi, nói rằng: &#x27;Hãy lại đây, và ta sẽ cho ngươi thấy một viễn cảnh của tương lai.&#x27;", "syn": [], "cefr": "C2", "ref": "note:1788603785336"}, {"id": "044446a74d24ff00", "front": "scrupulous", "pos": "adjective", "ipa": "", "vi": "tỉ mỉ và cẩn trọng, kỹ lưỡng về đạo đức", "en": "", "ex": "The scrupulous accountant double-checked every figure to ensure the company's financial records were both accurate and ethical.", "exvi": "Người kế toán tỉ mỉ đã kiểm tra lại từng con số để đảm bảo hồ sơ tài chính của công ty vừa chính xác vừa có đạo đức.", "syn": [], "cefr": "C1", "ref": "note:1788603785337"}, {"id": "52750ea34fb0465a", "front": "thou", "pos": "pronoun", "ipa": "", "vi": "ngươi, mày", "en": "", "ex": "O Romeo, Romeo, wherefore art thou Romeo?", "exvi": "Ôi Romeo, Romeo, vì sao chàng lại là Romeo?", "syn": [], "cefr": "C2", "ref": "note:1788603785338"}, {"id": "6a73984544b89a51", "front": "insuperable", "pos": "adjective", "ipa": "", "vi": "không thể vượt qua, không thể khắc phục", "en": "", "ex": "Despite their best efforts, the team faced an insuperable lead from their opponents in the final quarter.", "exvi": "Bất chấp những nỗ lực hết mình, đội đã phải đối mặt với một khoảng cách điểm không thể vượt qua từ đối thủ trong hiệp cuối.", "syn": [], "cefr": "C2", "ref": "note:1788603785339"}, {"id": "349b93ba2d023aea", "front": "methinks", "pos": "verb", "ipa": "", "vi": "tôi nghĩ rằng, dường như với tôi", "en": "", "ex": "He proclaims his innocence, but methinks he knows more than he is telling.", "exvi": "Anh ta tuyên bố mình vô tội, nhưng tôi nghĩ rằng anh ta biết nhiều hơn những gì anh ta đang nói.", "syn": [], "cefr": "C2", "ref": "note:1788603785340"}, {"id": "76693d0ab56f17d5", "front": "underscore", "pos": "verb", "ipa": "", "vi": "nhấn mạnh, gạch dưới", "en": "", "ex": "The tragic accident underscores the need for stricter safety regulations on the highway.", "exvi": "Vụ tai nạn thảm khốc nhấn mạnh sự cần thiết phải có các quy định an toàn nghiêm ngặt hơn trên đường cao tốc.", "syn": [], "cefr": "B2", "ref": "note:1788603785341"}, {"id": "21b495ff793a81ef", "front": "equivalence", "pos": "noun", "ipa": "", "vi": "sự tương đương, sự bằng nhau", "en": "", "ex": "The treaty established a military equivalence between the two countries, preventing either from gaining a significant advantage.", "exvi": "Hiệp ước đã thiết lập một sự tương đương về quân sự giữa hai quốc gia, ngăn cản một trong hai bên giành được lợi thế đáng kể.", "syn": [], "cefr": "C1", "ref": "note:1788603785343"}, {"id": "13341d6d1ad8bdaf", "front": "tenuous", "pos": "adjective", "ipa": "", "vi": "mỏng manh, không chắc chắn", "en": "", "ex": "The prosecutor's case was built on a tenuous link between the suspect and the crime scene.", "exvi": "Luận cứ của công tố viên được xây dựng dựa trên một mối liên hệ mỏng manh giữa nghi phạm và hiện trường vụ án.", "syn": [], "cefr": "C1", "ref": "note:1788603785345"}, {"id": "263609245337c35f", "front": "nebulous", "pos": "adjective", "ipa": "", "vi": "mơ hồ, không rõ ràng", "en": "", "ex": "The politician gave a nebulous answer to the reporter's question about her future plans.", "exvi": "Vị chính trị gia đã đưa ra một câu trả lời mơ hồ cho câu hỏi của phóng viên về các kế hoạch tương lai của bà.", "syn": [], "cefr": "C1", "ref": "note:1788603785347"}, {"id": "c1d262a5d7bb0a45", "front": "ceremoniously", "pos": "adverb", "ipa": "", "vi": "một cách trang trọng, theo nghi thức", "en": "", "ex": "The principal ceremoniously handed the diploma to each graduate during the commencement ceremony.", "exvi": "Thầy hiệu trưởng đã trang trọng trao bằng tốt nghiệp cho từng sinh viên trong lễ tốt nghiệp.", "syn": [], "cefr": "C1", "ref": "note:1788603785349"}, {"id": "39c1c0187f9758c2", "front": "convey", "pos": "verb", "ipa": "", "vi": "Truyền tải, diễn đạt (thông điệp, cảm xúc)", "en": "", "ex": "Using vivid patches of color, the painter ensured that deep human emotions were powerfully conveyed without depicting literal objects.", "exvi": "Sử dụng những mảng màu rực rỡ, họa sĩ đảm bảo rằng những cảm xúc sâu kín của con người được truyền tải mạnh mẽ mà không cần khắc họa các vật thể cụ thể.", "syn": [], "cefr": "B2", "ref": "note:1788603785351"}, {"id": "a8a45898ace41f1a", "front": "denounce", "pos": "verb", "ipa": "", "vi": "tố cáo, lên án", "en": "", "ex": "The human rights group was quick to denounce the government's violent crackdown on protesters.", "exvi": "Tổ chức nhân quyền đã nhanh chóng lên án cuộc đàn áp bạo lực của chính phủ đối với người biểu tình.", "syn": [], "cefr": "C1", "ref": "note:1788603785353"}, {"id": "efaebd1415ec4c03", "front": "detractor", "pos": "noun", "ipa": "", "vi": "người gièm pha, người chỉ trích", "en": "", "ex": "Even the president's loudest detractors have to admit that he is a brilliant strategist.", "exvi": "Ngay cả những người chỉ trích lớn tiếng nhất của tổng thống cũng phải thừa nhận rằng ông là một nhà chiến lược tài ba.", "syn": [], "cefr": "C1", "ref": "note:1788603785355"}, {"id": "c7eb581bd21b7d06", "front": "nullify", "pos": "verb", "ipa": "", "vi": "vô hiệu hóa, hủy bỏ", "en": "", "ex": "The court's decision will nullify the existing contract between the two companies.", "exvi": "Quyết định của tòa án sẽ vô hiệu hóa hợp đồng hiện tại giữa hai công ty.", "syn": [], "cefr": "C1", "ref": "note:1788603785357"}, {"id": "52580647d23013c2", "front": "assuage", "pos": "verb", "ipa": "", "vi": "làm dịu bớt, xoa dịu", "en": "", "ex": "The government has tried to assuage the public's fears about the spread of the virus.", "exvi": "Chính phủ đã cố gắng xoa dịu nỗi lo của công chúng về sự lây lan của virus.", "syn": [], "cefr": "C1", "ref": "note:1788603785359"}, {"id": "5807450bce8fac33", "front": "scrutinize", "pos": "verb", "ipa": "", "vi": "xem xét kỹ lưỡng, kiểm tra cẩn thận", "en": "", "ex": "The lawyer had to scrutinize every clause in the contract before her client signed it.", "exvi": "Nữ luật sư đã phải xem xét kỹ lưỡng từng điều khoản trong hợp đồng trước khi thân chủ của cô ấy ký tên.", "syn": [], "cefr": "B2", "ref": "note:1788603785361"}, {"id": "10aa32cc38caf211", "front": "explicable", "pos": "adjective", "ipa": "", "vi": "có thể giải thích được, có thể hiểu được", "en": "", "ex": "His sudden change in behavior was perfectly explicable once we learned about his family problems.", "exvi": "Sự thay đổi đột ngột trong hành vi của anh ấy hoàn toàn có thể giải thích được khi chúng tôi biết về vấn đề gia đình của anh.", "syn": [], "cefr": "C1", "ref": "note:1788603785363"}, {"id": "8020d8fab221976f", "front": "sanction", "pos": "verb, noun", "ipa": "", "vi": "sự cho phép, lệnh trừng phạt", "en": "", "ex": "The United Nations voted to impose economic sanctions on the country for violating the treaty.", "exvi": "Liên Hợp Quốc đã bỏ phiếu áp đặt các lệnh trừng phạt kinh tế đối với quốc gia này vì vi phạm hiệp ước.", "syn": [], "cefr": "C1", "ref": "note:1788603785365"}]}, {"key": "anki_starter-set09", "title": "Flashcard SAT Starter Set 09", "deck": "anki_starter", "count": 50, "cards": [{"id": "eca55742406d9428", "front": "extraneous", "pos": "adjective", "ipa": "", "vi": "không liên quan, không cần thiết", "en": "", "ex": "The professor asked him to remove the extraneous details from his essay to make the main argument clearer.", "exvi": "Giáo sư yêu cầu anh ấy loại bỏ những chi tiết không liên quan ra khỏi bài luận để làm cho luận điểm chính rõ ràng hơn.", "syn": [], "cefr": "C1", "ref": "note:1788603785367"}, {"id": "f0e544eea8703130", "front": "defunct", "pos": "adjective", "ipa": "", "vi": "không còn tồn tại, không còn hoạt động", "en": "", "ex": "The once-popular social media platform is now defunct, replaced by newer, more dynamic apps.", "exvi": "Nền tảng mạng xã hội từng rất phổ biến đó giờ đã không còn hoạt động, bị thay thế bởi các ứng dụng mới hơn, năng động hơn.", "syn": [], "cefr": "C1", "ref": "note:1788603785369"}, {"id": "f637c88a9bf45fc7", "front": "innovative", "pos": "adjective", "ipa": "", "vi": "sáng tạo, đổi mới", "en": "", "ex": "The company's innovative approach to marketing quickly captured the attention of young consumers.", "exvi": "Cách tiếp cận marketing sáng tạo của công ty đã nhanh chóng thu hút sự chú ý của người tiêu dùng trẻ.", "syn": [], "cefr": "B2", "ref": "note:1788603785371"}, {"id": "93251fdc19c2ad18", "front": "reverence", "pos": "noun", "ipa": "", "vi": "sự tôn kính, lòng sùng kính", "en": "", "ex": "The crowd stood in silent reverence as the veterans' parade passed by.", "exvi": "Đám đông đứng im trong sự tôn kính khi đoàn diễu hành của các cựu chiến binh đi qua.", "syn": [], "cefr": "C1", "ref": "note:1788603785373"}, {"id": "0bccb774b4bc0467", "front": "assent", "pos": "verb, noun", "ipa": "", "vi": "tán thành, đồng ý", "en": "", "ex": "The committee assented to the proposal after a long debate.", "exvi": "Ủy ban đã tán thành đề xuất sau một cuộc tranh luận dài.", "syn": [], "cefr": "C1", "ref": "note:1788603785375"}, {"id": "9fe1c672c14964fb", "front": "exacerbate", "pos": "verb", "ipa": "", "vi": "làm trầm trọng thêm, làm tồi tệ hơn", "en": "", "ex": "His sarcastic comments only exacerbated the already tense situation.", "exvi": "Những bình luận mỉa mai của anh ta chỉ làm trầm trọng thêm tình hình vốn đã căng thẳng.", "syn": [], "cefr": "C1", "ref": "note:1788603785377"}, {"id": "5c79f81118c98574", "front": "bolster", "pos": "verb", "ipa": "", "vi": "củng cố, ủng hộ", "en": "", "ex": "The new data will bolster our argument for increased funding.", "exvi": "Dữ liệu mới sẽ củng cố lập luận của chúng tôi về việc tăng ngân sách.", "syn": [], "cefr": "C1", "ref": "note:1788603785379"}, {"id": "c53f4c569ca3f579", "front": "obscure", "pos": "adjective / verb", "ipa": "", "vi": "không rõ ràng, che khuất", "en": "", "ex": "The details of his early life remain obscure, as he rarely spoke of his childhood.", "exvi": "Các chi tiết về thời thơ ấu của ông vẫn còn mơ hồ, vì ông hiếm khi nói về tuổi thơ của mình.", "syn": [], "cefr": "B2", "ref": "note:1788603785381"}, {"id": "eab80aff85f4a618", "front": "unprecedented", "pos": "adjective", "ipa": "", "vi": "chưa từng có, không có tiền lệ", "en": "", "ex": "The company's profits this year have grown at an unprecedented rate.", "exvi": "Lợi nhuận của công ty năm nay đã tăng trưởng với tốc độ chưa từng có.", "syn": [], "cefr": "C1", "ref": "note:1788603785383"}, {"id": "56ff7e04258d07f4", "front": "empirical", "pos": "adjective", "ipa": "", "vi": "mang tính thực nghiệm; dựa trên quan sát và trải nghiệm thực tế thay vì lý thuyết thuần túy", "en": "", "ex": "Rather than relying on speculative economic models, the researcher presented empirical evidence gathered from decades of market observations to support her hypothesis.", "exvi": "Thay vì dựa vào các mô hình kinh tế mang tính suy đoán, nhà nghiên cứu đã đưa ra bằng chứng thực nghiệm được thu thập từ nhiều thập kỷ quan sát thị trường để củng cố giả thuyết của mình.", "syn": [], "cefr": "C1", "ref": "note:1788603785385"}, {"id": "75336c95b28d8729", "front": "disinterested", "pos": "adjective", "ipa": "", "vi": "vô tư, không thiên vị", "en": "", "ex": "A judge must be a disinterested party in any case she oversees to ensure a fair trial.", "exvi": "Một thẩm phán phải là một bên vô tư trong bất kỳ vụ án nào mà bà ấy giám sát để đảm bảo một phiên tòa công bằng.", "syn": [], "cefr": "C1", "ref": "note:1788603785387"}, {"id": "1443ff19d0feb6de", "front": "anomaly", "pos": "noun", "ipa": "", "vi": "sự bất thường, điều dị thường", "en": "", "ex": "The scientists were puzzled by the anomaly in the climate data, which showed a sudden, unexpected drop in temperature.", "exvi": "Các nhà khoa học đã bối rối trước sự bất thường trong dữ liệu khí hậu, vốn cho thấy nhiệt độ giảm đột ngột và bất ngờ.", "syn": [], "cefr": "C1", "ref": "note:1788603785389"}, {"id": "ca2d6c564205f824", "front": "feasible", "pos": "adjective", "ipa": "", "vi": "khả thi, có thể thực hiện được", "en": "", "ex": "With the new funding, the ambitious construction project is now considered feasible.", "exvi": "Với nguồn vốn mới, dự án xây dựng đầy tham vọng này giờ đây được coi là khả thi.", "syn": [], "cefr": "B2", "ref": "note:1788603785391"}, {"id": "e59490b1909b6d18", "front": "dispassionate", "pos": "adjective", "ipa": "", "vi": "vô tư, khách quan", "en": "", "ex": "A good journalist must remain dispassionate and report the facts, even when the story is emotionally charged.", "exvi": "Một nhà báo giỏi phải giữ được thái độ vô tư và tường thuật sự thật, ngay cả khi câu chuyện gây xúc động mạnh.", "syn": [], "cefr": "C1", "ref": "note:1788603785393"}, {"id": "eefd29096956afbe", "front": "alleviate", "pos": "verb", "ipa": "", "vi": "làm giảm bớt, làm dịu đi", "en": "", "ex": "The new medicine did little to alleviate her suffering.", "exvi": "Loại thuốc mới không giúp làm dịu đi cơn đau của cô ấy là bao.", "syn": [], "cefr": "C1", "ref": "note:1788603785395"}, {"id": "5933725a38d61c10", "front": "conflate", "pos": "verb", "ipa": "", "vi": "kết hợp, đánh đồng", "en": "", "ex": "She conflated the results of the two different studies, mistakenly presenting them as a single conclusion.", "exvi": "Cô ấy đã đánh đồng kết quả của hai nghiên cứu khác nhau, và trình bày chúng một cách sai lầm như một kết luận duy nhất.", "syn": [], "cefr": "C1", "ref": "note:1788603785397"}, {"id": "6e76c59f5b67adec", "front": "disparage", "pos": "verb", "ipa": "", "vi": "gièm pha, chê bai", "en": "", "ex": "It is never right to disparage people based on their background.", "exvi": "Việc gièm pha người khác dựa trên xuất thân của họ là không bao giờ đúng.", "syn": [], "cefr": "C1", "ref": "note:1788603785399"}, {"id": "377c9e5e015a0f9a", "front": "sustainable", "pos": "adjective", "ipa": "", "vi": "bền vững, có thể duy trì", "en": "", "ex": "Many companies are now focusing on sustainable practices to reduce their environmental impact.", "exvi": "Nhiều công ty hiện đang tập trung vào các phương pháp bền vững để giảm tác động đến môi trường.", "syn": [], "cefr": "B2", "ref": "note:1788603785401"}, {"id": "e59b053f85f2b58e", "front": "postulate", "pos": "verb", "ipa": "", "vi": "đưa ra giả thuyết, mặc nhận", "en": "", "ex": "Scientists postulate that the universe is expanding at an accelerating rate.", "exvi": "Các nhà khoa học đưa ra giả thuyết rằng vũ trụ đang giãn nở với tốc độ ngày càng nhanh.", "syn": [], "cefr": "C1", "ref": "note:1788603785403"}, {"id": "9aab0358a15c8172", "front": "confound", "pos": "verb", "ipa": "", "vi": "làm bối rối, chứng minh là sai", "en": "", "ex": "The unexpected test results confounded the scientists, forcing them to rethink their entire theory.", "exvi": "Kết quả xét nghiệm bất ngờ đã làm các nhà khoa học bối rối, buộc họ phải suy nghĩ lại toàn bộ giả thuyết của mình.", "syn": [], "cefr": "C1", "ref": "note:1788603785405"}, {"id": "2421eb2822111f08", "front": "antithetical", "pos": "adjective", "ipa": "", "vi": "đối lập hoàn toàn, tương phản trực tiếp", "en": "", "ex": "The culture of consumerism is antithetical to the principles of environmental conservation.", "exvi": "Văn hóa tiêu dùng hoàn toàn đối lập với các nguyên tắc bảo tồn môi trường.", "syn": [], "cefr": "C1", "ref": "note:1788603785407"}, {"id": "9ff9bd438c78f8a6", "front": "disparate", "pos": "adjective", "ipa": "", "vi": "khác hẳn nhau, không liên quan", "en": "", "ex": "The study brought together disparate groups of people who had never worked together before.", "exvi": "Nghiên cứu đã quy tụ những nhóm người khác hẳn nhau mà trước đây chưa từng làm việc cùng nhau.", "syn": [], "cefr": "C1", "ref": "note:1788603785409"}, {"id": "e8b22df6e51ab09e", "front": "irrelevant", "pos": "adjective", "ipa": "", "vi": "không liên quan, không thích hợp", "en": "", "ex": "Her comment about the weather was completely irrelevant to our discussion about the company's financial crisis.", "exvi": "Lời bình luận của cô ấy về thời tiết hoàn toàn không liên quan đến cuộc thảo luận của chúng ta về khủng hoảng tài chính của công ty.", "syn": [], "cefr": "B2", "ref": "note:1788603785411"}, {"id": "e0d9fb45ea9e021c", "front": "rebut", "pos": "verb", "ipa": "", "vi": "bác bỏ, phản bác", "en": "", "ex": "The defense lawyer called a new witness to rebut the prosecutor's accusation.", "exvi": "Luật sư bào chữa đã gọi một nhân chứng mới để bác bỏ lời buộc tội của công tố viên.", "syn": [], "cefr": "C1", "ref": "note:1788603785413"}, {"id": "8447acffdcc1cec9", "front": "attest", "pos": "phrasal verb", "ipa": "", "vi": "chứng thực, xác nhận", "en": "", "ex": "The numerous five-star reviews attest to the quality of the hotel's service.", "exvi": "Vô số đánh giá năm sao đã chứng thực cho chất lượng dịch vụ của khách sạn.", "syn": [], "cefr": "C1", "ref": "note:1788603785415"}, {"id": "21099538a4b3d269", "front": "heterogeneity", "pos": "noun", "ipa": "", "vi": "sự không đồng nhất, tính đa dạng", "en": "", "ex": "The city is celebrated for its cultural heterogeneity, with residents from over a hundred different countries.", "exvi": "Thành phố này nổi tiếng vì sự đa dạng văn hóa, với cư dân đến từ hơn một trăm quốc gia khác nhau.", "syn": [], "cefr": "C2", "ref": "note:1788603785417"}, {"id": "5ff1393022b35277", "front": "homogeneity", "pos": "noun", "ipa": "", "vi": "sự đồng nhất, sự đồng đều", "en": "", "ex": "The cultural homogeneity of the small town was comforting to some but stifling to others.", "exvi": "Sự đồng nhất về văn hóa của thị trấn nhỏ này mang lại cảm giác dễ chịu cho một số người nhưng lại ngột ngạt đối với những người khác.", "syn": [], "cefr": "C2", "ref": "note:1788603785419"}, {"id": "36be59ba3bcb64af", "front": "abate", "pos": "verb", "ipa": "", "vi": "làm dịu đi, giảm bớt", "en": "", "ex": "As the hurricane's winds began to abate, the residents cautiously emerged from their shelters.", "exvi": "Khi sức gió của cơn bão bắt đầu giảm bớt, người dân đã thận trọng ra khỏi nơi trú ẩn.", "syn": [], "cefr": "B2", "ref": "note:1788603785421"}, {"id": "c694a67797ed0278", "front": "subvert", "pos": "verb", "ipa": "", "vi": "lật đổ, phá hoại ngầm", "en": "", "ex": "The rebel group attempted to subvert the government by spreading misinformation and organizing secret protests.", "exvi": "Nhóm nổi dậy đã cố gắng lật đổ chính quyền bằng cách lan truyền thông tin sai lệch và tổ chức các cuộc biểu tình bí mật.", "syn": [], "cefr": "C1", "ref": "note:1788603785423"}, {"id": "9d3e308659aca53d", "front": "hypothesized", "pos": "verb", "ipa": "", "vi": "đặt giả thuyết, giả định", "en": "", "ex": "Scientists hypothesized that the massive extinction event was caused by a giant asteroid impact.", "exvi": "Các nhà khoa học đã đưa ra giả thuyết rằng sự kiện tuyệt chủng hàng loạt là do một vụ va chạm tiểu hành tinh khổng lồ gây ra.", "syn": [], "cefr": "C1", "ref": "note:1788603785425"}, {"id": "2babce0797da9869", "front": "replicability", "pos": "noun", "ipa": "", "vi": "khả năng sao chép, khả năng tái tạo", "en": "", "ex": "The replicability of the experiment's results is crucial for its scientific validity.", "exvi": "Khả năng tái tạo kết quả của thí nghiệm là rất quan trọng đối với tính hợp lệ khoa học của nó.", "syn": [], "cefr": "C1", "ref": "note:1788603785427"}, {"id": "ffc1e156158bdc6b", "front": "robustness", "pos": "noun", "ipa": "", "vi": "Sự vững chắc, sự mạnh mẽ.", "en": "", "ex": "The robustness of the new software was tested against various cyberattacks.", "exvi": "Sự vững chắc của phần mềm mới đã được thử nghiệm trước nhiều cuộc tấn công mạng khác nhau.", "syn": [], "cefr": "C1", "ref": "note:1788603785429"}, {"id": "f547abe855645618", "front": "diminish", "pos": "verb", "ipa": "", "vi": "Làm giảm bớt, thu hẹp, suy giảm", "en": "", "ex": "Dense forest canopies can diminish the carrying power of high-frequency bird calls, forcing species to sing at lower pitches.", "exvi": "Tán rừng rậm rạp có thể làm giảm bớt sức truyền của tiếng hót chim có tần số cao, buộc các loài phải hót ở cao độ thấp hơn.", "syn": [], "cefr": "B2", "ref": "note:1788603785431"}, {"id": "fd1bec786f9945e2", "front": "deferential", "pos": "adjective", "ipa": "", "vi": "tôn trọng, kính cẩn", "en": "", "ex": "The young intern was always deferential to the senior managers, never interrupting them during meetings.", "exvi": "Anh chàng thực tập sinh trẻ luôn tỏ ra kính cẩn với các quản lý cấp cao, không bao giờ ngắt lời họ trong các cuộc họp.", "syn": [], "cefr": "C1", "ref": "note:1788603785433"}, {"id": "576e18f79fd3fe24", "front": "divergent", "pos": "adjective", "ipa": "", "vi": "khác biệt, phân kỳ", "en": "", "ex": "They held widely divergent opinions on the new policy, which led to a heated debate.", "exvi": "Họ có những ý kiến rất khác biệt về chính sách mới, điều này đã dẫn đến một cuộc tranh luận nảy lửa.", "syn": [], "cefr": "C1", "ref": "note:1788603785435"}, {"id": "3abeebb33a48353a", "front": "counterintuitive", "pos": "adjective", "ipa": "", "vi": "Phản trực giác, trái với lẽ thường.", "en": "", "ex": "It's counterintuitive, but sometimes you have to spend money to make money.", "exvi": "Nghe có vẻ phản trực giác, nhưng đôi khi bạn phải tiêu tiền để kiếm ra tiền.", "syn": [], "cefr": "C1", "ref": "note:1788603785437"}, {"id": "62a4bc8d6c7ec189", "front": "ostensible", "pos": "adjective", "ipa": "", "vi": "bề ngoài là, có vẻ là", "en": "", "ex": "Their ostensible reason for the visit was to see the new baby, but they really wanted to borrow money.", "exvi": "Lý do bề ngoài cho chuyến thăm của họ là để xem em bé mới sinh, nhưng thực ra họ muốn mượn tiền.", "syn": [], "cefr": "C1", "ref": "note:1788603785439"}, {"id": "7b6b507acc45a047", "front": "compensate for", "pos": "verb", "ipa": "", "vi": "Bù đắp cho, đền bù cho", "en": "", "ex": "Eyeless centipedes compensate for their lack of vision by using sensitive thermal receptors to detect light and heat.", "exvi": "Những con rết không có mắt bù đắp cho việc thiếu thị giác bằng cách sử dụng các thụ thể nhiệt nhạy bén để phát hiện ánh sáng và nhiệt.", "syn": [], "cefr": "B2", "ref": "note:1788603785441"}, {"id": "033a31b4dc4e3b32", "front": "prosaic", "pos": "adjective", "ipa": "", "vi": "tầm thường, không lãng mạn; nhàm chán, thiếu sáng tạo", "en": "", "ex": "The students' prosaic essays about their summer holidays bored the teacher.", "exvi": "Những bài luận tầm thường của học sinh về kỳ nghỉ hè đã làm giáo viên chán ngán.", "syn": [], "cefr": "C1", "ref": "note:1788603785443"}, {"id": "bd510b2791653ec8", "front": "obviate the need", "pos": "phrasal verb", "ipa": "", "vi": "loại bỏ sự cần thiết, phòng ngừa", "en": "", "ex": "The new automated system will obviate the need for manual data entry, saving us hours of work.", "exvi": "Hệ thống tự động mới sẽ loại bỏ sự cần thiết của việc nhập liệu thủ công, giúp chúng ta tiết kiệm hàng giờ làm việc.", "syn": [], "cefr": "C1", "ref": "note:1788603785445"}, {"id": "5918165db39f6e4d", "front": "propensity", "pos": "noun", "ipa": "", "vi": "khuynh hướng tự nhiên, thiên hướng", "en": "", "ex": "He has a propensity for telling ridiculously exaggerated stories.", "exvi": "Anh ấy có thiên hướng kể những câu chuyện được phóng đại một cách lố bịch.", "syn": [], "cefr": "C1", "ref": "note:1788603785447"}, {"id": "627ad7ca22bd28a0", "front": "salient", "pos": "adjective", "ipa": "", "vi": "nổi bật nhất, quan trọng nhất", "en": "", "ex": "The salient point of his argument was that the proposed law would be too expensive to implement.", "exvi": "Điểm nổi bật nhất trong lập luận của anh ấy là bộ luật được đề xuất sẽ quá tốn kém để thực thi.", "syn": [], "cefr": "C1", "ref": "note:1788603785449"}, {"id": "7cbbd2fea6b53369", "front": "disguise", "pos": "verb", "ipa": "", "vi": "Ngụy trang, che giấu, xóa nhòa", "en": "", "ex": "By blending folk melodies with modern electronic instruments, the artists disguised traditional boundaries between musical genres.", "exvi": "Bằng cách kết hợp các giai điệu dân gian với nhạc cụ điện tử hiện đại, các nghệ sĩ đã xóa nhòa ranh giới truyền thống giữa các thể loại âm nhạc.", "syn": [], "cefr": "B2", "ref": "note:1788603785451"}, {"id": "20a9c923da1c6431", "front": "specious", "pos": "adjective", "ipa": "", "vi": "có vẻ hợp lý, chỉ là bề ngoài", "en": "", "ex": "The politician's specious argument for tax cuts won over many voters, but it was based on flawed economic data.", "exvi": "Lập luận có vẻ hợp lý của chính trị gia về việc cắt giảm thuế đã thuyết phục được nhiều cử tri, nhưng nó lại dựa trên dữ liệu kinh tế sai sót.", "syn": [], "cefr": "C1", "ref": "note:1788603785453"}, {"id": "e3c7265a5538bc3c", "front": "anomalous", "pos": "adjective", "ipa": "", "vi": "bất thường, dị thường", "en": "", "ex": "For the year, the company reported anomalous growth in a period of economic decline.", "exvi": "Trong năm, công ty đã báo cáo sự tăng trưởng bất thường trong một giai đoạn kinh tế suy thoái.", "syn": [], "cefr": "C1", "ref": "note:1788603785455"}, {"id": "09d745c974f2777d", "front": "conflated", "pos": "phrasal verb", "ipa": "", "vi": "đánh đồng, gộp làm một", "en": "", "ex": "People often conflated the author's personal views with those of the characters in his novel.", "exvi": "Mọi người thường đánh đồng quan điểm cá nhân của tác giả với quan điểm của các nhân vật trong tiểu thuyết của ông.", "syn": [], "cefr": "C1", "ref": "note:1788603785457"}, {"id": "61263038a2e9da9c", "front": "contention", "pos": "noun", "ipa": "", "vi": "sự tranh cãi, luận điểm", "en": "", "ex": "The main contention of her argument was that the new law would do more harm than good.", "exvi": "Luận điểm chính trong lập luận của cô ấy là bộ luật mới sẽ gây hại nhiều hơn là có lợi.", "syn": [], "cefr": "C1", "ref": "note:1788603785459"}, {"id": "7420b5d1988b988e", "front": "realize", "pos": "verb", "ipa": "", "vi": "Hiện thực hóa, đạt được (kết quả mong đợi)", "en": "", "ex": "The anticipated air-clearing benefits of urban greenery were not fully realized along narrow streets with heavy vehicular traffic.", "exvi": "Những lợi ích lọc không khí được kỳ vọng của cây xanh đô thị đã không được hiện thực hóa hoàn toàn dọc theo các con phố hẹp có lưu lượng giao thông lớn.", "syn": [], "cefr": "B2", "ref": "note:1788603785461"}, {"id": "23c930d68030f16f", "front": "extrapolate", "pos": "verb", "ipa": "", "vi": "suy luận, ngoại suy", "en": "", "ex": "Based on the first quarter's sales data, we can extrapolate that the company will exceed its annual revenue target.", "exvi": "Dựa trên dữ liệu bán hàng của quý đầu tiên, chúng ta có thể suy luận rằng công ty sẽ vượt mục tiêu doanh thu hàng năm.", "syn": [], "cefr": "C1", "ref": "note:1788603785463"}, {"id": "7cd41ace4326ed1a", "front": "extrapolating", "pos": "phrasal verb", "ipa": "", "vi": "suy ra, ngoại suy", "en": "", "ex": "Extrapolating from the recent survey data, we can predict a significant shift in consumer preferences.", "exvi": "Ngoại suy từ dữ liệu khảo sát gần đây, chúng ta có thể dự đoán một sự thay đổi đáng kể trong sở thích của người tiêu dùng.", "syn": [], "cefr": "C1", "ref": "note:1788603785465"}]}, {"key": "anki_starter-set10", "title": "Flashcard SAT Starter Set 10", "deck": "anki_starter", "count": 50, "cards": [{"id": "eb608811c76e0dfa", "front": "fluctuations", "pos": "noun phrase", "ipa": "", "vi": "sự dao động, sự biến động", "en": "", "ex": "The wild fluctuations in the stock market made investors very nervous.", "exvi": "Sự biến động dữ dội của thị trường chứng khoán đã khiến các nhà đầu tư rất lo lắng.", "syn": [], "cefr": "C1", "ref": "note:1788603785467"}, {"id": "9319523bd872a420", "front": "immaterial", "pos": "adjective phrase", "ipa": "", "vi": "không quan trọng, không liên quan", "en": "", "ex": "The cost of the ticket was immaterial to him, as long as he could see the concert.", "exvi": "Giá vé không quan trọng đối với anh ấy, miễn là anh ấy có thể xem buổi hòa nhạc.", "syn": [], "cefr": "C1", "ref": "note:1788603785469"}, {"id": "0a7c7a3420059474", "front": "derived from", "pos": "phrasal verb", "ipa": "", "vi": "bắt nguồn từ, được phát triển hoặc thu nhận từ cái gì", "en": "", "ex": "Modern Hawaiian literature is largely derived from the traditional oral stories of the Kānaka Maoli.", "exvi": "Văn học Hawaii hiện đại phần lớn bắt nguồn từ các câu chuyện truyền miệng truyền thống của người Kānaka Maoli.", "syn": [], "cefr": "B2", "ref": "note:1788603785471"}, {"id": "c56f4c6f529544df", "front": "overt", "pos": "adjective", "ipa": "", "vi": "công khai, rõ ràng", "en": "", "ex": "The company's overt support for the controversial new law angered many of its customers.", "exvi": "Sự ủng hộ công khai của công ty đối với luật mới gây tranh cãi đã khiến nhiều khách hàng của họ tức giận.", "syn": [], "cefr": "C1", "ref": "note:1788603785473"}, {"id": "a4c6f3368c3e7897", "front": "perpetuate", "pos": "verb", "ipa": "", "vi": "làm cho tồn tại mãi, duy trì", "en": "", "ex": "The new laws will only perpetuate the social injustices that have plagued the country for decades.", "exvi": "Những bộ luật mới sẽ chỉ duy trì mãi những bất công xã hội đã tồn tại ở đất nước này hàng thập kỷ.", "syn": [], "cefr": "C1", "ref": "note:1788603785475"}, {"id": "8d6a57ba3a0859c7", "front": "precedents", "pos": "noun phrase", "ipa": "", "vi": "tiền lệ trong, ví dụ trước đó trong", "en": "", "ex": "The lawyer cited several precedents in copyright law to support her argument that the new song was a clear case of plagiarism.", "exvi": "Luật sư đã trích dẫn một số tiền lệ trong luật bản quyền để hỗ trợ lập luận của mình rằng bài hát mới là một trường hợp đạo nhạc rõ ràng.", "syn": [], "cefr": "C1", "ref": "note:1788603785477"}, {"id": "be120615ab2a6c92", "front": "proliferate", "pos": "verb", "ipa": "", "vi": "tăng nhanh, nảy nở", "en": "", "ex": "With the rise of social media, misinformation can proliferate at an alarming speed.", "exvi": "Với sự phát triển của mạng xã hội, thông tin sai lệch có thể lan truyền với tốc độ đáng báo động.", "syn": [], "cefr": "C1", "ref": "note:1788603785479"}, {"id": "bb074046119cd6e1", "front": "attribute", "pos": "verb", "ipa": "", "vi": "quy cho, cho là do nguyên nhân nào đó", "en": "", "ex": "Microbiologists attributed the noticeably cooler surface temperature of the mushrooms to the evaporation of surface water.", "exvi": "Các nhà vi sinh vật học đã quy nhiệt độ bề mặt mát hơn rõ rệt của những cây nấm là do sự bay hơi của nước trên bề mặt.", "syn": [], "cefr": "B2", "ref": "note:1788603785481"}, {"id": "c54f9f289207dd3e", "front": "banal", "pos": "adjective", "ipa": "", "vi": "sáo rỗng, tầm thường", "en": "", "ex": "The movie's plot was so banal; I predicted the ending within the first ten minutes.", "exvi": "Cốt truyện của bộ phim sáo rỗng đến mức tôi đã đoán được kết cục chỉ trong mười phút đầu.", "syn": [], "cefr": "C1", "ref": "note:1788603785483"}, {"id": "78d5ffde3992efee", "front": "candor", "pos": "noun", "ipa": "", "vi": "sự thẳng thắn, tính trung thực", "en": "", "ex": "She was praised for the candor with which she discussed her mistakes.", "exvi": "Cô ấy được khen ngợi vì sự thẳng thắn khi thảo luận về những sai lầm của mình.", "syn": [], "cefr": "C1", "ref": "note:1788603785485"}, {"id": "296638cc6ac7dc69", "front": "denigrate", "pos": "verb", "ipa": "", "vi": "phỉ báng, gièm pha", "en": "", "ex": "The article denigrated the actor's performance, unfairly calling it the worst of the decade.", "exvi": "Bài báo đã phỉ báng màn trình diễn của nam diễn viên, gọi đó một cách bất công là màn trình diễn tệ nhất thập kỷ.", "syn": [], "cefr": "C1", "ref": "note:1788603785487"}, {"id": "f4a2e87105e5c583", "front": "disingenuous", "pos": "adjective", "ipa": "", "vi": "không thành thật, giả tạo", "en": "", "ex": "His disingenuous apology convinced no one; we all knew he wasn't truly sorry.", "exvi": "Lời xin lỗi không thành thật của anh ta chẳng thuyết phục được ai; tất cả chúng tôi đều biết anh ta không thực sự hối lỗi.", "syn": [], "cefr": "C1", "ref": "note:1788603785489"}, {"id": "921d50ff48d2e0f2", "front": "profound", "pos": "adjective", "ipa": "", "vi": "sâu sắc, to lớn", "en": "", "ex": "The scientist's discovery had a profound impact on our understanding of the universe.", "exvi": "Phát hiện của nhà khoa học đã có một tác động sâu sắc đến sự hiểu biết của chúng ta về vũ trụ.", "syn": [], "cefr": "B2", "ref": "note:1788603785491"}, {"id": "1582aa96252db653", "front": "disseminate", "pos": "verb", "ipa": "", "vi": "phổ biến, lan truyền", "en": "", "ex": "One of the organization's aims is to disseminate information about the disease.", "exvi": "Một trong những mục tiêu của tổ chức là phổ biến thông tin về căn bệnh này.", "syn": [], "cefr": "C1", "ref": "note:1788603785493"}, {"id": "9a3962ce73684c0f", "front": "equitable", "pos": "adjective", "ipa": "", "vi": "công bằng, vô tư", "en": "", "ex": "The new tax law was designed to create a more equitable distribution of wealth.", "exvi": "Luật thuế mới được thiết kế để tạo ra một sự phân bổ của cải công bằng hơn.", "syn": [], "cefr": "C1", "ref": "note:1788603785495"}, {"id": "9ad0a2453a66b3c3", "front": "erratic", "pos": "adjective", "ipa": "", "vi": "thất thường, không đều", "en": "", "ex": "The stock market's performance has been erratic lately, with sharp ups and downs.", "exvi": "Hoạt động của thị trường chứng khoán gần đây rất thất thường, với những đợt tăng giảm đột ngột.", "syn": [], "cefr": "C1", "ref": "note:1788603785497"}, {"id": "a07924d7f3b26f2c", "front": "manifestation", "pos": "noun", "ipa": "", "vi": "sự biểu lộ, hiện thân", "en": "", "ex": "The city's vibrant street art is a clear manifestation of its creative energy.", "exvi": "Nghệ thuật đường phố sôi động của thành phố là một sự biểu lộ rõ ràng cho năng lượng sáng tạo của nó.", "syn": [], "cefr": "C1", "ref": "note:1788603785499"}, {"id": "7479e6aa9254c4b8", "front": "refute", "pos": "verb", "ipa": "", "vi": "bác bỏ, phản bác", "en": "", "ex": "The lawyer presented new evidence to refute the prosecutor's claims.", "exvi": "Vị luật sư đã đưa ra bằng chứng mới để bác bỏ những lời cáo buộc của công tố viên.", "syn": [], "cefr": "B2", "ref": "note:1788603785501"}, {"id": "d3f8ea2996abdb84", "front": "paucity", "pos": "noun", "ipa": "", "vi": "sự khan hiếm, sự ít ỏi", "en": "", "ex": "The paucity of evidence made it difficult for the jury to reach a verdict.", "exvi": "Sự khan hiếm bằng chứng đã khiến bồi thẩm đoàn khó đưa ra phán quyết.", "syn": [], "cefr": "C1", "ref": "note:1788603785503"}, {"id": "856540728c5395e4", "front": "pristine", "pos": "adjective", "ipa": "", "vi": "nguyên sơ, tinh khôi", "en": "", "ex": "The collector kept the vintage comic book in pristine condition, sealed in a protective case.", "exvi": "Nhà sưu tập đã giữ cuốn truyện tranh cổ trong tình trạng nguyên sơ, niêm phong trong một chiếc hộp bảo vệ.", "syn": [], "cefr": "C1", "ref": "note:1788603785505"}, {"id": "a062bc11c768888d", "front": "venerate", "pos": "verb", "ipa": "", "vi": "tôn kính, sùng bái", "en": "", "ex": "The younger generation was taught to venerate their elders for their wisdom and experience.", "exvi": "Thế hệ trẻ được dạy phải tôn kính những người lớn tuổi vì sự thông thái và kinh nghiệm của họ.", "syn": [], "cefr": "C1", "ref": "note:1788603785507"}, {"id": "5ae18f91f74c419f", "front": "affinity", "pos": "noun", "ipa": "", "vi": "sự yêu thích tự nhiên, sự tương đồng", "en": "", "ex": "He has a natural affinity for the music of Chopin, finding it both comforting and inspiring.", "exvi": "Anh ấy có một sự yêu thích bẩm sinh đối với âm nhạc của Chopin, anh thấy nó vừa dễ chịu vừa đầy cảm hứng.", "syn": [], "cefr": "C1", "ref": "note:1788603785509"}, {"id": "1b147906fff3c6e6", "front": "evade", "pos": "verb", "ipa": "", "vi": "trốn tránh, lảng tránh", "en": "", "ex": "The clever politician managed to evade the journalist's difficult questions during the press conference.", "exvi": "Vị chính trị gia thông minh đã xoay sở lảng tránh những câu hỏi hóc búa của nhà báo trong buổi họp báo.", "syn": [], "cefr": "B2", "ref": "note:1788603785511"}, {"id": "ef4dc9d0d3c86bd7", "front": "indigenous", "pos": "adjective", "ipa": "", "vi": "bản xứ, bản địa", "en": "", "ex": "The Maori are the indigenous people of New Zealand, with a rich and unique culture.", "exvi": "Người Maori là dân tộc bản địa của New Zealand, với một nền văn hóa phong phú và độc đáo.", "syn": [], "cefr": "C1", "ref": "note:1788603785513"}, {"id": "0ef19576346617ed", "front": "inextricable", "pos": "adjective", "ipa": "", "vi": "không thể gỡ ra được, không thể tách rời", "en": "", "ex": "In the book, the protagonist's fate is shown to be inextricable from that of his country.", "exvi": "Trong cuốn sách, số phận của nhân vật chính được cho thấy là gắn bó không thể tách rời với vận mệnh của đất nước anh ta.", "syn": [], "cefr": "C1", "ref": "note:1788603785515"}, {"id": "078526a7c9a17349", "front": "orthodox", "pos": "adjective", "ipa": "", "vi": "chính thống, truyền thống", "en": "", "ex": "He holds an orthodox view of the economy, believing in minimal government intervention.", "exvi": "Ông ấy có quan điểm kinh tế chính thống, tin vào sự can thiệp tối thiểu của chính phủ.", "syn": [], "cefr": "B2", "ref": "note:1788603785517"}, {"id": "b060763d00bb7ab3", "front": "magnify", "pos": "verb", "ipa": "", "vi": "phóng đại, làm trầm trọng thêm", "en": "", "ex": "Minor disagreements are often magnified into major arguments when you're tired.", "exvi": "Những bất đồng nhỏ thường bị phóng đại thành các cuộc tranh cãi lớn khi bạn mệt mỏi.", "syn": [], "cefr": "B2", "ref": "note:1788603785519"}, {"id": "0def79768e166e9e", "front": "mock", "pos": "verb", "ipa": "", "vi": "chế nhạo, nhại lại một cách mỉa mai", "en": "", "ex": "The other children mocked him for his new haircut, calling him a 'poodle'.", "exvi": "Những đứa trẻ khác chế nhạo cậu bé vì kiểu tóc mới, gọi cậu là 'chó xù'.", "syn": [], "cefr": "B2", "ref": "note:1788603785521"}, {"id": "c2b62b023dba60ed", "front": "mandatory", "pos": "adjective", "ipa": "", "vi": "bắt buộc, theo luật định", "en": "", "ex": "In many states, it is mandatory to wear a helmet when riding a motorcycle.", "exvi": "Ở nhiều tiểu bang, việc đội mũ bảo hiểm khi đi xe máy là bắt buộc.", "syn": [], "cefr": "B2", "ref": "note:1788603785523"}, {"id": "b023e55374250a28", "front": "capitalize", "pos": "phrasal verb", "ipa": "", "vi": "tận dụng, lợi dụng", "en": "", "ex": "The team capitalized on the opponent's mistake and scored a goal.", "exvi": "Đội bóng đã tận dụng sai lầm của đối thủ và ghi một bàn thắng.", "syn": [], "cefr": "B2", "ref": "note:1788603785525"}, {"id": "369d59413bba50fb", "front": "intricate", "pos": "adjective", "ipa": "", "vi": "phức tạp, rắc rối", "en": "", "ex": "The watchmaker was famous for his intricate designs that required a magnifying glass to fully appreciate.", "exvi": "Người thợ đồng hồ nổi tiếng với những thiết kế phức tạp mà phải cần đến kính lúp mới có thể chiêm ngưỡng trọn vẹn.", "syn": [], "cefr": "B2", "ref": "note:1788603785527"}, {"id": "1e92cc6c2c45296b", "front": "constrain", "pos": "verb", "ipa": "", "vi": "hạn chế, ép buộc", "en": "", "ex": "Scientists are constrained by the amount of funding they can get for their research.", "exvi": "Các nhà khoa học bị hạn chế bởi số tiền tài trợ mà họ có thể nhận được cho nghiên cứu của mình.", "syn": [], "cefr": "B2", "ref": "note:1788603785529"}, {"id": "a7d153cc240aeaa4", "front": "idealize", "pos": "verb", "ipa": "", "vi": "lý tưởng hóa, hoàn hảo hóa", "en": "", "ex": "Many people idealize the past, forgetting the hardships and struggles that actually existed.", "exvi": "Nhiều người lý tưởng hóa quá khứ, quên đi những khó khăn và vất vả đã thực sự tồn tại.", "syn": [], "cefr": "B2", "ref": "note:1788603785531"}, {"id": "5b3b85b515695c8e", "front": "distort", "pos": "verb", "ipa": "", "vi": "bóp méo, xuyên tạc", "en": "", "ex": "The media can distort reality by focusing only on the negative aspects of a story.", "exvi": "Giới truyền thông có thể bóp méo sự thật bằng cách chỉ tập trung vào các khía cạnh tiêu cực của một câu chuyện.", "syn": [], "cefr": "B2", "ref": "note:1788603785533"}, {"id": "d3dac80c7d1aa7b8", "front": "ambiguity", "pos": "noun", "ipa": "", "vi": "sự mơ hồ, sự tối nghĩa", "en": "", "ex": "The ambiguity of the contract's language led to a lengthy legal dispute between the two companies.", "exvi": "Sự tối nghĩa trong ngôn ngữ của hợp đồng đã dẫn đến một cuộc tranh chấp pháp lý kéo dài giữa hai công ty.", "syn": [], "cefr": "B2", "ref": "note:1788603785535"}, {"id": "64774f2aacfce8bc", "front": "hamper", "pos": "verb", "ipa": "", "vi": "cản trở, gây vướng víu", "en": "", "ex": "Heavy rain and strong winds hampered the rescue efforts.", "exvi": "Mưa lớn và gió mạnh đã cản trở nỗ lực cứu hộ.", "syn": [], "cefr": "B2", "ref": "note:1788603785537"}, {"id": "1115dc2159031945", "front": "conceal", "pos": "verb", "ipa": "", "vi": "che giấu, giấu kín", "en": "", "ex": "The elusive author made every effort to conceal her private life from the intrusive media.", "exvi": "Tác giả kín tiếng đã nỗ lực hết mình để che giấu đời sống riêng tư khỏi giới truyền thông săm soi.", "syn": [], "cefr": "B2", "ref": "note:1788603785539"}, {"id": "161cfca6929efb95", "front": "neutral", "pos": "adjective", "ipa": "", "vi": "trung lập, không thiên vị", "en": "", "ex": "The mediator remained entirely neutral, listening carefully to both parties without showing bias.", "exvi": "Người hòa giải giữ lập trường hoàn toàn trung lập, lắng nghe cẩn thận cả hai bên mà không tỏ ra thiên vị.", "syn": [], "cefr": "B2", "ref": "note:1788603785541"}, {"id": "21741c63545bee0d", "front": "prank", "pos": "noun", "ipa": "", "vi": "trò chơi khăm, trò đùa tinh quái", "en": "", "ex": "Creating nonexistent town entries on the public website was intended simply as a lighthearted prank by local students.", "exvi": "Việc tạo ra các mục từ về thị trấn không tồn tại trên trang web công cộng chỉ nhằm mục đích là một trò chơi khăm vô hại của học sinh địa phương.", "syn": [], "cefr": "B2", "ref": "note:1788603785543"}, {"id": "5821a2e4fdc2d030", "front": "insight into", "pos": "noun phrase", "ipa": "", "vi": "sự hiểu biết sâu sắc về, cái nhìn thấu đáo về", "en": "", "ex": "The presentation was explicitly structured to foster genuine insight into the technical methods used by renowned illustrators.", "exvi": "Bài thuyết trình được xây dựng rõ ràng nhằm thúc đẩy sự hiểu biết sâu sắc thực sự về các phương pháp kỹ thuật được các họa sĩ minh họa nổi tiếng sử dụng.", "syn": [], "cefr": "B2", "ref": "note:1788603785545"}, {"id": "fd1eff3a0cd26a46", "front": "acquire", "pos": "verb", "ipa": "", "vi": "thu được, có được, học được", "en": "", "ex": "Through years of field research, the anthropologist managed to acquire rare linguistic proficiency.", "exvi": "Qua nhiều năm nghiên cứu thực địa, nhà nhân chủng học đã có được sự thành thạo ngôn ngữ hiếm có.", "syn": [], "cefr": "B2", "ref": "note:1788603785547"}, {"id": "e0b8f3dcfe8ee1b9", "front": "blend", "pos": "verb", "ipa": "", "vi": "hòa trộn, kết hợp hài hòa", "en": "", "ex": "On her acclaimed recording, the singer managed to blend Afro-Indigenous vocal traditions with contemporary Latin pop.", "exvi": "Trong bản thu âm được đánh giá cao, nữ ca sĩ đã khéo léo kết hợp truyền thống thanh nhạc bản địa gốc Phi với nhạc pop Latin đương đại.", "syn": [], "cefr": "B2", "ref": "note:1788603785549"}, {"id": "42f886ddd78af300", "front": "complex", "pos": "adjective", "ipa": "", "vi": "phức tạp, rắc rối, nhiều thành phần", "en": "", "ex": "Ecosystem dynamics follow a complex series of relationships that cannot be captured by simple models.", "exvi": "Động lực học của hệ sinh thái tuân theo một chuỗi các mối quan hệ phức tạp mà các mô hình đơn giản không thể nắm bắt được.", "syn": [], "cefr": "B2", "ref": "note:1788603785551"}, {"id": "5fb62101a98cbbae", "front": "fragile", "pos": "adjective", "ipa": "", "vi": "mong manh, dễ vỡ, yếu ớt", "en": "", "ex": "The fresh blanket of winter snow appeared far too fragile to support the weight of heavy footsteps.", "exvi": "Tấm thảm tuyết mùa đông mới rơi dường như quá mong manh để có thể chịu được sức nặng của những bước chân nặng nề.", "syn": [], "cefr": "B2", "ref": "note:1788603785553"}, {"id": "a26d06d130052185", "front": "extend", "pos": "verb", "ipa": "", "vi": "mở rộng, kéo dài ra", "en": "", "ex": "The scientific panel decided to extend their field observations for three additional months to collect more conclusive data.", "exvi": "Hội đồng khoa học đã quyết định kéo dài các quan sát thực địa thêm ba tháng nữa để thu thập dữ liệu có tính thuyết phục hơn.", "syn": [], "cefr": "B2", "ref": "note:1788603785555"}, {"id": "1687a8108e54bb83", "front": "exceed", "pos": "verb", "ipa": "", "vi": "vượt quá, vượt trội hơn", "en": "", "ex": "Customer approval ratings for institutions with active community programs tended to significantly exceed those of neglectful firms.", "exvi": "Tỷ lệ tán thành của khách hàng đối với các tổ chức có chương trình cộng đồng tích cực có xu hướng vượt trội hơn đáng kể so với các công ty thờ ơ.", "syn": [], "cefr": "B2", "ref": "note:1788603785557"}, {"id": "fe92c0987ac1a496", "front": "attributed to", "pos": "verb phrase", "ipa": "", "vi": "được quy cho là do", "en": "", "ex": "The peculiar bitter flavor profile of the cultivated root crop could not be attributed to soil microbes alone.", "exvi": "Hồ sơ hương vị đắng đặc biệt của loại cây trồng lấy củ không thể chỉ quy cho là do các vi sinh vật trong đất.", "syn": [], "cefr": "B2", "ref": "note:1788603785559"}, {"id": "1914c4c8427bed43", "front": "slips away", "pos": "verb phrase", "ipa": "", "vi": "lặng lẽ rút lui, dần dần biến mất", "en": "", "ex": "As twilight deepens within the solemn sanctuary, the remaining golden beam slips away into the shadowed nave.", "exvi": "Khi hoàng hôn buông xuống bên trong nơi thánh đường tôn nghiêm, tia sáng vàng còn sót lại lặng lẽ rút lui vào gian giữa ngập tràn bóng tối.", "syn": [], "cefr": "B2", "ref": "note:1788603785561"}, {"id": "100da1b321b9ed6a", "front": "complement", "pos": "verb", "ipa": "", "vi": "bổ sung, kết hợp để hoàn thiện hơn", "en": "", "ex": "Researchers noted that live field trials must complement herbarium studies to form an accurate picture of plant development.", "exvi": "Các nhà nghiên cứu lưu ý rằng các thử nghiệm thực địa trên cây sống phải bổ sung cho các nghiên cứu mẫu tiêu bản sấy khô để tạo nên một bức tranh chính xác về sự phát triển của thực vật.", "syn": [], "cefr": "B2", "ref": "note:1788603785563"}, {"id": "5f6afeb68abb0aef", "front": "exhibit", "pos": "verb", "ipa": "", "vi": "thể hiện, bộc lộ rõ (tính cách, đặc điểm)", "en": "", "ex": "Raised in rugged border settlements, the siblings continued to exhibit an unapologetically rebellious streak.", "exvi": "Lớn lên ở những khu định cư biên giới gồ ghề, các anh chị em vẫn tiếp tục bộc lộ nét tính cách nổi loạn đầy tự tin.", "syn": [], "cefr": "B2", "ref": "note:1788603785565"}]}, {"key": "anki_starter-set11", "title": "Flashcard SAT Starter Set 11", "deck": "anki_starter", "count": 50, "cards": [{"id": "c2a29b0c0b190431", "front": "bring about", "pos": "phrasal verb", "ipa": "", "vi": "gây ra, đem lại, dẫn tới", "en": "", "ex": "Critics debated whether the gloomy climate helped bring about the somber disposition of the local residents.", "exvi": "Các nhà phê bình tranh luận liệu khí hậu ảm đạm có góp phần mang lại tính khí u sầu của người dân địa phương hay không.", "syn": [], "cefr": "B2", "ref": "note:1788603785567"}, {"id": "cb3c3157431e1719", "front": "constrict", "pos": "verb", "ipa": "", "vi": "làm hẹp lại, giới hạn", "en": "", "ex": "Fear of failure can constrict an artist's creativity.", "exvi": "Nỗi sợ thất bại có thể kìm hãm sự sáng tạo của người nghệ sĩ.", "syn": [], "cefr": "B2", "ref": "note:1788603785569"}, {"id": "b6c2851ebf91aba8", "front": "bypass", "pos": "verb", "ipa": "", "vi": "đi đường vòng, lờ đi hoặc tránh né", "en": "", "ex": "They built a new highway to bypass the city center and reduce traffic congestion.", "exvi": "Họ đã xây một đường cao tốc mới để đi vòng qua trung tâm thành phố và giảm tắc nghẽn giao thông.", "syn": [], "cefr": "B2", "ref": "note:1788603785571"}, {"id": "bf89d69de10927ca", "front": "customary", "pos": "adjective", "ipa": "", "vi": "thông thường, theo lệ", "en": "", "ex": "In Japan, it is customary to bow when you meet someone.", "exvi": "Ở Nhật Bản, cúi chào khi gặp ai đó là một thông lệ.", "syn": [], "cefr": "B2", "ref": "note:1788603785573"}, {"id": "a11be121f90a2374", "front": "disperse", "pos": "verb", "ipa": "", "vi": "phân tán, giải tán", "en": "", "ex": "The police used tear gas to disperse the crowd of protesters.", "exvi": "Cảnh sát đã dùng hơi cay để giải tán đám đông biểu tình.", "syn": [], "cefr": "B2", "ref": "note:1788603785575"}, {"id": "db8d8fc2fe636e8c", "front": "uncontroversial", "pos": "adjective", "ipa": "", "vi": "không gây tranh cãi, được chấp nhận chung", "en": "", "ex": "His proposal to provide free lunch for all students was surprisingly uncontroversial.", "exvi": "Đề xuất cung cấp bữa trưa miễn phí cho tất cả học sinh của ông ấy đã không gây tranh cãi một cách đáng ngạc nhiên.", "syn": [], "cefr": "B2", "ref": "note:1788603785577"}, {"id": "8eec6c2333ae33f0", "front": "discern", "pos": "verb", "ipa": "", "vi": "nhận ra, phân biệt được", "en": "", "ex": "It was difficult to discern the speaker's true intentions from his ambiguous words.", "exvi": "Thật khó để nhận ra ý định thật sự của người nói qua những lời lẽ mơ hồ của anh ta.", "syn": [], "cefr": "B2", "ref": "note:1788603785579"}, {"id": "77d823908a776981", "front": "prioritize", "pos": "verb", "ipa": "", "vi": "ưu tiên, đặt lên hàng đầu", "en": "", "ex": "You must learn to prioritize your work, or you'll never get anything done.", "exvi": "Bạn phải học cách ưu tiên công việc của mình, nếu không bạn sẽ chẳng bao giờ hoàn thành được việc gì cả.", "syn": [], "cefr": "B2", "ref": "note:1788603785581"}, {"id": "e83242f396c6318a", "front": "foresight", "pos": "noun", "ipa": "", "vi": "khả năng nhìn xa trông rộng, sự tiên đoán", "en": "", "ex": "She had the foresight to invest in the startup company before it became a huge success.", "exvi": "Cô ấy đã có tầm nhìn xa trông rộng để đầu tư vào công ty khởi nghiệp đó trước khi nó thành công rực rỡ.", "syn": [], "cefr": "B2", "ref": "note:1788603785583"}, {"id": "4d3c94f03214570b", "front": "variable", "pos": "adjective", "ipa": "", "vi": "hay thay đổi, không ổn định", "en": "", "ex": "The quality of the restaurant's food is highly variable.", "exvi": "Chất lượng món ăn của nhà hàng này rất hay thay đổi.", "syn": [], "cefr": "B2", "ref": "note:1788603785585"}, {"id": "a2c0910009875b98", "front": "pretentious", "pos": "adjective", "ipa": "", "vi": "tự phụ, khoe mẽ", "en": "", "ex": "The pretentious man always used complex vocabulary to make himself sound more intelligent.", "exvi": "Gã đàn ông khoe mẽ đó luôn dùng những từ vựng phức tạp để khiến bản thân nghe có vẻ thông thái hơn.", "syn": [], "cefr": "B2", "ref": "note:1788603785587"}, {"id": "db93342c1976cceb", "front": "provocative", "pos": "adjective", "ipa": "", "vi": "khiêu khích, gây tranh cãi", "en": "", "ex": "The author's provocative article on climate change sparked a heated debate among scientists and policymakers.", "exvi": "Bài báo đầy khiêu khích của tác giả về biến đổi khí hậu đã làm dấy lên một cuộc tranh luận sôi nổi giữa các nhà khoa học và nhà hoạch định chính sách.", "syn": [], "cefr": "B2", "ref": "note:1788603785589"}, {"id": "315dc8bd8827de97", "front": "thrive", "pos": "verb", "ipa": "", "vi": "phát triển mạnh mẽ, thịnh vượng", "en": "", "ex": "His business thrived in the new economic climate.", "exvi": "Doanh nghiệp của anh ấy phát triển mạnh trong bối cảnh kinh tế mới.", "syn": [], "cefr": "B2", "ref": "note:1788603785591"}, {"id": "72ab3aeec73699f9", "front": "suppress", "pos": "verb", "ipa": "", "vi": "Đàn áp, kìm nén", "en": "", "ex": "The government tried to suppress the protests.", "exvi": "Chính phủ đã cố gắng đàn áp các cuộc biểu tình.", "syn": [], "cefr": "B2", "ref": "note:1788603785593"}, {"id": "eaf4ec6e47324058", "front": "tranquil", "pos": "adjective", "ipa": "", "vi": "thanh bình, yên tĩnh", "en": "", "ex": "The tranquil lake was a perfect mirror for the mountains.", "exvi": "Mặt hồ thanh bình là một tấm gương hoàn hảo phản chiếu những ngọn núi.", "syn": [], "cefr": "B2", "ref": "note:1788603785595"}, {"id": "fb4a2cfa67b0f9b8", "front": "attrition", "pos": "noun", "ipa": "", "vi": "sự hao mòn, sự tiêu hao nhân sự", "en": "", "ex": "The company has a high rate of attrition because many employees are resigning due to the stressful work environment.", "exvi": "Công ty có tỷ lệ nhân viên nghỉ việc cao vì nhiều nhân viên từ chức do môi trường làm việc căng thẳng.", "syn": [], "cefr": "B2", "ref": "note:1788603785597"}, {"id": "83f75e7ea49e3c9b", "front": "applicable", "pos": "adjective", "ipa": "", "vi": "có thể áp dụng được, thích hợp", "en": "", "ex": "The new safety regulations are applicable to all construction sites in the city.", "exvi": "Các quy định an toàn mới có thể áp dụng cho tất cả các công trường xây dựng trong thành phố.", "syn": [], "cefr": "B2", "ref": "note:1788603785599"}, {"id": "3ceeb9203ffce3a9", "front": "infer", "pos": "verb", "ipa": "", "vi": "suy luận, suy ra", "en": "", "ex": "Based on the high number of book returns, the librarian could infer that the new fantasy novel was a disappointment.", "exvi": "Dựa trên số lượng sách bị trả lại cao, người thủ thư có thể suy luận rằng cuốn tiểu thuyết giả tưởng mới là một sự thất vọng.", "syn": [], "cefr": "B2", "ref": "note:1788603785601"}, {"id": "8cb585e585921990", "front": "intense", "pos": "adjective", "ipa": "", "vi": "mãnh liệt, sâu sắc, dữ dội", "en": "", "ex": "Standing before the towering cliffs, the poet felt an intense sense of solitude wash over his mind.", "exvi": "Đứng trước những vách đá sừng sững, nhà thơ cảm nhận một sự cô đơn sâu sắc mãnh liệt dâng trào trong tâm trí mình.", "syn": [], "cefr": "B2", "ref": "note:1788603785603"}, {"id": "dc3574f04732d9da", "front": "enhancement", "pos": "noun", "ipa": "", "vi": "sự cải thiện, nâng cao, gia tăng giá trị/chất lượng", "en": "", "ex": "The new software update included several enhancements to user security and processing speed.", "exvi": "Bản cập nhật phần mềm mới bao gồm một số cải tiến đối với bảo mật người dùng và tốc độ xử lý.", "syn": [], "cefr": "B2", "ref": "note:1788603785605"}, {"id": "50997efb5404b669", "front": "exceptions to", "pos": "noun phrase", "ipa": "", "vi": "ngoại lệ đối với", "en": "", "ex": "Despite the specialist's hesitancy about her expertise on the subject in general, she recognized clear exceptions to her perceived limitations when discussing Michele Wood's art.", "exvi": "Dù chuyên gia ngập ngừng về chuyên môn tổng quát của mình, bà nhận ra những ngoại lệ rõ ràng đối với hạn chế của bản thân khi thảo luận về nghệ thuật của Michele Wood.", "syn": [], "cefr": "B2", "ref": "note:1788603785607"}, {"id": "1e8afc8f88d17492", "front": "stabilize", "pos": "verb", "ipa": "", "vi": "làm ổn định, giữ vững", "en": "", "ex": "Central banks raised interest rates in an effort to stabilize the national currency.", "exvi": "Các ngân hàng trung ương đã tăng lãi suất trong nỗ lực làm ổn định đồng nội tệ.", "syn": [], "cefr": "B2", "ref": "note:1788603785609"}, {"id": "1fcdb0fd41d29da9", "front": "assess", "pos": "verb", "ipa": "", "vi": "đánh giá, thẩm định", "en": "", "ex": "One way to assess the importance of a scholar's research is to track how frequently it is cited.", "exvi": "Một cách để đánh giá tầm quan trọng của nghiên cứu của một học giả là theo dõi mức độ thường xuyên nó được trích dẫn.", "syn": [], "cefr": "B2", "ref": "note:1788603785611"}, {"id": "1b24bfc1c9f5c17c", "front": "evaluate", "pos": "verb", "ipa": "", "vi": "đánh giá, ước lượng giá trị", "en": "", "ex": "The committee met to evaluate the effectiveness of the community outreach program.", "exvi": "Ủy ban đã họp để đánh giá tính hiệu quả của chương trình tiếp cận cộng đồng.", "syn": [], "cefr": "B2", "ref": "note:1788603785613"}, {"id": "92ddfb417448c226", "front": "affect", "pos": "verb", "ipa": "", "vi": "tác động, làm xúc động, ảnh hưởng", "en": "", "ex": "The ancient cave paintings affect modern viewers deeply because of the shared sense of humanity across millennia.", "exvi": "Những bức tranh hang động cổ đại khiến người xem hiện đại xúc động sâu sắc nhờ cảm giác về nhân loại chung qua nhiều thiên niên kỷ.", "syn": [], "cefr": "B2", "ref": "note:1788603785615"}, {"id": "89f41b424fbceb32", "front": "complexity", "pos": "noun", "ipa": "", "vi": "sự phức tạp, nét rắc rối", "en": "", "ex": "The sheer complexity of the human genome continues to challenge geneticists.", "exvi": "Sự phức tạp tột cùng của bộ gen người tiếp tục thách thức các nhà di truyền học.", "syn": [], "cefr": "B2", "ref": "note:1788603785617"}, {"id": "24d5ee16d5a20b2e", "front": "impose", "pos": "verb", "ipa": "", "vi": "áp đặt; (dạng imposing: gây ấn tượng sâu sắc, uy nghiêm)", "en": "", "ex": "The grand architecture and vast capacity of the mosque made it an imposing presence in the capital.", "exvi": "Kiến trúc tráng lệ và sức chứa rộng lớn của nhà thờ Hồi giáo đã biến nó thành một công trình uy nghi, đầy ấn tượng tại thủ đô.", "syn": [], "cefr": "B2", "ref": "note:1788603785619"}, {"id": "5c32d34d47184897", "front": "accessible", "pos": "adjective", "ipa": "", "vi": "dễ tiếp cận, dễ hiểu, dễ tới", "en": "", "ex": "The author used straightforward language to make complex philosophical arguments accessible to general readers.", "exvi": "Tác giả đã dùng ngôn ngữ giản dị để làm cho những lập luận triết học phức tạp trở nên dễ hiểu đối với độc giả đại chúng.", "syn": [], "cefr": "B2", "ref": "note:1788603785621"}, {"id": "eb37fe1c3290387e", "front": "appeal to", "pos": "verb phrase", "ipa": "", "vi": "thu hút, hấp dẫn; kêu gọi", "en": "", "ex": "The new business textbook was explicitly designed to appeal to both academic researchers and practical entrepreneurs.", "exvi": "Cuốn sách giáo trình kinh doanh mới được thiết kế rõ ràng nhằm thu hút cả các nhà nghiên cứu học thuật lẫn các doanh nhân thực tế.", "syn": [], "cefr": "B2", "ref": "note:1788603785623"}, {"id": "dff0ed7449a0c8c9", "front": "originality", "pos": "noun", "ipa": "", "vi": "tính độc đáo, tính nguyên bản, sự sáng tạo", "en": "", "ex": "Critics praised the young composer's symphony for its daring originality and fresh instrumentation.", "exvi": "Các nhà phê bình đã ca ngợi bản giao hưởng của nhạc sĩ trẻ vì tính độc đáo táo bạo và cách phối khí mới mẻ.", "syn": [], "cefr": "B2", "ref": "note:1788603785625"}, {"id": "6d6a9886e386fc2b", "front": "neglect of", "pos": "noun phrase", "ipa": "", "vi": "sự lơ là, thờ ơ, bỏ bê đối với", "en": "", "ex": "The report criticized the municipal council's chronic neglect of public infrastructure in suburban neighborhoods.", "exvi": "Báo cáo chỉ trích sự bỏ bê triền miên của hội đồng thành phố đối với cơ sở hạ tầng công cộng ở các khu ngoại ô.", "syn": [], "cefr": "B2", "ref": "note:1788603785627"}, {"id": "29e744aded729988", "front": "inspiration for", "pos": "noun phrase", "ipa": "", "vi": "nguồn cảm hứng cho", "en": "", "ex": "The vibrant folk dances of the region served as the primary inspiration for the choreographer's new ballet.", "exvi": "Những điệu múa dân gian sôi động của vùng đã trở thành nguồn cảm hứng chính cho vở ba lê mới của biên đạo múa.", "syn": [], "cefr": "B2", "ref": "note:1788603785629"}, {"id": "449b9a8d9446df84", "front": "isolation from", "pos": "noun phrase", "ipa": "", "vi": "sự cô lập, tách biệt khỏi", "en": "", "ex": "Leading scientists seldom conduct their groundbreaking research in complete isolation from the broader academic community.", "exvi": "Các nhà khoa học hàng đầu hiếm khi thực hiện nghiên cứu mang tính đột phá của họ trong sự cô lập hoàn toàn với cộng đồng học thuật rộng lớn hơn.", "syn": [], "cefr": "B2", "ref": "note:1788603785631"}, {"id": "f7645c81eee73f1e", "front": "collaboration with", "pos": "noun phrase", "ipa": "", "vi": "sự hợp tác, cộng tác với", "en": "", "ex": "Scientific breakthroughs are rarely the work of lone geniuses, but rather the result of close collaboration with other experts.", "exvi": "Các đột phá khoa học hiếm khi là công lao của những thiên tài đơn độc, mà là kết quả của sự hợp tác chặt chẽ với các chuyên gia khác.", "syn": [], "cefr": "B2", "ref": "note:1788603785633"}, {"id": "d781d705dacdf841", "front": "fluctuate with", "pos": "verb phrase", "ipa": "", "vi": "biến động, dao động theo", "en": "", "ex": "Fuel prices tend to fluctuate with global geopolitical developments and crude supply shifts.", "exvi": "Giá nhiên liệu có xu hướng dao động theo những diễn biến địa chính trị toàn cầu và sự dịch chuyển nguồn cung dầu thô.", "syn": [], "cefr": "B2", "ref": "note:1788603785635"}, {"id": "8e9e2ef08865ab24", "front": "bias", "pos": "noun", "ipa": "", "vi": "sự thiên vị, định kiến, thiên lệch", "en": "", "ex": "Politicians often complain of partisan bias in news coverage, though reporters strive to present balanced facts.", "exvi": "Các chính trị gia thường phàn nàn về sự thiên vị đảng phái trong tin tức báo chí, dù các phóng viên luôn nỗ lực đưa tin công tâm.", "syn": [], "cefr": "B2", "ref": "note:1788603785637"}, {"id": "29abb93a3954a588", "front": "accelerate", "pos": "verb", "ipa": "", "vi": "thúc đẩy, đẩy nhanh, tăng tốc", "en": "", "ex": "Advanced submersible cameras are expected to accelerate the discovery and confirmation of bioluminescence in deep-sea creatures.", "exvi": "Các camera lặn hiện đại được kỳ vọng sẽ thúc đẩy nhanh việc phát hiện và chứng thực khả năng phát quang sinh học ở các loài sinh vật biển sâu.", "syn": [], "cefr": "B2", "ref": "note:1788603785639"}, {"id": "9c2827ff259bdce3", "front": "solitary", "pos": "adjective", "ipa": "", "vi": "đơn độc, một mình, biệt lập", "en": "", "ex": "The committee emphasized that scientific distinction is not reserved merely for solitary researchers working in vacuums.", "exvi": "Ủy ban nhấn mạnh rằng sự vinh danh khoa học không chỉ dành riêng cho những nhà nghiên cứu làm việc đơn độc tách biệt.", "syn": [], "cefr": "B2", "ref": "note:1788603785641"}, {"id": "7cc85df958fba708", "front": "melodic", "pos": "adjective", "ipa": "", "vi": "du dương, êm tai, có tính giai điệu", "en": "", "ex": "Even in written verse, Bao Phi's spoken-word poems retain a distinctly melodic rhythm.", "exvi": "Ngay cả trong những câu thơ viết ra giấy, các bài thơ biểu diễn của Bảo Phi vẫn giữ được nhịp điệu du dương đặc trưng.", "syn": [], "cefr": "B2", "ref": "note:1788603785643"}, {"id": "e136f91a9fe801f7", "front": "independent of", "pos": "adjective phrase", "ipa": "", "vi": "không phụ thuộc vào, độc lập với", "en": "", "ex": "Because the administrative hassle of making a contribution is largely independent of donation size, charities prioritize larger gifts.", "exvi": "Bởi vì phiền toái thủ tục hành chính khi đóng góp phần lớn độc lập với quy mô khoản quyên góp, các tổ chức từ thiện ưu tiên các món quà lớn hơn.", "syn": [], "cefr": "B2", "ref": "note:1788603785645"}, {"id": "698a09beca1f18c1", "front": "defy", "pos": "verb", "ipa": "", "vi": "bất chấp, thách thức, cưỡng lại thành công", "en": "", "ex": "The geometric enigma continued to defy all analytical efforts until a conclusive computer proof was published.", "exvi": "Bí ẩn hình học tiếp tục thách thức mọi nỗ lực phân tích cho đến khi một chứng minh máy tính thuyết phục được công bố.", "syn": [], "cefr": "B2", "ref": "note:1788603785647"}, {"id": "500924e336781eb5", "front": "interconnect", "pos": "verb", "ipa": "", "vi": "kết nối với nhau, liên kết chặt chẽ", "en": "", "ex": "The terraces, waterways, and temples of the ancient irrigation network are interconnected into one harmonious system.", "exvi": "Các thửa ruộng bậc thang, kênh dẫn nước và đền thờ của mạng lưới thủy lợi cổ xưa được kết nối với nhau thành một hệ thống hài hòa.", "syn": [], "cefr": "B2", "ref": "note:1788603785649"}, {"id": "881ffef4160bf46f", "front": "credible", "pos": "adjective", "ipa": "", "vi": "đáng tin, có thể tin được", "en": "", "ex": "The police received a credible tip from an anonymous caller that helped them solve the case.", "exvi": "Cảnh sát đã nhận được một tin báo đáng tin cậy từ một người gọi ẩn danh, giúp họ phá án.", "syn": [], "cefr": "B2", "ref": "note:1788603785651"}, {"id": "8149dc908ff9d36c", "front": "reciprocate", "pos": "verb", "ipa": "", "vi": "đáp lại, đền đáp", "en": "", "ex": "Sophie was kind to her new colleagues, and they reciprocated by inviting her to lunch.", "exvi": "Sophie đã đối xử tốt với các đồng nghiệp mới, và họ đáp lại bằng cách mời cô đi ăn trưa.", "syn": [], "cefr": "B2", "ref": "note:1788603785653"}, {"id": "a0e4572df4443a9a", "front": "annotate", "pos": "verb", "ipa": "", "vi": "chú thích, ghi chú", "en": "", "ex": "The professor asked us to annotate the historical document, highlighting key events and adding our own interpretations in the margins.", "exvi": "Giáo sư yêu cầu chúng tôi chú thích tài liệu lịch sử, nhấn mạnh các sự kiện chính và thêm vào những diễn giải của riêng mình ở bên lề.", "syn": [], "cefr": "B2", "ref": "note:1788603785655"}, {"id": "75376f5b1c91c6b6", "front": "imperative", "pos": "adjective", "ipa": "", "vi": "cấp bách, bắt buộc", "en": "", "ex": "It is imperative that we act now before the problem gets worse.", "exvi": "Việc chúng ta phải hành động ngay bây giờ trước khi vấn đề trở nên tồi tệ hơn là vô cùng cấp bách.", "syn": [], "cefr": "B2", "ref": "note:1788603785657"}, {"id": "91ee465ceaf504b3", "front": "supposition", "pos": "noun", "ipa": "", "vi": "sự giả định, sự phỏng đoán", "en": "", "ex": "The detective's theory was based on the supposition that the witness was telling the truth.", "exvi": "Lý thuyết của vị thám tử dựa trên giả định rằng nhân chứng đã nói sự thật.", "syn": [], "cefr": "B2", "ref": "note:1788603785659"}, {"id": "37cb7e3450009554", "front": "fruitful", "pos": "adjective", "ipa": "", "vi": "có hiệu quả, thành công", "en": "", "ex": "After months of negotiation, the two companies finally had a fruitful discussion and reached an agreement.", "exvi": "Sau nhiều tháng đàm phán, hai công ty cuối cùng đã có một cuộc thảo luận hiệu quả và đạt được thỏa thuận.", "syn": [], "cefr": "B2", "ref": "note:1788603785661"}, {"id": "35c21b2a7622db10", "front": "substantial", "pos": "adjective", "ipa": "", "vi": "đáng kể, quan trọng", "en": "", "ex": "The company made a substantial profit this year, allowing for significant bonuses for all employees.", "exvi": "Công ty đã tạo ra một khoản lợi nhuận đáng kể trong năm nay, cho phép có những khoản thưởng lớn cho tất cả nhân viên.", "syn": [], "cefr": "B2", "ref": "note:1788603785663"}, {"id": "9631a691cf790206", "front": "reluctantly", "pos": "adverb", "ipa": "", "vi": "miễn cưỡng, bất đắc dĩ", "en": "", "ex": "He reluctantly agreed to help, but his heart wasn't in it.", "exvi": "Anh ấy miễn cưỡng đồng ý giúp đỡ, nhưng lòng anh không thực sự muốn.", "syn": [], "cefr": "B2", "ref": "note:1788603785665"}]}, {"key": "anki_starter-set12", "title": "Flashcard SAT Starter Set 12", "deck": "anki_starter", "count": 50, "cards": [{"id": "78c80acf6f9c8fee", "front": "eclipse", "pos": "noun, verb", "ipa": "", "vi": "(n) sự che khuất, (v) làm lu mờ", "en": "", "ex": "The new startup's innovative product quickly eclipsed the sales of its more established rivals.", "exvi": "Sản phẩm sáng tạo của công ty khởi nghiệp mới đã nhanh chóng làm lu mờ doanh số của các đối thủ lâu đời hơn.", "syn": [], "cefr": "B2", "ref": "note:1788603785667"}, {"id": "fcf717ae5aaf046b", "front": "consensus", "pos": "noun", "ipa": "", "vi": "sự đồng thuận, sự nhất trí", "en": "", "ex": "After hours of debate, the committee finally reached a consensus on the new policy.", "exvi": "Sau nhiều giờ tranh luận, ủy ban cuối cùng đã đạt được sự đồng thuận về chính sách mới.", "syn": [], "cefr": "B2", "ref": "note:1788603785669"}, {"id": "3f651a32c08df9bb", "front": "notional", "pos": "adjective", "ipa": "", "vi": "chỉ có trong ý niệm, trừu tượng", "en": "", "ex": "The budget provided only a notional figure for the first year's sales, as no one knew what the actual demand would be.", "exvi": "Ngân sách chỉ cung cấp một con số mang tính lý thuyết cho doanh thu năm đầu, vì không ai biết nhu cầu thực tế sẽ là bao nhiêu.", "syn": [], "cefr": "B2", "ref": "note:1788603785671"}, {"id": "9acb3a3ad2daa6a6", "front": "trivial", "pos": "adjective", "ipa": "", "vi": "tầm thường, không đáng kể", "en": "", "ex": "While the color of the new office chairs seemed like a trivial detail, the manager spent the entire afternoon debating it.", "exvi": "Dù màu sắc của những chiếc ghế văn phòng mới có vẻ là một chi tiết tầm thường, người quản lý đã dành cả buổi chiều để tranh luận về nó.", "syn": [], "cefr": "B2", "ref": "note:1788603785673"}, {"id": "627d05319d6a1b22", "front": "proponent", "pos": "noun", "ipa": "", "vi": "người đề xuất, người ủng hộ", "en": "", "ex": "As a lifelong proponent of environmental protection, she dedicated her career to conservation efforts.", "exvi": "Là một người ủng hộ việc bảo vệ môi trường suốt đời, bà đã cống hiến sự nghiệp của mình cho các nỗ lực bảo tồn.", "syn": [], "cefr": "B2", "ref": "note:1788603785675"}, {"id": "70e1ceb3cfa30760", "front": "foster", "pos": "verb", "ipa": "", "vi": "nuôi dưỡng, thúc đẩy", "en": "", "ex": "The club's aim is to foster better relations within the community.", "exvi": "Mục đích của câu lạc bộ là thúc đẩy các mối quan hệ tốt đẹp hơn trong cộng đồng.", "syn": [], "cefr": "B2", "ref": "note:1788603785677"}, {"id": "f13d00feac8baf3b", "front": "nuance", "pos": "noun", "ipa": "", "vi": "sắc thái, sự khác biệt tinh tế", "en": "", "ex": "To be a great detective, you must be able to perceive every nuance in a person's behavior.", "exvi": "Để trở thành một thám tử tài ba, bạn phải có khả năng nhận ra mọi sắc thái trong hành vi của một người.", "syn": [], "cefr": "B2", "ref": "note:1788603785679"}, {"id": "baba3ef00e6d713f", "front": "contingent", "pos": "phrasal adjective", "ipa": "", "vi": "phụ thuộc vào, tùy thuộc vào", "en": "", "ex": "The success of our outdoor festival is contingent on the weather.", "exvi": "Sự thành công của lễ hội ngoài trời của chúng tôi phụ thuộc vào thời tiết.", "syn": [], "cefr": "B2", "ref": "note:1788603785681"}, {"id": "a271cc6046c95226", "front": "reconcile", "pos": "verb", "ipa": "", "vi": "hòa giải, dung hòa", "en": "", "ex": "It is difficult to reconcile the team's poor performance with the coach's optimistic statements.", "exvi": "Thật khó để dung hòa màn trình diễn tệ hại của đội với những phát biểu lạc quan của huấn luyện viên.", "syn": [], "cefr": "B2", "ref": "note:1788603785683"}, {"id": "a0240943b3dbf9a3", "front": "validate", "pos": "verb", "ipa": "", "vi": "xác nhận, chứng thực", "en": "", "ex": "The new data helped validate the scientist's theory about climate change.", "exvi": "Dữ liệu mới đã giúp chứng thực giả thuyết của nhà khoa học về biến đổi khí hậu.", "syn": [], "cefr": "B2", "ref": "note:1788603785685"}, {"id": "2a7d7228638c8350", "front": "collaboration", "pos": "noun", "ipa": "", "vi": "sự hợp tác, sự cộng tác", "en": "", "ex": "The new art exhibit is a collaboration between several local artists and the city museum.", "exvi": "Buổi triển lãm nghệ thuật mới là sự hợp tác giữa một số nghệ sĩ địa phương và bảo tàng thành phố.", "syn": [], "cefr": "B2", "ref": "note:1788603785687"}, {"id": "658c4d0b39a9e1bb", "front": "discernible", "pos": "adjective", "ipa": "", "vi": "có thể nhận thấy, có thể phân biệt được", "en": "", "ex": "There was no discernible difference between the two copies of the painting.", "exvi": "Không có sự khác biệt nào có thể nhận thấy được giữa hai bản sao của bức tranh.", "syn": [], "cefr": "B2", "ref": "note:1788603785689"}, {"id": "54471ba684e43727", "front": "mundane", "pos": "adjective", "ipa": "", "vi": "tầm thường, nhàm chán", "en": "", "ex": "After the excitement of her trip to Paris, Sophie found her daily routine of checking emails and attending meetings to be quite mundane.", "exvi": "Sau sự phấn khích của chuyến đi đến Paris, Sophie cảm thấy công việc hàng ngày của mình là kiểm tra email và tham dự các cuộc họp khá là nhàm chán.", "syn": [], "cefr": "B2", "ref": "note:1788603785691"}, {"id": "73a0d07460cad7b1", "front": "reservation", "pos": "noun", "ipa": "", "vi": "sự nghi ngờ, sự dè dặt", "en": "", "ex": "He accepted my advice without reservation.", "exvi": "Anh ấy đã chấp nhận lời khuyên của tôi không một chút dè dặt.", "syn": [], "cefr": "B2", "ref": "note:1788603785693"}, {"id": "582c17c080b3f965", "front": "concede", "pos": "verb", "ipa": "", "vi": "thừa nhận, nhượng bộ", "en": "", "ex": "After weeks of debate, the manager finally had to concede that the new marketing strategy was not working.", "exvi": "Sau nhiều tuần tranh luận, người quản lý cuối cùng đã phải thừa nhận rằng chiến lược tiếp thị mới không hiệu quả.", "syn": [], "cefr": "B2", "ref": "note:1788603785695"}, {"id": "46f050f87cabfcc9", "front": "precursor", "pos": "noun", "ipa": "", "vi": "vật báo hiệu, người tiền nhiệm", "en": "", "ex": "The Wright brothers' glider was a precursor to the modern airplane.", "exvi": "Tàu lượn của anh em nhà Wright là tiền thân của máy bay hiện đại.", "syn": [], "cefr": "B2", "ref": "note:1788603785697"}, {"id": "d806372c64abb70e", "front": "arrest", "pos": "verb", "ipa": "", "vi": "bắt giữ, chặn lại", "en": "", "ex": "The new treatment successfully arrested the spread of the cancer cells.", "exvi": "Phương pháp điều trị mới đã thành công trong việc ngăn chặn sự lây lan của các tế bào ung thư.", "syn": [], "cefr": "B2", "ref": "note:1788603785699"}, {"id": "cdca4e09364c145d", "front": "conviction", "pos": "noun", "ipa": "", "vi": "niềm tin mãnh liệt, sự kết tội", "en": "", "ex": "She holds the conviction that all people are created equal, a belief she has defended her entire life.", "exvi": "Cô ấy giữ một niềm tin mãnh liệt rằng mọi người sinh ra đều bình đẳng, một niềm tin mà cô đã bảo vệ cả đời mình.", "syn": [], "cefr": "B2", "ref": "note:1788603785701"}, {"id": "15bb031e50ee4e13", "front": "diverge", "pos": "verb", "ipa": "", "vi": "phân ra, khác nhau", "en": "", "ex": "Although they started the project together, their opinions on the final design began to diverge.", "exvi": "Mặc dù họ bắt đầu dự án cùng nhau, quan điểm của họ về thiết kế cuối cùng đã bắt đầu khác biệt.", "syn": [], "cefr": "B2", "ref": "note:1788603785703"}, {"id": "b994dfa6aa1bc1c7", "front": "explicit", "pos": "adjective", "ipa": "", "vi": "rõ ràng, dứt khoát", "en": "", "ex": "The doctor gave me explicit instructions on how to take the medication.", "exvi": "Bác sĩ đã cho tôi những chỉ dẫn rõ ràng về cách uống thuốc.", "syn": [], "cefr": "B2", "ref": "note:1788603785705"}, {"id": "dd6baa84a2839d68", "front": "galvanize", "pos": "verb", "ipa": "", "vi": "kích động, khích lệ hành động", "en": "", "ex": "The activist's passionate speech galvanized the crowd into protesting against the new law.", "exvi": "Bài phát biểu đầy nhiệt huyết của nhà hoạt động đã kích động đám đông biểu tình chống lại luật mới.", "syn": [], "cefr": "B2", "ref": "note:1788603785707"}, {"id": "692f62ef6b851610", "front": "latent", "pos": "adjective", "ipa": "", "vi": "tiềm ẩn, ngấm ngầm", "en": "", "ex": "The virus can remain latent in the body for years before any symptoms appear.", "exvi": "Virus có thể tiềm ẩn trong cơ thể nhiều năm trước khi bất kỳ triệu chứng nào xuất hiện.", "syn": [], "cefr": "B2", "ref": "note:1788603785709"}, {"id": "ae816fdfffab02cb", "front": "pragmatic", "pos": "adjective", "ipa": "", "vi": "thực tế, thực dụng", "en": "", "ex": "While her dream was to be a painter, she took a pragmatic approach and studied graphic design to ensure a stable income.", "exvi": "Mặc dù ước mơ của cô là trở thành họa sĩ, cô đã có một cách tiếp cận thực tế và học thiết kế đồ họa để đảm bảo có thu nhập ổn định.", "syn": [], "cefr": "B2", "ref": "note:1788603785711"}, {"id": "3b666c3b402d404f", "front": "resilient", "pos": "adjective", "ipa": "", "vi": "kiên cường, có khả năng phục hồi", "en": "", "ex": "Children are often more resilient than adults because they can adapt to new situations very quickly.", "exvi": "Trẻ em thường kiên cường hơn người lớn vì chúng có thể thích nghi với các tình huống mới rất nhanh chóng.", "syn": [], "cefr": "B2", "ref": "note:1788603785713"}, {"id": "6a5ee3da1b2d7ccd",
